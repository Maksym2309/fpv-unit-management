/* ══ ЧАСТОТИ ЕКІПАЖУ: налаштування + рекомендації ══
   Кольори/позначення — ті самі, що на карті частот:
   🟢 вільна · ⭐ рекомендована · 🟠 поряд (Δ20–40) · 🟡 IMD3 ·
   🔴 конфлікт/зайнята (Δ<20) · ⚠ нерекомендована. Оптимум — 1–3 частоти
   на екіпаж: так спектр ділиться на максимум безконфліктних екіпажів. */

// Частоти екіпажу списком: [{code, label, freq, kind:'main'|'res'}]
function crewFreqList(cr) {
  var out = [];
  function parse(str, kind) {
    if (!str) return;
    var m = String(str).match(/\((\d+)\)/);
    out.push({ code: cleanCode(str), label: String(str), freq: m ? Number(m[1]) : 0, kind: kind });
  }
  parse(cr.freq, 'main');
  (cr.reserves||'').split('|').filter(Boolean).forEach(function(r){ parse(r, 'res'); });
  return out;
}

// Зайняті частоти всіх, КРІМ цього екіпажу (активні + резервні + чужі підрозділи)
function occupiedFreqsExcept(cr) {
  var d = S.freq || {};
  var self = [String(cr.id), String(cr.crewName || '')];
  function other(who) { return self.indexOf(String(who || '')) === -1; }
  var out = [];
  (d.active || []).forEach(function(a){
    if (a.freq && other(a.crew)) out.push({ freq: a.freq, who: a.crew, res: false });
  });
  (d.reserves || []).forEach(function(r){
    if (r.freq && other(r.crew)) out.push({ freq: r.freq, who: r.crew, res: true });
  });
  return out;
}

// Класифікація частоти відносно зайнятих (логіка карти частот: Δ<20 / Δ20–40 / IMD3)
function classifyFreq(f, occ, warningFreqs) {
  var hit = null;
  occ.forEach(function(o){ var d = Math.abs(o.freq - f); if (d < 20 && (!hit || d < hit.d)) hit = { o: o, d: d }; });
  if (hit) return { lvl: 'busy', mark: '🔴', who: hit.o.who + (hit.o.res ? ' (резерв)' : ''), d: hit.d };
  occ.forEach(function(o){ var d = Math.abs(o.freq - f); if (d >= 20 && d < 40 && (!hit || d < hit.d)) hit = { o: o, d: d }; });
  if (hit) return { lvl: 'near', mark: '🟠', who: hit.o.who, d: hit.d };
  for (var i = 0; i < occ.length; i++)
    for (var j = 0; j < occ.length; j++)
      if (i !== j && Math.abs(f - (2 * occ[i].freq - occ[j].freq)) < 10)
        return { lvl: 'imd', mark: '🟡', who: occ[i].who, d: 0 };
  if (warningFreqs && warningFreqs[f]) return { lvl: 'warn', mark: '⚠', who: '', d: 0 };
  return { lvl: 'free', mark: '🟢', who: '', d: 0 };
}
function freqMinDist(f, occ) {
  var m = 9999;
  occ.forEach(function(o){ m = Math.min(m, Math.abs(o.freq - f)); });
  return m;
}
// Група діапазону за МГц: 5.8 / 5.0 / 3.3 (як фільтр на карті частот)
function freqGroupOf(f) { return f >= 5600 ? '5.8' : (f >= 4900 ? '5.0' : '3.3'); }

// Чи дозволений бенд для відеосистеми екіпажу (правило sidebar-форм):
// Hornet Vision — ТІЛЬКИ HV-бенди; інші відомі системи — все, крім HV;
// система не вказана — без обмежень
function systemAllowsBand(system, band) {
  var isHV = String(band).indexOf('HV-') === 0;
  if (system === 'Hornet Vision') return isHV;
  if (system) return !isHV;
  return true;
}

// Рекомендовані вільні частоти: максимальний запас відстані до зайнятих →
// лишає найбільше місця для наступних екіпажів (унікальні за МГц).
// Тримаємось діапазону поточних частот екіпажу (аналог на 5.8 не
// відправляємо в 3.3 ГГц); якщо частот немає — розглядаємо всі.
function recommendFreqs(cr, limit) {
  var d = S.freq || {};
  var bands = allBands(d);
  var order = allBandOrder(d).filter(function(b){ return bands[b]; });
  var occ = occupiedFreqsExcept(cr);
  var myList = crewFreqList(cr);
  var mine = myList.map(function(x){ return x.code; });
  var targetGroup = myList.length && myList[0].freq ? freqGroupOf(myList[0].freq) : '';
  var items = [];
  order.forEach(function(band){
    if (!systemAllowsBand(cr.system, band)) return; // цифра/HV — тільки свої бенди
    if (!gridAllowsBand(crewGrid(cr), band)) return;     // радити те, чого борт не тягне, — гірше ніж мовчати
    bands[band].forEach(function(f, i){
      var code = band + (i + 1);
      if (!gridAllowsFreq(crewGrid(cr), band, f)) return;
      var ef = f;
      if (mine.indexOf(code) !== -1) return;
      var c = classifyFreq(ef, occ, d.warningFreqs);
      if (c.lvl === 'free') items.push({ code: code, freq: ef, dist: freqMinDist(ef, occ), grp: freqGroupOf(ef) });
    });
  });
  // Група 5.8/5.0/3.3 — вторинний фільтр; для Hornet Vision не застосовуємо
  // (його дозволений набір і так малий та розкиданий по групах)
  var pool = (targetGroup && cr.system !== 'Hornet Vision')
    ? items.filter(function(x){ return x.grp === targetGroup; }) : items;
  if (!pool.length) pool = items;
  pool.sort(function(a, b){ return b.dist - a.dist; });
  var seen = {}, recs = [];
  pool.forEach(function(x){
    if (!seen[x.freq] && recs.length < (limit || 5)) { seen[x.freq] = 1; recs.push(x); }
  });
  return recs;
}

function renderCrewFreqPanel() {
  var isLinks = crewPageTab === 'links';
  var editOn = isLinks && (typeof crewEdit !== 'undefined' && crewEdit);
  // Який екіпаж показувати:
  // - користувач у режимі редагування — примусово СВІЙ екіпаж (тільки його
  //   він і може редагувати; у боковому переліку свій не вибирається)
  // - інакше: боковий перелік → вибраний у тулбарі (links) → свій
  var selId;
  if (editOn && !canEditCrews() && S.auth && S.auth.crewId) {
    selId = S.auth.crewId;
  } else {
    selId = sideCrewSel || (isLinks ? crewPageSel : '') || (S.auth && S.auth.crewId) || '';
  }
  var cr = selId ? crewById(selId) : null;
  var h = '<div class="side-panel">'+sidePanelHead('freqs', '📻 Частоти екіпажу'+(cr ? ' ('+esc(cr.crewName || cr.id)+')' : ''));
  if (!sidePanelOpen.freqs) return h + '</div>';
  h += '<div class="side-panel-body">';
  if (!cr) return h + '<div class="empty">Оберіть екіпаж у переліку вище</div></div></div>';

  // Кнопки редагування — ТІЛЬКИ на «Активних зʼєднаннях» у режимі
  // «Редагування» (синхронно з перемикачем) і лише для свого/адміна.
  // «Загальний О.С.» і режим «Перегляд» — суто інформаційний показ.
  var canMg = editOn && canManageCrew(cr.id);
  var occ = occupiedFreqsExcept(cr);
  var list = crewFreqList(cr);
  var d = S.freq || {};
  var conflicts = [];

  // Bind-фраза — над списком частот: вона спільна для всіх бортів екіпажу,
  // а частоти нижче поштучні. Рядок показується завжди (тобто і в режимі
  // «Перегляд», і на «Загальному О.С.»), кнопка ✎ — лише за тим самим
  // правилом canMg, що й у частот.
  h += '<div class="member-row">'+
    '<div style="flex:1"><div class="member-cs">🔗 '+
      (cr.bind ? '<span class="mono" style="color:var(--accent-soft)">'+esc(cr.bind)+'</span>'
               : '<span class="hint">— не задано —</span>')+'</div>'+
    '<div class="member-name">bind-фраза екіпажу</div></div>'+
    (canMg
      ? '<div class="inv-acts"><button class="inv-act" title="Змінити bind-фразу" onclick="crewBindModal(\''+esc(cr.id)+'\')">'+svgIcon('edit')+'</button></div>'
      : '')+
  '</div>';

  if (!list.length) {
    h += '<div class="hint" style="margin-bottom:8px">Частот не задано</div>';
  }
  list.forEach(function(x){
    var c = classifyFreq(x.freq, occ, d.warningFreqs);
    if (c.lvl === 'busy' || c.lvl === 'near') conflicts.push({ x: x, c: c });
    h += '<div class="member-row">'+
      '<div style="flex:1"><div class="member-cs">'+(x.kind === 'main' ? '⭐ ' : '🔄 ')+
        '<span class="mono" style="color:var(--accent-soft)">'+esc(x.code)+'</span> '+
        '<span class="hint">'+esc(x.freq)+' МГц</span></div>'+
      '<div class="member-name">'+c.mark+' '+(c.lvl==='free' ? 'без конфліктів'
        : c.lvl==='busy' ? 'конфлікт з '+esc(c.who)+' (Δ'+c.d+')'
        : c.lvl==='near' ? 'поряд із '+esc(c.who)+' (Δ'+c.d+')'
        : c.lvl==='imd' ? 'IMD3-інтермодуляція'
        : 'нерекомендована частота')+'</div></div>'+
      (canMg
        ? '<div class="inv-acts">'+
            '<button class="inv-act" title="Змінити" data-k="'+x.kind+'" data-c="'+esc(x.code)+'" onclick="crewFreqPickModal(\''+esc(cr.id)+'\', this.dataset.k, this.dataset.c)">'+svgIcon('edit')+'</button>'+
            '<button class="inv-act inv-act--del" title="Видалити частоту" data-k="'+x.kind+'" data-c="'+esc(x.code)+'" onclick="crewRemoveFreq(\''+esc(cr.id)+'\', this.dataset.k, this.dataset.c)">'+svgIcon('x')+'</button>'+
          '</div>'
        : '')+
    '</div>';
  });

  // Оптимум 1–3 частоти
  if (list.length) {
    h += list.length <= 3
      ? '<div class="hint" style="color:var(--green);margin-top:6px">✓ '+list.length+' част. — оптимально (1–3)</div>'
      : '<div class="warn" style="margin-top:6px">⚠ '+list.length+' частот — понад оптимум. Кожна зайва частота звужує вільний спектр і зменшує кількість екіпажів, які можна розмістити без конфліктів.</div>';
  }

  // Конфлікти → рекомендації заміни
  if (conflicts.length) {
    var recs = recommendFreqs(cr, 3);
    h += '<div class="warn" style="margin-top:6px">⚠ Є конфліктні частоти. Рекомендовані вільні: '+
      (recs.length ? recs.map(function(r){ return '<b class="mono">'+esc(r.code)+' ('+r.freq+')</b>'; }).join(', ') : '—')+
      (canMg ? '<br><span class="hint">Натисни ✎ біля конфліктної частоти і обери зі списку «⭐ Рекомендовані»</span>' : '')+
    '</div>';
  }

  if (canMg) {
    h += '<div class="btn-row" style="margin-top:10px">'+
      (!cr.freq ? '<button class="btn btn-mini btn-green" onclick="crewFreqPickModal(\''+esc(cr.id)+'\', \'main\', \'\')">⭐ Основна</button>' : '')+
      '<button class="btn btn-mini btn-sec" onclick="crewFreqPickModal(\''+esc(cr.id)+'\', \'res\', \'\')">➕ Резервна</button>'+
    '</div>';
  }
  h += '</div></div>';
  return h;
}

// Модалка вибору частоти: групи як на карті частот + рекомендації
function crewFreqPickModal(crewId, kind, replaceCode) {
  var cr = crewById(crewId);
  if (!cr) return;
  var d = S.freq || {};
  var bands = allBands(d);
  var order = allBandOrder(d).filter(function(b){ return bands[b]; });
  var occ = occupiedFreqsExcept(cr);
  var mine = crewFreqList(cr).map(function(x){ return x.code; });

  var items = [];
  order.forEach(function(band){
    if (!systemAllowsBand(cr.system, band)) return; // тільки бенди відеосистеми екіпажу
    if (!gridAllowsBand(crewGrid(cr), band)) return;     // і тільки те, що тягне VTX борту
    bands[band].forEach(function(f, i){
      var code = band + (i + 1);
      if (!gridAllowsFreq(crewGrid(cr), band, f)) return;
      var ef = f;
      if (mine.indexOf(code) !== -1 && code !== replaceCode) return;
      items.push({ code: code, freq: ef, c: classifyFreq(ef, occ, d.warningFreqs), dist: freqMinDist(ef, occ) });
    });
  });
  var recSet = {};
  recommendFreqs(cr, 5).forEach(function(r){ recSet[r.code] = 1; });

  function opts(arr) {
    return arr.map(function(x){
      var lbl = (recSet[x.code] ? '⭐ ' : x.c.mark + ' ') + x.code + ' — ' + x.freq + ' МГц' +
        (x.c.who ? ' · ' + x.c.who : '') + (x.c.d ? ' (Δ' + x.c.d + ')' : '');
      return '<option value="'+esc(x.code)+' ('+x.freq+')">'+esc(lbl)+'</option>';
    }).join('');
  }
  var gRec  = items.filter(function(x){ return recSet[x.code]; });
  var gFree = items.filter(function(x){ return x.c.lvl === 'free' && !recSet[x.code]; });
  var gImd  = items.filter(function(x){ return x.c.lvl === 'imd'; });
  var gNear = items.filter(function(x){ return x.c.lvl === 'near'; });
  var gWarn = items.filter(function(x){ return x.c.lvl === 'warn'; });
  var gBusy = items.filter(function(x){ return x.c.lvl === 'busy'; });

  var selHtml = '<select id="cfpSel">'+
    '<option value="">— оберіть частоту —</option>'+
    (gRec.length  ? '<optgroup label="⭐ Рекомендовані (максимальний запас)">'+opts(gRec)+'</optgroup>' : '')+
    (gFree.length ? '<optgroup label="🟢 Вільні">'+opts(gFree)+'</optgroup>' : '')+
    (gImd.length  ? '<optgroup label="🟡 IMD3-інтермодуляція">'+opts(gImd)+'</optgroup>' : '')+
    (gNear.length ? '<optgroup label="🟠 Поряд із зайнятими (Δ20–40)">'+opts(gNear)+'</optgroup>' : '')+
    (gWarn.length ? '<optgroup label="⚠ Нерекомендовані">'+opts(gWarn)+'</optgroup>' : '')+
    (gBusy.length ? '<optgroup label="🔴 Конфліктні / зайняті (Δ<20)">'+opts(gBusy)+'</optgroup>' : '')+
  '</select>';

  openModal((kind === 'main' ? '⭐ Основна частота' : '🔄 Резервна частота') + ' · ' + esc(cr.crewName || cr.id),
    (cr.system ? '<div class="hint" style="margin-bottom:6px">📹 '+esc(cr.system)+' — показано лише сумісні бенди</div>' : '')+
    (replaceCode ? '<div class="hint" style="margin-bottom:8px">Заміна частоти <b class="mono">'+esc(replaceCode)+'</b></div>' : '')+
    '<div class="f"><label>Частота</label>'+selHtml+'</div>'+
    '<div class="hint" style="margin-bottom:10px">🟢 вільна · ⭐ рекомендована (лишає максимум місця іншим екіпажам) · 🟡 IMD3 · 🟠 поряд · 🔴 конфлікт · ⚠ нерекомендована</div>'+
    '<button class="btn btn-green" id="cfpBtn" onclick="crewApplyFreq(\''+esc(crewId)+'\', \''+esc(kind)+'\', \''+esc(replaceCode||'')+'\')">💾 Зберегти</button>'
  );
}

function crewApplyFreq(crewId, kind, replaceCode) {
  var v = $('cfpSel').value;
  if (!v) { toast('⚠ Обери частоту', true); return; }
  var cr = crewById(crewId);
  if (!cr) return;
  var m = v.match(/\((\d+)\)/);
  var f = m ? Number(m[1]) : 0;
  var c = classifyFreq(f, occupiedFreqsExcept(cr), (S.freq||{}).warningFreqs);
  if (c.lvl === 'busy' && !confirm('🔴 '+v+' конфліктує з '+c.who+' (Δ'+c.d+' МГц). Взяти все одно?')) return;
  if (c.lvl === 'near' && !confirm('🟠 '+v+' близько до '+c.who+' (Δ'+c.d+' МГц). Взяти все одно?')) return;
  if (c.lvl === 'warn' && !confirm('⚠ '+v+' — нерекомендована частота. Взяти все одно?')) return;

  var patch;
  if (kind === 'main') {
    patch = { freq: v };
  } else {
    var arr = (cr.reserves||'').split('|').filter(Boolean);
    if (replaceCode) arr = arr.map(function(r){ return cleanCode(r) === replaceCode ? v : r; });
    else arr.push(v);
    patch = { reserves: arr.join('|') };
  }
  // Оптимум 1–3: попередження, якщо стає більше
  var mainCnt = (patch.freq !== undefined ? patch.freq : cr.freq) ? 1 : 0;
  var resCnt = String(patch.reserves !== undefined ? patch.reserves : (cr.reserves||'')).split('|').filter(Boolean).length;
  if (mainCnt + resCnt > 3 && !confirm('⚠ У екіпажу стане '+(mainCnt+resCnt)+' частот (оптимально 1–3).\nНадлишкові частоти звужують спектр і заважають безконфліктному розміщенню інших екіпажів. Продовжити?')) return;

  var btn = $('cfpBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('updateCrew', [crewId, patch, crewToken() || undefined], function(){
    if (patch.freq !== undefined) cr.freq = patch.freq;
    if (patch.reserves !== undefined) cr.reserves = patch.reserves;
    toast('📻 '+(cr.crewName || crewId)+': '+(kind==='main' ? 'основна → ' : 'резервні: ')+v);
    closeModal();
    renderView();
    reloadFreq();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; }
    toast('❌ '+e.message, true);
  });
}

function crewRemoveFreq(crewId, kind, code) {
  var cr = crewById(crewId);
  if (!cr) return;
  if (!confirm('✕ Видалити '+(kind==='main' ? 'основну' : 'резервну')+' частоту '+code+' у '+(cr.crewName || crewId)+'?')) return;
  var patch;
  if (kind === 'main') patch = { freq: '' };
  else patch = { reserves: (cr.reserves||'').split('|').filter(Boolean).filter(function(r){ return cleanCode(r) !== code; }).join('|') };
  rpc('updateCrew', [crewId, patch, crewToken() || undefined], function(){
    if (patch.freq !== undefined) cr.freq = patch.freq;
    if (patch.reserves !== undefined) cr.reserves = patch.reserves;
    toast('✕ '+code+' видалено');
    renderView();
    reloadFreq();
  });
}

// ── Операції зі складом ──
function crewMembersArr(cr) { return (cr.members||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean); }

function crewSaveMembers(cr, patch, okMsg) {
  rpc('updateCrew', [cr.id, patch, crewToken() || undefined], function(){
    if (patch.members !== undefined) cr.members = patch.members;
    if (patch.main    !== undefined) cr.main    = patch.main;
    toast(okMsg);
    // Оновити привʼязку в локальному персоналі + власну сесію
    refreshPersonnelCrewLinks();
    if (S.auth) rpc('authWhoAmI', [authToken()], function(op){ if (op && op.id) S.auth = op; renderView(); }, function(){ renderView(); });
    else renderView();
    loadAll();
  }, function(e){ toast('❌ '+e.message, true); renderView(); });
}

// Перерахувати crewId/isMain у S.personnel з локальних даних екіпажів
function refreshPersonnelCrewLinks() {
  var crews = activeCrews();
  S.personnel.forEach(function(p){
    p.crewId = ''; p.crewName = ''; p.isMain = false;
    crews.forEach(function(cr){
      if (cr.main === p.id) { p.crewId = cr.id; p.crewName = cr.crewName || ''; p.isMain = true; }
      else if (crewMembersArr(cr).indexOf(p.id) !== -1) { p.crewId = cr.id; p.crewName = cr.crewName || ''; }
    });
  });
}

function crewAddMemberModal() {
  var cr = crewById(crewPageSel);
  if (!cr) return;
  var inCrew = crewMembersArr(cr).concat(cr.main ? [cr.main] : []);
  var list = S.personnel.filter(function(p){ return inCrew.indexOf(p.id) === -1; });
  if (!list.length) { toast('⚠ Немає вільних осіб — додай персонал у налаштуваннях', true); return; }
  var opts = list.map(function(p){
    var locked = p.crewId && p.crewId !== cr.id;
    // Людина з іншого сектора — «відряджена», в цей екіпаж не можна взагалі
    var away = !!(cr.sector && p.sector && p.sector !== cr.sector);
    return '<option value="'+esc(p.id)+'"'+((away || (locked && !canEditCrews()))?' disabled':'')+'>'+
      esc(p.callsign)+(p.name?' ('+esc(p.name)+')':'')+(locked?' 🔒 '+esc(p.crewName||p.crewId):'')+
      (away?' ⛔ Відряджений · '+esc(sectorName(p.sector)):'')+'</option>';
  }).join('');
  openModal('➕ Член екіпажу → '+esc(cr.crewName || cr.id),
    '<div class="f"><label>Особа</label><select id="cmSel">'+opts+'</select>'+
    '<div class="hint">🔒 — особа в іншому екіпажі'+(canEditCrews()?' (можна перевести)':' (переводить адмін)')+
    (cr.sector ? ' · ⛔ — розподілена в інший сектор (переміщення — вкладка «Розподіл» у Секторі, адмін)' : '')+'</div></div>'+
    '<button class="btn btn-green" id="cmBtn" onclick="crewPickMember()">➕ Додати</button>'

}

function crewPickMember() {
  var cr = crewById(crewPageSel);
  var opId = $('cmSel').value;
  var p = personById(opId);
  if (!cr || !p) return;
  var btn = $('cmBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  // Захист від обходу disabled-опції: інший сектор — зась (бекенд перевірить теж)
  if (cr.sector && p.sector && p.sector !== cr.sector) {
    toast('⛔ '+p.callsign+' розподілений у «'+sectorName(p.sector)+'» — переміщення через вкладку «Розподіл» (адмін)', true);
    if (btn) { btn.disabled = false; btn.textContent = '➕ Додати'; }
    return;
  }
  function addHere() {
    var patch = cr.main ? { members: crewMembersArr(cr).concat([opId]).join('|') } : { main: opId };
    crewSaveMembers(cr, patch, '✅ '+p.callsign+' додано до '+(cr.crewName || cr.id));
    closeModal();
  }
  if (p.crewId && p.crewId !== cr.id) {
    if (!canEditCrews()) { toast('⚠ '+p.callsign+' в іншому екіпажі — переводить адмін', true); if (btn){btn.disabled=false;btn.textContent='➕ Додати';} return; }
    if (p.isMain) { toast('⚠ '+p.callsign+' — головний екіпажу '+(p.crewName||p.crewId)+'. Спочатку передай там головного.', true); if (btn){btn.disabled=false;btn.textContent='➕ Додати';} return; }
    if (!confirm('🔒 '+p.callsign+' в екіпажі '+(p.crewName||p.crewId)+'.\nПеревести в '+(cr.crewName||cr.id)+'?')) { if (btn){btn.disabled=false;btn.textContent='➕ Додати';} return; }
    var oc = crewById(p.crewId);
    var rest = crewMembersArr(oc).filter(function(x){ return x !== opId; }).join('|');
    rpc('updateCrew', [oc.id, { members: rest }], function(){
      oc.members = rest;
      addHere();
    }, function(e){ if (btn){btn.disabled=false;btn.textContent='➕ Додати';} toast('❌ '+e.message, true); });
  } else {
    addHere();
  }
}

function crewSetMain(opId) {
  var cr = crewById(crewPageSel);
  if (!cr) return;

  if (!confirm('⭐ Зробити '+(p?p.callsign:opId)+' головним відповідальним '+(cr.crewName||cr.id)+'?'+

function crewRemoveMember(opId) {

// Виставити частоту; якщо її немає в списку (інша система) — додати окремою опцією щоб не загубити
function cfSetFreqValue(freq) {
  var fs = $('cfFreq');
  if (!fs || !freq) return;
  fs.value = freq;
  if (fs.value !== freq) {
    var o = document.createElement('option');
    o.value = freq; o.textContent = freq;
    fs.appendChild(o);
    fs.value = freq;
  }
}
// Перебудувати списки частот (основна + резервні) під відеосистему
function cfRebuildFreqs(system) {
  var fs = $('cfFreq'), rs = $('cfReserveSel');
  var grid = $('cfGrid') ? $('cfGrid').value : '';
  var opts = freqOptionsHtml(system, grid);
  if (fs) {
    var cur = fs.value;
    fs.innerHTML = '<option value="">— не вказано —</option>' + opts;
    // Раніше обрана частота може бути поза новою сіткою — тоді cfSetFreqValue
    // її не знайде, і поле лишиться порожнім. Кажемо про це прямо, щоб
    // людина не думала, що частота просто «збереглась десь».
    if (cur) {
      cfSetFreqValue(cur);
      if (fs.value !== cur) {
        toast('⚠ Частота '+cur+' не входить у сітку — обери іншу', true);
      }
    }
  }
  if (rs) rs.innerHTML = '<option value="">+ додати резервну</option>' + opts;
  cfWarnReservesOutOfGrid(grid);
}

// Резервні, що випали за межі сітки, — позначаємо, але не стираємо мовчки
function cfWarnReservesOutOfGrid(grid) {
  if (!grid || !crewForm.reserves || !crewForm.reserves.length) return;
  var bad = crewForm.reserves.filter(function(code){
    var m = /^(.+?)\d+\s*\((\d+)\)/.exec(code);
    if (!m) return false;
    return !gridAllowsFreq(grid, m[1].trim(), Number(m[2]));
  });
  if (bad.length) toast('⚠ Поза сіткою: '+bad.join(', ')+' — прибери або зміни сітку', true);
}
function cfSystemChange() {
  var hint = $('cfSysHint');
  if (hint) hint.innerHTML = '';
  cfRebuildFreqs($('cfSystem').value);
}
// Авто-визначення відеосистеми екіпажу по назвах бортів у пулі
// Чи це Sting з аналоговим VTX — саме в нього звужена сітка.
// Тип STNG або «Sting» у назві + аналоговий суфікс (AD/AT).
function isStingAnalog(it) {
  if (!it) return false;
  var name = String(it.name || '');
  var isSting = String(it.type || '').indexOf('STNG') === 0 || /sting/i.test(name);
  return isSting && detectSystemFromName(name) === 'Аналог';
}

// Сітка за бортами пулу. Змішаний пул навмисно тягне до вужчої сітки:
// частота має підійти ВСІМ бортам екіпажу, тож вирішує слабший.
function detectGridFromDrones() {
  for (var i = 0; i < crewForm.drones.length; i++) {
    var it = S.items.find(function(x){ return x.id === crewForm.drones[i]; });
    if (isStingAnalog(it)) return 'Sting';
  }
  return '';
}

function cfAutoDetectSystem() {
  var sel = $('cfSystem');
  if (!sel) return;
  var detected = '';
  for (var i = 0; i < crewForm.drones.length; i++) {
    var it = S.items.find(function(x){ return x.id === crewForm.drones[i]; });
    var d = detectSystemFromName(it ? it.name : '');
    if (d) { detected = d; break; }
  }

  // Сітка визначається так само автоматично, як і відеосистема
  var grid = detectGridFromDrones();
  var gsel = $('cfGrid');
  var gridHint = '';
  if (gsel && grid && gsel.value !== grid) {
    gsel.value = grid;
    gridHint = ' · сітка <b>'+esc(grid)+'</b> (звужена під VTX борту)';
  }

  if (detected) {
    sel.value = detected;
    var hint = $('cfSysHint');
    if (hint) hint.innerHTML = '✅ Авто з борту: <b>'+esc(detected)+'</b>'+gridHint;
    cfRebuildFreqs(detected);
  } else if (gridHint) {
    var h2 = $('cfSysHint');
    if (h2) h2.innerHTML = '✅ Авто з борту:'+gridHint;
    cfRebuildFreqs(sel.value);
  }
}
function cfFilterDrones() {
  var q = $('cfDroneSearch').value.toLowerCase();
  var dd = $('cfDroneDd');
  if (!q) { dd.style.display='none'; return; }
  var busy = busyDrones();
  var list = S.items.filter(function(it){
    return (it.type.indexOf('FPV')===0 || it.type.indexOf('STNG')===0 || it.type.indexOf('WING')===0) &&
      (it.id.toLowerCase().indexOf(q)!==-1 || it.name.toLowerCase().indexOf(q)!==-1) &&
      crewForm.drones.indexOf(it.id) === -1;
  }).slice(0, 10);
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(it){
    return '<div class="ac-item" onmousedown="cfAddDrone(\''+esc(it.id)+'\')">'+
      '<div class="ac-id">'+esc(it.id)+(busy[it.id]?' ⚠ в повітрі':'')+'</div>'+
      '<div class="ac-meta">'+esc(it.name)+' · '+esc(it.status)+'</div></div>';
  }).join('');
  dd.style.display = 'block';
}
function cfAddDrone(id) { if (crewForm.drones.indexOf(id)===-1) crewForm.drones.push(id); $('cfDroneSearch').value=''; $('cfDroneDd').style.display='none'; cfRenderChips(); cfAutoDetectSystem(); }
function cfRemoveDrone(id) { crewForm.drones = crewForm.drones.filter(function(x){ return x !== id; }); cfRenderChips(); cfAutoDetectSystem(); }
function cfFilterTrackers() {
  var q = $('cfTrkSearch').value.toLowerCase().trim();
  var dd = $('cfTrkDd');
  var busyTrk = {};
  activeCrews().forEach(function(c2){
    if (c2.tracker && c2.id !== crewForm.editId) c2.tracker.split('|').forEach(function(t){ t=t.trim(); if(t) busyTrk[t]=(busyTrk[t]||[]).concat(c2.id); });
  });
  var list = S.trackers.filter(function(t){
    return crewForm.trackers.indexOf(t.id)===-1 &&
      (!q || t.id.toLowerCase().indexOf(q)!==-1 || (t.model||'').toLowerCase().indexOf(q)!==-1 || (t.imei||'').toLowerCase().indexOf(q)!==-1);
  }).slice(0, 10);
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(t){
    var busy = busyTrk[t.id];
    var flag = busy ? ' 🔒 '+busy.join(',') : (t.status!=='Робочий' ? ' ⚠ '+t.status : '');
    return '<div class="ac-item" '+(busy?'style="opacity:.5;cursor:not-allowed"':'onmousedown="cfAddTracker(\''+esc(t.id)+'\')"')+'>'+
      '<div class="ac-id">'+esc(t.imei||t.id)+flag+'</div>'+
      '<div class="ac-meta">'+esc(t.model)+' · '+esc(t.simContact||'без SIM')+'</div></div>';
  }).join('');
  dd.style.display = 'block';
}
function cfAddTracker(id) {
  var t = S.trackers.find(function(x){ return x.id===id; });
  if (t && t.status !== 'Робочий' && !confirm('⚠ Трекер '+id+' — '+t.status+'! Додати все одно?')) return;
  if (crewForm.trackers.indexOf(id)===-1) crewForm.trackers.push(id);
  $('cfTrkSearch').value=''; $('cfTrkDd').style.display='none'; cfRenderChips();
}
function cfAddReserve() {
  var sel = $('cfReserveSel');
  if (!sel.value) return;
  if (crewForm.reserves.length >= 10) { toast('⚠ Максимум 10 резервних', true); sel.value=''; return; }
  if (crewForm.reserves.indexOf(sel.value)===-1) crewForm.reserves.push(sel.value);
  sel.value=''; cfRenderChips();
}
function cfRenderChips() {
  // Основний борт випав із пулу — скидаємо, щоб не зберегти неіснуючий
  if (crewForm.mainDrone && crewForm.drones.indexOf(crewForm.mainDrone) === -1) crewForm.mainDrone = '';
  if ($('cfMainDrone')) {
    $('cfMainDrone').innerHTML = '<option value="">— не вказано —</option>' +
      crewForm.drones.map(function(d){
        var it = S.items.find(function(x){ return x.id === d; });
        return '<option value="'+esc(d)+'"'+(crewForm.mainDrone===d?' selected':'')+'>'+esc(d)+(it?' — '+esc(it.name):'')+'</option>';
      }).join('');
    $('cfMainDrone').onchange = function(){ crewForm.mainDrone = this.value; cfRenderChips(); };
  }
  if ($('cfDroneList')) $('cfDroneList').innerHTML = crewForm.drones.map(function(d){
    return '<span class="chip click" onclick="cfRemoveDrone(\''+esc(d)+'\')">'+(crewForm.mainDrone===d?'⭐ ':'')+esc(d)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
  if ($('cfTrkList')) $('cfTrkList').innerHTML = crewForm.trackers.map(function(t){
    var tr = S.trackers.find(function(x){ return x.id===t; });
    return '<span class="chip click" onclick="crewForm.trackers=crewForm.trackers.filter(function(x){return x!==\''+esc(t)+'\'});cfRenderChips()">'+esc(tr&&tr.imei?tr.imei:t)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
  if ($('cfReserveList')) $('cfReserveList').innerHTML = crewForm.reserves.map(function(r){
    return '<span class="chip click chip-freq" onclick="crewForm.reserves=crewForm.reserves.filter(function(x){return x!==\''+esc(r)+'\'});cfRenderChips()">'+esc(r)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
}
// Форма екіпажу у спливаючому вікні: без crewId — створення, з crewId — редагування
function openCrewForm(crewId) {
  if (crewId) {
    var cr = crewById(crewId);
    if (!cr) return;
    crewForm = {
      editId: crewId,
      drones: cr.drones ? cr.drones.split('|').filter(Boolean) : [],
      trackers: cr.tracker ? cr.tracker.split('|').map(function(s){return s.trim();}).filter(Boolean) : [],
      reserves: cr.reserves ? cr.reserves.split('|').filter(Boolean) : [],
      mainDrone: cr.mainDrone || ''
    };
  } else {
    crewForm = { drones: [], trackers: [], reserves: [], editId: null, mainDrone: '' };
  }
  var cr2 = crewId ? crewById(crewId) : null;
  openModal(crewId ? '✏️ Екіпаж '+esc((cr2 && cr2.crewName) || crewId) : '➕ Новий екіпаж',
    '<div id="crewFormPanel"></div>', true);
  renderCrewForm();
}
function doSaveCrew() {
  if (!crewForm.drones.length) { toast('⚠ Додай хоча б один борт', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('cfBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() {
    if (btn) { btn.disabled = false; btn.textContent = crewForm.editId ? '💾 Зберегти' : '👥 Створити екіпаж'; }
  }
  var data = {
    gnst: $('cfGnst').value, bind: $('cfBind').value.trim(),
    drones: crewForm.drones.join('|'), tracker: crewForm.trackers.join('|'),
    system: $('cfSystem').value, grid: ($('cfGrid') ? $('cfGrid').value : ''), freq: $('cfFreq').value, reserves: crewForm.reserves.join('|'),
    mainDrone: crewForm.mainDrone || '',
    sector: $('cfSector') ? $('cfSector').value : '',
    crewName: $('cfName') ? $('cfName').value.trim() : undefined,
    main: $('cfMain') ? $('cfMain').value : undefined
  };
  if (crewForm.editId) {
    var editId = crewForm.editId;
    rpc('updateCrew', [editId, data], function(){
      toast('💾 '+editId+' збережено');
      // Одразу оновлюємо локально — без очікування перезавантаження з сервера
      var c = crewById(editId);
      if (c) { c.gnst=data.gnst; c.bind=data.bind; c.drones=data.drones; c.tracker=data.tracker;
               c.system=data.system; c.freq=data.freq; c.reserves=data.reserves;
               c.grid=data.grid; c.mainDrone=data.mainDrone; c.sector=data.sector;
               if (data.crewName !== undefined) c.crewName = data.crewName;
               if (data.main !== undefined) c.main = data.main; }
      crewForm = {drones:[],trackers:[],reserves:[],editId:null};
      closeModal();
      renderView();
      loadAll();
    }, function(e){ unlock(); toast('❌ ' + e.message, true); });
  } else {
    data.pilot = '';
    rpc('createCrew', [data], function(newId){
      // Одразу показуємо новий екіпаж локально — без очікування перезавантаження
      if (typeof newId === 'string' && newId) {
        toast('👥 Екіпаж '+newId+' створено');
        S.flights.push({ id:newId, date:new Date().toISOString().slice(0,10), crew:newId,
          gnst:data.gnst, drones:data.drones, bind:data.bind, pilot:'', tracker:data.tracker,
          trackerOk:'', start:'', end:'', status:'Активний', note:'', creatorEmail:S.me,
          system:data.system, freq:data.freq, reserves:data.reserves, equip:'',
          main:data.main || '', members:'', crewName:data.crewName || '', sector:data.sector || '' });
        refreshPersonnelCrewLinks();
      } else {
        toast('👥 Екіпаж створено');
      }
      crewForm = {drones:[],trackers:[],reserves:[],editId:null};
      closeModal();
      renderView();
      updateTopStats();
      loadAll();
    }, function(e){ unlock(); toast('❌ ' + e.message, true); });
  }
}
function doCloseCrew(crewId) {
  var act = activeFlights().filter(function(f){ return f.crew===crewId; });
  if (act.length) { toast('⚠ Спочатку заверши вильоти: '+act.map(function(f){return f.id;}).join(', '), true); return; }
  var cr = crewById(crewId);
  if (!confirm('🔴 Завершити екіпаж '+((cr && cr.crewName) ? cr.crewName+' ('+crewId+')' : crewId)+'?\nЗ\'єднання стане неактивним, люди й інвентар звільняться.')) return;
  rpc('endFlight', [crewId, [], 'Екіпаж завершено'], function(){ toast('🔴 '+crewId+' завершено'); loadAll(); });
}

// ── Перейменування екіпажу (адмін, режим редагування) ──
function crewRenameModal(crewId) {
  var cr = crewById(crewId);
  if (!cr) return;
  openModal('✏️ Назва екіпажу · '+esc(crewId),
    '<div class="f"><label>Назва</label><input type="text" id="cnName" value="'+esc(cr.crewName||'')+'" placeholder="напр. Alfa" onkeydown="if(event.key===\'Enter\')doCrewRename(\''+esc(crewId)+'\')"></div>'+
    '<button class="btn btn-green" id="cnBtn" onclick="doCrewRename(\''+esc(crewId)+'\')">💾 Зберегти</button>'
  );
  setTimeout(function(){ var i = $('cnName'); if (i) { i.focus(); i.select(); } }, 60);
}
function doCrewRename(crewId) {
  var v = $('cnName').value.trim();
  if (!v) { toast('⚠ Вкажи назву', true); return; }
  var btn = $('cnBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('updateCrew', [crewId, { crewName: v }, crewToken() || undefined], function(){
    var cr = crewById(crewId);
    if (cr) cr.crewName = v;
    refreshPersonnelCrewLinks();
    toast('✏️ '+crewId+' → «'+v+'»');
    closeModal();
    renderView();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; }
    toast('❌ '+e.message, true);
  });
}

// Bind-фраза екіпажу — правиться прямо з панелі «Частоти екіпажу»,
// бо разом із частотами вона і потрібна під час налаштування зв'язку.
// Порожнє значення дозволене навмисно: так вичищаються старі приписки
// (колись у це поле писали GNST наземки, звідки й плутанина в назвах).
function crewBindModal(crewId) {
  var cr = crewById(crewId);
  if (!cr) return;
  openModal('🔗 Bind-фраза · '+esc(cr.crewName || crewId),
    '<div class="f"><label>Bind фраза</label><input type="text" id="cbVal" value="'+esc(cr.bind||'')+'" placeholder="спільна для всіх бортів…" onkeydown="if(event.key===\'Enter\')doCrewBind(\''+esc(crewId)+'\')"></div>'+
    '<div class="hint" style="margin-bottom:10px">Спільна для всіх бортів екіпажу. Порожнє поле — прибрати фразу.</div>'+
    '<button class="btn btn-green" id="cbBtn" onclick="doCrewBind(\''+esc(crewId)+'\')">💾 Зберегти</button>'
  );
  setTimeout(function(){ var i = $('cbVal'); if (i) { i.focus(); i.select(); } }, 60);
}
function doCrewBind(crewId) {
  var v = $('cbVal').value.trim();
  var btn = $('cbBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('updateCrew', [crewId, { bind: v }, crewToken() || undefined], function(){
    var cr = crewById(crewId);
    if (cr) cr.bind = v;
    toast(v ? '🔗 Bind: '+v : '🔗 Bind-фразу прибрано');
    closeModal();
    renderView();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; }
    toast('❌ '+e.message, true);
  });
}

/* ═══════════ МОДАЛКИ ═══════════ */
// Зупинити відео/аудіо всередині модалки. Обовʼязково перед закриттям і
// перед заміною вмісту: closeModal лише ховає модалку (знімає клас), а
// плеєр лишається в DOM і грає далі у фоні; заміна ж через innerHTML у
// частини браузерів теж не глушить звук одразу. Зупиняємо явно:
// пауза + зняття src + load(), щоб і потік з Worker перестав тягтися.
function modalStopMedia() {
  var box = $('modalBox');
  if (!box) return;
  var els = box.querySelectorAll('video,audio');
  for (var i = 0; i < els.length; i++) {
    try { els[i].pause(); els[i].removeAttribute('src'); els[i].load(); } catch(e) {}
  }
  // Blob тут НЕ відкликаємо: openModal викликається ПІСЛЯ того, як
  // переглядач створив свій blob-URL, — відкликання вбило б його до показу
}

function openModal(title, bodyHtml, wide) {
  modalStopMedia();
  $('modalBox').className = 'modal' + (wide ? ' wide' : '');
  $('modalBox').innerHTML = '<div class="modal-title"><span>'+title+'</span>'+
    '<button class="modal-close" onclick="closeModal()">✕</button></div>' + bodyHtml;
  $('modalBg').classList.add('open');
}
function closeModal() {
  modalStopMedia();
  infoRevokeBlob();   // переглядач закрито — його blob більше нікому не потрібен
  $('modalBg').classList.remove('open');
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

/* ═══════════ СТАРТ ═══════════ */
if (DEMO) {
  $('demoBanner').style.display = 'block';
  $('demoBanner').innerHTML = '⚠ Демо-режим — дані тестові · ' +
    '<a href="#" onclick="setApiUrl();return false" style="color:inherit;text-decoration:underline">підключити базу</a>';
}
if ($('footGear')) $('footGear').innerHTML = svgIcon('gear');
if (MODE === 'api' && !authToken()) {
  // PWA без сесії: спершу вхід, дані підтягнуться після логіна
  renderView();
  openLoginModal();
} else {
  // Снапшот з минулого разу — на екрані одразу, свіже доїде слідом
  if (loadSnapshot()) renderView();
  loadAll();
}
authInit();
// Автооновлення: НЕ чіпаємо, поки відкрита модалка або користувач щось
// друкує — інакше перемальовка збиває заповнення форми
function userIsBusy() {
  // Завантаження файлу — теж «зайнято»: автооновлення перемальовувало
  // розділ просто посеред процесу і збивало роботу
  if ((typeof infoUp !== 'undefined' && infoUp.active) ||
      (typeof infoDl !== 'undefined' && infoDl.active)) return true;
  if ($('modalBg') && $('modalBg').classList.contains('open')) return true;
  var a = document.activeElement;
  return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT'));
}
setInterval(function(){
  if (document.hidden || (MODE === 'api' && !authToken()) || userIsBusy()) return;
  // На вкладці карти втрат — не смикати: тихе оновлення даних без ререндеру
  if (S.view === 'trackers' && trkTab === 'map') { loadAll(false, true); return; }
  // Сектор: у редагуванні не оновлюємо ВЗАГАЛІ — ререндер зносить ручки
  // вершин і режим малювання посеред роботи; у перегляді — тихо,
  // щоб карта не скидала зум і позицію кожні 90 секунд
  if (S.view === 'sector') {
    if (!sectorEdit && !sectorDraw) loadAll(false, true);
    return;
  }
  loadAll();
}, 90000);
</script>
