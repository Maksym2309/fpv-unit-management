/* ═══════════ ВИД: ІНФОРМАЦІЯ ═══════════ */
// Документи підрозділу зі спільної теки Drive. Доступ — право «Інформація»
// в аркуші «Персонал»: Drive операторів не знає (вони заходять за позивним),
// тому розмежування живе в нашому коді, а не в шаренні Drive. З тієї ж
// причини файл відкривається вмістом через API, а не посиланням на Drive.
var infoState = { folderId: '', data: null, loading: false, err: '' };
// Режими як у решті застосунку: перегляд нічого не змінює, редагування
// відкриває дії. Кнопки створення й видалення живуть лише в редагуванні.
var infoMode = 'view';   // 'view' | 'edit'
function infoSetMode(m) { infoMode = m; renderView(); }

// Що зараз «вирізано». Клік по рядку теки не можна було зайняти під це:
// він відкриває теку, а щоб перенести — треба саме дійти до призначення.
// Тому позначаємо кнопкою, а навігація лишається звичайною.
var infoClip = null;     // { id, name, isFolder }

function infoCut(id, name, isFolder) {
  infoClip = { id: id, name: name, isFolder: !!isFolder };
  renderView();
}
function infoCutCancel() { infoClip = null; renderView(); }

function infoPasteHere() {
  if (!infoClip) return;
  var btn = $('infoPasteBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'зачекай…'; }
  rpc('infoMove', [infoClip.id, infoState.folderId], function(res){
    var what = (res && res.name) || infoClip.name;
    infoClip = null;
    // Змінилися дві теки — вихідна й ця. Переміщення рідкісне, тож
    // простіше й надійніше скинути кеш цілком, ніж вгадувати, чий саме.
    infoCache = {};
    toast('Переміщено: ' + what);
    infoReload();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = 'Вставити сюди'; }
    toast('Помилка: ' + e.message, true);
  });
}
function infoIcon(kind) {
  return kind === 'image' ? '🖼' : kind === 'pdf' ? '📕' : kind === 'video' ? '🎞'
       : kind === 'text' ? '📄' : kind === 'gdoc' ? '📘' : '📎';
}
function infoSize(n) {
  if (!n) return '';
  if (n < 1024) return n + ' Б';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' КБ';
  return (n / 1024 / 1024).toFixed(1) + ' МБ';
}

// Кеш вмісту тек. Повернення назад не має нічого чекати: тека, у якій
// уже були, показується миттєво, а свіжість перевіряється тихо у фоні.
var infoCache = {};

function infoOpenFolder(id) {
  infoState.folderId = id || '';
  infoState.err = '';
  var hit = infoCache[infoState.folderId];
  if (hit) {
    infoState.data = hit;
    renderView();
    infoLoad(true);          // тиха перевірка, без спінера
  } else {
    infoState.data = null;
    infoLoad();
  }
}

// Після власної зміни (створив, перейменував, видалив, завантажив)
// кеш цієї теки більше не дійсний
function infoReload() {
  delete infoCache[infoState.folderId];
  infoState.data = null;
  infoLoad();
}

function infoLoad(silent) {
  if (infoState.loading) return;
  if (!silent) { infoState.loading = true; infoState.err = ''; renderView(); }
  var want = infoState.folderId;          // користувач міг піти далі, поки чекали
  rpc('infoListFolder', [want], function(res){
    infoState.loading = false;
    if (infoState.folderId !== want) return;
    if (res) infoCache[want] = res;
    // Тихе оновлення не перемальовує список, якщо нічого не змінилось —
    // інакше воно смикало б сторінку просто так
    var same = silent && infoState.data && JSON.stringify(res) === JSON.stringify(infoState.data);
    infoState.data = res || null;
    if (!same) renderView();
  }, function(e){
    infoState.loading = false;
    if (infoState.folderId !== want) return;
    if (silent) return;                    // тиха перевірка не показує помилок
    infoState.err = e.message || 'Помилка';
    renderView();
  });
}

// Малює смужки прогресу в готовий контейнер. Ніякого renderView —
// саме тому список під час завантаження стоїть спокійно.
function infoProgRender() {
  var box = $('infoProg');
  if (!box) return;
  var h = '';
  if (infoDl.active) {
    h += '<div style="margin-bottom:10px">'+
      '<div class="hint" style="margin-bottom:4px">⬇ '+esc(infoDl.name)+' — '+infoDl.pct+'%</div>'+
      '<div style="height:6px;background:var(--panel-3);border:1px solid var(--line)">'+
        '<div style="height:100%;width:'+infoDl.pct+'%;background:var(--blue);transition:width .2s"></div>'+
      '</div></div>';
  }
  if (infoUp.active) {
    h += '<div style="margin-bottom:10px">'+
      '<div class="hint" style="margin-bottom:4px">'+esc(infoUp.name)+' — '+infoUp.pct+'%'+
        (infoUp.mode === 'slow' ? ' (запасний шлях)' : '')+'</div>'+
      '<div style="height:6px;background:var(--panel-3);border:1px solid var(--line)">'+
        '<div style="height:100%;width:'+infoUp.pct+'%;background:var(--accent);transition:width .2s"></div>'+
      '</div></div>';
  }
  box.innerHTML = h;
}

function renderInfo(c) {
  var head = '<div class="view-title">Інформація <span class="accent">підрозділу</span></div>'+
    '<div class="view-sub">Документи, інструкції, матеріали навчання</div>';

  if (!canViewInfo()) {
    c.innerHTML = head + '<div class="side-panel" style="margin-top:14px"><div class="side-panel-body">'+
      '<div class="empty">Немає доступу до цього розділу.</div>'+
      '<div class="hint" style="margin-top:8px">Право «Інформація» видає адміністратор у розділі «Екіпаж» → особовий склад.</div>'+
    '</div></div>';
    return;
  }

  if (!infoState.data && !infoState.loading && !infoState.err) { infoLoad(); }

  var body;
  if (infoState.loading) {
    body = '<div class="loading-view"><span class="pulse-dot"></span>Завантаження…</div>';
  } else if (infoState.err) {
    body = '<div class="empty">❌ '+esc(infoState.err)+'</div>';
  } else if (infoState.data && infoState.data.configured === false) {
    body = '<div class="empty">Сховище ще не під\'єднане.</div>'+
      '<div class="hint" style="margin-top:8px">Адміністратору: створи спільну теку на Google Drive і впиши її ID у INFO_ROOT_ID (файл Code.gs).</div>';
  } else if (infoState.data) {
    var d = infoState.data;
    var crumbs = (d.path || []).map(function(p, i, arr){
      var last = i === arr.length - 1;
      return last ? '<b>'+esc(p.name)+'</b>'
                  : '<a href="#" onclick="infoOpenFolder(\''+esc(p.id)+'\');return false;" style="color:var(--blue-soft)">'+esc(p.name)+'</a>';
    }).join(' <span class="hint">/</span> ');

    var edit = (infoMode === 'edit');

    var rows = '';
    (d.folders || []).forEach(function(f){
      // event.stopPropagation() обов'язковий: рядок клікабельний цілком —
      // інакше натиск на олівець чи смітник ще й провалювався б у теку.
      rows += '<div class="member-row" style="cursor:pointer" onclick="infoOpenFolder(\''+esc(f.id)+'\')">'+
        '<div style="flex:1"><div class="member-cs">📁 <b>'+esc(f.name)+'</b></div></div>'+
        (edit
          ? '<div class="inv-acts">'+
              '<button class="inv-act" title="Перемістити теку" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" '+
                'onclick="event.stopPropagation();infoCut(this.dataset.id, this.dataset.name, true)">⤴</button>'+
              '<button class="inv-act" title="Перейменувати теку" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" '+
                'onclick="event.stopPropagation();infoRenameModal(this.dataset.id, this.dataset.name)">'+svgIcon('edit')+'</button>'+
              '<button class="inv-act inv-act--del" title="Видалити теку" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" '+
                'onclick="event.stopPropagation();infoTrashModal(this.dataset.id, this.dataset.name)">'+svgIcon('trash')+'</button>'+
            '</div>'
          : '<div class="hint">тека</div>')+
      '</div>';
    });
    (d.files || []).forEach(function(f){
      // Симетрично до тек: у перегляді — робота з файлом (▶ ⬇),
      // у редагуванні — робота НАД файлом (✎ 🗑).
      // Завантажити можна й те, що завелике для перегляду: раніше такий
      // файл позначався «завеликий» і забрати його було неможливо взагалі.
      var acts = edit
        ? '<button class="inv-act" title="Перемістити файл" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" '+
            'onclick="infoCut(this.dataset.id, this.dataset.name, false)">⤴</button>'+
          '<button class="inv-act" title="Перейменувати файл" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" '+
            'onclick="infoRenameFileModal(this.dataset.id, this.dataset.name)">'+svgIcon('edit')+'</button>'+
          '<button class="inv-act inv-act--del" title="Видалити файл" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" '+
            'onclick="infoTrashFileModal(this.dataset.id, this.dataset.name)">'+svgIcon('trash')+'</button>'
        : '<button class="inv-act" title="Переглянути" data-id="'+esc(f.id)+'" data-size="'+(f.size||0)+'" '+
            'onclick="infoOpen(this.dataset.id, this, +this.dataset.size)">'+svgIcon('play')+'</button>'+
          '<button class="inv-act" title="Завантажити" data-id="'+esc(f.id)+'" data-name="'+esc(f.name)+'" data-size="'+(f.size||0)+'" '+
            'onclick="infoDownload(this.dataset.id, this.dataset.name, +this.dataset.size, this)">⬇</button>';

      rows += '<div class="member-row">'+
        '<div style="flex:1"><div class="member-cs">'+infoIcon(f.kind)+' '+esc(f.name)+'</div>'+
        '<div class="member-name">'+esc(f.date)+(f.size?' · '+infoSize(f.size):'')+
          (f.tooBig ? ' · <span class="hint">перегляд довантажує цілком</span>' : '')+'</div></div>'+
        '<div class="inv-acts">'+acts+'</div>'+
      '</div>';
    });
    if (!rows) rows = '<div class="empty">Тека порожня</div>';

    // Панель дій одним рядком: перемикач режимів ліворуч, дії праворуч —
    // як на сторінці екіпажів. Створення й завантаження діють у ПОТОЧНІЙ
    // теці, тій, що видно в крихтах.
    // Прихований input: свій вигляд кнопки замість системного «Огляд».
    var actions =
      '<div class="info-bar">'+
        '<div class="inv-mode" style="margin-left:0">'+
          '<button class="inv-mode-btn'+(!edit?' active':'')+'" onclick="infoSetMode(\'view\')">Перегляд</button>'+
          '<button class="inv-mode-btn'+(edit?' active':'')+'" onclick="infoSetMode(\'edit\')">Редагування</button>'+
        '</div>'+
        (edit
          ? '<div class="info-acts">'+
              '<button class="icon-btn" title="Нова тека" style="background:var(--accent);color:var(--on-accent)" onclick="infoNewFolderModal()">'+svgIcon('folderAdd')+'</button>'+
              '<button class="icon-btn" title="Завантажити файл" style="background:var(--accent);color:var(--on-accent)" onclick="infoPickFile()">'+svgIcon('upload')+'</button>'+
              '<input type="file" id="infoFileInput" style="display:none" onchange="infoDoUpload(this)">'+
            '</div>'
          : '')+
      '</div>';

    // Контейнер прогресу існує ЗАВЖДИ, навіть порожній: оновлення відсотків
    // тоді точково пише в нього і не перемальовує весь список під час
    // завантаження — раніше саме це й смикало сторінку.
    actions += '<div id="infoProg"></div>';

    // Смужка «переміщується». Видно на будь-якій теці, поки не вставиш
    // або не скасуєш — саме вона й тримає стан між переходами.
    if (infoClip) {
      var here = (d.folderId || '') === (infoState.folderId || '');
      var inside = (d.path || []).some(function(p){ return p.id === infoClip.id; });
      actions +=
        '<div class="warn" style="margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
          '<span style="flex:1">'+(infoClip.isFolder?'📁':'📄')+' Переміщується: <b>'+esc(infoClip.name)+'</b></span>'+
          (inside
            ? '<span class="hint">не можна вставити всередину себе</span>'
            : '<button class="btn btn-mini btn-green" id="infoPasteBtn" onclick="infoPasteHere()">Вставити сюди</button>')+
          '<button class="btn btn-mini btn-sec" onclick="infoCutCancel()">Скасувати</button>'+
        '</div>';
    }

    body = (crumbs ? '<div class="hint" style="margin-bottom:8px">'+crumbs+'</div>' : '') + actions + rows;
  } else {
    body = '<div class="empty">—</div>';
  }

  c.innerHTML = head + '<div class="side-panel" style="margin-top:14px"><div class="side-panel-body">'+body+'</div></div>';
  // Перемальовка створює контейнер прогресу порожнім. Без цього рядка
  // смужка зникала при перемиканні режиму, хоча завантаження тривало —
  // процес ішов, а показати його не було де.
  infoProgRender();
}

// Відкриття файлу: бекенд віддає вміст (base64) після перевірки прав,
// далі робимо blob і показуємо ПРЯМО в застосунку. Посилання на Drive
// в людини без Google-доступу не спрацювало б, а Apps Script не вміє
// віддавати бінарні дані — тому вміст і приходить у тілі відповіді.
var infoBlobUrl = '';   // активний blob поточного перегляду

function infoRevokeBlob() {
  if (infoBlobUrl) { try { URL.revokeObjectURL(infoBlobUrl); } catch(e) {} infoBlobUrl = ''; }
}

function infoDownloadCurrent(name) {
  if (!infoBlobUrl) return;
  var a = document.createElement('a');
  a.href = infoBlobUrl; a.download = name || 'file';
  document.body.appendChild(a); a.click(); a.remove();
}

// Перегляд. Стеля 25 МБ була не в перегляді як такому, а в тому, що файл
// їхав одним куском через памʼять Apps Script. Великий файл тепер
// довантажується частинами — тим самим шляхом, що й збереження, — тож
// показати можна будь-що, лише довше.
var INFO_ONESHOT_MB = 25;

// Прямий потік через Worker, якщо він налаштований. Тоді байти не йдуть
// через Apps Script узагалі: відео перемотується, файли кешуються
// браузером і завантажуються на повній швидкості. Не налаштований —
// усе працює як раніше, просто повільніше.
function infoTryStream(fileId, forDownload, ok, fail) {
  rpc('infoMediaTicket', [fileId, !!forDownload], function(t){
    if (t && t.available && t.url) ok(t); else fail();
  }, function(){ fail(); });
}

function infoOpen(fileId, btn, size) {
  size = Number(size) || 0;
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳'; }
  infoTryStream(fileId, false, function(t){
    if (btn) { btn.disabled = false; btn.innerHTML = svgIcon('play'); }
    infoShowViewerUrl(t.name, t.mime, t.url);
  }, function(){
    if (btn) { btn.disabled = false; btn.innerHTML = svgIcon('play'); }
    infoOpenSlow(fileId, null, size);
  });
}

function infoOpenSlow(fileId, btn, size) {
  size = Number(size) || 0;
  if (size > INFO_ONESHOT_MB * 1024 * 1024) {
    if (infoDl.active) { toast('⚠ Зачекай — інше завантаження ще йде', true); return; }
    if (!confirm('Файл '+(size/1024/1024).toFixed(1)+' МБ. Щоб показати, його треба завантажити цілком — це займе час. Продовжити?')) return;
    infoDl.name = 'перегляд';
    infoOpenChunked(fileId);
    return;
  }
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳'; }
  rpc('infoGetFile', [fileId], function(res){
    if (btn) { btn.disabled = false; btn.innerHTML = svgIcon('play'); }
    if (!res || !res.data) { toast('❌ Порожня відповідь', true); return; }
    var bin = atob(res.data), len = bin.length, bytes = new Uint8Array(len);
    for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    infoShowViewer(res.name || 'файл', res.mime || 'application/octet-stream', [bytes], res.exported);
  }, function(e){
    if (btn) { btn.disabled = false; btn.innerHTML = svgIcon('play'); }
    toast('❌ '+e.message, true);
  });
}

// Довантаження частинами саме для перегляду
function infoOpenChunked(fileId) {
  infoDlSet(0);
  rpc('infoFileInfo', [fileId], function(info){
    if (!info || !info.size) { infoDl.active = false; infoProgRender(); toast('❌ Не вдалося дізнатися розмір', true); return; }
    infoDl.name = info.name || 'перегляд';
    var parts = [], pos = 0;
    function step() {
      if (pos >= info.size) {
        infoDl.active = false; infoProgRender();
        infoShowViewer(info.name, info.mime || 'application/octet-stream', parts, false);
        return;
      }
      rpc('infoGetFileChunk', [fileId, pos, Math.min(info.chunk, info.size - pos)], function(res){
        var bin = atob(res.data || ''), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        if (!arr.length) { infoDl.active = false; infoProgRender(); toast('❌ Drive повернув порожній шматок', true); return; }
        parts.push(arr); pos += arr.length;
        infoDlSet(Math.min(100, Math.round(pos / info.size * 100)));
        step();
      }, function(e){ infoDl.active = false; infoProgRender(); toast('❌ '+e.message, true); });
    }
    step();
  }, function(e){ infoDl.active = false; infoProgRender(); toast('❌ '+e.message, true); });
}

// Перегляд напряму за адресою (Worker). Головна відмінність від blob:
// відео тягне лише потрібні шматки й перемотується, бо Worker підтримує
// Range. Нічого попередньо завантажувати не треба.
function infoShowViewerUrl(name, mime, url) {
  var nameEsc = esc(name || 'файл');
  mime = mime || 'application/octet-stream';
  var view;
  if (mime.indexOf('image/') === 0) {
    view = '<img src="'+esc(url)+'" alt="'+nameEsc+'" style="max-width:100%;max-height:70vh;display:block;margin:0 auto">';
  } else if (mime === 'application/pdf') {
    view = '<iframe src="'+esc(url)+'" class="viewer-frame"></iframe>';
  } else if (mime.indexOf('video/') === 0) {
    view = '<video src="'+esc(url)+'" controls preload="metadata" style="max-width:100%;max-height:70vh;display:block;margin:0 auto"></video>';
  } else if (mime.indexOf('audio/') === 0) {
    view = '<audio src="'+esc(url)+'" controls preload="metadata" style="width:100%"></audio>';
  } else if (mime.indexOf('text/') === 0 || mime.indexOf('json') !== -1) {
    view = '<pre id="infoTextView" style="max-height:70vh;overflow:auto;white-space:pre-wrap;word-break:break-word;'+
           'background:var(--bg-low);border:1px solid var(--line);padding:10px;font-size:12px">завантаження…</pre>';
  } else {
    view = '<div class="empty">Цей тип не показується в застосунку — збережи файл, щоб відкрити.</div>';
  }

  openModal('📄 '+nameEsc,
    view+
    '<div class="btn-row" style="margin-top:10px">'+
      (mime === 'application/pdf'
        ? '<button class="btn btn-sec" onclick="viewerToggleFull(this)">⛶ На весь екран</button>' : '')+
      '<a class="btn btn-sec" href="'+esc(url)+(url.indexOf('dl=1')===-1?'&dl=1':'')+'" '+
        'download="'+nameEsc+'" style="text-align:center;text-decoration:none">⬇ Зберегти</a>'+
    '</div>', true);

  // Текст читаємо окремо — його треба показати як текст, а не як файл
  if ($('infoTextView')) {
    fetch(url).then(function(r){ return r.text(); }).then(function(t){
      var el = $('infoTextView'); if (el) el.textContent = t;
    }).catch(function(e){
      var el = $('infoTextView'); if (el) el.textContent = 'Не вдалося прочитати: ' + e.message;
    });
  }
}

// Саме вікно перегляду. parts — масив Uint8Array (один або багато шматків).
function infoShowViewer(name, mime, parts, exported) {
  try {
    infoRevokeBlob();
    infoBlobUrl = URL.createObjectURL(new Blob(parts, { type: mime }));

    var nameEsc = esc(name || 'файл');
    var view;
      if (mime.indexOf('image/') === 0) {
        view = '<img src="'+infoBlobUrl+'" alt="'+nameEsc+'" style="max-width:100%;max-height:70vh;display:block;margin:0 auto">';
      } else if (mime === 'application/pdf') {
        // Вбудований переглядач браузера. На iOS Safari iframe із PDF
        // буває примхливим — тому поруч завжди лишається «Зберегти».
        view = '<iframe src="'+infoBlobUrl+'" class="viewer-frame"></iframe>';
      } else if (mime.indexOf('video/') === 0) {
        // Без перемотки наперед: файл приходить цілком, стрімінгу тут немає.
        view = '<video src="'+infoBlobUrl+'" controls style="max-width:100%;max-height:70vh;display:block;margin:0 auto"></video>';
      } else if (mime.indexOf('audio/') === 0) {
        view = '<audio src="'+infoBlobUrl+'" controls style="width:100%"></audio>';
      } else if (mime.indexOf('text/') === 0 || mime.indexOf('json') !== -1) {
        var txt = '';
        try {
          var total = 0, k;
          for (k = 0; k < parts.length; k++) total += parts[k].length;
          var all = new Uint8Array(total), off = 0;
          for (k = 0; k < parts.length; k++) { all.set(parts[k], off); off += parts[k].length; }
          txt = new TextDecoder('utf-8').decode(all);
        } catch(e) { txt = '(не вдалося прочитати як текст)'; }
        view = '<pre style="max-height:70vh;overflow:auto;white-space:pre-wrap;word-break:break-word;'+
               'background:var(--bg-low);border:1px solid var(--line);padding:10px;font-size:12px">'+esc(txt)+'</pre>';
      } else {
        view = '<div class="empty">Цей тип не показується в застосунку — збережи файл, щоб відкрити.</div>';
      }

    openModal('📄 '+nameEsc,
      (exported ? '<div class="hint" style="margin-bottom:8px">Google-документ показано як PDF</div>' : '')+
      view+
      '<div class="btn-row" style="margin-top:10px">'+
        (mime === 'application/pdf'
          ? '<button class="btn btn-sec" onclick="viewerToggleFull(this)">⛶ На весь екран</button>' : '')+
        '<button class="btn btn-sec" onclick="infoDownloadCurrent(\''+esc(name||'file').replace(/'/g,"\\'")+'\')">⬇ Зберегти</button>'+
      '</div>', true);
  } catch(e) { toast('❌ '+e.message, true); }
}

// Перемикач повного екрана для переглядача. openModal ставить className
// заново, тож наступна модалка завжди відкривається звичайним вікном.
function viewerToggleFull(btn) {
  var on = $('modalBox').classList.toggle('modal-full');
  if (btn) btn.textContent = on ? '🗗 Вікном' : '⛶ На весь екран';
}

/* ── Завантаження файлу на пристрій ──────────────────────────
   Маленький файл беремо одним запитом. Великий — частинами: стеля
   infoGetFile упирається в те, що Apps Script тримає всю відповідь у
   пам'яті, і без цього завеликий архів забрати із застосунку було
   неможливо взагалі. */
var infoDl = { active: false, name: '', pct: 0 };

function infoDlSet(pct) {
  infoDl.active = true; infoDl.pct = pct;
  infoProgRender();          // точково, без перемальовки списку
}
function infoSaveBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name || 'file';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}

function infoDownload(fileId, name, size, btn) {
  if (infoDl.active) { toast('⚠ Зачекай — інше завантаження ще йде', true); return; }
  infoDl.name = name || 'файл';
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳'; }

  // Спершу прямий потік: браузер качає сам, на повній швидкості,
  // з власним індикатором і без обмежень на розмір
  infoTryStream(fileId, true, function(t){
    if (btn) { btn.disabled = false; btn.textContent = '⬇'; }
    var a = document.createElement('a');
    a.href = t.url; a.download = t.name || name || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    toast('⬇ Завантаження почалося: '+(t.name || name));
  }, function(){
    if (btn) { btn.disabled = false; btn.textContent = '⬇'; }
    infoDownloadSlow(fileId, name, size, btn);
  });
}

// Запасний шлях — через Apps Script (base64), зі стелею й частинами
function infoDownloadSlow(fileId, name, size, btn) {
  infoDl.name = name || 'файл';
  // 25 МБ — та сама стеля, що й у infoGetFile
  if (size && size > 25 * 1024 * 1024) { infoDownloadChunked(fileId, name); return; }

  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  rpc('infoGetFile', [fileId], function(res){
    if (btn) { btn.disabled = false; btn.textContent = '⬇'; }
    if (!res || !res.data) { toast('❌ Порожня відповідь', true); return; }
    var bin = atob(res.data), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    infoSaveBlob(new Blob([arr], { type: res.mime || 'application/octet-stream' }), res.name || name);
    toast('⬇ Збережено: '+(res.name || name));
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '⬇'; }
    toast('❌ '+e.message, true);
  });
}

function infoDownloadChunked(fileId, name) {
  infoDlSet(0);
  rpc('infoFileInfo', [fileId], function(info){
    if (!info || !info.size) { infoDl.active = false; toast('❌ Не вдалося дізнатися розмір', true); renderView(); return; }
    var parts = [], pos = 0;
    function step() {
      if (pos >= info.size) {
        infoDl.active = false;
        infoSaveBlob(new Blob(parts, { type: info.mime || 'application/octet-stream' }), info.name || name);
        toast('⬇ Збережено: '+(info.name || name));
        renderView();
        return;
      }
      var len = Math.min(info.chunk, info.size - pos);
      rpc('infoGetFileChunk', [fileId, pos, len], function(res){
        var bin = atob(res.data || ''), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        if (!arr.length) {  // захист від безкінечного циклу
          infoDl.active = false; toast('❌ Drive повернув порожній шматок', true); renderView(); return;
        }
        parts.push(arr);
        pos += arr.length;                 // саме довжина отриманого, а не запитаного
        infoDlSet(Math.min(100, Math.round(pos / info.size * 100)));
        step();
      }, function(e){
        infoDl.active = false; toast('❌ '+e.message, true); renderView();
      });
    }
    step();
  }, function(e){
    infoDl.active = false; toast('❌ '+e.message, true); renderView();
  });
}

function infoPickFile() { var i = $('infoFileInput'); if (i) i.click(); }

// Стеля для повільного (запасного) шляху: там файл їде через Apps Script
// у base64 і цілком лежить у його пам'яті.
var INFO_SLOW_MAX_MB = 25;
// Прямий шлях стелі не має: Drive приймає до 5 ТБ, а байти йдуть повз
// Apps Script. Лишається запобіжник від явно випадкового вибору файлу.
var INFO_FAST_MAX_MB = 5120;
// З якого розміру перепитувати. Не заборона — просто щоб великий файл
// не поїхав по мобільному інтернету непомітно для людини.
var INFO_BIG_WARN_MB = 100;
// Шматок вивантаження. Google вимагає кратність 256 КБ для проміжних
// шматків — 8 МБ підходить і дає притомну зернистість прогресу.
var INFO_UPLOAD_CHUNK = 8 * 1024 * 1024;

var infoUp = { active: false, name: '', pct: 0, mode: '' };

function infoUpSet(pct, mode) {
  infoUp.active = true; infoUp.pct = pct; infoUp.mode = mode || infoUp.mode;
  infoProgRender();          // точково, без перемальовки списку
}
function infoUpDone(msg, isErr) {
  infoUp.active = false; infoUp.pct = 0;
  toast(msg, isErr);
  infoReload();
}

function infoDoUpload(input) {
  var file = input && input.files && input.files[0];
  input.value = '';           // щоб той самий файл можна було обрати ще раз
  if (!file) return;
  if (infoUp.active) { toast('⚠ Зачекай — попереднє завантаження ще йде', true); return; }
  if (file.size > INFO_FAST_MAX_MB * 1024 * 1024) {
    toast('❌ Файл завеликий ('+(file.size/1024/1024).toFixed(0)+' МБ, стеля '+INFO_FAST_MAX_MB+' МБ)', true);
    return;
  }

  if (file.size > INFO_BIG_WARN_MB * 1024 * 1024) {
    if (!confirm('Файл ' + (file.size/1024/1024).toFixed(0) + ' МБ.\n\n' +
        'Він піде шматками по 8 МБ — прогрес буде видно, а якщо звʼязок обірветься, ' +
        'завантаження продовжиться з того самого місця, а не з нуля.\n\n' +
        'Але на мобільному інтернеті це надовго. Завантажувати?')) return;
  }

  infoUp.name = file.name;
  infoUpSet(0, 'fast');

  // Швидкий шлях: бекенд відкриває resumable-сесію, байти летять у Drive
  // напряму — без base64 (+33%) і без Apps Script у шляху даних.
  rpc('infoUploadSession', [infoState.folderId, file.name, file.type || 'application/octet-stream'],
    function(s){
      if (!s || !s.uploadUrl) { infoUploadSlow(file); return; }
      infoPutChunk(file, s, 0, 0);
    },
    function(){ infoUploadSlow(file); }   // сесію взагалі не відкрили
  );
}

/* ── Вивантаження шматками з продовженням ─────────────────────
   Раніше файл ішов одним суцільним PUT: обрив на 400-му мегабайті
   означав почати спочатку, а «100% і провал» неможливо було відрізнити
   від справжньої невдачі. Resumable-сесія Google саме для цього й
   існує — шлемо шматками з Content-Range, а після збою питаємо, скільки
   вже дійшло, і продовжуємо з того місця. */

// Скільки байтів Google підтвердив: заголовок Range виду "bytes=0-8388607".
// Якщо CORS не дає його прочитати — повертаємо null, і тоді довіряємо
// власному лічильнику: наступний шматок Google або прийме, або поправить.
function infoAckedEnd(xhr) {
  var r = '';
  try { r = xhr.getResponseHeader('Range') || ''; } catch (e) { r = ''; }
  var m = /bytes=\d+-(\d+)/.exec(r);
  return m ? Number(m[1]) + 1 : null;
}

function infoPutChunk(file, session, offset, retries) {
  if (offset >= file.size) { infoAfterPut(file, session, 'кінець без підтвердження'); return; }

  var end = Math.min(offset + INFO_UPLOAD_CHUNK, file.size);
  var xhr = new XMLHttpRequest();
  xhr.open('PUT', session.uploadUrl, true);
  xhr.setRequestHeader('Content-Range', 'bytes ' + offset + '-' + (end - 1) + '/' + file.size);

  xhr.upload.onprogress = function(ev){
    if (ev.lengthComputable) {
      infoUpSet(Math.min(99, Math.round((offset + ev.loaded) / file.size * 100)), 'fast');
    }
  };
  xhr.onload = function(){
    if (xhr.status === 200 || xhr.status === 201) {
      infoUpDone('⬆ Завантажено: '+(session.name || file.name)+
        (session.renamed ? ' (перейменовано — таке ім\'я вже було)' : ''));
      return;
    }
    if (xhr.status === 308) {              // «шматок прийняв, давай далі»
      var next = infoAckedEnd(xhr);
      infoPutChunk(file, session, next === null ? end : next, 0);
      return;
    }
    infoResumeQuery(file, session, retries);
  };
  xhr.onerror = function(){ infoResumeQuery(file, session, retries); };
  xhr.send(file.slice(offset, end));
}

// Збій. Питаємо Google, скільки байтів у нього вже є, і продовжуємо.
function infoResumeQuery(file, session, retries) {
  if (retries >= 4) { infoAfterPut(file, session, 'звʼязок не відновився'); return; }
  infoUpSet(infoUp.pct, 'fast');

  var xhr = new XMLHttpRequest();
  xhr.open('PUT', session.uploadUrl, true);
  xhr.setRequestHeader('Content-Range', 'bytes */' + file.size);
  xhr.onload = function(){
    if (xhr.status === 200 || xhr.status === 201) {
      infoUpDone('⬆ Завантажено: '+(session.name || file.name));
      return;
    }
    if (xhr.status === 308) {
      var next = infoAckedEnd(xhr);
      infoPutChunk(file, session, next === null ? 0 : next, retries + 1);
      return;
    }
    infoAfterPut(file, session, 'HTTP '+xhr.status);
  };
  // Пауза перед повтором росте — щоб не добивати вже впалий звʼязок
  xhr.onerror = function(){
    setTimeout(function(){ infoResumeQuery(file, session, retries + 1); }, 1500 * (retries + 1));
  };
  xhr.send();
}

// PUT завершився не так, як хотілося. Перш ніж вантажити повторно —
// питаємо, чи файл усе-таки зʼявився в теці. Без цього великий файл
// їхав удруге запасним шляхом і впирався в стелю 25 МБ, а малий
// створювався дублікатом.
function infoAfterPut(file, session, why) {
  infoUpSet(100, 'fast');
  rpc('infoUploadCheck', [infoState.folderId, session.name || file.name], function(res){
    if (res && res.found) {
      infoUpDone('⬆ Завантажено: '+(res.name || file.name)+
        (session.renamed ? ' (перейменовано — таке ім\'я вже було)' : ''));
      return;
    }
    toast('⚠ Пряме завантаження не дійшло ('+why+') — пробую запасним шляхом', true);
    infoUploadSlow(file);
  }, function(){
    // Навіть перевірку не змогли зробити — лишається запасний шлях
    infoUploadSlow(file);
  });
}

// Запасний шлях — той самий, що був: base64 через Apps Script.
function infoUploadSlow(file) {
  if (file.size > INFO_SLOW_MAX_MB * 1024 * 1024) {
    infoUp.active = false;
    toast('❌ Пряме завантаження не вдалося, а для запасного шляху файл завеликий ('+
          (file.size/1024/1024).toFixed(1)+' МБ, стеля '+INFO_SLOW_MAX_MB+' МБ)', true);
    renderView();
    return;
  }
  infoUpSet(0, 'slow');
  var reader = new FileReader();
  reader.onerror = function(){ infoUp.active = false; toast('❌ Не вдалося прочитати файл', true); renderView(); };
  reader.onprogress = function(ev){
    if (ev.lengthComputable) infoUpSet(Math.round(ev.loaded / ev.total * 50), 'slow'); // читання — перша половина
  };
  reader.onload = function(){
    infoUpSet(50, 'slow');
    // readAsDataURL дає "data:<mime>;base64,<дані>" — беремо частину після коми
    var s = String(reader.result), comma = s.indexOf(',');
    var b64 = comma >= 0 ? s.slice(comma + 1) : '';
    if (!b64) { infoUp.active = false; toast('❌ Порожній файл', true); renderView(); return; }
    rpc('infoUploadFile', [infoState.folderId, file.name, file.type || 'application/octet-stream', b64], function(res){
      infoUpDone('⬆ Завантажено: '+((res && res.name) || file.name)+((res && res.renamed) ? ' (перейменовано — таке ім\'я вже було)' : ''));
    }, function(e){ infoUp.active = false; toast('❌ '+e.message, true); renderView(); });
  };
  reader.readAsDataURL(file);
}

function admSavePerson(id) {
  var d = {
    callsign: $('apCallsign').value.trim(),
    name: $('apName').value.trim(),
    role: $('apRole').value,
    status: $('apStatus').value
  };
  // Права шле тільки адмін (у решти чекбоксів немає; бекенд теж їх відкине)
  if (isAdminUser()) {
    d.admin = !!($('apAdmin') && $('apAdmin').checked);
    d.rightInv = !!($('apRightInv') && $('apRightInv').checked);
    d.rightCrew = !!($('apRightCrew') && $('apRightCrew').checked);
    d.rightInfo = !!($('apRightInfo') && $('apRightInfo').checked);
  }
  if (id) d.id = id;
  var pw = $('apPassword').value;
  if (pw) d.newPassword = pw;
  if (!d.callsign) { toast('⚠ Вкажи позивний', true); return; }
  if (!id && !pw) { toast('⚠ Вкажи початковий пароль', true); return; }
  var btn = $('apBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('adminSavePerson', [d], function(res){
    toast('💾 '+d.callsign+' збережено');
    closeModal();
    admLoadPersonnel();
    loadAll();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; }
    toast('❌ '+e.message, true);
  });
}

function admDeletePerson(id) {
  var p = S.personnel.find(function(x){ return x.id === id; });
  if (!p) return;
  if (p.crewId) { toast('⚠ '+p.callsign+' в екіпажі '+(p.crewName||p.crewId)+' — спочатку прибери з екіпажу', true); return; }
  if (!confirm('🗑 Видалити '+p.callsign+' ('+id+')?')) return;
  rpc('adminDeletePerson', [id], function(){
    S.personnel = S.personnel.filter(function(x){ return x.id !== id; });
    toast('🗑 '+p.callsign+' видалено');
    admRenderPersonnel();
  }, function(e){ toast('❌ '+e.message, true); });
}

var bandGroup = 'all';
function bandOf(band) {
  // Перший НЕпорожній канал: у «B Sting» єдина частота стоїть п'ятою,
  // і [0] = null відправляв бенд у групу 3.3
  var f = (BANDS[band] || []).find(function(x){ return x; }) || 0;
  // Нижні бенди (HV-L, L, L Foxeer, U, O) — це канали 5.8-відеосистем,
  // тож живуть у групі 5.8. У «5.0» лишається тільки X (4990–5200)
  if (f >= 5240) return '5.8';
  if (f >= 4900) return '5.0';
  return '3.3';
}
function cleanCode(fc) { return String(fc||'').replace(/\s*\(\d+\)/, '').trim(); }
// Читабельна назва екіпажу: «Alfa» (за CRW-ID) або сам рядок, якщо це не наш екіпаж

function freqToCodeLocal(freq) {
  for (var b in BANDS) { var i = BANDS[b].indexOf(Number(freq)); if (i !== -1) return b + (i+1); }
  return '?';
}
function countConflicts() {
  if (!S.freq) return 0;
  var occupied = (S.freq.active||[]).filter(function(a){ return a.freq; });
  var n = 0;
  for (var i = 0; i < occupied.length; i++)
    for (var j = i+1; j < occupied.length; j++) {
      if (occupied[i].crew === occupied[j].crew) continue;
      if (Math.abs(occupied[i].freq - occupied[j].freq) < 40) n++;
    }
  return n;
}
var specOpen = true;
var sidePanels = { af: true, crews: true, conf: true };
// Мітки спектра: піднімаємо на поверх вище, якщо перекривається з попередньою
// на тому ж поверсі (за реальними пікселями після рендеру). Шкала отримує
// верхній відступ під найвищий поверх.
function layoutSpecLabels() {
  var area = $('specArea');
  if (!area) return;
  var LVL_H = 16, LEVELS = 6, BASE_TOP = 14; // BASE_TOP = верх лінії поверху 0
  var marks = Array.from(area.querySelectorAll('.spec-mark')).sort(function(a, b){ return parseFloat(a.style.left) - parseFloat(b.style.left); });
  // 1) Скидаємо в базовий стан і міряємо ширини
  marks.forEach(function(m){ m.style.top = BASE_TOP + 'px'; m.querySelector('.spec-lbl').style.top = '-13px'; });
  var rects = marks.map(function(m){ return m.querySelector('.spec-lbl').getBoundingClientRect(); });
  // 2) Поверх для кожної мітки: найнижчий, де вона не наїжджає на попередні
  var lastRight = [], lvls = [];
  rects.forEach(function(r, i){
    var lvl = 0;
    while (lvl < LEVELS - 1 && lastRight[lvl] !== undefined && r.left < lastRight[lvl] + 4) lvl++;
    lastRight[lvl] = r.right; lvls[i] = lvl;
  });
  var maxLvl = Math.max.apply(null, [0].concat(lvls));
  // 3) Застосовуємо: ЛІНІЯ маркера піднімається до свого поверху (top менший),
  //    мітка сидить на вершині лінії — жодних «підвішених» підписів.
  //    Верхній відступ шкали — під найвищий поверх.
  area.style.marginTop = (8 + maxLvl * LVL_H) + 'px';
  marks.forEach(function(m, i){
    m.style.top = (BASE_TOP - lvls[i] * LVL_H) + 'px';
    m.querySelector('.spec-lbl').style.top = '-13px';
    m.style.zIndex = String(10 + lvls[i]); // вищі поверхи — зверху над нижчими лініями
  });
}

function togglePanel(key) { sidePanels[key] = !sidePanels[key]; renderView(); }

// Розкриті резервні частоти в таблиці «Наші екіпажі» (без обмеження кількості)
var freqResOpen = {};
function toggleCrewRes(id) { freqResOpen[id] = !freqResOpen[id]; renderView(); }

// Зріз карти частот за сектором ('all' — увесь ефір)
var freqSectorSel = 'all';
function renderFreq(c) {
  var d = S.freq;
  if (!d) { c.innerHTML = '<div class="empty">Дані частот недоступні</div>'; return; }
  var active = d.active || [];
  var bands = allBands(d);
  var bandOrder = allBandOrder(d).filter(function(b){ return bands[b]; });
  var warningFreqs = d.warningFreqs || {};
  var reserves = d.reserves || [];

  // «Різна таблиця частот» для секторів: фільтр за сектором екіпажу.
  // Зовнішні джерела й екіпажі без сектора видно в будь-якому зрізі —
  // ефір спільний, а старі екіпажі ще не розподілені.
  if (freqSectorSel !== 'all' && SECTORS.length > 1) {
    var inSec = function(a){
      if (!a.crew) return true;
      var cr = crewById(a.crew);
      return !cr || !cr.sector || cr.sector === freqSectorSel;
    };
    active = active.filter(inSec);
    reserves = reserves.filter(inSec);
  }

  var codeSource = {};
  active.forEach(function(a){
    var code = cleanCode(a.freqCode);
    if (code && code !== '?') codeSource[code] = a;
    else if (a.freq) codeSource['_mhz_'+a.freq] = a;
  });
  var occupied = active.filter(function(a){ return a.freq; });
  var reserveMap = {};
  reserves.forEach(function(r){ var code = cleanCode(r.freqCode); if (code) reserveMap[code] = r; });
  var crewInfoMap = {};
  (d.crewFreqInfo||[]).forEach(function(ci){ crewInfoMap[ci.crew] = ci; });

  // «Своє» — не лише власний виліт (creatorEmail), а й частоти свого екіпажу:
  // адмін теж буває в екіпажі, і його екіпаж має світитися зеленим
  var myCrewId = (S.auth && S.auth.crewId) || '';
  function isOwn(a) {
    if (a.source === 'external') return false;
    return a.source === 'mine' || (!!myCrewId && a.crew === myCrewId);
  }

  function freqLevel(f, code) {
    var level = 'free';
    var selfSrc = code ? (codeSource[code] || codeSource['_mhz_'+f] || null) : null;
    occupied.forEach(function(o){
      if (selfSrc && o.crew === selfSrc.crew && o.freq === f) return;
      var dd = Math.abs(f - o.freq);
      if (dd < 20) level = 'critical';
      else if (dd < 40 && level !== 'critical') level = 'serious';
    });
    if (level !== 'critical' && level !== 'serious') {
      for (var i = 0; i < occupied.length; i++)
        for (var j = 0; j < occupied.length; j++) {
          if (i === j) continue;
          if (Math.abs(f - (2*occupied[i].freq - occupied[j].freq)) < 10) level = 'moderate';
        }
    }
    return level;
  }
  // Конфлікти конкретного екіпажу (для бейджів на картках)
  function conflictOf(a) {
    if (!a.freq) return null;
    for (var i = 0; i < occupied.length; i++) {
      var o = occupied[i];
      if (o.crew === a.crew) continue;
      var gap = Math.abs(a.freq - o.freq);
      if (gap < 20) return { with: o, gap: gap, level: 'critical' };
    }
    for (var k = 0; k < occupied.length; k++) {
      var o2 = occupied[k];
      if (o2.crew === a.crew) continue;
      var g2 = Math.abs(a.freq - o2.freq);
      if (g2 < 40) return { with: o2, gap: g2, level: 'serious' };
    }
    return null;
  }

  // ── Верхня панель: легенда як у макеті ──
  var legend = '<div class="freq-topbar"><div class="freq-legend">'+
    '<div class="li"><span class="lg-sq" style="background:#2ecc71"></span>Своя частота</div>'+
    '<div class="li"><span class="lg-sq" style="border:1px solid #3498db;background:rgba(52,152,219,.2)"></span>Екіпаж підрозділу</div>'+
    '<div class="li"><span class="lg-sq" style="background:#7f8c8d"></span>Зовнішні (інші)</div>'+
    '<div class="li"><span class="lg-sq" style="background:#e74c3c"></span>Конфлікт</div>'+
    '<div class="li"><span class="lg-sq" style="background:#f39c12"></span>Близько до конфлікту</div>'+
    '<div class="li"><span class="lg-sq" style="background:#f1c40f"></span>Інтермодуляція</div>'+
    '<div class="li"><span class="lg-sq" style="border:1px dashed #9b59b6"></span>Резерв</div>'+
    '<div class="li"><span class="lg-sq" style="background:#33270e;border:1px solid #f39c12"></span>⚠ Нерекомендована</div>'+
  '</div></div>';

  // ── Матриця (на всю ширину, table-layout: fixed) ──
  var visibleBands = bandOrder.filter(function(b){ return bandGroup==='all' || bandOf(b)===bandGroup; });
  var maxCh = 0;
  visibleBands.forEach(function(b){ if (bands[b].length > maxCh) maxCh = bands[b].length; });
  var groupLbl = bandGroup==='all' ? 'ВСІ БЕНДИ' : bandGroup + ' GHz';
  var filters = ['all','5.8','5.0','3.3'].map(function(g){
    var lbl = g==='all' ? 'ВСІ' : g + ' GHz';
    return '<button class="filter-chip'+(bandGroup===g?' active':'')+'" onclick="bandGroup=\''+g+'\';renderView()">'+lbl+'</button>';
  }).join('');
  // Зріз за сектором — з'являється, коли секторів більше одного
  var secFilters = SECTORS.length > 1
    ? '<button class="filter-chip'+(freqSectorSel==='all'?' active':'')+'" onclick="freqSectorSel=\'all\';renderView()">⬡ ВСІ</button>'+
      SECTORS.map(function(s){
        return '<button class="filter-chip'+(freqSectorSel===s.id?' active':'')+'" onclick="freqSectorSel=\''+esc(s.id)+'\';renderView()">'+esc(s.name)+'</button>';
      }).join('')
    : '';

  var m = '<div class="matrix-panel">'+
    '<div class="matrix-panel-head" style="flex-wrap:wrap;gap:6px"><span class="cap">Сітка каналів · '+groupLbl+'</span><div style="display:flex;gap:6px;flex-wrap:wrap">'+secFilters+filters+'</div></div>'+
    '<div class="matrix-wrap"><table class="matrix"><tr><th class="band-col">Band / CH</th>';
  for (var ch = 1; ch <= maxCh; ch++) m += '<th>'+ch+'</th>';
  m += '</tr>';
  visibleBands.forEach(function(band){
    m += '<tr><td class="band">'+esc(band)+'</td>';
    bands[band].forEach(function(freq, idx){
      // Порожня позиція: бенд може мати канал не з першої колонки
      // (у «B Sting» єдиний канал стоїть п'ятим, під тим самим номером,
      // що й B5, — щоб на карті вони були один під одним)
      if (!freq) { m += '<td></td>'; return; }
      var code = band + (idx + 1);
      var lvl = freqLevel(freq, code);
      var src = codeSource[code] || codeSource['_mhz_'+freq];
      var resv = reserveMap[code];
      var cls, tag = '';
      if (src) {
        // Зайнята клітинка: конфлікт перекриває колір власника
        if (lvl === 'critical') cls = 'cell-critical';
        else if (lvl === 'serious') cls = 'cell-serious';
        else if (isOwn(src)) cls = 'cell-mine';
        else if (src.source === 'external') cls = 'cell-ext';
        else cls = 'cell-unit';
        tag = '<span class="ctag">('+esc(src.source==='mine' ? 'ВИ' : (src.crew||'чужий'))+')</span>';
      } else if (resv) {
        cls = 'cell-reserve';
        tag = '<span class="ctag">('+esc(resv.crew)+')</span>';
      } else if (lvl !== 'free') {
        cls = lvl==='critical' ? 'cell-critF' : (lvl==='serious' ? 'cell-serF' : 'cell-modF');
      } else if (warningFreqs[freq]) {
        cls = 'cell-warning';
      } else {
        cls = '';
      }
      m += '<td><div class="cell '+cls+'" onclick="cellClick('+freq+')" title="'+code+' — '+freq+' МГц'+(warningFreqs[freq]?' ⚠':'')+'">'+
        freq + tag + '</div></td>';
    });
    for (var pad = bands[band].length; pad < maxCh; pad++) m += '<td></td>';
    m += '</tr>';
  });
  m += '</table></div></div>';

  // ── Права панель ──
  var flightsList = active.filter(function(a){ return a.source==='mine' || a.source==='unit'; });
  var crewsList = active.filter(function(a){ return a.source==='crew'; });
  var extList = active.filter(function(a){ return a.source==='external'; });

  function afCard(a) {
    var cc = cleanCode(a.freqCode) || freqToCodeLocal(a.freq);
    var conf = conflictOf(a);
    var isExt = a.source === 'external';
    var isMineA = a.source === 'mine';
    var own = isOwn(a);
    var info = crewInfoMap[a.crew];
    var canSwitch = !isExt && info && info.reserves && info.reserves.length &&
      (info.author === S.me || S.me === d.adminEmail);
    var swId = 'sw-' + String(a.crew).replace(/[^\w-]/g, '_');
    var freqCls = conf && conf.level==='critical' ? 'red' : (own ? '' : (isExt ? 'grey' : 'blue'));

    var h = '<div class="af-card'+(own?' mine':'')+(isExt?' ext':'')+(conf&&conf.level==='critical'?' conflict':'')+'">'+
      '<div class="af-bar"></div>'+
      (conf&&conf.level==='critical'?'<div class="af-badge">КОНФЛІКТ!</div>':'')+
      '<div class="af-head">'+
        '<div class="af-title">'+crewDisplayHtml(a.crew)+(isMineA?' (ВИ)':'')+(isExt?' (ЗОВН)':'')+'</div>'+
        '<div class="af-freq '+freqCls+'">📶 '+(a.freq?esc(cc)+' ('+esc(a.freq)+')':'—')+'</div>'+
      '</div>'+
      ((a.pilot||a.system)?'<div class="af-meta">'+(a.pilot?'👤 '+esc(a.pilot):'')+(a.pilot&&a.system?' · ':'')+(a.system&&a.system!=='Зовнішній'?esc(a.system):'')+'</div>':'');
    if (conf) h += '<div class="af-note">&gt; Δ'+conf.gap+' МГц з '+esc(conf.with.crew)+'</div>';
    if (freqSwapBusy[a.crew]) {
      h += '<div class="af-meta">⏳ Зміна частоти…</div>';
    } else if (canSwitch) {
      h += '<button class="af-btn" onclick="document.getElementById(\''+swId+'\').classList.toggle(\'open\')">Змінити частоту</button>'+
        '<div class="swap-menu" id="'+swId+'">';
      info.reserves.forEach(function(r){
        h += '<button class="vtx-btn" onclick="doSwapFreq(\''+esc(a.crew)+'\',\''+esc(r)+'\')">→ '+esc(cleanCode(r))+'</button>';
      });
      h += '</div>';
    }
    if (isExt) h += '<button class="af-btn red" onclick="delExt('+a.freq+')">✕ Зняти позначку</button>';
    return h + '</div>';
  }

  var afList = flightsList.concat(extList);
  var side = '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'af\')"><span class="cap">✈ Активні вильоти</span>'+
    '<span><span class="count-pill">'+afList.length+' В ЕФІРІ</span> <span class="arr">'+(sidePanels.af?'▲':'▼')+'</span></span></div>'+
    '<div class="side-body'+(sidePanels.af?'':' hid')+'">'+
    (afList.length ? afList.map(afCard).join('') : '<div class="empty">Немає активних вильотів</div>')+
    '</div></div>';

  // Наші екіпажі — таблиця як у макеті.
  // Резервні частоти згорнуті під основною свого екіпажу (▸ N) — рівний
  // список основних і резервів упереміш був неінтуїтивний. Розкривати
  // можна хоч усі екіпажі одразу, стан живе у freqResOpen між рендерами.
  var resByCrew = {};
  reserves.forEach(function(r){ (resByCrew[r.crew] = resByCrew[r.crew] || []).push(r); });
  var resShown = {};
  var crewRows = '';
  crewsList.forEach(function(a){
    var cc = cleanCode(a.freqCode) || freqToCodeLocal(a.freq);
    var info = crewInfoMap[a.crew];
    var own = isOwn(a);
    // Зміна частоти — лише через розгорнуті резерви («⇄ основна»);
    // окремий 🎚 зі своїм меню дублював цю ж дію
    var canSwitch = info && info.reserves && info.reserves.length && (info.author === S.me || S.me === d.adminEmail);
    var rlist = resByCrew[a.crew] || [];
    resShown[a.crew] = true;
    var resOpen = !!freqResOpen[a.crew];
    var busyC = !!freqSwapBusy[a.crew];
    var resBtn = rlist.length
      ? ' <button class="vtx-btn" style="padding:1px 6px;margin-left:4px;border-color:var(--purple);color:var(--purple)" '+
        'title="'+(resOpen?'Сховати':'Показати')+' резервні частоти" data-id="'+esc(a.crew)+'" '+
        'onclick="toggleCrewRes(this.dataset.id)">'+(resOpen?'▾':'▸')+' '+rlist.length+'</button>'
      : '';
    crewRows += '<tr><td><span class="crew-dot'+(own?' green':'')+'"></span>'+crewDisplayHtml(a.crew)+
      (own?' <span class="badge-main">мій</span>':'')+'</td>'+
      '<td><span class="crew-freq'+(own?'" style="color:#2ecc71':'')+'">'+esc(cc)+' ('+esc(a.freq)+')</span>'+
      (busyC?' <span title="Зміна частоти…">⏳</span>':'')+resBtn+
      '</td><td>'+crewBindCell(a.crew)+'</td></tr>';
    if (resOpen) rlist.forEach(function(r){
      // ⇄ — резерв стає основною (те саме право, що й був перемикач 🎚).
      // Під час зміни — ⏳ і все заблоковано: обірвати чи клікнути вдруге не можна
      var swapBtn = '';
      if (busyC) {
        swapBtn = ' <button class="vtx-btn" disabled style="padding:1px 6px;margin-left:4px;opacity:.6">⏳</button>';
      } else if (canSwitch) {
        swapBtn = ' <button class="vtx-btn" '+(freqSwapAny()?'disabled ':'')+
          'style="padding:1px 6px;margin-left:4px'+(freqSwapAny()?';opacity:.5':'')+'" title="Зробити основною частотою" '+
          'data-crew="'+esc(a.crew)+'" data-code="'+esc(r.freqCode)+'" '+
          'onclick="doSwapFreq(this.dataset.crew, this.dataset.code)">⇄ основна</button>';
      }
      crewRows += '<tr><td style="padding-left:26px;color:var(--dim)">↳ резерв</td>'+
        '<td><span class="crew-freq purple">'+esc(cleanCode(r.freqCode))+(r.freq?' ('+esc(r.freq)+')':'')+'</span>'+swapBtn+
        '</td><td></td></tr>';
    });
  });
  // Резерви екіпажів без рядка в таблиці (виліт «поглинув» основну) — як раніше
  reserves.forEach(function(r){
    if (resShown[r.crew]) return;
    crewRows += '<tr><td><span class="crew-dot purple"></span>'+crewDisplayHtml(r.crew)+'</td>'+
      '<td><span class="crew-freq purple">РЕЗЕРВ '+esc(cleanCode(r.freqCode))+'</span></td>'+
      '<td>'+crewBindCell(r.crew)+'</td></tr>';
  });
  side += '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'crews\')"><span class="cap">👥 Наші екіпажі</span><span class="arr">'+(sidePanels.crews?'▲':'▼')+'</span></div>'+
    '<div class="side-body'+(sidePanels.crews?'':' hid')+'" style="padding:0">'+
    (crewRows ? '<table class="crew-table"><tr><th>Позивний</th><th>Частота</th><th>Bind</th></tr>'+crewRows+'</table>' : '<div class="empty">Екіпажів немає</div>')+
    '</div></div>';

  // Конфлікти (активні + резервні)
  var realConf = [];
  for (var i = 0; i < occupied.length; i++)
    for (var j = i+1; j < occupied.length; j++) {
      var a1 = occupied[i], a2 = occupied[j];
      if (a1.crew === a2.crew) continue;
      var gap = Math.abs(a1.freq - a2.freq);
      if (gap < 20) realConf.push({lvl:'🔴', t:'Прямий', d:crewNameOnly(a1.crew)+' @'+a1.freq+' ↔ '+crewNameOnly(a2.crew)+' @'+a2.freq+' (Δ'+gap+' МГц)'});
      else if (gap < 40) realConf.push({lvl:'🟠', t:'Близькі канали', d:crewNameOnly(a1.crew)+' @'+a1.freq+' ↔ '+crewNameOnly(a2.crew)+' @'+a2.freq+' (Δ'+gap+' МГц)'});
    }
  reserves.forEach(function(r){
    occupied.forEach(function(o){
      if (o.crew === r.crew) return;
      var dd = Math.abs(r.freq - o.freq);
      if (dd < 20) realConf.push({lvl:'🔴', t:'Резерв ↔ активна', d:'🔄 '+crewNameOnly(r.crew)+' резерв '+r.freq+' ↔ '+crewNameOnly(o.crew)+' '+o.freq+' (Δ'+dd+')'});
      else if (dd < 40) realConf.push({lvl:'🟠', t:'Резерв ↔ активна', d:'🔄 '+crewNameOnly(r.crew)+' резерв '+r.freq+' ↔ '+crewNameOnly(o.crew)+' '+o.freq+' (Δ'+dd+')'});
    });
  });
  side += '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'conf\')"><span class="cap">⚠ Конфлікти</span>'+
    '<span>'+(realConf.length?'<span class="count-pill" style="color:var(--red-soft)">'+realConf.length+'</span> ':'')+'<span class="arr">'+(sidePanels.conf?'▲':'▼')+'</span></span></div>'+
    '<div class="side-body'+(sidePanels.conf?'':' hid')+'">'+
    (realConf.length
      ? realConf.map(function(cf){ return '<div class="conflict-item">'+cf.lvl+' '+esc(cf.t)+'<div class="detail">'+esc(cf.d)+'</div></div>'; }).join('')
      : '<div class="empty">✅ Конфліктів немає</div>')+
    '</div></div>';

  // ── Спектр-аналізатор ──
  var range;
  if (bandGroup === '5.8') range = [5200, 6200];
  else if (bandGroup === '5.0') range = [4900, 5250];
  else if (bandGroup === '3.3') range = [3000, 3600];
  else {
    var fs = occupied.map(function(o){ return o.freq; }).concat(reserves.map(function(r){ return r.freq; }));
    if (fs.length) range = [Math.min.apply(null, fs) - 100, Math.max.apply(null, fs) + 100];
    else range = [5600, 6000];
  }
  function pos(f) { return Math.max(1.5, Math.min(98.5, (f - range[0]) / (range[1] - range[0]) * 100)); }
  // Збираємо всі мітки, сортуємо по частоті й розкладаємо по «поверхах»:
  // якщо мітка ближче за MIN_GAP% до попередньої на тому ж поверсі — піднімаємо
  // на поверх вище. Так підписи не перекриваються. Лише назва; деталі — tooltip.
  // Деталі мітки — не системний title (блідий, без дотику на телефоні),
  // а власна плашка по кліку в стилі складу комплектів (kit-pop)
  var items = [];
  occupied.forEach(function(o){
    if (o.freq < range[0] || o.freq > range[1]) return;
    var conf = conflictOf(o);
    var own = isOwn(o);
    var col = conf && conf.level==='critical' ? '#e74c3c' : (own ? '#2ecc71' : (o.source==='external' ? '#7f8c8d' : '#3498db'));
    var code = cleanCode(o.freqCode) || freqToCodeLocal(o.freq);
    items.push({ f: o.freq, x: pos(o.freq), col: col, dash: !!(conf&&conf.level==='critical'),
      name: o.source==='mine' ? 'ВИ' : crewNameOnly(o.crew),
      pop: '<div class="kp-head">📶 '+esc(crewNameOnly(o.crew))+(own?' (ВИ)':'')+
          (o.crew && crewById(o.crew) ? ' <span class="crew-id">'+esc(o.crew)+'</span>' : '')+'</div>'+
        '<div class="kp-row"><span class="kp-id">'+esc(code && code!=='?' ? code : '—')+'</span> · <b>'+esc(o.freq)+' МГц</b>'+
          (o.system ? ' · <span class="kp-name">'+esc(o.system)+'</span>' : '')+'</div>'+
        (o.pilot ? '<div class="kp-row kp-name">👤 '+esc(o.pilot)+'</div>' : '')+
        (conf ? '<div class="kp-row" style="color:var(--red-soft)">⚠ Конфлікт з '+esc(crewNameOnly(conf.with.crew))+' (Δ'+conf.gap+' МГц)</div>' : '') });
  });
  reserves.forEach(function(r){
    if (r.freq < range[0] || r.freq > range[1]) return;
    var codeR = cleanCode(r.freqCode) || freqToCodeLocal(r.freq);
    items.push({ f: r.freq, x: pos(r.freq), col: '#9b59b6', dash: true,
      name: '🔄 ' + crewNameOnly(r.crew),
      pop: '<div class="kp-head" style="color:var(--purple)">🔄 Резерв · '+esc(crewNameOnly(r.crew))+'</div>'+
        '<div class="kp-row"><span class="kp-id">'+esc(codeR && codeR!=='?' ? codeR : '—')+'</span> · <b>'+esc(r.freq)+' МГц</b></div>' });
  });
  items.sort(function(a, b){ return a.x - b.x; });
  window._specItems = items;
  var marks = items.map(function(it, i){
    return '<div class="spec-mark'+(it.dash?' dash':'')+'" style="left:'+it.x+'%;border-color:'+it.col+'" data-i="'+i+'" onclick="specPop(event,this)">'+
      '<div class="spec-lbl" style="background:'+it.col+'">'+esc(it.name)+'</div></div>';
  }).join('');
  var spectrum = '<div class="spectrum">'+
    '<div class="spec-head"><span>'+(range[0]/1000).toFixed(1)+' GHz</span><span>Аналізатор спектру</span>'+
    '<span>'+(range[1]/1000).toFixed(1)+' GHz <button class="tgl" onclick="toggleSpec()">'+(specOpen?'▼':'▲')+'</button></span></div>'+
    '<div class="spec-area'+(specOpen?'':' hid')+'" id="specArea">'+marks+'</div></div>';
  // Розкладка міток по «поверхах» після рендеру — за реальною шириною тексту
  setTimeout(layoutSpecLabels, 0);

  c.innerHTML = '<div class="view-title">Матриця <span class="accent">частот</span> <span style="font-size:14px;color:var(--dim)">(VHF/UHF)</span></div>'+
    '<div class="view-sub">Клік по клітинці — позначити/зняти чужу частоту</div>'+
    legend +
    '<div class="freq-layout">'+ m +'<div>'+ side +'</div></div>'+
    spectrum;
}
/* Плашка деталей мітки спектра — той самий патерн, що invKitPop:
   працює і по кліку, і на дотик; повторний клік по тій самій мітці закриває */
function specPopClose() {
  var p = $('specPopEl');
  if (p) p.parentNode.removeChild(p);
  document.removeEventListener('click', specPopOutside, true);
}
function specPopOutside(e) {
  var p = $('specPopEl');
  if (p && !p.contains(e.target)) specPopClose();
}
function specPop(ev, el) {
  ev.stopPropagation();
  var i = el.dataset.i;
  var it = (window._specItems || [])[i];
  if (!it) return;
  var wasOpen = $('specPopEl') && $('specPopEl').dataset.i === i;
  specPopClose();
  if (wasOpen) return;
  var p = document.createElement('div');
  p.className = 'kit-pop';
  p.id = 'specPopEl';
  p.dataset.i = i;
  p.innerHTML = it.pop;
  document.body.appendChild(p);
  // Позиція: під підписом мітки, з притисканням до країв екрана (як kit-pop)
  var lbl = el.querySelector('.spec-lbl') || el;
  var r = lbl.getBoundingClientRect();
  var left = r.left, w = p.offsetWidth;
  if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
  if (left < 8) left = 8;
  p.style.left = left + 'px';
  var h = p.offsetHeight;
  var top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = r.top - h - 6;
  if (top < 8) top = 8;
  p.style.top = top + 'px';
  setTimeout(function(){ document.addEventListener('click', specPopOutside, true); }, 0);
}

function cellClick(freq) {
  var ext = (S.freq && S.freq.active || []).filter(function(a){ return a.source==='external' && a.freq===freq; });
  if (ext.length) { delExt(freq); return; }
  openModal('⚫ Чужа частота',
    '<div class="tcard-meta mono" style="margin-bottom:10px">'+freq+' МГц ('+esc(freqToCodeLocal(freq))+')</div>'+
    '<div class="f"><label>Опис</label><input type="text" id="extDesc" placeholder="Напр. Сусідній підрозділ"></div>'+
    '<button class="btn" onclick="confirmExt('+freq+')">Позначити зайнятою</button>'
  );
}
function confirmExt(freq) {
  var desc = $('extDesc').value.trim() || 'Чужий підрозділ';
  rpc('addExternalFreq', [freq, desc], function(){ closeModal(); toast('⚫ '+freq+' МГц позначено'); reloadFreq(); });
}
function delExt(freq) {
  rpc('removeExternalFreq', [freq], function(){ toast('✅ '+freq+' МГц звільнено'); reloadFreq(); });
}
/* Зміна основної частоти екіпажу. Раніше після відповіді сервера йшов
   повний loadAll — секунди очікування, і матриця встигала оновитись
   раніше за таблицю екіпажів. Тепер: на час запиту ⏳ і блокування
   повторних кліків, після успіху — той самий своп локально в S.freq
   і S.flights (дзеркало логіки swapCrewFrequency), один рендер. */
var freqSwapBusy = {};
function freqSwapAny() { for (var k in freqSwapBusy) if (freqSwapBusy[k]) return true; return false; }
function codeFreqLocal(code) {
  var m = String(code||'').match(/\((\d{4})\)/);
  if (m) return Number(m[1]);
  var cc = cleanCode(code);
  for (var b in BANDS) for (var i = 0; i < BANDS[b].length; i++)
    if (BANDS[b][i] && b + (i+1) === cc) return BANDS[b][i];
  return 0;
}
function doSwapFreq(crewId, code) {
  if (freqSwapAny()) return;  // одна зміна за раз — без обривів і подвійних кліків
  freqSwapBusy[crewId] = true;
  renderView();
  rpc('swapCrewFrequency', [crewId, code], function(){
    var d = S.freq, oldMain = '';
    if (d) {
      var mainA = (d.active||[]).find(function(a){ return a.crew === crewId && (a.isCrewMain || a.source === 'crew'); });
      if (mainA) {
        oldMain = mainA.freqCode;
        mainA.freqCode = code;
        mainA.freq = codeFreqLocal(code);
      }
      if (oldMain) {
        var res = (d.reserves||[]).find(function(x){ return x.crew === crewId && x.freqCode === code; });
        if (res) { res.freqCode = oldMain; res.freq = codeFreqLocal(oldMain); }
        var ci = (d.crewFreqInfo||[]).find(function(x){ return x.crew === crewId; });
        if (ci) {
          var ri = ci.reserves.indexOf(code);
          if (ri !== -1) ci.reserves[ri] = oldMain;
          ci.main = code;
        }
      }
    }
    // Рядок екіпажу в S.flights (сторінка екіпажів читає freq/reserves звідти)
    var cr = crewById(crewId);
    if (cr) {
      if (oldMain && cr.reserves) {
        cr.reserves = String(cr.reserves).split('|').map(function(s){
          return s.trim() === code ? oldMain : s;
        }).join('|');
      }
      cr.freq = code;
    }
    delete freqSwapBusy[crewId];
    toast('🎚 '+crewNameOnly(crewId)+' → '+cleanCode(code));
    updateTopStats();
    renderView();
  }, function(e){
    delete freqSwapBusy[crewId];
    renderView();
    toast('❌ '+e.message, true);
  });
}
function reloadFreq() {
  rpc('getFrequencyAnalysis', [], function(v){ S.freq = v; updateTopStats(); renderView(); });
}

/* ═══════════ ВИД: УПРАВЛІННЯ СЕКТОРОМ (концепт) ═══════════

function sectorById(id) { return SECTORS.find(function(s){ return s.id === id; }) || SECTORS[0]; }
// Дати/часи з журналу приходять то рядком «2026-08-20», то Date-рядком
// «Thu Aug 20 2026 00:00:00 GMT…» (час — узагалі «Sat Dec 30 1899 10:51…»)
function sectorYmd(v) {
  var s = String(v || '');
  var m = s.match(/^(\d{4}-\d{2}-\d{2})/);
  if (m) return m[1];
  var d = new Date(s);
  if (isNaN(d)) return '';
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function sectorHm(v) {
  var s = String(v || '');
  var m = s.match(/(\d{1,2}):(\d{2})/);
  return m ? ('0'+m[1]).slice(-2)+':'+m[2] : s;
}
// Висота робочої області: на десктопі карта й бічна колонка закінчуються
// рівно на нижньому краї дисплея (замість сірої порожнечі під картою),
// бічна колонка прокручується всередині. На мобільному — природний потік.
function sectorFitHeight() {
  var lay = $('sectorLayout'), side = $('sectorSide'), map = $('sectorMap');
  if (!lay) return;
  if (window.innerWidth > 1100) {
    // Прокручується main.content, а не вікно: зміщення рахуємо всередині
    // нього, інакше після прокрученої «Статистики» висота їде
    var sc = lay.closest('main.content');
    // Стандартні 40px знизу тут — змарнований простір: карта має тягнутися
    // до краю. Звужуємо відступ ДО замірів; renderView повертає його назад
    // при переході в інший розділ
    if (sc) sc.style.paddingBottom = '12px';
    var scRect = sc ? sc.getBoundingClientRect() : { top: 0, bottom: window.innerHeight };
    var top = lay.getBoundingClientRect().top - scRect.top + (sc ? sc.scrollTop : window.scrollY);
    var h = Math.max(180,(scRect.bottom - scRect.top) - top - 16);
    lay.style.height = h + 'px';
    if (side) side.style.overflowY = 'auto';
    if (map) { map.style.flex = '1 1 0'; map.style.height = ''; }
    // Під областю ще смуга погоди й кнопок — вона має стояти впритул до
    // нижнього краю без прокрутки. Формула вище цього не гарантує (запас
    // -16 плюс нижні відступи смуги й контейнера), тому міряємо фактичний
    // зазор під смугою і віддаємо його карті; перевірка переповнення нижче
    // лишається останнім словом — вона підрізає, якщо перебрали
    if (sc) {
      var bar = $('sectorBottomBar');
      if (bar) {
        var tail = parseFloat(getComputedStyle(bar).marginBottom) || 0;
        tail += parseFloat(getComputedStyle(sc).paddingBottom) || 0;
        var slack = scRect.bottom - bar.getBoundingClientRect().bottom - tail;
        if (slack > 0) { h += slack; lay.style.height = h + 'px'; }
      }
      var over = sc.scrollHeight - sc.clientHeight;
      if (over > 0) lay.style.height = Math.max(180,h - over) + 'px';
    }
  } else {
    // flex-basis 0 перебив би явну висоту — тому тут basis auto
    lay.style.height = '';
    if (side) side.style.overflowY = '';
    if (map) { map.style.flex = '0 0 auto'; map.style.height = '56vh'; }
    var scM = lay.closest('main.content');
    if (scM) scM.style.paddingBottom = '';
  }
  if (_sectorMapObj) { try { _sectorMapObj.invalidateSize(); } catch(e) {} }
}

// Темна карта з квадратними контролями праворуч: зум і перемикач топооснови ⧉
function hudMap(el) {
  var map = L.map(el, { zoomControl: false });
  L.control.zoom({ position: 'topright' }).addTo(map);
  var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: '© Esri' });
  (mapLayer === 'sat' ? sat : osm).addTo(map);
  var ctl = L.control({ position: 'topright' });
  ctl.onAdd = function(){
    var d = L.DomUtil.create('div', 'leaflet-bar');
    var a = L.DomUtil.create('a', mapLayer === 'sat' ? 'map-sq-active' : '', d);
    a.href = '#';
    a.title = 'Топооснова: Карта / Супутник';
    a.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 3l9 5-9 5-9-5 9-5zm-6.5 8.6L12 15l6.5-3.4L21 13l-9 5-9-5 2.5-1.4zm0 4L12 19l6.5-3.4L21 17l-9 5-9-5 2.5-1.4z"/></svg>';
    L.DomEvent.disableClickPropagation(d);
    a.onclick = function(ev){
      ev.preventDefault();
      mapLayer = mapLayer === 'sat' ? 'osm' : 'sat';
      if (mapLayer === 'sat') { map.removeLayer(osm); sat.addTo(map); } else { map.removeLayer(sat); osm.addTo(map); }
      a.classList.toggle('map-sq-active', mapLayer === 'sat');
    };
    return d;
  };
  ctl.addTo(map);
  return map;
}

// Середня тривалість завершених вильотів за часами "HH:MM" початку/кінця
function sectorAvgFlight() {
  var mins = [], toMin = function(t){
    var m = String(t||'').match(/(\d{1,2}):(\d{2})/);
    return m ? (+m[1])*60 + (+m[2]) : null;
  };
  S.flights.forEach(function(f){
    if (f.id.indexOf('CRW-') === 0) return;
    var a = toMin(f.start), b = toMin(f.end);
    if (a === null || b === null) return;
    var d = b - a; if (d < 0) d += 24*60;
    if (d > 0 && d < 6*60) mins.push(d);
  });
  if (!mins.length) return '—';
  var avg = Math.round(mins.reduce(function(s,x){ return s+x; }, 0) / mins.length);
  return ('0'+Math.floor(avg/60)).slice(-2)+':'+('0'+avg%60).slice(-2);
}

function renderSector(c) {

  // Екіпаж/людина без сектора (старі дані, нерозподілені) — видно скрізь.
  var crewSectorById = {};
