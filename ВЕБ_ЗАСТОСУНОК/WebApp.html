}
function doAddTracker() {
  var model = $('atModel').value.trim();
  if (!model) { toast('⚠ Вкажи модель', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('atBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() { if (btn) { btn.disabled = false; btn.textContent = '➕ Додати трекер'; } }
  var simId = $('atSim').value;
  rpc('addSinotrack', [{ model: model, imei: $('atImei').value.trim(), note: $('atNote').value.trim() }], function(newId){
    if (simId) {
      rpc('bindSimToTracker', [simId, newId, false], function(){ toast('📡 '+newId+' додано + SIM'); closeModal(); loadAll(); },
        function(e){ toast('📡 '+newId+' додано, але SIM не прив\'язано: ' + e.message, true); closeModal(); loadAll(); });
    } else { toast('📡 '+newId+' додано'); closeModal(); loadAll(); }
  }, function(e){ unlock(); toast('❌ ' + e.message, true); });
}
function openAddSim() {
  openModal('📱 Нова SIM-карта',
    '<div class="f"><label>Назва контакту *</label><input type="text" id="asContact" placeholder="Vodafone-07"></div>'+
    '<div class="f"><label>Номер *</label><input type="text" id="asNumber" placeholder="+380671112233"></div>'+
    '<button class="btn" id="asBtn" onclick="doAddSim()">➕ Додати SIM</button>'
  );
}
function doAddSim() {
  var contact = $('asContact').value.trim(), number = $('asNumber').value.trim();
  if (!contact || !number) { toast('⚠ Заповни контакт і номер', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('asBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  rpc('addSim', [{ contact: contact, number: number }], function(newId){ toast('📱 '+newId+' додано'); closeModal(); loadAll(); },
    function(e){ if (btn) { btn.disabled = false; btn.textContent = '➕ Додати SIM'; } toast('❌ ' + e.message, true); });
}
function openBindSim(trackerId) {
  var freeSims = S.sims.filter(function(s){ return !s.binding && s.status !== 'Втрачена'; });
  if (!freeSims.length) { toast('⚠ Немає вільних SIM-карт', true); return; }
  openModal('🔗 Прив\'язати SIM до '+esc(trackerId),
    '<div class="f"><label>SIM-карта</label><select id="bsSim">'+
    freeSims.map(function(s){ return '<option value="'+esc(s.id)+'">'+esc(s.id)+' — '+esc(s.contact)+' · '+esc(s.number)+'</option>'; }).join('')+
    '</select></div>'+
    '<button class="btn" id="bsBtn" onclick="doBindSim(\''+esc(trackerId)+'\')">🔗 Прив\'язати</button>'
  );
}
function doBindSim(trackerId) {
  var simId = $('bsSim').value;
  // Захист від повторного натискання поки виконується запит
  var btn = $('bsBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() { if (btn) { btn.disabled = false; btn.textContent = '🔗 Прив\'язати'; } }
  rpc('bindSimToTracker', [simId, trackerId, false], function(){
    toast('🔗 SIM прив\'язано'); closeModal(); loadAll();
  }, function(e){
    if (confirm('⚠ ' + e.message + '\n\nПрив\'язати примусово?')) {
      rpc('bindSimToTracker', [simId, trackerId, true], function(){ toast('🔗 SIM прив\'язано (примусово)'); closeModal(); loadAll(); },
        function(e2){ unlock(); toast('❌ ' + e2.message, true); });
    } else { unlock(); }
  });
}
function doUnbindSim(trackerId) {
  if (!confirm('🔌 Відв\'язати SIM від '+trackerId+'?')) return;
  rpc('unbindSimFromTracker', [trackerId], function(){ toast('🔌 SIM відв\'язано'); loadAll(); });
}

/* ═══════════ ВИД: ІНВЕНТАР ═══════════ */
var invFilter = { q:'', type:'all', status:'all' };
var invMode = 'view';   // 'view' | 'edit'
var invTab = 'all';     // 'all' — загальний | 'crew' — інвентар екіпажу
var invCrewSel = '';    // вибраний екіпаж на вкладці екіпажу
var invBusy = {};       // id → true поки виконується запит по рядку
var myCallsign = '';    // запам'ятований позивний для «Прийняти»
var INV_STATUSES = ['Робочий','Ремонт','На перевірці','Несправний','Втрачений','Списаний','Резерв'];
var TRK_STATUSES = ['Робочий','Зламаний','Втрачений'];

function invIsAdmin() { return !!(S.invCaps && S.invCaps.admin); }
function invStatuses() { return (S.invCaps && S.invCaps.statuses && S.invCaps.statuses.length) ? S.invCaps.statuses : INV_STATUSES; }

// Список за поточними фільтрами (вкладка + тип + пошук), БЕЗ фільтра за статусом —
// з нього рахуються плитки дашборду, тому вони синхронні з фільтрами
function invBaseList() {
  var q = invFilter.q.toLowerCase();
  var source = invTab === 'crew' ? invCrewItems() : S.items;
  return source.filter(function(it){
    if (invTab === 'all' && invFilter.type !== 'all' && String(it.type||'').split('-')[0] !== invFilter.type) return false;
    if (q && (it.id+' '+it.name+' '+it.type+' '+it.responsible+' '+it.assignment).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function renderInventory(c) {
  var types = {};
  S.items.forEach(function(it){ var t = String(it.type||'').split('-')[0]; if (t) types[t] = 1; });
  var typeChips = ['all'].concat(Object.keys(types).sort()).map(function(t){
    return '<button class="filter-chip'+(invFilter.type===t?' active':'')+'" onclick="invFilter.type=\''+t+'\';renderView()">'+(t==='all'?'ВСІ':esc(t))+'</button>';
  }).join('');
  var stats = {};
  invBaseList().forEach(function(it){ var s = String(it.status||'').trim(); stats[s] = (stats[s]||0)+1; });

  // Редагування: адмін (основна таблиця) або головний відповідальний екіпажу (після входу)
  var canEdit = !!S.invCaps && (invIsAdmin() || !!(S.auth && S.auth.isMain));
  var sub;
  if (!canEdit) {
    sub = S.items.length+' одиниць · перегляд'+(S.auth ? '' : ' (редагування — після входу головного відповідального)');
  } else if (invMode !== 'edit') {
    sub = S.items.length+' одиниць · перегляд';
  } else if (invIsAdmin()) {
    sub = S.items.length+' одиниць · редагування: статуси (списання — через статус) · прийняття · до екіпажу · видалити';
  } else {
    sub = S.items.length+' одиниць · редагування: статуси · прийняття обладнання ('+esc(S.auth.crewName || S.auth.crewId)+')';
  }

  var modeToggle = canEdit
    ? '<div class="inv-mode">'+
        '<button class="inv-mode-btn'+(invMode!=='edit'?' active':'')+'" onclick="invSetMode(\'view\')">Перегляд</button>'+
        '<button class="inv-mode-btn'+(invMode==='edit'?' active':'')+'" onclick="invSetMode(\'edit\')">Редагування</button>'+
      '</div>'
    : '';

  // Вкладки: загальний інвентар / інвентар екіпажу
  var tabs = '<div class="inv-tabs">'+
    '<button class="inv-tab'+(invTab==='all'?' active':'')+'" onclick="invSetTab(\'all\')">Загальний інвентар</button>'+
    '<button class="inv-tab'+(invTab==='crew'?' active':'')+'" onclick="invSetTab(\'crew\')">Інвентар екіпажу</button>'+
  '</div>';

  // Вкладка «Інвентар екіпажу» без входу — тільки кнопка входу
  if (invTab === 'crew' && !isAdminUser() && !S.auth) {
    c.innerHTML = '<div class="view-title">Інвентар <span class="accent">підрозділу</span></div>'+
      '<div class="view-sub">'+sub+'</div>'+
      '<div class="inv-tabs">'+
        '<button class="inv-tab" onclick="invSetTab(\'all\')">Загальний інвентар</button>'+
        '<button class="inv-tab active">Інвентар екіпажу</button>'+
      '</div>'+
      loginGateHtml('Інвентар екіпажу');
    return;
  }

  // Панель вибору екіпажу (вкладка екіпажу)
  var crewBar = '';
  if (invTab === 'crew') {
    var crews = activeCrews();
    // Не-адмін бачить тільки свій екіпаж
    if (!isAdminUser() && S.auth) {
      crews = crews.filter(function(cr){ return cr.id === S.auth.crewId; });
    }
    if (!invCrewSel || !crews.find(function(cr){ return cr.id === invCrewSel; })) {
      invCrewSel = crews.length ? crews[0].id : '';
    }
    var crewOpts = crews.map(function(cr){
      return '<option value="'+esc(cr.id)+'"'+(cr.id===invCrewSel?' selected':'')+'>'+esc(cr.crewName || cr.id)+(cr.bind?' ['+esc(cr.bind)+']':'')+'</option>';
    }).join('');
    var addDroneBtn = (invMode==='edit' && canEdit && invIsAdmin() && invCrewSel)
      ? '<button class="btn btn-mini btn-green" onclick="invAddDroneToCrewModal()">➕ Додати</button>' : '';
    crewBar = '<div class="inv-crew-bar">'+
      '<label>Вибір підрозділу:</label>'+
      (crews.length
        ? '<select onchange="invCrewSel=this.value;renderView()">'+crewOpts+'</select>'
        : '<span class="hint">'+(S.auth && !S.auth.crewId ? 'Ти не привʼязаний до екіпажу' : 'Немає активних екіпажів')+'</span>')+
      addDroneBtn+
    '</div>';
  }

  c.innerHTML = '<div class="view-title">Інвентар <span class="accent">підрозділу</span></div>'+
    '<div class="view-sub">'+sub+'</div>'+
    '<div class="stat-row">'+
      '<div class="stat-tile green click'+(invFilter.status==='Робочий'?' active':'')+'" onclick="invStatFilter(\'Робочий\')" title="Фільтр: Робочі"><div class="stat-num" id="stW">'+(stats['Робочий']||0)+'</div><div class="stat-lbl">Робочі</div></div>'+
      '<div class="stat-tile click'+(invFilter.status==='Ремонт'?' active':'')+'" onclick="invStatFilter(\'Ремонт\')" title="Фільтр: В ремонті"><div class="stat-num" id="stR">'+(stats['Ремонт']||0)+'</div><div class="stat-lbl">В ремонті</div></div>'+
      '<div class="stat-tile red click'+(invFilter.status==='broken'?' active':'')+'" onclick="invStatFilter(\'broken\')" title="Фільтр: Несправні + втрачені"><div class="stat-num" id="stB">'+((stats['Несправний']||0)+(stats['Втрачений']||0))+'</div><div class="stat-lbl">Несправні + втрачені</div></div>'+
      '<div class="stat-tile blue click'+(invFilter.status==='Резерв'?' active':'')+'" onclick="invStatFilter(\'Резерв\')" title="Фільтр: Резерв"><div class="stat-num" id="stRes">'+(stats['Резерв']||0)+'</div><div class="stat-lbl">Резерв</div></div>'+
    '</div>'+
    tabs+
    crewBar+
    '<div class="filter-row">'+
      '<input type="text" id="invSearch" placeholder="Пошук: ID, назва, відповідальний…" value="'+esc(invFilter.q)+'" oninput="invFilter.q=this.value;renderInvTable()">'+
      (invTab==='all' ? typeChips : '')+
      modeToggle+
    '</div>'+
    '<div class="table-wrap"><table class="data-table" id="invTable"></table></div>';
  renderInvTable();
}

function invSetMode(m) { invMode = m; renderView(); }
function invSetTab(t) { invTab = t; renderView(); }

// Клік по плитці дашборду — фільтр за статусом (повторний клік скидає)
function invStatFilter(st) {
  invFilter.status = invFilter.status === st ? 'all' : st;
  renderView();
}

// Чи проходить статус поточний фільтр плиток
function invStatusMatch(st) {
  if (invFilter.status === 'all') return true;
  st = String(st||'').trim();
  if (invFilter.status === 'broken') return st === 'Несправний' || st === 'Втрачений' || st === 'Зламаний';
  return st === invFilter.status;
}

function invStatusSelectHtml(it) {
  var cur = String(it.status||'').trim();
  var sts = invStatuses();
  var opts = sts.map(function(s){
    return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';
  });
  if (cur && sts.indexOf(cur) === -1) {
    opts.unshift('<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>');
  }
  var busy = invBusy[it.id] ? ' disabled' : '';
  return '<select class="inv-status-sel" data-id="'+esc(it.id)+'" onchange="invChangeStatus(this)"'+busy+'>'+opts.join('')+'</select>';
}

// Слот предмета в екіпажі: борт / наземка / спорядження
function invSlotOf(it) {
  var t = String(it.type||'');
  if (t.indexOf('FPV')===0 || t.indexOf('STNG')===0 || t.indexOf('WING')===0) return 'drone';
  if (t.indexOf('GNST')===0) return 'gnst';
  return 'equip';
}

// В якому активному екіпажі зараз предмет (борти, наземка або спорядження)
function invItemCrew(id) {
  return activeCrews().find(function(c){
    var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }) : [];
    var eq = c.equip  ? c.equip.split('|').map(function(s){ return s.trim(); })  : [];
    return dl.indexOf(id) !== -1 || eq.indexOf(id) !== -1 || String(c.gnst||'').trim() === id;
  }) || null;
}

// Хто може приймати обладнання: адмін — будь-яке, головний — предмети свого екіпажу
function invCanAccept(it) {
  if (isAdminUser()) return true;
  if (!(S.auth && S.auth.isMain)) return false;
  var c = invItemCrew(it.id);
  return !!(c && c.id === S.auth.crewId);
}

function invActionsHtml(it) {
  if (invBusy[it.id]) return '<div class="inv-acts"><span class="hint">⏳</span></div>';
  // Дії під ID, однакові на обох вкладках. Списання — через статус «Списаний».
  var h = '<div class="inv-acts">';
  // Прийняття обладнання головним відповідальним / адміном
  if (invCanAccept(it)) {
    h += '<button class="inv-act inv-act--ok" title="Прийняти обладнання" onclick="invAcceptEquip(this.dataset.id)" data-id="'+esc(it.id)+'">'+svgIcon('check')+'</button>';
    h += '<button class="inv-act" style="color:var(--orange);border-color:var(--orange)" title="Не прийняти (причина + статус)" onclick="invRejectModal(this.dataset.id)" data-id="'+esc(it.id)+'">'+svgIcon('x')+'</button>';
  }
  if (invIsAdmin()) {
    // Одна кнопка-перемикач: в екіпажі → прибрати (✕), поза екіпажем → додати (+)
    var inCrew = invItemCrew(it.id);
    h += inCrew
      ? '<button class="inv-act inv-act--crew" title="Прибрати з екіпажу '+esc(inCrew.id)+'" onclick="invCrewToggle(this.dataset.id)" data-id="'+esc(it.id)+'">'+svgIcon('x')+'</button>'
      : '<button class="inv-act inv-act--crew" title="Додати до екіпажу" onclick="invCrewToggle(this.dataset.id)" data-id="'+esc(it.id)+'">'+svgIcon('plus')+'</button>';
    h += '<button class="inv-act inv-act--del" title="Видалити з обліку" onclick="invDelete(this.dataset.id)" data-id="'+esc(it.id)+'">'+svgIcon('trash')+'</button>';
  }
  return h + '</div>';
}

// ── Прийняття обладнання ──
function invAcceptEquip(id) {
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it || invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  rpc('acceptItem', [crewToken() || null, id, true, ''], function(){
    it.accepted = 'Прийнято'; it.acceptReason = '';
    delete invBusy[id];
    toast('✓ '+id+' прийнято');
    renderInvTable();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

function invRejectModal(id) {
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  var stOpts = ['','Несправний','Ремонт','На перевірці'].map(function(s){
    return '<option value="'+esc(s)+'">'+(s || '— не міняти —')+'</option>';
  }).join('');
  openModal('✗ Не прийняти: '+esc(id),
    '<div class="hint" style="margin-bottom:8px">'+esc(it.name)+' лишиться на балансі екіпажу з позначкою «не прийнятий»</div>'+
    '<div class="f"><label>Причина *</label><input type="text" id="rjReason" placeholder="напр. тріщина рами"></div>'+
    '<div class="f"><label>Змінити статус</label><select id="rjStatus">'+stOpts+'</select></div>'+
    '<button class="btn btn-red" id="rjBtn" onclick="doRejectEquip(\''+esc(id)+'\')">✗ Не прийняти</button>'
  );
}

function doRejectEquip(id) {
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  var reason = $('rjReason').value.trim();
  if (!reason) { toast('⚠ Вкажи причину', true); return; }
  var newSt = $('rjStatus').value;
  var btn = $('rjBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('acceptItem', [crewToken() || null, id, false, reason], function(){
    it.accepted = 'Не прийнято'; it.acceptReason = reason;
    function fin() { closeModal(); toast('✗ '+id+' не прийнято: '+reason); renderView(); }
    if (newSt) {
      rpc('updateItemStatusById', [{ id: id, status: newSt, comment: 'Не прийнято: '+reason }], function(){
        it.status = newSt; fin();
      }, function(e){ fin(); toast('⚠ Статус не змінено: '+e.message, true); });
    } else fin();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '✗ Не прийняти'; }
    toast('❌ '+e.message, true);
  });
}

// Перемикач екіпажу: в екіпажі → прибрати з пулу, інакше → вибір екіпажу
function invCrewToggle(id) {
  var c = invItemCrew(id);
  if (c) invRemoveFromCrew(id, c.id);
  else invAddToCrew(id);
}

function invRemoveFromCrew(id, crewId) {
  var c = crewById(crewId);
  if (!c) return;
  // Визначаємо, в якому слоті екіпажу цей предмет
  var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  var eq = c.equip  ? c.equip.split('|').map(function(s){ return s.trim(); }).filter(Boolean)  : [];
  var patch = null, warn = '';
  if (dl.indexOf(id) !== -1) {
    var rest = dl.filter(function(x){ return x !== id; });
    if (!rest.length) warn = '\n⚠ Це останній борт у пулі — екіпаж лишиться без бортів.';
    patch = { drones: rest.join('|') };
  } else if (String(c.gnst||'').trim() === id) {
    patch = { gnst: '' };
  } else if (eq.indexOf(id) !== -1) {
    patch = { equip: eq.filter(function(x){ return x !== id; }).join('|') };
  }
  if (!patch) return;
  if (!confirm('✕ Прибрати '+id+' з екіпажу '+crewId+'?'+warn)) return;
  if (invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  rpc('updateCrew', [crewId, patch], function(){
    if (patch.drones !== undefined) c.drones = patch.drones;
    if (patch.gnst   !== undefined) c.gnst   = patch.gnst;
    if (patch.equip  !== undefined) c.equip  = patch.equip;
    delete invBusy[id];
    toast('✕ '+id+' прибрано з '+crewId);
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// Патч додавання предмета у відповідний слот екіпажу (null → потрібне підтвердження заміни наземки)
function invBuildAddPatch(it, c) {
  var slot = invSlotOf(it);
  if (slot === 'drone') {
    var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
    return { drones: dl.concat([it.id]).join('|') };
  }
  if (slot === 'gnst') {
    var cur = String(c.gnst||'').trim();
    if (cur && cur !== it.id && !confirm('📡 В екіпажі вже наземка '+cur+'. Замінити на '+it.id+'?')) return null;
    return { gnst: it.id };
  }
  var eq = c.equip ? c.equip.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  return { equip: eq.concat([it.id]).join('|') };
}

// Предмети інвентарю вибраного екіпажу (борти пулу + наземка + спорядження)
function invCrewItems() {
  var c = crewById(invCrewSel);
  if (!c) return [];
  var ids = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  if (c.gnst) ids.push(c.gnst.trim());
  if (c.equip) ids = ids.concat(c.equip.split('|').map(function(s){ return s.trim(); }).filter(Boolean));
  return S.items.filter(function(it){ return ids.indexOf(it.id) !== -1; });
}

// Трекери вибраного екіпажу — рядки з власним списком статусів
function invCrewTrackers() {
  var c = crewById(invCrewSel);
  if (!c || !c.tracker) return [];
  var ids = c.tracker.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
  return S.trackers.filter(function(t){ return ids.indexOf(t.id) !== -1; });
}

function invTrkStatusSelectHtml(t) {
  var cur = String(t.status||'').trim();
  var opts = TRK_STATUSES.map(function(s){
    return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';
  });
  if (cur && TRK_STATUSES.indexOf(cur) === -1) {
    opts.unshift('<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>');
  }
  var busy = invBusy[t.id] ? ' disabled' : '';
  return '<select class="inv-status-sel" data-id="'+esc(t.id)+'" onchange="invTrkChangeStatus(this)"'+busy+'>'+opts.join('')+'</select>';
}

// ✕ Прибрати трекер з пулу вибраного екіпажу
function invRemoveTrkFromCrew(id) {
  var c = crewById(invCrewSel);
  if (!c) return;
  var tl = (c.tracker||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
  if (tl.indexOf(id) === -1) return;
  var t = S.trackers.find(function(x){ return x.id === id; });
  if (!confirm('✕ Прибрати трекер '+((t&&t.imei)||id)+' з екіпажу '+c.id+'?')) return;
  if (invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  var patch = { tracker: tl.filter(function(x){ return x !== id; }).join('|') };
  rpc('updateCrew', [c.id, patch], function(){
    invApplyCrewPatch(c, patch);
    delete invBusy[id];
    toast('✕ Трекер прибрано з '+c.id);
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

function invTrkChangeStatus(sel) {
  var id = sel.dataset.id;
  var t = S.trackers.find(function(x){ return x.id === id; });
  if (!t) return;
  var newSt = sel.value;
  var oldSt = String(t.status||'').trim();
  if (newSt === oldSt) return;
  if (newSt === 'Втрачений' && !confirm('❗ Трекер '+id+' — ВТРАЧЕНИЙ? Це незворотньо, SIM теж стане втраченою.')) { sel.value = oldSt; return; }
  invBusy[id] = true; renderInvTable();
  rpc('updateSinotrackStatus', [id, newSt, ''], function(){
    t.status = newSt;
    delete invBusy[id];
    toast('📡 '+id+': '+oldSt+' → '+newSt);
    renderInvTable();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

function renderInvTable() {
  var q = invFilter.q.toLowerCase();
  var base = invBaseList();

  // Плитки дашборду синхронні з фільтрами (тип/пошук/вкладка)
  var stats = {};
  base.forEach(function(it){ var s = String(it.status||'').trim(); stats[s] = (stats[s]||0)+1; });
  if ($('stW'))   $('stW').textContent   = stats['Робочий'] || 0;
  if ($('stR'))   $('stR').textContent   = stats['Ремонт'] || 0;
  if ($('stB'))   $('stB').textContent   = (stats['Несправний']||0) + (stats['Втрачений']||0);
  if ($('stRes')) $('stRes').textContent = stats['Резерв'] || 0;

  var list = base.filter(function(it){ return invStatusMatch(it.status); });
  var edit = invMode === 'edit' && !!S.invCaps;
  var showActs = edit;

  var head = '<thead><tr><th>ID'+(showActs?' / дії':'')+'</th><th>Назва</th><th>Тип</th><th>Закріплення</th><th>Статус</th><th>Відповідальний</th><th>Дата</th><th>Компл.</th><th>Примітка</th></tr></thead>';
  var cols = 9;

  var rows = list.map(function(it){
    return '<tr><td class="mono accent">'+esc(it.id)+(showActs ? invActionsHtml(it) : '')+'</td>'+
      '<td>'+esc(it.name)+'</td><td class="mono">'+esc(it.type)+'</td>'+
      '<td>'+esc(it.assignment)+'</td>'+
      '<td>'+(edit ? invStatusSelectHtml(it) : statusChip(it.status))+
        (it.accepted === 'Не прийнято'
          ? '<div class="accept-badge accept-no" title="'+esc(it.acceptReason||'')+'">НЕ ПРИЙНЯТИЙ'+(it.acceptReason?': '+esc(it.acceptReason):'')+'</div>'
          : (it.accepted === 'Прийнято' ? '<div class="accept-badge accept-yes">✓ прийнято</div>' : ''))+
      '</td>'+
      '<td>'+esc(it.responsible)+'</td>'+
      '<td class="mono">'+esc(it.date||'')+'</td>'+
      '<td class="mono">'+esc(it.kit)+'</td>'+
      '<td class="mono" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(it.note||'')+'">'+esc(it.note||'')+'</td>'+
    '</tr>';
  }).join('');

  // Вкладка екіпажу: додаємо рядки GPS трекерів екіпажу (свій список статусів)
  if (invTab === 'crew') {
    var trks = invCrewTrackers().filter(function(t){
      if (q && ((t.imei||'')+' '+t.id+' '+(t.model||'')).toLowerCase().indexOf(q) === -1) return false;
      if (!invStatusMatch(t.status)) return false;
      return true;
    });
    rows += trks.map(function(t){
      var c = crewById(invCrewSel);
      var bind = t.binding ? 'Борт '+t.binding : (c ? c.id : '');
      // Дії трекера: ✕ прибрати з екіпажу (адмін) — та сама логіка, що й у предметів
      var trkActs = '';
      if (showActs && invIsAdmin()) {
        trkActs = invBusy[t.id]
          ? '<span class="hint">⏳</span>'
          : '<div class="inv-acts"><button class="inv-act inv-act--crew" title="Прибрати трекер з екіпажу" onclick="invRemoveTrkFromCrew(this.dataset.id)" data-id="'+esc(t.id)+'">'+svgIcon('x')+'</button></div>';
      }
      return '<tr><td class="mono accent">'+esc(t.imei||t.id)+trkActs+'</td><td>'+esc(t.model||'')+'</td><td class="mono">GPS Трекер</td>'+
        '<td>'+esc(bind)+'</td>'+
        '<td>'+(edit ? invTrkStatusSelectHtml(t) : statusChip(t.status))+'</td>'+
        '<td></td>'+
        '<td class="mono"></td>'+
        '<td class="mono">'+esc(t.simContact||'')+'</td>'+
        '<td class="mono" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.note||'')+'">'+esc(t.note||'')+'</td>'+
      '</tr>';
    }).join('');
  }

  $('invTable').innerHTML = head+
    '<tbody>'+(rows || '<tr><td colspan="'+cols+'" class="empty">Нічого не знайдено</td></tr>')+'</tbody>';
}

// ── Зміна статусу (випадаючий список у рядку) ──
function invChangeStatus(sel) {
  var id = sel.dataset.id;
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  var newSt = sel.value;
  var oldSt = String(it.status||'').trim();
  if (newSt === oldSt) return;
  if (newSt === 'Втрачений') { sel.value = oldSt; openLostModal(id); return; }
  if (newSt === 'Списаний' && !confirm('📉 Списати '+id+'? Відповідальний очиститься.')) { sel.value = oldSt; return; }
  invBusy[id] = true; renderInvTable();
  rpc('updateItemStatusById', [{ id:id, status:newSt }], function(){
    it.status = newSt;
    if (newSt === 'Списаний') it.responsible = '';
    delete invBusy[id];
    toast('✅ '+id+': '+oldSt+' → '+newSt);
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// ── Втрата: модалка з деталями ──
function openLostModal(id) {
  openModal('❌ Втрата: '+esc(id),
    '<div class="f"><label>📍 Координати</label><input type="text" id="lmCoords" placeholder="напр. 48.123, 35.456"></div>'+
    '<div class="f"><label>🗺 Посилання з трекера</label><input type="text" id="lmLink" placeholder="необов\'язково"></div>'+
    '<div class="f"><label>📋 Обставини втрати</label><input type="text" id="lmCirc" placeholder="необов\'язково"></div>'+
    '<div class="hint">⚠️ Прив\'язаний трекер і його SIM теж стануть втраченими</div>'+
    '<button class="btn btn-red" id="lmBtn" onclick="doMarkLost(\''+esc(id)+'\')" style="margin-top:8px">❌ Підтвердити втрату</button>'
  );
}
function doMarkLost(id) {
  var btn = $('lmBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ Запис…'; }
  var lost = { coords: $('lmCoords').value.trim(), mapsLink: $('lmLink').value.trim(), conditions: $('lmCirc').value.trim() };
  rpc('updateItemStatusById', [{ id:id, status:'Втрачений', lostData: lost }], function(){
    var it = S.items.find(function(x){ return x.id === id; });
    if (it) it.status = 'Втрачений';
    toast('❌ '+id+' позначено втраченим');
    closeModal(); loadAll();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '❌ Підтвердити втрату'; }
    toast('❌ '+e.message, true);
  });
}

// ── Видалення з обліку (адмін) ──
function invDelete(id) {
  var reason = prompt('🗑 Видалити '+id+' з обліку БЕЗПОВОРОТНО?\nВкажи причину:', '');
  if (reason === null) return;
  if (invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  rpc('webDeleteInventoryItem', [id, reason.trim()], function(){
    S.items = S.items.filter(function(x){ return x.id !== id; });
    delete invBusy[id];
    toast('🗑 '+id+' видалено з обліку');
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// ── Додати предмет до екіпажу (адмін): вибір екіпажу ──
function invAddToCrew(id) {
  var crews = activeCrews();
  if (!crews.length) { toast('⚠ Немає активних екіпажів', true); return; }
  var cur = invItemCrew(id);
  var opts = crews.map(function(c){
    var dl = c.drones ? c.drones.split('|').filter(Boolean) : [];
    var inCrew = cur && cur.id === c.id;
    return '<option value="'+esc(c.id)+'"'+(inCrew?' disabled':'')+'>'+esc(c.id)+(c.bind?' ['+esc(c.bind)+']':'')+' — '+dl.length+' борт.'+(inCrew?' (вже там)':'')+'</option>';
  }).join('');
  openModal('👥 '+esc(id)+' → екіпаж',
    '<div class="f"><label>Екіпаж</label><select id="acCrew">'+opts+'</select></div>'+
    '<button class="btn btn-green" id="acBtn" onclick="doAddToCrew(\''+esc(id)+'\')">➕ Додати в екіпаж</button>'
  );
}

// Патч прибирання предмета з відповідного слоту екіпажу
function invBuildRemovePatch(id, c) {
  var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  var eq = c.equip  ? c.equip.split('|').map(function(s){ return s.trim(); }).filter(Boolean)  : [];
  if (dl.indexOf(id) !== -1) return { drones: dl.filter(function(x){ return x !== id; }).join('|') };
  if (String(c.gnst||'').trim() === id) return { gnst: '' };
  if (eq.indexOf(id) !== -1) return { equip: eq.filter(function(x){ return x !== id; }).join('|') };
  return null;
}

function invApplyCrewPatch(c, patch) {
  if (patch.drones !== undefined) c.drones = patch.drones;
  if (patch.gnst   !== undefined) c.gnst   = patch.gnst;
  if (patch.equip  !== undefined) c.equip  = patch.equip;
  if (patch.tracker!== undefined) c.tracker= patch.tracker;
}
function doAddToCrew(id) {
  var crewId = $('acCrew').value;
  var c = crewById(crewId);
  if (!c) { toast('❌ Екіпаж не знайдено', true); return; }
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  if (invItemCrew(id) && invItemCrew(id).id === crewId) { toast('⚠ '+id+' вже в '+crewId, true); return; }
  var patch = invBuildAddPatch(it, c);
  if (!patch) return;
  var btn = $('acBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ Запис…'; }
  rpc('updateCrew', [crewId, patch], function(){
    if (patch.drones !== undefined) c.drones = patch.drones;
    if (patch.gnst   !== undefined) c.gnst   = patch.gnst;
    if (patch.equip  !== undefined) c.equip  = patch.equip;
    toast('✅ '+id+' додано до '+crewId);
    closeModal(); renderView();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '➕ Додати в екіпаж'; }
    toast('❌ '+e.message, true);
  });
}

// ── Додати до вибраного екіпажу (кнопка на вкладці екіпажу) ──
// Пошук по всьому інвентарю (борти, наземки, щогли, екрани…) + Sinotrack трекери.
// Предмет з іншого екіпажу позначений 🔒 і переводиться з підтвердженням.
function invAddDroneToCrewModal() {
  var c = crewById(invCrewSel);
  if (!c) { toast('⚠ Обери екіпаж', true); return; }
  openModal('➕ Додати → '+esc(invCrewSel),
    '<div class="f"><label>Пошук (ID або назва)</label>'+
      '<div class="ac-wrap">'+
        '<input type="text" id="adSearch" placeholder="борт, наземка, трекер, щогла, екран…" oninput="invAdFilter()" onfocus="invAdFilter()" autocomplete="off">'+
        '<div class="ac-list" id="adDd"></div>'+
      '</div>'+
    '</div>'+
    '<div class="hint">🔒 предмет з іншого екіпажу — вибір запропонує перевести його сюди</div>'
  );
  setTimeout(function(){ var i = $('adSearch'); if (i) { i.focus(); invAdFilter(); } }, 60);
}

// В якому активному екіпажі зараз трекер
function invTrackerCrew(id) {
  return activeCrews().find(function(c){
    return (c.tracker||'').split('|').map(function(s){ return s.trim(); }).indexOf(id) !== -1;
  }) || null;
}

function invAdFilter() {
  var dd = $('adDd');
  if (!dd) return;
  var q = $('adSearch').value.toLowerCase().trim();
  var c = crewById(invCrewSel);
  if (!c) return;
  var inThis = (c.drones||'').split('|').concat((c.equip||'').split('|'), [c.gnst||''])
    .map(function(s){ return s.trim(); }).filter(Boolean);
  var thisTrks = (c.tracker||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean);

  // Інвентар: усі типи, крім тих що вже в цьому екіпажі
  var items = S.items.filter(function(it){
    return inThis.indexOf(it.id) === -1 &&
      (!q || it.id.toLowerCase().indexOf(q) !== -1 || it.name.toLowerCase().indexOf(q) !== -1);
  }).slice(0, 9);
  // Sinotrack трекери, крім тих що вже в цьому екіпажі
  var trks = S.trackers.filter(function(t){
    return thisTrks.indexOf(t.id) === -1 &&
      (!q || t.id.toLowerCase().indexOf(q) !== -1 || (t.imei||'').toLowerCase().indexOf(q) !== -1 ||
       (t.model||'').toLowerCase().indexOf(q) !== -1);
  }).slice(0, 5);

  if (!items.length && !trks.length) { dd.style.display = 'none'; return; }
  var html = items.map(function(it){
    var other = invItemCrew(it.id);
    return '<div class="ac-item" onmousedown="invAdPick(this.dataset.id, \'item\')" data-id="'+esc(it.id)+'">'+
      '<div class="ac-id">'+esc(it.id)+' — '+esc(it.name)+
        (other ? ' <span style="color:var(--accent)">🔒 '+esc(other.id)+'</span>' : '')+
      '</div>'+
      '<div class="ac-meta">'+esc(it.status)+
        (it.assignment ? ' · '+esc(it.assignment) : '')+
        (it.responsible ? ' · 👤 '+esc(it.responsible) : '')+
      '</div>'+
    '</div>';
  }).join('');
  html += trks.map(function(t){
    var other = invTrackerCrew(t.id);
    return '<div class="ac-item" onmousedown="invAdPick(this.dataset.id, \'trk\')" data-id="'+esc(t.id)+'">'+
      '<div class="ac-id">📡 '+esc(t.imei||t.id)+' — '+esc(t.model||'')+
        (other ? ' <span style="color:var(--accent)">🔒 '+esc(other.id)+'</span>' : '')+
      '</div>'+
      '<div class="ac-meta">'+esc(t.status)+
        (t.simContact ? ' · '+esc(t.simContact) : ' · без SIM')+
        (t.binding ? ' · борт '+esc(t.binding) : '')+
      '</div>'+
    '</div>';
  }).join('');
  dd.innerHTML = html;
  dd.style.display = 'block';
}

function invAdPick(id, kind) {
  var target = crewById(invCrewSel);
  if (!target || invBusy[id]) return;

  if (kind === 'trk') {
    // ── Sinotrack трекер → пул трекерів екіпажу ──
    var tl = (target.tracker||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    if (tl.indexOf(id) !== -1) { toast('⚠ '+id+' вже в '+target.id, true); return; }
    var otherC = invTrackerCrew(id);
    function addTrk() {
      var patch = { tracker: tl.concat([id]).join('|') };
      rpc('updateCrew', [target.id, patch], function(){
        invApplyCrewPatch(target, patch);
        delete invBusy[id];
        toast('📡 '+id+' додано до '+target.id);
        closeModal(); renderView();
      }, function(e){ delete invBusy[id]; toast('❌ '+e.message, true); });
    }
    if (otherC) {
      if (!confirm('🔒 Трекер '+id+' зараз в екіпажі '+otherC.id+'.\nПеревести в '+target.id+'?')) return;
      invBusy[id] = true;
      var rest = (otherC.tracker||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean)
        .filter(function(x){ return x !== id; }).join('|');
      rpc('updateCrew', [otherC.id, { tracker: rest }], function(){
        otherC.tracker = rest;
        addTrk();
      }, function(e){ delete invBusy[id]; toast('❌ '+e.message, true); });
    } else {
      invBusy[id] = true;
      addTrk();
    }
    return;
  }

  // ── Предмет інвентарю → відповідний слот (борт / наземка / спорядження) ──
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  var cur = invItemCrew(id);
  if (cur && cur.id === target.id) { toast('⚠ '+id+' вже в '+target.id, true); return; }

  function addItem() {
    var patch = invBuildAddPatch(it, target);
    if (!patch) { delete invBusy[id]; return; }
    rpc('updateCrew', [target.id, patch], function(){
      invApplyCrewPatch(target, patch);
      delete invBusy[id];
      toast('✅ '+id+' додано до '+target.id);
      closeModal(); renderView();
    }, function(e){ delete invBusy[id]; toast('❌ '+e.message, true); });
  }

  if (cur) {
    if (!confirm('🔒 '+id+' зараз в екіпажі '+cur.id+'.\nПеревести в '+target.id+'?')) return;
    var rm = invBuildRemovePatch(id, cur);
    if (!rm) return;
    invBusy[id] = true;
    rpc('updateCrew', [cur.id, rm], function(){
      invApplyCrewPatch(cur, rm);
      addItem();
    }, function(e){ delete invBusy[id]; toast('❌ '+e.message, true); });
  } else {
    invBusy[id] = true;
    addItem();
  }
}

/* ═══════════ ВИД: ЕКІПАЖ (управління екіпажами) ═══════════ */
var crewForm = { drones: [], trackers: [], reserves: [], editId: null };
var crewPageTab = 'staff';  // 'staff' — загальний О.С. | 'links' — активні з'єднання
var crewPageSel = '';       // екіпаж основної таблиці (тулбар вкладки зʼєднань)
var sideCrewSel = '';       // окремий вибір у боковій панелі — лише для перегляду складу
var sidePanelOpen = { list: true, comp: false }; // склад за замовчуванням згорнутий

// Чи можна вибрати екіпаж у боковому переліку (свій/вибраний — ні, щоб не дублювати)
function sideCrewClickable(id) {
  if (S.auth && !isAdminUser() && S.auth.crewId === id) return false;                 // «мій» оператора
  if (isAdminUser() && crewPageTab === 'links' && crewPageSel === id) return false;   // «вибраний» адміна
  return true;
}
function sideCrewBadge(id) {
  if (S.auth && !isAdminUser() && S.auth.crewId === id) return '<span class="badge-main">мій</span>';
  if (isAdminUser() && crewPageTab === 'links' && crewPageSel === id) return '<span class="badge-main">вибраний</span>';
  return '';
}
function sideCrewPick(id) {
  if (!sideCrewClickable(id)) return;
  sideCrewSel = id;
  sidePanelOpen.comp = true;
  renderView();
}

function sidePanelToggle(key) { sidePanelOpen[key] = !sidePanelOpen[key]; renderView(); }
function sidePanelHead(key, title, extra) {
  return '<div class="side-panel-head" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="sidePanelToggle(\''+key+'\')">'+
    '<span>'+title+'</span>'+
    '<span style="display:flex;align-items:center;gap:8px">'+(extra || '')+'<span>'+(sidePanelOpen[key] ? '▴' : '▾')+'</span></span></div>';
}

var staffFilter = { q: '', mode: 'all' };  // all | crewed | free | reserve
var staffEdit = false;                     // перегляд / редагування списку О.С.

function renderCrews(c) {
  // Без входу (і без адмін-прав) — тільки кнопка входу
  if (!isAdminUser() && !S.auth) {
    c.innerHTML = '<div class="view-title">Управління <span class="accent">екіпажами</span></div>'+
      '<div class="view-sub">Ресурсний модуль · розподіл особового складу</div>'+
      loginGateHtml('Екран екіпажу');
    return;
  }
  var crews = activeCrews();
  // Оператор завжди працює зі своїм екіпажем; адмін вибирає в тулбарі
  if (S.auth && !isAdminUser()) {
    crewPageSel = S.auth.crewId || '';
  } else if (!crewPageSel || !crews.find(function(x){ return x.id === crewPageSel; })) {
    crewPageSel = crews[0] ? crews[0].id : '';
  }
  // Боковий вибір складу: скинути, якщо екіпаж зник або став невибірним
  if (sideCrewSel && (!crews.find(function(x){ return x.id === sideCrewSel; }) || !sideCrewClickable(sideCrewSel))) {
    sideCrewSel = '';
    sidePanelOpen.comp = false;
  }

  // Плитки розділу
  var totalOS  = S.personnel.length;
  var inCrews  = S.personnel.filter(function(p){ return p.crewId; }).length;
  var reserve  = S.personnel.filter(function(p){ return p.status === 'Резерв' || p.status === 'Відпочинок'; }).length;

  var html = '<div class="flex-head" style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px">'+
    '<div><div class="view-title">Управління <span class="accent">екіпажами</span></div>'+
    '<div class="view-sub">Ресурсний модуль · розподіл особового складу</div></div>'+
    '<div style="margin-bottom:12px"><input type="text" id="staffSearch" placeholder="Пошук персоналу…" value="'+esc(staffFilter.q)+'" '+
      'oninput="staffFilter.q=this.value;renderStaffInto()" style="width:220px"></div>'+
  '</div>'+
    '<div class="stat-row">'+
      '<div class="stat-tile blue click'+(crewPageTab==='staff'&&staffFilter.mode==='all'?' active':'')+'" onclick="crewPageTab=\'staff\';staffFilter.mode=\'all\';renderView()"><div class="stat-num">'+totalOS+'</div><div class="stat-lbl">Загальний О.С.</div></div>'+
      '<div class="stat-tile click'+(crewPageTab==='links'?' active':'')+'" onclick="crewPageTab=\'links\';renderView()" title="Активні з\'єднання"><div class="stat-num">'+crews.length+'</div><div class="stat-lbl">Активні екіпажі</div></div>'+
      '<div class="stat-tile green click'+(crewPageTab==='staff'&&staffFilter.mode==='crewed'?' active':'')+'" onclick="crewPageTab=\'staff\';staffFilter.mode=\'crewed\';renderView()"><div class="stat-num">'+inCrews+'</div><div class="stat-lbl">В екіпажах</div></div>'+
      '<div class="stat-tile red click'+(crewPageTab==='staff'&&staffFilter.mode==='reserve'?' active':'')+'" onclick="crewPageTab=\'staff\';staffFilter.mode=\'reserve\';renderView()"><div class="stat-num">'+reserve+'</div><div class="stat-lbl">Резерв О.С.</div></div>'+
    '</div>'+
    '<div class="inv-tabs">'+
      '<button class="inv-tab'+(crewPageTab==='staff'?' active':'')+'" onclick="crewPageTab=\'staff\';renderView()">Загальний О.С.</button>'+
      '<button class="inv-tab'+(crewPageTab==='links'?' active':'')+'" onclick="crewPageTab=\'links\';renderView()">Активні з\'єднання</button>'+
    '</div>';

  // Основний layout: зліва контент вкладки, справа бічна панель (перелік + склад)
  html += '<div class="crew-layout"><div id="crewMain">';
  html += crewPageTab === 'staff' ? renderStaffMain() : renderLinksMain();
  html += '</div><div class="crew-side">';
  // Бічна панель: перелік екіпажів (згортається)
  html += '<div class="side-panel">'+sidePanelHead('list', '🗂 Перелік екіпажів');
  if (sidePanelOpen.list) {
    html += '<div class="side-panel-body">';
    html += crews.length ? crews.map(function(cr){
      var n = (cr.main ? 1 : 0) + (cr.members||'').split('|').filter(Boolean).length;
      var clickable = sideCrewClickable(cr.id);
      var badge = sideCrewBadge(cr.id);
      return '<div class="crew-pick'+(cr.id===sideCrewSel?' active':'')+'"'+
        (clickable
          ? ' onclick="sideCrewPick(\''+esc(cr.id)+'\')"'
          : ' style="cursor:default;opacity:.85"')+'>'+
        '<div><div class="cp-name">'+esc(cr.crewName || cr.id)+' '+badge+'</div>'+
        '<div class="cp-sub">'+esc(cr.id)+' · 👤 '+(cr.main ? esc(personLabel(cr.main)) : 'без головного')+'</div></div>'+
        '<span class="cp-sub">'+n+' оп.</span>'+
      '</div>';
    }).join('') : '<div class="empty">Активних екіпажів немає</div>';
    html += '</div>';
  }
  html += '</div>';
  // Бічна панель: склад вибраного екіпажу
  html += renderCrewComposition();
  html += '</div></div>';

  c.innerHTML = html;
  if (crewPageTab === 'staff') renderStaffInto();
}

// ── Ліва частина, вкладка «Увесь О.С.» ──
function renderStaffMain() {
  var actions = isAdminUser()
    ? '<div class="staff-actions">'+
        '<div class="inv-mode">'+
          '<button class="inv-mode-btn'+(!staffEdit?' active':'')+'" onclick="staffEdit=false;renderView()">Перегляд</button>'+
          '<button class="inv-mode-btn'+(staffEdit?' active':'')+'" onclick="staffEdit=true;renderView()">Редагування</button>'+
        '</div>'+
        (staffEdit
          ? '<button class="icon-btn" title="Додати особу" style="background:var(--accent);color:var(--on-accent)" onclick="admEditPerson(\'\')">'+svgIcon('personAdd')+'</button>'
          : '')+
      '</div>'
    : '';
  return '<div class="staff-bar">'+
      '<label>Фільтр списку:</label>'+
      '<select onchange="staffFilter.mode=this.value;renderView()">'+
        [['all','Усі'],['crewed','В екіпажах'],['free','Без екіпажу'],['reserve','Резерв / відпочинок']].map(function(o){
          return '<option value="'+o[0]+'"'+(staffFilter.mode===o[0]?' selected':'')+'>'+o[1]+'</option>';
        }).join('')+
      '</select>'+
      actions+
    '</div>'+
    '<div class="table-wrap"><table class="data-table" id="staffTable"></table></div>';
}

// ── Статуси особового складу ──
var PERSON_STATUSES = ['Активний','Відпочинок','Резерв'];
function personStatusChip(st) {
  st = String(st||'').trim();
  var cls = st === 'Активний' ? 'st-green' : (st === 'Відпочинок' ? 'st-yellow' : (st === 'Резерв' ? 'st-orange' : 'st-grey'));
  return '<span class="st-chip '+cls+'">'+esc(st||'—')+'</span>';
}
function personStatusSelect(p) {
  var cur = String(p.status||'').trim();
  var opts = PERSON_STATUSES.map(function(s){
    return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';
  });
  if (cur && PERSON_STATUSES.indexOf(cur) === -1) opts.unshift('<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>');
  return '<select class="inv-status-sel" style="width:auto;min-width:96px" data-op="'+esc(p.id)+'" onchange="crewChangePersonStatus(this)">'+opts.join('')+'</select>';
}
function crewChangePersonStatus(sel) {
  var opId = sel.dataset.op, st = sel.value;
  rpc('setPersonStatus', [opId, st, crewToken() || undefined], function(){
    var p = personById(opId); if (p) p.status = st;
    if (S.auth && S.auth.id === opId) S.auth.status = st;
    toast('💾 Статус: '+st);
  }, function(e){ toast('❌ '+e.message, true); renderView(); });
}

// Призначене обладнання особи — предмети, де вона відповідальна
function personEquipment(p) {
  return S.items.filter(function(it){
    return it.responsible && it.responsible.trim().toLowerCase() === p.callsign.toLowerCase();
  }).map(function(it){ return it.id; });
}

function staffList() {
  var q = staffFilter.q.toLowerCase().trim();
  return S.personnel.filter(function(p){
    if (staffFilter.mode === 'crewed' && !p.crewId) return false;
    if (staffFilter.mode === 'free' && p.crewId) return false;
    if (staffFilter.mode === 'reserve' && p.status !== 'Резерв' && p.status !== 'Відпочинок') return false;
    if (q && (p.id+' '+p.callsign+' '+p.name+' '+p.role).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

function renderStaffInto() {
  var t = $('staffTable');
  if (!t) return;
  var edit = staffEdit && isAdminUser();
  var rows = staffList().map(function(p){
    var eq = personEquipment(p);
    return '<tr><td class="mono accent">'+esc(p.id)+
      (edit ? '<div class="inv-acts">'+
        '<button class="inv-act" title="Редагувати" onclick="admEditPerson(this.dataset.id)" data-id="'+esc(p.id)+'">'+svgIcon('edit')+'</button>'+
        '<button class="inv-act inv-act--del" title="Видалити" onclick="admDeletePerson(this.dataset.id)" data-id="'+esc(p.id)+'">'+svgIcon('trash')+'</button>'+
      '</div>' : '')+'</td>'+
      '<td><b>'+esc(p.callsign)+'</b>'+(p.name ? '<div class="member-name">'+esc(p.name)+'</div>' : '')+'</td>'+
      '<td class="mono">'+esc(p.role || '—')+'</td>'+
      '<td>'+(edit ? personStatusSelect(p) : personStatusChip(p.status))+'</td>'+
      '<td class="mono" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(eq.join(', '))+'">'+
        (eq.length ? esc(eq.join(', ')) : '<span class="hint">—</span>')+'</td>'+
      '<td>'+(p.crewId
        ? esc(p.crewName || p.crewId)+(p.isMain ? ' <span class="badge-main">Головний</span>' : '')
        : '<span class="hint">—</span>')+'</td></tr>';
  }).join('');
  t.innerHTML = '<thead><tr><th>ID</th><th>Позивний / Ім\'я</th><th>Роль</th><th>Статус</th><th>Призначене обладнання</th><th>Екіпаж</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="6" class="empty">Нічого не знайдено</td></tr>')+'</tbody>';
}

// ── Ліва частина, вкладка «Активні з'єднання» ──
var crewEdit = false; // перегляд / редагування складу на вкладці зʼєднань

function renderLinksMain() {
  var crews = activeCrews();
  var cr = crewById(crewPageSel);
  var canMg = cr ? canManageCrew(cr.id) : false;

  // Тулбар: вибір екіпажу + перегляд/редагування + 👤⁺ (тільки адмін)
  var crewOpts = crews.map(function(c2){
    return '<option value="'+esc(c2.id)+'"'+(c2.id===crewPageSel?' selected':'')+'>'+esc(c2.crewName || c2.id)+'</option>';
  }).join('');
  // Оператор привʼязаний до свого екіпажу — випадаючого списку немає, лише позначка «мій».
  // Адмін вибирає екіпаж; якщо він був вибраний у боковій панелі — та згортається (не дублюємо).
  var crewPicker;
  if (S.auth && !isAdminUser()) {
    crewPicker = cr
      ? '<span class="cp-name" style="font-family:var(--font-data)">'+esc(cr.crewName || cr.id)+' <span class="badge-main">мій</span></span>'
      : '<span class="hint">Ти не привʼязаний до екіпажу</span>';
  } else {
    crewPicker = crews.length
      ? '<select onchange="crewPageSel=this.value;if(sideCrewSel===crewPageSel){sideCrewSel=\'\';sidePanelOpen.comp=false;}renderView()">'+crewOpts+'</select>'
      : '<span class="hint">Немає активних екіпажів</span>';
  }
  var h = '<div class="staff-bar">'+
    '<label>'+(S.auth && !isAdminUser() ? 'Екіпаж:' : 'Вибір екіпажу:')+'</label>'+
    crewPicker+
    '<div class="staff-actions">'+
      // Адмін бачить перемикач завжди (інакше з нулем екіпажів не увімкнути
      // редагування і не створити перший екіпаж), головний — для свого екіпажу
      (isAdminUser() || canMg
        ? '<div class="inv-mode">'+
            '<button class="inv-mode-btn'+(!crewEdit?' active':'')+'" onclick="crewEdit=false;renderView()">Перегляд</button>'+
            '<button class="inv-mode-btn'+(crewEdit?' active':'')+'" onclick="crewEdit=true;renderView()">Редагування</button>'+
          '</div>'
        : '')+
      (isAdminUser() && crewEdit
        ? '<button class="icon-btn" title="Створити екіпаж" style="background:var(--accent);color:var(--on-accent)" onclick="openCrewForm(\'\')">'+svgIcon('plus')+'</button>'
        : '')+
    '</div>'+
  '</div>';

  if (!cr) return h + '<div class="empty">Оберіть екіпаж</div>';

  // Таблиця членів вибраного екіпажу
  var ids = (cr.main ? [cr.main] : []).concat(crewMembersArr(cr));
  var rows = ids.map(function(opId){
    var isMain = opId === cr.main;
    var p = personById(opId);
    var eq = p ? personEquipment(p) : [];
    var canRole = crewEdit && (canMg || (S.auth && S.auth.id === opId));
    var roleCell;
    var curRole = p ? p.role : '';
    if (canRole) {
      var opts = PERSON_ROLES.map(function(r){
        return '<option value="'+esc(r)+'"'+(r===curRole?' selected':'')+'>'+esc(r)+'</option>';
      }).join('');
      if (curRole && PERSON_ROLES.indexOf(curRole) === -1) opts = '<option value="'+esc(curRole)+'" selected>'+esc(curRole)+'</option>' + opts;
      roleCell = '<select class="inv-status-sel" style="width:auto;min-width:92px" data-op="'+esc(opId)+'" onchange="crewChangeRole(this)">'+
        '<option value=""'+(curRole?'':' selected')+'>— роль —</option>'+opts+'</select>';
    } else {
      roleCell = '<span class="mono">'+esc(isMain ? (curRole ? curRole+' / ' : '')+'Командир екіпажу' : (curRole || '—'))+'</span>';
    }
    // Дії — під ID, у стилі позначок з інвентарю
    var acts = '';
    if (crewEdit && canMg) {
      acts = '<div class="inv-acts">'+
        (isAdminUser() ? '<button class="inv-act" title="Редагувати особу" onclick="admEditPerson(this.dataset.op)" data-op="'+esc(opId)+'">'+svgIcon('edit')+'</button>' : '')+
        (!isMain ? '<button class="inv-act inv-act--crew" title="Зробити головним відповідальним" onclick="crewSetMain(this.dataset.op)" data-op="'+esc(opId)+'">'+svgIcon('star')+'</button>' : '')+
        (!isMain ? '<button class="inv-act inv-act--del" title="Прибрати з екіпажу" onclick="crewRemoveMember(this.dataset.op)" data-op="'+esc(opId)+'">'+svgIcon('x')+'</button>' : '')+
      '</div>';
    }
    var canStatus = crewEdit && p && (canMg || (S.auth && S.auth.id === opId));
    return '<tr><td class="mono accent">'+esc(opId)+acts+'</td>'+
      '<td><b>'+esc(p ? p.callsign : opId)+'</b>'+(isMain?' <span class="badge-main">Головний</span>':'')+
        (p && p.name ? '<div class="member-name">'+esc(p.name)+'</div>' : '')+'</td>'+
      '<td>'+roleCell+'</td>'+
      '<td>'+(canStatus ? personStatusSelect(p) : personStatusChip(p ? p.status : ''))+'</td>'+
      '<td class="mono" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(eq.join(', '))+'">'+
        (eq.length ? esc(eq.join(', ')) : '<span class="hint">—</span>')+'</td></tr>';
  }).join('');

  h += '<div class="table-wrap"><table class="data-table">'+
    '<thead><tr><th>ID</th><th>Позивний / Ім\'я</th><th>Роль</th><th>Статус</th><th>Призначене обладнання</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="5" class="empty">Склад порожній'+(isAdminUser()?' — додай членів кнопкою 👤⁺ у режимі редагування':'')+'</td></tr>')+'</tbody></table></div>';

  return h;
}

// ── Склад вибраного екіпажу ──
// Бокова панель складу — суто інформаційна (редагування — в основній таблиці).
// Показує екіпаж, вибраний у боковому переліку (sideCrewSel), а не в тулбарі.
function renderCrewComposition() {
  var cr = sideCrewSel ? crewById(sideCrewSel) : null;
  var h = '<div class="side-panel">'+sidePanelHead('comp', '👥 Склад екіпажу'+(cr ? ' ('+esc(cr.crewName || cr.id)+')' : ''));
  if (!sidePanelOpen.comp) return h + '</div>';
  h += '<div class="side-panel-body">';
  if (!cr) return h + '<div class="empty">Оберіть екіпаж у переліку вище</div></div></div>';
  function row(opId, isMain) {
    var p = personById(opId);
    return '<div class="member-row'+(isMain?' member-main':'')+'">'+
      '<div style="flex:1"><div class="member-cs">'+esc(p ? p.callsign : opId)+
        (isMain ? ' <span class="badge-main">Головний</span>' : '')+'</div>'+
      '<div class="member-name">'+esc(p && p.name || '')+
        (p && p.status && p.status !== 'Активний' ? ' · '+esc(p.status) : '')+'</div></div>'+
      '<span class="member-role">'+esc(p && p.role || '')+'</span>'+
    '</div>';
  }
  if (cr.main) h += row(cr.main, true);
  else h += '<div class="hint" style="margin-bottom:6px">⚠ Головного не призначено</div>';
  (cr.members||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(op){
    h += row(op, false);
  });
  h += '</div></div>';
  return h;
}

// ── Операції зі складом ──
function crewMembersArr(cr) { return (cr.members||'').split('|').map(function(s){ return s.trim(); }).filter(Boolean); }

function crewSaveMembers(cr, patch, okMsg) {
  rpc('updateCrew', [cr.id, patch, crewToken() || undefined], function(){
    if (patch.members !== undefined) cr.members = patch.members;
    if (patch.main    !== undefined) cr.main    = patch.main;
    toast(okMsg);
    // Оновити привʼязку в локальному персоналі + власну сесію
    refreshPersonnelCrewLinks();
    if (S.auth) rpc('authWhoAmI', [authToken()], function(op){ if (op && op.id) S.auth = op; renderView(); }, function(){ renderView(); });
    else renderView();
    loadAll();
  }, function(e){ toast('❌ '+e.message, true); renderView(); });
}

// Перерахувати crewId/isMain у S.personnel з локальних даних екіпажів
function refreshPersonnelCrewLinks() {
  var crews = activeCrews();
  S.personnel.forEach(function(p){
    p.crewId = ''; p.crewName = ''; p.isMain = false;
    crews.forEach(function(cr){
      if (cr.main === p.id) { p.crewId = cr.id; p.crewName = cr.crewName || ''; p.isMain = true; }
      else if (crewMembersArr(cr).indexOf(p.id) !== -1) { p.crewId = cr.id; p.crewName = cr.crewName || ''; }
    });
  });
}

function crewAddMemberModal() {
  var cr = crewById(crewPageSel);
  if (!cr) return;
  var inCrew = crewMembersArr(cr).concat(cr.main ? [cr.main] : []);
  var list = S.personnel.filter(function(p){ return inCrew.indexOf(p.id) === -1; });
  if (!list.length) { toast('⚠ Немає вільних осіб — додай персонал у налаштуваннях', true); return; }
  var opts = list.map(function(p){
    var locked = p.crewId && p.crewId !== cr.id;
    return '<option value="'+esc(p.id)+'"'+((locked && !isAdminUser())?' disabled':'')+'>'+
      esc(p.callsign)+(p.name?' ('+esc(p.name)+')':'')+(locked?' 🔒 '+esc(p.crewName||p.crewId):'')+'</option>';
  }).join('');
  openModal('➕ Член екіпажу → '+esc(cr.crewName || cr.id),
    '<div class="f"><label>Особа</label><select id="cmSel">'+opts+'</select>'+
    '<div class="hint">🔒 — особа в іншому екіпажі'+(isAdminUser()?' (адмін може перевести)':' (переводить адмін)')+'</div></div>'+
    '<button class="btn btn-green" id="cmBtn" onclick="crewPickMember()">➕ Додати</button>'
  );
}

function crewPickMember() {
  var cr = crewById(crewPageSel);
  var opId = $('cmSel').value;
  var p = personById(opId);
  if (!cr || !p) return;
  var btn = $('cmBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  function addHere() {
    var patch = cr.main ? { members: crewMembersArr(cr).concat([opId]).join('|') } : { main: opId };
    crewSaveMembers(cr, patch, '✅ '+p.callsign+' додано до '+(cr.crewName || cr.id));
    closeModal();
  }
  if (p.crewId && p.crewId !== cr.id) {
    if (!isAdminUser()) { toast('⚠ '+p.callsign+' в іншому екіпажі — переводить адмін', true); if (btn){btn.disabled=false;btn.textContent='➕ Додати';} return; }
    if (p.isMain) { toast('⚠ '+p.callsign+' — головний екіпажу '+(p.crewName||p.crewId)+'. Спочатку передай там головного.', true); if (btn){btn.disabled=false;btn.textContent='➕ Додати';} return; }
    if (!confirm('🔒 '+p.callsign+' в екіпажі '+(p.crewName||p.crewId)+'.\nПеревести в '+(cr.crewName||cr.id)+'?')) { if (btn){btn.disabled=false;btn.textContent='➕ Додати';} return; }
    var oc = crewById(p.crewId);
    var rest = crewMembersArr(oc).filter(function(x){ return x !== opId; }).join('|');
    rpc('updateCrew', [oc.id, { members: rest }], function(){
      oc.members = rest;
      addHere();
    }, function(e){ if (btn){btn.disabled=false;btn.textContent='➕ Додати';} toast('❌ '+e.message, true); });
  } else {
    addHere();
  }
}

function crewSetMain(opId) {
  var cr = crewById(crewPageSel);
  if (!cr) return;
  var p = personById(opId);
  if (!confirm('⭐ Зробити '+(p?p.callsign:opId)+' головним відповідальним '+(cr.crewName||cr.id)+'?'+
    (cr.main ? '\nПоточний головний ('+personLabel(cr.main)+') стане членом екіпажу.' : ''))) return;
  var ms = crewMembersArr(cr).filter(function(x){ return x !== opId; });
  if (cr.main) ms.push(cr.main);
  crewSaveMembers(cr, { main: opId, members: ms.join('|') }, '⭐ Головного змінено');
}

function crewRemoveMember(opId) {
  var cr = crewById(crewPageSel);
  if (!cr) return;
  var p = personById(opId);
  if (!confirm('✕ Прибрати '+(p?p.callsign:opId)+' з екіпажу '+(cr.crewName||cr.id)+'?')) return;
  crewSaveMembers(cr, { members: crewMembersArr(cr).filter(function(x){ return x !== opId; }).join('|') },
    '✕ '+(p?p.callsign:opId)+' прибрано');
}

function crewChangeRole(sel) {
  var opId = sel.dataset.op, role = sel.value;
  rpc('setPersonRole', [opId, role, crewToken() || undefined], function(){
    var p = personById(opId); if (p) p.role = role;
    if (S.auth && S.auth.id === opId) S.auth.role = role;
    toast('💾 Роль оновлено');
  }, function(e){ toast('❌ '+e.message, true); renderView(); });
}
function renderCrewForm() {
  var panel = $('crewFormPanel');
  if (!panel) return;
  var editing = !!crewForm.editId;
  var cr = editing ? crewById(crewForm.editId) : null;

  var busyGnst = {};
  activeCrews().forEach(function(c2){ if (c2.gnst && c2.id !== crewForm.editId) busyGnst[c2.gnst] = (busyGnst[c2.gnst]||[]).concat(c2.id); });
  var gnstOpts = '<option value="">— без наземки —</option>' +
    S.items.filter(function(it){ return it.type && it.type.indexOf('GNST')===0; }).map(function(it){
      var busy = busyGnst[it.id];
      var selected = cr && cr.gnst === it.id ? ' selected' : '';
      return '<option value="'+esc(it.id)+'"'+selected+'>'+esc(it.id+' — '+it.name+(busy?' 🔒 '+busy.join(', '):''))+'</option>';
    }).join('');
  var sysOpts = '<option value="">— не вказано —</option>' + VIDEO_SYSTEMS.map(function(s){
    return '<option value="'+s+'"'+(cr && cr.system===s?' selected':'')+'>'+s+'</option>';
  }).join('');

  // Головний відповідальний: вільні особи + поточний головний
  var mainOpts = '<option value="">— без головного —</option>' + S.personnel
    .filter(function(p){ return !p.crewId || (cr && p.crewId === cr.id); })
    .map(function(p){
      var sel = cr && cr.main === p.id ? ' selected' : '';
      return '<option value="'+esc(p.id)+'"'+sel+'>'+esc(p.callsign)+(p.name?' ('+esc(p.name)+')':'')+'</option>';
    }).join('');

  panel.innerHTML =
    (editing?'<div class="chip chip-main" style="margin-bottom:10px">РЕДАГУВАННЯ '+esc(crewForm.editId)+'</div>':'')+
    '<div class="f"><label>Назва екіпажу</label><input type="text" id="cfName" placeholder="напр. АЛЬФА" value="'+esc(cr?(cr.crewName||''):'')+'"></div>'+
    '<div class="f"><label>Головний відповідальний</label><select id="cfMain">'+mainOpts+'</select></div>'+
    '<div class="f"><label>Наземна станція</label><select id="cfGnst">'+gnstOpts+'</select></div>'+
    '<div class="f"><label>Bind фраза</label><input type="text" id="cfBind" placeholder="спільна для всіх бортів…" value="'+esc(cr?cr.bind:'')+'"></div>'+
    '<div class="f"><label>Борти (пул)</label>'+
      '<div class="ac-wrap"><input type="text" id="cfDroneSearch" placeholder="Пошук борту…" oninput="cfFilterDrones()" autocomplete="off"><div class="ac-list" id="cfDroneDd"></div></div>'+
      '<div id="cfDroneList" style="margin-top:6px"></div></div>'+
    '<div class="f"><label>Sinotrack трекери</label>'+
      '<div class="ac-wrap"><input type="text" id="cfTrkSearch" placeholder="Пошук трекера…" oninput="cfFilterTrackers()" onfocus="cfFilterTrackers()" autocomplete="off"><div class="ac-list" id="cfTrkDd"></div></div>'+
      '<div id="cfTrkList" style="margin-top:6px"></div>'+
      '<div class="hint">💡 Перевірка: SMS 669000 на номер SIM → ID і координати</div></div>'+
    '<div class="f"><label>Відеосистема</label><select id="cfSystem" onchange="cfSystemChange()">'+sysOpts+'</select>'+
      '<div class="hint" id="cfSysHint"></div></div>'+
    '<div class="f"><label>Основна частота</label><select id="cfFreq" onchange="freqWarn(this)"><option value="">— не вказано —</option>'+freqOptionsHtml(cr ? cr.system : '')+'</select></div>'+
    '<div class="f"><label>📻 Резервні VTX (до 10)</label>'+
      '<select id="cfReserveSel" onchange="cfAddReserve()"><option value="">+ додати резервну</option>'+freqOptionsHtml(cr ? cr.system : '')+'</select>'+
      '<div id="cfReserveList" style="margin-top:6px"></div></div>'+
    (editing
      ? '<div class="btn-row"><button class="btn btn-green" id="cfBtn" onclick="doSaveCrew()">💾 Зберегти</button>'+
        '<button class="btn btn-sec" onclick="crewForm={drones:[],trackers:[],reserves:[],editId:null};closeModal()">Скасувати</button></div>'
      : '<button class="btn btn-green" id="cfBtn" onclick="doSaveCrew()">👥 Створити екіпаж</button>');

  if (cr && cr.freq) cfSetFreqValue(cr.freq);
  cfRenderChips();
}
// Виставити частоту; якщо її немає в списку (інша система) — додати окремою опцією щоб не загубити
function cfSetFreqValue(freq) {
  var fs = $('cfFreq');
  if (!fs || !freq) return;
  fs.value = freq;
  if (fs.value !== freq) {
    var o = document.createElement('option');
    o.value = freq; o.textContent = freq;
    fs.appendChild(o);
    fs.value = freq;
  }
}
// Перебудувати списки частот (основна + резервні) під відеосистему
function cfRebuildFreqs(system) {
  var fs = $('cfFreq'), rs = $('cfReserveSel');
  var opts = freqOptionsHtml(system);
  if (fs) {
    var cur = fs.value;
    fs.innerHTML = '<option value="">— не вказано —</option>' + opts;
    if (cur) cfSetFreqValue(cur);
  }
  if (rs) rs.innerHTML = '<option value="">+ додати резервну</option>' + opts;
}
function cfSystemChange() {
  var hint = $('cfSysHint');
  if (hint) hint.innerHTML = '';
  cfRebuildFreqs($('cfSystem').value);
}
// Авто-визначення відеосистеми екіпажу по назвах бортів у пулі
function cfAutoDetectSystem() {
  var sel = $('cfSystem');
  if (!sel) return;
  var detected = '';
  for (var i = 0; i < crewForm.drones.length; i++) {
    var it = S.items.find(function(x){ return x.id === crewForm.drones[i]; });
    var d = detectSystemFromName(it ? it.name : '');
    if (d) { detected = d; break; }
  }
  if (detected) {
    sel.value = detected;
    var hint = $('cfSysHint');
    if (hint) hint.innerHTML = '✅ Авто з борту: <b>'+esc(detected)+'</b>';
    cfRebuildFreqs(detected);
  }
}
function cfFilterDrones() {
  var q = $('cfDroneSearch').value.toLowerCase();
  var dd = $('cfDroneDd');
  if (!q) { dd.style.display='none'; return; }
  var busy = busyDrones();
  var list = S.items.filter(function(it){
    return (it.type.indexOf('FPV')===0 || it.type.indexOf('STNG')===0 || it.type.indexOf('WING')===0) &&
      (it.id.toLowerCase().indexOf(q)!==-1 || it.name.toLowerCase().indexOf(q)!==-1) &&
      crewForm.drones.indexOf(it.id) === -1;
  }).slice(0, 10);
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(it){
    return '<div class="ac-item" onmousedown="cfAddDrone(\''+esc(it.id)+'\')">'+
      '<div class="ac-id">'+esc(it.id)+(busy[it.id]?' ⚠ в повітрі':'')+'</div>'+
      '<div class="ac-meta">'+esc(it.name)+' · '+esc(it.status)+'</div></div>';
  }).join('');
  dd.style.display = 'block';
}
function cfAddDrone(id) { if (crewForm.drones.indexOf(id)===-1) crewForm.drones.push(id); $('cfDroneSearch').value=''; $('cfDroneDd').style.display='none'; cfRenderChips(); cfAutoDetectSystem(); }
function cfRemoveDrone(id) { crewForm.drones = crewForm.drones.filter(function(x){ return x !== id; }); cfRenderChips(); cfAutoDetectSystem(); }
function cfFilterTrackers() {
  var q = $('cfTrkSearch').value.toLowerCase().trim();
  var dd = $('cfTrkDd');
  var busyTrk = {};
  activeCrews().forEach(function(c2){
    if (c2.tracker && c2.id !== crewForm.editId) c2.tracker.split('|').forEach(function(t){ t=t.trim(); if(t) busyTrk[t]=(busyTrk[t]||[]).concat(c2.id); });
  });
  var list = S.trackers.filter(function(t){
    return crewForm.trackers.indexOf(t.id)===-1 &&
      (!q || t.id.toLowerCase().indexOf(q)!==-1 || (t.model||'').toLowerCase().indexOf(q)!==-1 || (t.imei||'').toLowerCase().indexOf(q)!==-1);
  }).slice(0, 10);
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(t){
    var busy = busyTrk[t.id];
    var flag = busy ? ' 🔒 '+busy.join(',') : (t.status!=='Робочий' ? ' ⚠ '+t.status : '');
    return '<div class="ac-item" '+(busy?'style="opacity:.5;cursor:not-allowed"':'onmousedown="cfAddTracker(\''+esc(t.id)+'\')"')+'>'+
      '<div class="ac-id">'+esc(t.imei||t.id)+flag+'</div>'+
      '<div class="ac-meta">'+esc(t.model)+' · '+esc(t.simContact||'без SIM')+'</div></div>';
  }).join('');
  dd.style.display = 'block';
}
function cfAddTracker(id) {
  var t = S.trackers.find(function(x){ return x.id===id; });
  if (t && t.status !== 'Робочий' && !confirm('⚠ Трекер '+id+' — '+t.status+'! Додати все одно?')) return;
  if (crewForm.trackers.indexOf(id)===-1) crewForm.trackers.push(id);
  $('cfTrkSearch').value=''; $('cfTrkDd').style.display='none'; cfRenderChips();
}
function cfAddReserve() {
  var sel = $('cfReserveSel');
  if (!sel.value) return;
  if (crewForm.reserves.length >= 10) { toast('⚠ Максимум 10 резервних', true); sel.value=''; return; }
  if (crewForm.reserves.indexOf(sel.value)===-1) crewForm.reserves.push(sel.value);
  sel.value=''; cfRenderChips();
}
function cfRenderChips() {
  if ($('cfDroneList')) $('cfDroneList').innerHTML = crewForm.drones.map(function(d){
    return '<span class="chip click" onclick="cfRemoveDrone(\''+esc(d)+'\')">'+esc(d)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
  if ($('cfTrkList')) $('cfTrkList').innerHTML = crewForm.trackers.map(function(t){
    var tr = S.trackers.find(function(x){ return x.id===t; });
    return '<span class="chip click" onclick="crewForm.trackers=crewForm.trackers.filter(function(x){return x!==\''+esc(t)+'\'});cfRenderChips()">'+esc(tr&&tr.imei?tr.imei:t)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
  if ($('cfReserveList')) $('cfReserveList').innerHTML = crewForm.reserves.map(function(r){
    return '<span class="chip click chip-freq" onclick="crewForm.reserves=crewForm.reserves.filter(function(x){return x!==\''+esc(r)+'\'});cfRenderChips()">'+esc(r)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
}
// Форма екіпажу у спливаючому вікні: без crewId — створення, з crewId — редагування
function openCrewForm(crewId) {
  if (crewId) {
    var cr = crewById(crewId);
    if (!cr) return;
    crewForm = {
      editId: crewId,
      drones: cr.drones ? cr.drones.split('|').filter(Boolean) : [],
      trackers: cr.tracker ? cr.tracker.split('|').map(function(s){return s.trim();}).filter(Boolean) : [],
      reserves: cr.reserves ? cr.reserves.split('|').filter(Boolean) : []
    };
  } else {
    crewForm = { drones: [], trackers: [], reserves: [], editId: null };
  }
  var cr2 = crewId ? crewById(crewId) : null;
  openModal(crewId ? '✏️ Екіпаж '+esc((cr2 && cr2.crewName) || crewId) : '➕ Новий екіпаж',
    '<div id="crewFormPanel"></div>', true);
  renderCrewForm();
}
function doSaveCrew() {
  if (!crewForm.drones.length) { toast('⚠ Додай хоча б один борт', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('cfBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() {
    if (btn) { btn.disabled = false; btn.textContent = crewForm.editId ? '💾 Зберегти' : '👥 Створити екіпаж'; }
  }
  var data = {
    gnst: $('cfGnst').value, bind: $('cfBind').value.trim(),
    drones: crewForm.drones.join('|'), tracker: crewForm.trackers.join('|'),
    system: $('cfSystem').value, freq: $('cfFreq').value, reserves: crewForm.reserves.join('|'),
    crewName: $('cfName') ? $('cfName').value.trim() : undefined,
    main: $('cfMain') ? $('cfMain').value : undefined
  };
  if (crewForm.editId) {
    var editId = crewForm.editId;
    rpc('updateCrew', [editId, data], function(){
      toast('💾 '+editId+' збережено');
      // Одразу оновлюємо локально — без очікування перезавантаження з сервера
      var c = crewById(editId);
      if (c) { c.gnst=data.gnst; c.bind=data.bind; c.drones=data.drones; c.tracker=data.tracker;
               c.system=data.system; c.freq=data.freq; c.reserves=data.reserves;
               if (data.crewName !== undefined) c.crewName = data.crewName;
               if (data.main !== undefined) c.main = data.main; }
      crewForm = {drones:[],trackers:[],reserves:[],editId:null};
      closeModal();
      renderView();
      loadAll();
    }, function(e){ unlock(); toast('❌ ' + e.message, true); });
  } else {
    data.pilot = '';
    rpc('createCrew', [data], function(newId){
      // Одразу показуємо новий екіпаж локально — без очікування перезавантаження
      if (typeof newId === 'string' && newId) {
        toast('👥 Екіпаж '+newId+' створено');
        S.flights.push({ id:newId, date:new Date().toISOString().slice(0,10), crew:newId,
          gnst:data.gnst, drones:data.drones, bind:data.bind, pilot:'', tracker:data.tracker,
          trackerOk:'', start:'', end:'', status:'Активний', note:'', creatorEmail:S.me,
          system:data.system, freq:data.freq, reserves:data.reserves, equip:'',
          main:data.main || '', members:'', crewName:data.crewName || '' });
        refreshPersonnelCrewLinks();
      } else {
        toast('👥 Екіпаж створено');
      }
      crewForm = {drones:[],trackers:[],reserves:[],editId:null};
      closeModal();
      renderView();
      updateTopStats();
      loadAll();
    }, function(e){ unlock(); toast('❌ ' + e.message, true); });
  }
}
function doCloseCrew(crewId) {
  var act = activeFlights().filter(function(f){ return f.crew===crewId; });
  if (act.length) { toast('⚠ Спочатку заверши вильоти: '+act.map(function(f){return f.id;}).join(', '), true); return; }
  if (!confirm('🔴 Завершити екіпаж '+crewId+'?')) return;
  rpc('endFlight', [crewId, [], 'Екіпаж завершено'], function(){ toast('🔴 '+crewId+' завершено'); loadAll(); });
}

/* ═══════════ МОДАЛКИ ═══════════ */
function openModal(title, bodyHtml, wide) {
  $('modalBox').className = 'modal' + (wide ? ' wide' : '');
  $('modalBox').innerHTML = '<div class="modal-title"><span>'+title+'</span>'+
    '<button class="modal-close" onclick="closeModal()">✕</button></div>' + bodyHtml;
  $('modalBg').classList.add('open');
}
function closeModal() { $('modalBg').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

/* ═══════════ СТАРТ ═══════════ */
if (DEMO) $('demoBanner').style.display = 'block';
if ($('footGear')) $('footGear').innerHTML = svgIcon('gear');
loadAll();
authInit();
setInterval(function(){ if (!document.hidden) loadAll(); }, 90000);
</script>
