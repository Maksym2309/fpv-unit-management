<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILD HORNETS — Tactical OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ═══ HORNET TACTICAL OS · Web App ═══ */
:root {
  --bg: #131313; --bg-low: #0e0e0e;
  --panel: #1c1b1b; --panel-2: #201f1f; --panel-3: #2a2a2a; --panel-4: #353534;
  --line: #353534; --line-2: #514532;
  --text: #e5e2e1; --muted: #a8a5a2; --dim: #7f7c78;
  --accent: #ffb800; --accent-hi: #ffca3d; --accent-soft: #ffdca1; --on-accent: #1a1300;
  --blue: #3498db; --blue-deep: #2a486b; --blue-soft: #abc9f2;
  --green: #2ecc71; --green-bg: #11301d;
  --red: #e74c3c; --red-soft: #ff8580; --red-bg: #3a1512;
  --orange: #f39c12; --orange-bg: #33270e;
  --yellow: #f1c40f; --purple: #9b59b6; --grey: #7f8c8d;
  --font-ui: 'Archivo Narrow', Arial, sans-serif;
  --font-data: 'JetBrains Mono', Consolas, monospace;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui); font-size: 14px; color: var(--text);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    var(--bg);
  overflow: hidden;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ── Каркас ── */
#app { display: flex; flex-direction: column; height: 100vh; }
header.topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line-2); z-index: 40;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-name { font-size: 20px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
.brand-sub { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .2em; }
.top-stats { display: flex; align-items: center; gap: 18px; font-family: var(--font-data); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.top-stats b { color: var(--accent); font-weight: 700; }
.top-stats .warn-b { color: var(--red-soft); }
.icon-btn { background: none; border: 1px solid transparent; color: var(--accent); font-size: 16px; cursor: pointer; padding: 6px 9px; }
.icon-btn:hover { border-color: var(--accent); background: var(--panel-3); }
#layout { display: flex; flex: 1; min-height: 0; }

/* ── Сайдбар ── */
aside.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-low); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 0 10px; overflow-y: auto;
}
.unit-box { padding: 0 16px 14px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.unit-name { font-size: 17px; font-weight: 700; color: var(--accent-soft); text-transform: uppercase; letter-spacing: .05em; }
.unit-status { display: flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 9px; color: var(--green); text-transform: uppercase; letter-spacing: .12em; margin-top: 5px; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.new-flight-btn {
  margin: 0 16px 16px; padding: 12px; background: var(--accent); color: var(--on-accent);
  border: none; font-family: var(--font-data); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
}
.new-flight-btn:hover { background: var(--accent-hi); }
nav.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer;
  font-family: var(--font-data); font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); border-left: 3px solid transparent;
  background: none; border-top: none; border-right: none; border-bottom: none; text-align: left; width: 100%;
}
.nav-item:hover { color: var(--text); background: var(--panel); }
.nav-item.active {
  color: var(--on-accent); background: var(--accent); border-left-color: var(--accent-hi);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
}
.nav-icon { font-size: 14px; width: 18px; text-align: center; }
.sidebar-foot { margin-top: auto; padding: 12px 16px 4px; border-top: 1px solid var(--line); }
.user-email { font-family: var(--font-data); font-size: 9px; color: var(--dim); word-break: break-all; margin-bottom: 8px; }
.sync-line { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.sync-line b { color: var(--green); }

/* ── Контент ── */
main.content { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 40px; }
.view-title { font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin-bottom: 4px; }
.view-title .accent { color: var(--accent); }
.view-sub { font-family: var(--font-data); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 18px; }

/* ── Загальні елементи ── */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; }
.panel-title { font-family: var(--font-data); font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; border-left: 3px solid var(--accent); padding-left: 8px; margin-bottom: 10px; }
.panel-title.red { color: var(--red-soft); border-left-color: var(--red); }
.panel-title.blue { color: var(--blue-soft); border-left-color: var(--blue); }
label { display: block; font-weight: 700; color: var(--dim); margin-bottom: 4px; font-size: 9px; text-transform: uppercase; letter-spacing: .12em; font-family: var(--font-data); }
select, input, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 0;
  font-size: 13px; background: var(--bg-low); color: var(--text); font-family: var(--font-data);
}
select:focus, input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: inset 0 -1px 0 0 var(--accent); }
input::placeholder, textarea::placeholder { color: #5c5955; }
select option, select optgroup { background: var(--bg-low); color: var(--text); }
textarea { height: 54px; resize: vertical; }
.f { margin-bottom: 11px; }
.hint { font-size: 10px; color: var(--dim); margin-top: 3px; font-family: var(--font-data); }
.btn {
  width: 100%; padding: 10px; background: var(--accent); color: var(--on-accent); border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 8px;
  font-family: var(--font-data); text-transform: uppercase; letter-spacing: .06em;
}
.btn:hover { background: var(--accent-hi); }
.btn:disabled { background: var(--panel-3); color: var(--dim); cursor: not-allowed; }
.btn-green { background: var(--green-bg); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.btn-green:hover { background: var(--green); color: #04180c; }
.btn-red { background: var(--red-bg); color: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.btn-red:hover { background: var(--red); color: #1c0503; }
.btn-sec { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-sec:hover { background: var(--panel-3); color: var(--text); }
.btn-mini { width: auto; padding: 4px 10px; margin: 0; font-size: 10px; }
.btn-row { display: flex; gap: 6px; }
.btn-row .btn { flex: 1; }
.chip { display: inline-block; background: var(--panel-3); color: var(--text); border: 1px solid var(--line-2); padding: 3px 8px; font-size: 11px; margin: 2px; font-family: var(--font-data); }
.chip.click { cursor: pointer; }
.chip.click:hover { background: var(--red-bg); border-color: var(--red); color: var(--red-soft); }
.chip-freq { border-color: var(--blue); color: var(--blue-soft); }
.chip-main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.st-chip { display: inline-flex; align-items: center; font-size: 10px; padding: 2px 8px 2px 6px; white-space: nowrap; font-family: var(--font-data); font-weight: 700; border-left: 4px solid; }
.st-green  { background: var(--green-bg);  color: var(--green);    border-left-color: var(--green); }
.st-orange { background: var(--orange-bg); color: var(--orange);   border-left-color: var(--orange); }
.st-red    { background: var(--red-bg);    color: var(--red-soft); border-left-color: var(--red); }
.st-dark   { background: #2a0505;          color: var(--red-soft); border-left-color: #7a2020; }
.st-grey   { background: var(--panel-3);   color: var(--muted);    border-left-color: var(--grey); }
.st-blue   { background: #152535;          color: var(--blue-soft);border-left-color: var(--blue); }
.msg-box { padding: 9px; margin-top: 9px; font-size: 12px; display: none; font-family: var(--font-data); }
.msg-box.ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); display: block; }
.msg-box.err { background: var(--red-bg); color: var(--red-soft); border: 1px solid var(--red); display: block; }
.empty { text-align: center; color: var(--dim); padding: 18px; font-size: 12px; font-family: var(--font-data); }
.loading-view { text-align: center; padding: 80px 0; color: var(--dim); font-family: var(--font-data); font-size: 12px; text-transform: uppercase; letter-spacing: .15em; }
.loading-view .pulse-dot { display: inline-block; margin-right: 8px; }

/* ── Стат-плитки ── */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat-tile { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 12px; }
.stat-tile.green { border-left-color: var(--green); }
.stat-tile.red { border-left-color: var(--red); }
.stat-tile.blue { border-left-color: var(--blue); }
.stat-tile.click { cursor: pointer; }
.stat-tile.click:hover { background: var(--panel-3); }
.stat-tile.active { background: var(--panel-3); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat-num { font-family: var(--font-data); font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
.stat-lbl { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }

/* ── Тактичні картки ── */
.tcard {
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue);
  padding: 10px 12px; margin-bottom: 8px; position: relative;
}
.tcard.mine { border-left-color: var(--accent); background: #211d10; }
.tcard.other { opacity: .75; }
.tcard.lost { border-left-color: #7a2020; background: #1d0a0a; }
.tcard.ok { border-left-color: var(--green); }
.tcard.bad { border-left-color: var(--red); }
.tcard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.tcard-id { font-family: var(--font-data); font-size: 14px; font-weight: 700; color: var(--accent-soft); }
.tcard-meta { font-size: 12px; color: var(--muted); line-height: 1.8; }
.tcard-meta b { color: var(--text); }
.tcard-meta .mono { font-family: var(--font-data); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

/* ── Статусні кнопки вильоту ── */
.st-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; }
@media (max-width: 600px) { .st-grid { grid-template-columns: 1fr 1fr; } }
.st-btn { padding: 7px 4px; border: 1px solid var(--line-2); text-align: center; cursor: pointer; font-size: 10px; font-weight: 700; font-family: var(--font-data); color: var(--muted); background: var(--bg-low); }
.st-btn:hover { color: var(--text); }
.st-btn.sel-ok   { background: var(--green-bg);  color: var(--green);    border-color: var(--green);  box-shadow: 0 0 0 1px var(--green); }
.st-btn.sel-fix  { background: var(--orange-bg); color: var(--orange);   border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.st-btn.sel-bad  { background: var(--red-bg);    color: var(--red-soft); border-color: var(--red);    box-shadow: 0 0 0 1px var(--red); }
.st-btn.sel-lost { background: #2a0505;          color: var(--red-soft); border-color: #7a2020;       box-shadow: 0 0 0 1px #7a2020; }
.lost-box { background: #1d0a0a; border: 1px solid var(--red); padding: 10px; margin-top: 8px; }
.lost-box label { color: var(--red-soft); }
.lost-box input, .lost-box textarea { background: #140505; border-color: #7a2020; color: #ffcccc; }

/* ── Таблиці ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  font-family: var(--font-data); font-size: 9px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); text-align: left; padding: 8px; background: var(--panel-3);
  border: 1px solid var(--line); position: sticky; top: 0; z-index: 2;
}
.data-table td { padding: 7px 8px; border: 1px solid #262525; color: var(--text); }
.data-table tr:nth-child(odd) td { background: #161616; }
.data-table tr:nth-child(even) td { background: var(--panel); }
.data-table tr:hover td { background: var(--panel-3); }
.data-table .mono { font-family: var(--font-data); }
.data-table .accent { color: var(--accent); }
.table-wrap { overflow: auto; border: 1px solid var(--line); max-height: 62vh; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filter-row input, .filter-row select { width: auto; min-width: 160px; flex: 0 1 auto; }
.filter-chip { padding: 5px 10px; font-family: var(--font-data); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--panel); border: 1px solid var(--line-2); color: var(--muted); cursor: pointer; }
.filter-chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ── Інвентар: режим редагування ── */
.inv-mode { display: flex; margin-left: auto; border: 1px solid var(--line-2); background: var(--panel); }
.inv-mode-btn { padding: 5px 12px; font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: none; color: var(--muted); cursor: pointer; }
.inv-mode-btn.active { background: var(--accent); color: var(--on-accent); }
.inv-status-sel { width: 100%; min-width: 110px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text); font-family: var(--font-data); font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 4px; cursor: pointer; }
.inv-status-sel:disabled { opacity: .5; cursor: wait; }
.inv-act { background: transparent; border: 1px solid var(--line-2); border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; color: var(--muted); flex-shrink: 0; }
.inv-act:hover { background: var(--panel-3); }
.inv-act:disabled { opacity: .4; cursor: wait; }
.inv-act--ok { color: var(--green); border-color: var(--green); }
.inv-act--ok:hover { background: var(--green-bg); }
.inv-act--crew { color: var(--accent); border-color: var(--accent); }
.inv-act--crew:hover { background: rgba(255,184,0,.12); }
.inv-act--del { color: var(--red); border-color: var(--red); }
.inv-act--del:hover { background: var(--red-bg); }
.inv-acts { display: flex; gap: 5px; margin-top: 6px; white-space: nowrap; }
.inv-tabs { display: flex; border-bottom: 1px solid var(--line-2); margin-bottom: 12px; font-family: var(--font-data); }
.inv-tab { padding: 8px 18px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
.inv-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,184,0,.05); }
.inv-crew-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 12px; }
.inv-crew-bar label { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.inv-crew-bar select { width: auto; min-width: 170px; }

/* ── Карта частот ── */
.freq-topbar { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; margin-bottom: 12px; }
.freq-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.freq-legend .li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-sq { width: 11px; height: 11px; flex-shrink: 0; }
.freq-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: stretch; }
@media (max-width: 1100px) { .freq-layout { grid-template-columns: 1fr; } }
.matrix-panel { background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.matrix-panel-head { padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel-3); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.matrix-panel-head .cap { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.matrix-wrap { overflow: auto; flex: 1; padding: 6px 8px 8px; }
.matrix { border-collapse: collapse; width: 100%; table-layout: fixed; font-family: var(--font-data); min-width: 620px; }
.matrix th { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 7px 2px; border-bottom: 1px solid var(--line-2); text-align: center; position: sticky; top: -6px; background: var(--panel-2); z-index: 3; }
.matrix th.band-col, .matrix td.band { width: 104px; text-align: left; padding-left: 8px; }
.matrix td.band { color: var(--accent); font-size: 10px; line-height: 1.25; white-space: normal; overflow-wrap: break-word; border-right: 1px solid var(--line-2); font-weight: 700; }
.matrix td { padding: 3px; }
.cell { height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 12px; background: var(--panel-3); border: 1px solid rgba(81,69,50,.45); color: var(--muted); overflow: hidden; }
.cell:hover { border-color: var(--accent); color: var(--text); }
.cell .ctag { font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 58%; }
.cell-mine     { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 700; }
.cell-unit     { background: rgba(52,152,219,.16); border: 1px solid var(--blue); color: var(--blue); font-weight: 700; }
.cell-ext      { background: var(--grey); border-color: var(--grey); color: #10171a; font-weight: 700; }
.cell-critical { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; animation: pulse 1.6s infinite; }
.cell-serious  { background: var(--orange); border-color: var(--orange); color: #231604; font-weight: 700; }
.cell-moderate { background: var(--yellow); border-color: var(--yellow); color: #231d04; font-weight: 700; }
.cell-warning  { background: var(--orange-bg); border: 1px solid var(--orange); color: var(--orange); }
.cell-reserve  { background: transparent; border: 1px dashed var(--purple); color: #c9a6dd; }
/* Вільні, але небезпечні клітинки — приглушені відтінки (без пульсації) */
.cell-critF { background: rgba(231,76,60,.15);  border-color: rgba(231,76,60,.55);  color: #ff9a94; }
.cell-serF  { background: rgba(243,156,18,.13); border-color: rgba(243,156,18,.5);  color: var(--orange); }
.cell-modF  { background: rgba(241,196,15,.11); border-color: rgba(241,196,15,.45); color: #e8d44d; }
/* ── Права панель частот ── */
.side-panel { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; margin-bottom: 10px; min-height: 0; }
.side-head { background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.side-head:hover { background: var(--panel-3); }
.side-head .cap { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 7px; }
.side-head .arr { color: var(--accent); font-size: 11px; }

/* ═══════════ RPC-ОБГОРТКА ═══════════ */
function rpc(fn, args, ok, fail) {
  args = args || [];
  if (DEMO) {
    setTimeout(function(){
      try {
        var v = DEMO_DATA[fn];
        if (typeof v === 'function') { var r = v.apply(null, args); ok && ok(r === undefined ? {demo:true} : r); }
        else if (DEMO_DATA.hasOwnProperty(fn)) { ok && ok(JSON.parse(JSON.stringify(v))); }
        else { ok && ok({demo:true}); }
      } catch(e) { if (fail) fail(e); else toast('❌ ' + e.message, true); }
    }, 120);
    return;
  }
  var runner = google.script.run
    .withSuccessHandler(function(res){ ok && ok(res); })
    .withFailureHandler(function(e){ if (fail) fail(e); else toast('❌ ' + e.message, true); });
  runner[fn].apply(runner, args);
}

// Суфікси назв бортів → відеосистема (як у sidebar-формах)
var NAME_SUFFIXES = {
  'AD':'Аналог','AT':'Аналог',
  'HVD':'Hornet Vision','HVT':'Hornet Vision',
  'HDD':'HDZero','HDT':'HDZero',
  'DJD':'DJI','DJT':'DJI',
  'WSD':'Walksnail','WST':'Walksnail'
};
var WARNING_FREQS = { 5240: 'Канал HV-L1 (5240 МГц) використовувати НЕ рекомендовано! Можливі проблеми зв\'язку. Тільки короткочасно.' };
function detectSystemFromName(name) {
  if (!name) return '';
  var upper = String(name).toUpperCase().trim();
  var keys = Object.keys(NAME_SUFFIXES).sort(function(a,b){ return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var suf = keys[i];
    // Суфікс як окреме слово АБО в кінці назви (StingHVD, Sting HVD, Sting-HVD)
    var re = new RegExp('(^|[\\s\\-_])' + suf + '($|[\\s\\-_0-9])');
    if (re.test(upper)) return NAME_SUFFIXES[suf];
    if (upper.endsWith(suf)) return NAME_SUFFIXES[suf];
  }
  return '';
}
// Попередження про нерекомендовану частоту
function freqWarn(sel) {
  var m = String(sel.value || '').match(/\((\d+)\)/);
  if (m && WARNING_FREQS[Number(m[1])]) toast('⚠ ' + WARNING_FREQS[Number(m[1])], true);
}

/* ═══════════ ЗАВАНТАЖЕННЯ ДАНИХ ═══════════ */
var _loading = 0;
var _loadPending = false;   // запит на оновлення прийшов, поки тривало інше — виконати після
var _loadStarted = 0;
function loadAll(showToast) {
  if (_loading) {
    // Якщо завантаження триває — не губимо запит, а ставимо в чергу.
    // Якщо воно «застрягло» (>25 с без відповіді) — скидаємо і вантажимо заново.
    if (Date.now() - _loadStarted < 25000) { _loadPending = true; return; }
    _loading = 0;
  }
  _loadStarted = Date.now();
  _loading = 5;
  function done() {
    _loading--;
    if (_loading > 0) return;
    S.loadedAt = new Date();
    $('syncTime').textContent = S.loadedAt.toTimeString().slice(0,8);
    updateTopStats();
    renderView();
    if (showToast) toast('✅ Дані оновлено');
    if (_loadPending) { _loadPending = false; setTimeout(function(){ loadAll(); }, 200); }
  }
  rpc('getCurrentUserEmail', [], function(v){ S.me = v || ''; $('userEmail').textContent = S.me; done(); }, function(){ done(); });
  rpc('getAdminEmail', [], function(v){ S.admin = v || ''; done(); }, function(){ done(); });
  rpc('getInventoryList', [], function(v){ S.items = v || []; done(); }, function(){ S.items=[]; done(); });
  rpc('getSinotrackList', [], function(v){ S.trackers = v || []; done(); }, function(){ S.trackers=[]; done(); });
  rpc('getFlightList', [], function(v){ S.flights = v || []; loadFreqAndSims(done); }, function(){ S.flights=[]; loadFreqAndSims(done); });
}
function loadFreqAndSims(done) {
  // Права на інвентар не змінюються — тягнемо один раз за сесію
  var needCaps = S.invCaps === undefined;
  var n = needCaps ? 4 : 3;
  function sub(){ n--; if (!n) done(); }
  rpc('getSimList', [], function(v){ S.sims = v || []; sub(); }, function(){ S.sims=[]; sub(); });
  rpc('getFrequencyAnalysis', [], function(v){ S.freq = v; sub(); }, function(){ S.freq=null; sub(); });
  rpc('getPersonnelList', [], function(v){ S.personnel = Array.isArray(v) ? v : []; sub(); }, function(){ S.personnel=[]; sub(); });
  if (needCaps) {
    // Старий бекенд без цієї функції → тільки перегляд
    rpc('getInventoryCaps', [], function(v){ S.invCaps = (v && v.mode) ? v : null; sub(); }, function(){ S.invCaps = null; sub(); });
  }
}

      setAuthToken(res.token);

      toast('✅ Вітаю, '+res.op.callsign+'!'+(res.op.crewId ? ' Екіпаж: '+(res.op.crewName || res.op.crewId) : ' Ти поки без екіпажу'));

function doChangeMyRole() {
  var role = $('stRole').value;
  var btn = $('stRoleBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; }
  rpc('authChangeMyRole', [authToken(), role], function(op){
    if (op && op.id) S.auth = op;
    var p = personById(S.auth.id); if (p) p.role = role;
    toast('💾 Роль: '+role);
    if (btn) btn.disabled = false;
  }, function(e){ if (btn) btn.disabled = false; toast('❌ '+e.message, true); });
}

function doChangePassword() {
  var oldPw = $('stOldPw').value, newPw = $('stNewPw').value;
  if (!oldPw || !newPw) { toast('⚠ Заповни обидва поля', true); return; }
  var btn = $('stPwBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('authChangePassword', [authToken(), oldPw, newPw], function(){
    toast('🔒 Пароль змінено');
    $('stOldPw').value = ''; $('stNewPw').value = '';
    if (btn) { btn.disabled = false; btn.textContent = '🔒 Змінити пароль'; }
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '🔒 Змінити пароль'; }
    toast('❌ '+e.message, true);
  });
}

      }).join('')+'</select></div>'+

function admSavePerson(id) {
  var d = {
    callsign: $('apCallsign').value.trim(),
    name: $('apName').value.trim(),
    role: $('apRole').value,
    status: $('apStatus').value
  };
  if (id) d.id = id;
  var pw = $('apPassword').value;
  if (pw) d.newPassword = pw;
  if (!d.callsign) { toast('⚠ Вкажи позивний', true); return; }
  if (!id && !pw) { toast('⚠ Вкажи початковий пароль', true); return; }
  var btn = $('apBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('adminSavePerson', [d], function(res){
    toast('💾 '+d.callsign+' збережено');
    closeModal();
    admLoadPersonnel();
    loadAll();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; }
    toast('❌ '+e.message, true);
  });
}

function admDeletePerson(id) {
  var p = S.personnel.find(function(x){ return x.id === id; });
  if (!p) return;
  if (p.crewId) { toast('⚠ '+p.callsign+' в екіпажі '+(p.crewName||p.crewId)+' — спочатку прибери з екіпажу', true); return; }
  if (!confirm('🗑 Видалити '+p.callsign+' ('+id+')?')) return;
  rpc('adminDeletePerson', [id], function(){
    S.personnel = S.personnel.filter(function(x){ return x.id !== id; });
    toast('🗑 '+p.callsign+' видалено');
    admRenderPersonnel();
  }, function(e){ toast('❌ '+e.message, true); });
}

function flightCard(f) {
  var mine = isMine(f);
  var sel = fltStatuses[f.id] || '';
  var stBtns = mine
    ? '<div class="st-grid">'+
        '<div class="st-btn'+(sel==='Робочий'?' sel-ok':'')+'" onclick="setFltSt(\''+esc(f.id)+'\',\'Робочий\')">✅ РОБОЧИЙ</div>'+
        '<div class="st-btn'+(sel==='Ремонт'?' sel-fix':'')+'" onclick="setFltSt(\''+esc(f.id)+'\',\'Ремонт\')">🔧 РЕМОНТ</div>'+
        '<div class="st-btn'+(sel==='Несправний'?' sel-bad':'')+'" onclick="setFltSt(\''+esc(f.id)+'\',\'Несправний\')">❌ НЕСПРАВ.</div>'+
        '<div class="st-btn'+(sel==='Втрачений'?' sel-lost':'')+'" onclick="setFltSt(\''+esc(f.id)+'\',\'Втрачений\')">🔍 ВТРАЧЕНИЙ</div>'+
      '</div>'+
      (sel==='Втрачений'
        ? '<div class="lost-box" id="lostBox-'+esc(f.id)+'">'+
            '<label>Деталі втрати</label>'+
            '<input type="text" id="lostCoords-'+esc(f.id)+'" placeholder="📍 Координати (48.123, 35.456)" style="margin-bottom:5px">'+
            '<input type="text" id="lostLink-'+esc(f.id)+'" placeholder="🗺 Посилання з трекера" style="margin-bottom:5px">'+
            '<textarea id="lostCirc-'+esc(f.id)+'" placeholder="📋 Обставини втрати…"></textarea>'+
            '<div class="hint">⚠ Трекер і SIM цього вильоту теж стануть втраченими</div>'+
          '</div>'
        : '')+
      '<input type="text" id="endNote-'+esc(f.id)+'" placeholder="Примітка…" style="margin-top:8px">'+
      '<button class="btn btn-green" onclick="doEnd(\''+esc(f.id)+'\')">🛬 Приземлився</button>'
    : '<div class="hint" style="margin-top:8px">🔒 Тільки автор вильоту може завершити</div>';

  var crewObj = crewById(f.crew);
  var bindInfo = crewObj && crewObj.bind ? ' · Bind: <b class="mono">'+esc(crewObj.bind)+'</b>' : '';
  return '<div class="tcard '+(mine?'mine':'other')+'">'+
    '<div class="tcard-head">'+
      '<span class="tcard-id">'+esc(f.drones)+'</span>'+
      (f.freq?'<span class="chip chip-freq">'+esc(f.freq)+'</span>':'')+
      statusChip(f.status)+
    '</div>'+
    '<div class="tcard-meta mono">🕐 '+esc(f.start)+(f.pilot?' · 👤 '+esc(f.pilot):'')+' · '+esc(f.crew)+bindInfo+
    (f.tracker?'<br>📡 '+esc(f.tracker):'')+(f.system?' · 📹 '+esc(f.system):'')+'</div>'+
    stBtns+
  '</div>';
}
function setFltSt(fid, st) { fltStatuses[fid] = (fltStatuses[fid]===st ? '' : st); renderView(); }
function doEnd(fid) {
  var st = fltStatuses[fid];
  if (!st) { toast('⚠ Обери статус борта перед посадкою', true); return; }
  var f = S.flights.find(function(x){ return x.id===fid; });
  var droneId = f && f.drones ? f.drones.split('|')[0].trim() : '';
  var note = ($('endNote-'+fid) && $('endNote-'+fid).value) || '';
  var ds = [{ id: droneId, status: st }];
  if (st === 'Втрачений') {
    ds[0].lostData = {
      coords: ($('lostCoords-'+fid)&&$('lostCoords-'+fid).value)||'',
      mapsLink: ($('lostLink-'+fid)&&$('lostLink-'+fid).value)||'',
      conditions: ($('lostCirc-'+fid)&&$('lostCirc-'+fid).value)||''
    };
    if (!confirm('❗ Позначити борт '+droneId+' як ВТРАЧЕНИЙ? Трекер і SIM теж стануть втраченими.')) return;
  }
  rpc('endFlight', [fid, ds, note], function(){
    delete fltStatuses[fid];
    toast('🛬 Виліт '+fid+' завершено');
    loadAll();
  });
}
function renderLogTable() {
  var q = ($('logSearch') ? $('logSearch').value : '').toLowerCase();
  var list = S.flights.filter(function(f){ return f.id.indexOf('CRW-')!==0; }).slice().reverse();
  if (q) list = list.filter(function(f){
    return (f.id+' '+f.drones+' '+f.pilot+' '+f.crew+' '+f.status).toLowerCase().indexOf(q) !== -1;
  });
  var rows = list.slice(0, 100).map(function(f){
    return '<tr>'+
      '<td class="mono">'+esc(f.id)+'</td>'+
      '<td class="mono">'+esc(f.date)+'</td>'+
      '<td class="mono">'+esc(f.start)+(f.end?' → '+esc(f.end):'')+'</td>'+
      '<td class="mono">'+esc(f.drones)+'</td>'+
      '<td>'+esc(f.pilot)+'</td>'+
      '<td class="mono">'+esc(f.crew)+'</td>'+
      '<td class="mono">'+esc(f.freq||'')+'</td>'+
      '<td>'+statusChip(f.status)+'</td>'+
    '</tr>';
  }).join('');
  $('logTable').innerHTML = '<thead><tr><th>ID</th><th>Дата</th><th>Час</th><th>Борт</th><th>Пілот</th><th>Екіпаж</th><th>Частота</th><th>Статус</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="8" class="empty">Нічого не знайдено</td></tr>')+'</tbody>';
}

/* ═══════════ МОДАЛКА: НОВИЙ ВИЛІТ ═══════════ */
function openNewFlightModal() {
  // Виліт: адмін — будь-який екіпаж; відповідальна особа — тільки свій; без входу — зась
  if (!isAdminUser()) {
    if (!S.auth) { openLoginModal('Фіксувати виліт може тільки член екіпажу — увійди'); return; }
    if (!S.auth.crewId) { toast('⚠ Ти не привʼязаний до екіпажу — виліт неможливий', true); return; }
  }
  var crews = activeCrews();
  if (!isAdminUser() && S.auth) {
    crews = crews.filter(function(c){ return c.id === S.auth.crewId; });
  }
  if (!crews.length) {
    toast('⚠ Спочатку створи екіпаж (розділ «Екіпаж»)', true);
    setView('crews');
    return;
  }
  var crewOpts = crews.map(function(c){
    var dl = c.drones ? c.drones.split('|').filter(Boolean) : [];
    return '<option value="'+esc(c.id)+'">'+esc(c.crewName || c.id)+(c.bind?' ['+esc(c.bind)+']':'')+' — '+esc(dl.join(', '))+'</option>';
  }).join('');
  var sysOpts = VIDEO_SYSTEMS.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join('');
  openModal(
    '🛫 Новий виліт',
    '<div class="f"><label>Екіпаж *</label><select id="nfCrew" onchange="nfCrewChange()"><option value="">— оберіть —</option>'+crewOpts+'</select></div>'+
    '<div id="nfCrewInfo"></div>'+
    '<div class="f"><label>Відповідальна особа *</label><input type="text" id="nfPilot" placeholder="Позивний або ПІБ…"></div>'+
    '<div class="f" id="nfDroneBlock" style="display:none"><label>Борт (який летить зараз) *</label><select id="nfDrone" onchange="nfDroneChange()"></select></div>'+
    '<div class="f" id="nfTrkBlock" style="display:none"><label>Sinotrack з цим бортом</label><select id="nfTrk"></select></div>'+
    '<div class="f"><label>Відеосистема</label><select id="nfSystem" onchange="nfSystemChange()"><option value="">— авто з екіпажу —</option>'+sysOpts+'</select>'+
    '<div class="hint" id="nfSysHint"></div></div>'+
    '<div class="f"><label>Частота (МГц)</label><select id="nfFreq" onchange="freqWarn(this)"><option value="">— оберіть —</option>'+freqOptionsHtml()+'</select>'+
    '<div class="hint">📻 Перевір карту частот на конфлікти</div></div>'+
    '<button class="btn btn-green" id="nfBtn" onclick="doStartFlight()">🛫 Злетів</button>'
  );
  // Відповідальна особа: свій екіпаж одразу вибраний, позивний підставлений
  if (!isAdminUser() && S.auth) {
    if ($('nfPilot')) $('nfPilot').value = S.auth.callsign;
    if (crews.length === 1) { $('nfCrew').value = crews[0].id; nfCrewChange(); }
  }
}
function nfCrewChange() {
  var id = $('nfCrew').value;
  var info = $('nfCrewInfo'), block = $('nfDroneBlock'), trkBlock = $('nfTrkBlock');
  if (!id) { info.innerHTML=''; block.style.display='none'; trkBlock.style.display='none'; return; }
  var c = crewById(id);
  if (!c) return;
  var dl = c.drones ? c.drones.split('|').filter(Boolean) : [];
  var busy = busyDrones();

  info.innerHTML = '<div class="tcard" style="border-left-color:var(--blue)"><div class="tcard-meta mono">'+
    (c.gnst?'📡 '+esc(c.gnst)+'<br>':'')+
    (c.bind?'🔗 Bind: <b>'+esc(c.bind)+'</b><br>':'')+
    (c.tracker?'📡 '+esc(c.tracker.split('|').join(', '))+(c.trackerOk==='Перевірено'?' ✅':'')+'<br>':'')+
    (c.system?'📹 '+esc(c.system)+'<br>':'')+
    (c.freq?'📻 Основна: <b>'+esc(c.freq)+'</b><br>':'')+
    (c.reserves?'🔄 Резервні: '+esc(c.reserves.split('|').join(', '))+'<br>':'')+
    '🛸 Пул: '+esc(dl.join(', '))+
  '</div></div>';

  if (c.system) $('nfSystem').value = c.system;

  // Частоти: якщо екіпаж задав — тільки основна + резервні
  var freqSel = $('nfFreq');
  if (c.freq || c.reserves) {
    var opts = '<option value="">— оберіть —</option>';
    if (c.freq) opts += '<option value="'+esc(c.freq)+'">⭐ Основна: '+esc(c.freq)+'</option>';
    (c.reserves||'').split('|').filter(Boolean).forEach(function(r){
      opts += '<option value="'+esc(r)+'">🔄 Резерв: '+esc(r)+'</option>';
    });
    freqSel.innerHTML = opts;
    if (c.freq) freqSel.value = c.freq;
  } else {
    // Екіпаж без частот → сітка по системі екіпажу (борт може перевизначити)
    freqSel.innerHTML = '<option value="">— оберіть —</option>' + freqOptionsHtml(c.system || '');
  }

  $('nfDrone').innerHTML = '<option value="">— оберіть —</option>' + dl.map(function(did){
    var it = S.items.find(function(i){ return i.id===did; });
    var inFlight = busy[did];
    return '<option value="'+esc(did)+'">'+esc(did)+(it?' — '+esc(it.name):'')+(inFlight?' ✈ вже в повітрі':'')+'</option>';
  }).join('');
  block.style.display = 'block';

  var crewTrks = (c.tracker||'').split('|').map(function(s){return s.trim();}).filter(Boolean);
  if (crewTrks.length) {
    var busyTrk = {};
    activeFlights().forEach(function(f){ if (f.tracker) busyTrk[f.tracker.trim()] = f.id; });
    $('nfTrk').innerHTML = '<option value="">— без трекера —</option>' + crewTrks.map(function(tid){
      var t = S.trackers.find(function(x){ return x.id===tid; });
      var lbl = (t&&t.imei?t.imei:tid)+(t?' — '+t.model:'')+(busyTrk[tid]?' ✈ вже летить':'');
      return '<option value="'+esc(tid)+'">'+esc(lbl)+'</option>';
    }).join('');
    trkBlock.style.display = 'block';
  } else trkBlock.style.display = 'none';
}
// Чи задав екіпаж фіксовані частоти (тоді список вильоту не перебудовуємо — VTX pool)
function nfCrewHasFreqs() {
  var c = crewById($('nfCrew').value);
  return !!(c && (c.freq || c.reserves));
}
function nfRebuildFreqs(system) {
  var fs = $('nfFreq');
  if (!fs) return;
  var cur = fs.value;
  fs.innerHTML = '<option value="">— оберіть —</option>' + freqOptionsHtml(system);
  if (cur) fs.value = cur;
}
function nfSystemChange() {
  var sys = $('nfSystem').value;
  var hint = $('nfSysHint');
  if (hint) hint.innerHTML = sys ? 'Обрано: <b>'+esc(sys)+'</b>' : '';
  if (!nfCrewHasFreqs()) nfRebuildFreqs(sys);
}
// Авто-визначення відеосистеми при виборі борту
function nfDroneChange() {
  var droneId = $('nfDrone').value;
  var hint = $('nfSysHint');
  if (!droneId) { if (hint) hint.innerHTML = ''; return; }
  var it = S.items.find(function(i){ return i.id === droneId; });
  if (!it) return;
  var detected = detectSystemFromName(it.name);
  if (detected) {
    $('nfSystem').value = detected;
    if (hint) hint.innerHTML = '✅ Авто з назви "'+esc(it.name)+'": <b>'+esc(detected)+'</b>';
    if (!nfCrewHasFreqs()) nfRebuildFreqs(detected);
  } else {
    if (hint) hint.innerHTML = '⚠ "'+esc(it.name)+'" — система не розпізнана, обери вручну';
    var cur = $('nfSystem').value;
    if (cur && !nfCrewHasFreqs()) nfRebuildFreqs(cur);
  }
}
function doStartFlight() {
  var crewId = $('nfCrew').value, pilot = $('nfPilot').value.trim(), drone = $('nfDrone').value;
  if (!crewId) { toast('⚠ Обери екіпаж', true); return; }
  if (!pilot) { toast('⚠ Вкажи відповідальну особу', true); return; }
  if (!drone) { toast('⚠ Обери борт', true); return; }
  var busy = busyDrones();
  if (busy[drone] && !confirm('⚠ Борт '+drone+' вже в повітрі ('+busy[drone]+'). Все одно злетіти?')) return;
  var c = crewById(crewId);
  var btn = $('nfBtn'); btn.disabled = true; btn.textContent = '⏳ Запис…';
  var fltTrk = $('nfTrk') ? $('nfTrk').value : '';
  var fltSystem = $('nfSystem').value, fltFreq = $('nfFreq').value;
  rpc('startFlight', [{
    crew: crewId, gnst: '', drones: drone, bind: '', pilot: pilot,
    tracker: fltTrk, trackerOk: (c && c.trackerOk) || '',
    note: '', system: fltSystem, freq: fltFreq,
    token: crewToken() || undefined
  }], function(res){
    closeModal();
    toast('🛫 Виліт '+ (res && res.id ? res.id : '') +' розпочато');
    // Одразу показуємо виліт локально — без очікування перезавантаження
    S.flights.push({ id:(res && res.id) || ('FLT-' + Date.now()), date:new Date().toISOString().slice(0,10),
      crew:crewId, gnst:'', drones:drone, bind:'', pilot:pilot, tracker:fltTrk,
      trackerOk:(c && c.trackerOk) || '', start:(res && res.start) || '', end:'', status:'Активний',
      note:'', creatorEmail:S.me, system:fltSystem, freq:fltFreq, reserves:'', equip:'' });
    renderView();
    updateTopStats();
    loadAll();
  }, function(e){ btn.disabled=false; btn.textContent='🛫 Злетів'; toast('❌ '+e.message, true); });
}

/* ═══════════ ВИД: КАРТА ЧАСТОТ ═══════════ */
var bandGroup = 'all';
function bandOf(band) {
  var f = BANDS[band][0];
  if (f >= 5600) return '5.8';
  if (f >= 4900) return '5.0';
  return '3.3';
}
function cleanCode(fc) { return String(fc||'').replace(/\s*\(\d+\)/, '').trim(); }
function freqToCodeLocal(freq) {
  for (var b in BANDS) { var i = BANDS[b].indexOf(Number(freq)); if (i !== -1) return b + (i+1); }
  return '?';
}
function countConflicts() {
  if (!S.freq) return 0;
  var occupied = (S.freq.active||[]).filter(function(a){ return a.freq; });
  var n = 0;
  for (var i = 0; i < occupied.length; i++)
    for (var j = i+1; j < occupied.length; j++) {
      if (occupied[i].crew === occupied[j].crew) continue;
      if (Math.abs(occupied[i].freq - occupied[j].freq) < 40) n++;
    }
  return n;
}
var specOpen = true;
var sidePanels = { af: true, crews: true, conf: true };
function togglePanel(key) { sidePanels[key] = !sidePanels[key]; renderView(); }
function toggleSpec() { specOpen = !specOpen; renderView(); }

function renderFreq(c) {
  var d = S.freq;
  if (!d) { c.innerHTML = '<div class="empty">Дані частот недоступні</div>'; return; }
  var active = d.active || [];
  var bands = d.bands || BANDS;
  var bandOrder = (d.bandOrder || Object.keys(bands)).filter(function(b){ return bands[b]; });
  var warningFreqs = d.warningFreqs || {};
  var reserves = d.reserves || [];

  var codeSource = {};
  active.forEach(function(a){
    var code = cleanCode(a.freqCode);
    if (code && code !== '?') codeSource[code] = a;
    else if (a.freq) codeSource['_mhz_'+a.freq] = a;
  });
  var occupied = active.filter(function(a){ return a.freq; });
  var reserveMap = {};
  reserves.forEach(function(r){ var code = cleanCode(r.freqCode); if (code) reserveMap[code] = r; });
  var crewInfoMap = {};
  (d.crewFreqInfo||[]).forEach(function(ci){ crewInfoMap[ci.crew] = ci; });

  function freqLevel(f, code) {
    var level = 'free';
    var selfSrc = code ? (codeSource[code] || codeSource['_mhz_'+f] || null) : null;
    occupied.forEach(function(o){
      if (selfSrc && o.crew === selfSrc.crew && o.freq === f) return;
      var dd = Math.abs(f - o.freq);
      if (dd < 20) level = 'critical';
      else if (dd < 40 && level !== 'critical') level = 'serious';
    });
    if (level !== 'critical' && level !== 'serious') {
      for (var i = 0; i < occupied.length; i++)
        for (var j = 0; j < occupied.length; j++) {
          if (i === j) continue;
          if (Math.abs(f - (2*occupied[i].freq - occupied[j].freq)) < 10) level = 'moderate';
        }
    }
    return level;
  }
  // Конфлікти конкретного екіпажу (для бейджів на картках)
  function conflictOf(a) {
    if (!a.freq) return null;
    for (var i = 0; i < occupied.length; i++) {
      var o = occupied[i];
      if (o.crew === a.crew) continue;
      var gap = Math.abs(a.freq - o.freq);
      if (gap < 20) return { with: o, gap: gap, level: 'critical' };
    }
    for (var k = 0; k < occupied.length; k++) {
      var o2 = occupied[k];
      if (o2.crew === a.crew) continue;
      var g2 = Math.abs(a.freq - o2.freq);
      if (g2 < 40) return { with: o2, gap: g2, level: 'serious' };
    }
    return null;
  }

  // ── Верхня панель: легенда як у макеті ──
  var legend = '<div class="freq-topbar"><div class="freq-legend">'+
    '<div class="li"><span class="lg-sq" style="background:#2ecc71"></span>Своя частота</div>'+
    '<div class="li"><span class="lg-sq" style="border:1px solid #3498db;background:rgba(52,152,219,.2)"></span>Екіпаж підрозділу</div>'+
    '<div class="li"><span class="lg-sq" style="background:#7f8c8d"></span>Зовнішні (інші)</div>'+
    '<div class="li"><span class="lg-sq" style="background:#e74c3c"></span>Конфлікт</div>'+
    '<div class="li"><span class="lg-sq" style="background:#f39c12"></span>Близько до конфлікту</div>'+
    '<div class="li"><span class="lg-sq" style="background:#f1c40f"></span>Інтермодуляція</div>'+
    '<div class="li"><span class="lg-sq" style="border:1px dashed #9b59b6"></span>Резерв</div>'+
    '<div class="li"><span class="lg-sq" style="background:#33270e;border:1px solid #f39c12"></span>⚠ Нерекомендована</div>'+
  '</div></div>';

  // ── Матриця (на всю ширину, table-layout: fixed) ──
  var visibleBands = bandOrder.filter(function(b){ return bandGroup==='all' || bandOf(b)===bandGroup; });
  var maxCh = 0;
  visibleBands.forEach(function(b){ if (bands[b].length > maxCh) maxCh = bands[b].length; });
  var groupLbl = bandGroup==='all' ? 'ВСІ БЕНДИ' : bandGroup + ' GHz';
  var filters = ['all','5.8','5.0','3.3'].map(function(g){
    var lbl = g==='all' ? 'ВСІ' : g + ' GHz';
    return '<button class="filter-chip'+(bandGroup===g?' active':'')+'" onclick="bandGroup=\''+g+'\';renderView()">'+lbl+'</button>';
  }).join('');

  var m = '<div class="matrix-panel">'+
    '<div class="matrix-panel-head"><span class="cap">Сітка каналів · '+groupLbl+'</span><div style="display:flex;gap:6px">'+filters+'</div></div>'+
    '<div class="matrix-wrap"><table class="matrix"><tr><th class="band-col">Band / CH</th>';
  for (var ch = 1; ch <= maxCh; ch++) m += '<th>'+ch+'</th>';
  m += '</tr>';
  visibleBands.forEach(function(band){
    m += '<tr><td class="band">'+esc(band)+'</td>';
    bands[band].forEach(function(freq, idx){
      var code = band + (idx + 1);
      var lvl = freqLevel(freq, code);
      var src = codeSource[code] || codeSource['_mhz_'+freq];
      var resv = reserveMap[code];
      var cls, tag = '';
      if (src) {
        // Зайнята клітинка: конфлікт перекриває колір власника
        if (lvl === 'critical') cls = 'cell-critical';
        else if (lvl === 'serious') cls = 'cell-serious';
        else if (src.source === 'mine') cls = 'cell-mine';
        else if (src.source === 'external') cls = 'cell-ext';
        else cls = 'cell-unit';
        tag = '<span class="ctag">('+esc(src.source==='mine' ? 'ВИ' : (src.crew||'чужий'))+')</span>';
      } else if (resv) {
        cls = 'cell-reserve';
        tag = '<span class="ctag">('+esc(resv.crew)+')</span>';
      } else if (lvl !== 'free') {
        cls = lvl==='critical' ? 'cell-critF' : (lvl==='serious' ? 'cell-serF' : 'cell-modF');
      } else if (warningFreqs[freq]) {
        cls = 'cell-warning';
      } else {
        cls = '';
      }
      m += '<td><div class="cell '+cls+'" onclick="cellClick('+freq+')" title="'+code+' — '+freq+' МГц'+(warningFreqs[freq]?' ⚠':'')+'">'+
        freq + tag + '</div></td>';
    });
    for (var pad = bands[band].length; pad < maxCh; pad++) m += '<td></td>';
    m += '</tr>';
  });
  m += '</table></div></div>';

  // ── Права панель ──
  var flightsList = active.filter(function(a){ return a.source==='mine' || a.source==='unit'; });
  var crewsList = active.filter(function(a){ return a.source==='crew'; });
  var extList = active.filter(function(a){ return a.source==='external'; });

  function afCard(a) {
    var cc = cleanCode(a.freqCode) || freqToCodeLocal(a.freq);
    var conf = conflictOf(a);
    var isExt = a.source === 'external';
    var isMineA = a.source === 'mine';
    var info = crewInfoMap[a.crew];
    var canSwitch = !isExt && info && info.reserves && info.reserves.length &&
      (info.author === S.me || S.me === d.adminEmail);
    var swId = 'sw-' + String(a.crew).replace(/[^\w-]/g, '_');
    var freqCls = conf && conf.level==='critical' ? 'red' : (isMineA ? '' : (isExt ? 'grey' : 'blue'));

    var h = '<div class="af-card'+(isMineA?' mine':'')+(isExt?' ext':'')+(conf&&conf.level==='critical'?' conflict':'')+'">'+
      '<div class="af-bar"></div>'+
      (conf&&conf.level==='critical'?'<div class="af-badge">КОНФЛІКТ!</div>':'')+
      '<div class="af-head">'+
        '<div class="af-title">'+esc(a.crew)+(isMineA?' (ВИ)':'')+(isExt?' (ЗОВН)':'')+'</div>'+
        '<div class="af-freq '+freqCls+'">📶 '+(a.freq?esc(cc)+' ('+esc(a.freq)+')':'—')+'</div>'+
      '</div>'+
      ((a.pilot||a.system)?'<div class="af-meta">'+(a.pilot?'👤 '+esc(a.pilot):'')+(a.pilot&&a.system?' · ':'')+(a.system&&a.system!=='Зовнішній'?esc(a.system):'')+'</div>':'');
    if (conf) h += '<div class="af-note">&gt; Δ'+conf.gap+' МГц з '+esc(conf.with.crew)+'</div>';
    if (canSwitch) {
      h += '<button class="af-btn" onclick="document.getElementById(\''+swId+'\').classList.toggle(\'open\')">Змінити частоту</button>'+
        '<div class="swap-menu" id="'+swId+'">';
      info.reserves.forEach(function(r){
        h += '<button class="vtx-btn" onclick="doSwapFreq(\''+esc(a.crew)+'\',\''+esc(r)+'\')">→ '+esc(cleanCode(r))+'</button>';
      });
      h += '</div>';
    }
    if (isExt) h += '<button class="af-btn red" onclick="delExt('+a.freq+')">✕ Зняти позначку</button>';
    return h + '</div>';
  }

  var afList = flightsList.concat(extList);
  var side = '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'af\')"><span class="cap">✈ Активні вильоти</span>'+
    '<span><span class="count-pill">'+afList.length+' В ЕФІРІ</span> <span class="arr">'+(sidePanels.af?'▲':'▼')+'</span></span></div>'+
    '<div class="side-body'+(sidePanels.af?'':' hid')+'">'+
    (afList.length ? afList.map(afCard).join('') : '<div class="empty">Немає активних вильотів</div>')+
    '</div></div>';

  // Наші екіпажі — таблиця як у макеті
  var crewRows = '';
  crewsList.forEach(function(a){
    var cc = cleanCode(a.freqCode) || freqToCodeLocal(a.freq);
    var info = crewInfoMap[a.crew];
    var canSwitch = info && info.reserves && info.reserves.length && (info.author === S.me || S.me === d.adminEmail);
    var swId = 'swc-' + String(a.crew).replace(/[^\w-]/g, '_');
    crewRows += '<tr><td><span class="crew-dot"></span>'+esc(a.crew)+'</td>'+
      '<td><span class="crew-freq">'+esc(cc)+' ('+esc(a.freq)+')</span>'+
      (canSwitch?' <button class="vtx-btn" style="padding:1px 6px;margin-left:4px" onclick="document.getElementById(\''+swId+'\').classList.toggle(\'open\')">🎚</button>':'')+
      '</td></tr>';
    if (canSwitch) {
      crewRows += '<tr><td colspan="2" style="padding:0 8px"><div class="swap-menu" id="'+swId+'" style="margin:0 0 6px">';
      info.reserves.forEach(function(r){
        crewRows += '<button class="vtx-btn" onclick="doSwapFreq(\''+esc(a.crew)+'\',\''+esc(r)+'\')">→ '+esc(cleanCode(r))+'</button>';
      });
      crewRows += '</div></td></tr>';
    }
  });
  reserves.forEach(function(r){
    crewRows += '<tr><td><span class="crew-dot purple"></span>'+esc(r.crew)+'</td>'+
      '<td><span class="crew-freq purple">РЕЗЕРВ '+esc(cleanCode(r.freqCode))+'</span></td></tr>';
  });
  side += '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'crews\')"><span class="cap">👥 Наші екіпажі</span><span class="arr">'+(sidePanels.crews?'▲':'▼')+'</span></div>'+
    '<div class="side-body'+(sidePanels.crews?'':' hid')+'" style="padding:0">'+
    (crewRows ? '<table class="crew-table"><tr><th>Позивний</th><th>Частота</th></tr>'+crewRows+'</table>' : '<div class="empty">Екіпажів немає</div>')+
    '</div></div>';

  // Конфлікти (активні + резервні)
  var realConf = [];
  for (var i = 0; i < occupied.length; i++)
    for (var j = i+1; j < occupied.length; j++) {
      var a1 = occupied[i], a2 = occupied[j];
      if (a1.crew === a2.crew) continue;
      var gap = Math.abs(a1.freq - a2.freq);
      if (gap < 20) realConf.push({lvl:'🔴', t:'Прямий', d:a1.crew+' @'+a1.freq+' ↔ '+a2.crew+' @'+a2.freq+' (Δ'+gap+' МГц)'});
      else if (gap < 40) realConf.push({lvl:'🟠', t:'Близькі канали', d:a1.crew+' @'+a1.freq+' ↔ '+a2.crew+' @'+a2.freq+' (Δ'+gap+' МГц)'});
    }
  reserves.forEach(function(r){
    occupied.forEach(function(o){
      if (o.crew === r.crew) return;
      var dd = Math.abs(r.freq - o.freq);
      if (dd < 20) realConf.push({lvl:'🔴', t:'Резерв ↔ активна', d:'🔄 '+r.crew+' резерв '+r.freq+' ↔ '+o.crew+' '+o.freq+' (Δ'+dd+')'});
      else if (dd < 40) realConf.push({lvl:'🟠', t:'Резерв ↔ активна', d:'🔄 '+r.crew+' резерв '+r.freq+' ↔ '+o.crew+' '+o.freq+' (Δ'+dd+')'});
    });
  });
  side += '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'conf\')"><span class="cap">⚠ Конфлікти</span>'+
    '<span>'+(realConf.length?'<span class="count-pill" style="color:var(--red-soft)">'+realConf.length+'</span> ':'')+'<span class="arr">'+(sidePanels.conf?'▲':'▼')+'</span></span></div>'+
    '<div class="side-body'+(sidePanels.conf?'':' hid')+'">'+
    (realConf.length
      ? realConf.map(function(cf){ return '<div class="conflict-item">'+cf.lvl+' '+esc(cf.t)+'<div class="detail">'+esc(cf.d)+'</div></div>'; }).join('')
      : '<div class="empty">✅ Конфліктів немає</div>')+
    '</div></div>';

  // ── Спектр-аналізатор ──
  var range;
  if (bandGroup === '5.8') range = [5600, 6200];
  else if (bandGroup === '5.0') range = [4900, 5700];
  else if (bandGroup === '3.3') range = [3000, 3600];
  else {
    var fs = occupied.map(function(o){ return o.freq; }).concat(reserves.map(function(r){ return r.freq; }));
    if (fs.length) range = [Math.min.apply(null, fs) - 100, Math.max.apply(null, fs) + 100];
    else range = [5600, 6000];
  }
  function pos(f) { return Math.max(1.5, Math.min(98.5, (f - range[0]) / (range[1] - range[0]) * 100)); }
  var marks = '';
  occupied.forEach(function(o){
    if (o.freq < range[0] || o.freq > range[1]) return;
    var conf = conflictOf(o);
    var col = conf && conf.level==='critical' ? '#e74c3c' : (o.source==='mine' ? '#2ecc71' : (o.source==='external' ? '#7f8c8d' : '#3498db'));
    var lbl = (o.source==='mine' ? 'ВИ' : o.crew) + ' (' + o.freq + ')';
    marks += '<div class="spec-mark'+(conf&&conf.level==='critical'?' dash':'')+'" style="left:'+pos(o.freq)+'%;border-color:'+col+'">'+
      '<div class="spec-lbl" style="background:'+col+'">'+esc(lbl)+'</div></div>';
  });
  reserves.forEach(function(r){
    if (r.freq < range[0] || r.freq > range[1]) return;
    marks += '<div class="spec-mark dash" style="left:'+pos(r.freq)+'%;border-color:#9b59b6">'+
      '<div class="spec-lbl" style="background:#9b59b6">🔄 '+esc(r.crew)+' ('+r.freq+')</div></div>';
  });
  var spectrum = '<div class="spectrum">'+
    '<div class="spec-head"><span>'+(range[0]/1000).toFixed(1)+' GHz</span><span>Аналізатор спектру · зайнятість</span>'+
    '<span>'+(range[1]/1000).toFixed(1)+' GHz <button class="tgl" onclick="toggleSpec()">'+(specOpen?'▼':'▲')+'</button></span></div>'+
    '<div class="spec-area'+(specOpen?'':' hid')+'">'+marks+'</div></div>';

  c.innerHTML = '<div class="view-title">Матриця <span class="accent">частот</span> <span style="font-size:14px;color:var(--dim)">(VHF/UHF)</span></div>'+
    '<div class="view-sub">Клік по клітинці — позначити/зняти чужу частоту</div>'+
    legend +
    '<div class="freq-layout">'+ m +'<div>'+ side +'</div></div>'+
    spectrum;
}
function cellClick(freq) {
  var ext = (S.freq && S.freq.active || []).filter(function(a){ return a.source==='external' && a.freq===freq; });
  if (ext.length) { delExt(freq); return; }

    '<div class="f"><label>Опис</label><input type="text" id="extDesc" placeholder="Напр. Сусідній підрозділ"></div>'+
    '<button class="btn" onclick="confirmExt('+freq+')">Позначити зайнятою</button>'

function confirmExt(freq) {
  var desc = $('extDesc').value.trim() || 'Чужий підрозділ';
  rpc('addExternalFreq', [freq, desc], function(){ closeModal(); toast('⚫ '+freq+' МГц позначено'); reloadFreq(); });
}
function delExt(freq) {
  rpc('removeExternalFreq', [freq], function(){ toast('✅ '+freq+' МГц звільнено'); reloadFreq(); });
}
function doSwapFreq(crewId, code) {
  rpc('swapCrewFrequency', [crewId, code], function(){ toast('🎚 '+crewId+' → '+code); loadAll(); });
}
function reloadFreq() {
  rpc('getFrequencyAnalysis', [], function(v){ S.freq = v; updateTopStats(); renderView(); });
}

}
function doSimStatus(id, st) {

}
function openAddTracker() {
  var simOpts = S.sims.filter(function(s){ return !s.binding; }).map(function(s){
    return '<option value="'+esc(s.id)+'">'+esc(s.contact)+' · '+esc(s.number)+'</option>';
  }).join('');
  openModal('📡 Новий трекер',
    '<div class="f"><label>Модель *</label><input type="text" id="atModel" placeholder="ST-901"></div>'+
    '<div class="f"><label>Заводський ID / IMEI</label><input type="text" id="atImei" placeholder="8641290055512"></div>'+
    '<div class="f"><label>SIM-карта</label><select id="atSim"><option value="">— без SIM —</option>'+simOpts+'</select></div>'+
    '<div class="f"><label>Примітка</label><input type="text" id="atNote"></div>'+
    '<button class="btn" id="atBtn" onclick="doAddTracker()">➕ Додати трекер</button>'
