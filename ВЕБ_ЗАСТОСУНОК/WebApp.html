/* ── Дії редагування сектора ── */
function sectorArm(mode) {
  if (!sectorCanEdit()) { toast('⚠ Потрібне право «Екіпажі» або адмін', true); return; }
  sectorEdit = true;
  sectorDraw = mode;
  // Межі редагуються «як є»: стартуємо з наявних вершин, а не з чистого листа
  sectorDrawPts = mode === 'bounds'
    ? (sectorById(sectorSel).bounds || []).map(function(p){ return p.slice(); })
    : [];
  renderView();
  toast(mode === 'bounds' ? '✎ Тягни вершини · клік по вершині — видалити · клік по карті — нова'
    : mode === 'position' ? '📍 Клікни точку нової позиції на карті'
    : '🔶 Клікни точку орієнтира на карті');
}
function sectorBoundsDone() {
  if (sectorDrawPts.length < 3) { toast('⚠ Потрібно мінімум 3 вершини — площа не існує', true); return; }
  sectorById(sectorSel).bounds = sectorDrawPts.map(function(p){ return p.slice(); });
  sectorDraw = null; sectorDrawPts = [];
  saveSectors(); renderView();
  toast('💾 Межі сектору оновлено');
}
function sectorDrawCancel() { sectorDraw = null; sectorDrawPts = []; sectorMoveTarget = null; renderView(); }

/* ── Редагування меж «по-живому»: полігон + вершини-ручки ── */
var _secHandles = [];
// Перемалювати робочий полігон (ручки не чіпаємо — важливо під час перетягування)
function sectorBoundsRefresh(map) {
  if (_sectorDrawLayer) { try { map.removeLayer(_sectorDrawLayer); } catch(e) {} _sectorDrawLayer = null; }
  if (sectorDrawPts.length >= 3) {
    _sectorDrawLayer = L.polygon(sectorDrawPts, { color: '#ffb800', weight: 2, dashArray: '4 3', fillOpacity: .08, interactive: false }).addTo(map);
  } else if (sectorDrawPts.length === 2) {
    _sectorDrawLayer = L.polyline(sectorDrawPts, { color: '#ffb800', weight: 2, dashArray: '4 3', interactive: false }).addTo(map);
  }
  var btn = $('secDoneBtn');
  if (btn) btn.textContent = '✓ Готово ('+sectorDrawPts.length+')';
}
// Перебудувати ручки вершин (тягнеться — вершина їде, клік — видалення)
function sectorBoundsHandles(map) {
  _secHandles.forEach(function(h){ try { map.removeLayer(h); } catch(e) {} });
  _secHandles = [];
  sectorDrawPts.forEach(function(p, i){
    var mk = L.marker(p, { draggable: true, icon: L.divIcon({
      className: '', iconSize: [14, 14], iconAnchor: [7, 7],
      html: '<div class="hud-vertex"></div>'
    }) }).addTo(map);
    mk._dragged = false;
    mk.on('dragstart', function(){ mk._dragged = true; });
    mk.on('drag', function(ev){
      sectorDrawPts[i] = [ +ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6) ];
      sectorBoundsRefresh(map);
    });
    mk.on('click', function(){
      // Клік одразу після перетягування — не видалення
      if (mk._dragged) { mk._dragged = false; return; }
      sectorVtxDelete(i);
    });
    mk.bindTooltip('Тягни — перемістити · клік — видалити', { direction: 'top', offset: [0, -10] });
    _secHandles.push(mk);
  });
}
function sectorVtxDelete(i) {
  if (sectorDrawPts.length <= 3) { toast('⚠ Мінімум 3 вершини — спочатку додай нову', true); return; }
  sectorDrawPts.splice(i, 1);
  if (_sectorMapObj) { sectorBoundsRefresh(_sectorMapObj); sectorBoundsHandles(_sectorMapObj); }
}
// Нова вершина: до 3-х — просто додається, далі — вставляється в найближчу грань
function sectorInsertVertex(ll, map) {
  if (sectorDrawPts.length < 3) {
    sectorDrawPts.push(ll);
  } else {
    var P = map.latLngToLayerPoint(L.latLng(ll[0], ll[1]));
    var best = 0, bestD = Infinity;
    for (var i = 0; i < sectorDrawPts.length; i++) {
      var j = (i + 1) % sectorDrawPts.length;
      var a = map.latLngToLayerPoint(L.latLng(sectorDrawPts[i][0], sectorDrawPts[i][1]));
      var b = map.latLngToLayerPoint(L.latLng(sectorDrawPts[j][0], sectorDrawPts[j][1]));
      var d = L.LineUtil.pointToSegmentDistance(P, a, b);
      if (d < bestD) { bestD = d; best = i; }
    }
    sectorDrawPts.splice(best + 1, 0, ll);
  }
  sectorBoundsRefresh(map);
  sectorBoundsHandles(map);
}
// Перемістити конкретний маркер: озброюємо режим, наступний клік по карті — нова точка
var sectorMoveTarget = null;   // { kind:'pos'|'lm', i }
function sectorMoveArm(kind, i) {
  if (!sectorCanEdit()) { toast('⚠ Потрібне право «Екіпажі» або адмін', true); return; }
  sectorEdit = true;
  sectorDraw = 'move';
  sectorMoveTarget = { kind: kind, i: i };
  renderView();
  toast('✥ Клікни нову точку на карті');
}
function sectorPosRename(i) {
  var ps = sectorPositions(sectorById(sectorSel));
  if (!ps[i]) return;
  var name = prompt('Назва позиції:', ps[i].name || 'Позиція');
  if (name === null || !name.trim()) return;
  ps[i].name = name.trim();
  saveSectors(); renderView();
}
function sectorPosDelete(i) {
  var ps = sectorPositions(sectorById(sectorSel));
  if (!ps[i] || !confirm('🗑 Видалити позицію «'+(ps[i].name||'Позиція')+'»?')) return;
  ps.splice(i, 1);
  saveSectors(); renderView();
}
function sectorLmRename(i) {
  var sec = sectorById(sectorSel);
  var lm = sec.landmarks[i];
  if (!lm) return;
  var name = prompt('Назва орієнтира:', lm.name);
  if (name === null || !name.trim()) return;
  lm.name = name.trim();
  saveSectors(); renderView();
}
function sectorLmDelete(i) {
  var sec = sectorById(sectorSel);
  var lm = sec.landmarks[i];
  if (!lm || !confirm('🗑 Видалити орієнтир «'+lm.name+'»?')) return;
  sec.landmarks.splice(i, 1);
  saveSectors(); renderView();
}
// Медіа маркера (орієнтир або позиція): data-URL (файл) або зовнішнє
// посилання. Сумісність зі старим полем video. Перегляд — у картці маркера.
function sectorItem(kind, i) {
  var sec = sectorById(sectorSel);
  return kind === 'pos' ? sectorPositions(sec)[i] : sec.landmarks[i];
}
function sectorMediaHtml(obj) {
  var m = obj.media || (obj.video ? { type:'video', src: obj.video } : null);
  if (!m || !m.src) return '<span style="color:#888">🎬 Медіа — не додано</span>';
  if (m.type === 'video') return '<video src="'+esc(m.src)+'" controls preload="metadata" style="max-width:220px;max-height:150px;margin-top:4px;background:#000"></video>';
  return '<img src="'+esc(m.src)+'" style="max-width:220px;max-height:150px;margin-top:4px" alt="">';
}
function sectorMedia(kind, i) {
  var obj = sectorItem(kind, i);
  if (!obj) return;
  var curUrl = (obj.media && /^https?:/.test(obj.media.src)) ? obj.media.src : '';
  openModal('🎬 Медіа: '+esc(obj.name || (kind==='pos' ? 'Позиція' : 'Орієнтир')),
    (obj.media || obj.video ? '<div class="hint" style="margin-bottom:8px">Уже додано: '+((obj.media&&obj.media.type==='video')||obj.video?'відео':'фото')+
      ' — <a href="#" style="color:var(--red)" onclick="sectorMediaClear(\''+kind+'\','+i+');return false">🗑 прибрати</a></div>' : '')+
    '<div class="f"><label>Файл — фото або коротке відео</label><input type="file" id="lmFile" accept="image/*,video/*"></div>'+
    '<div class="hint" style="text-align:center;margin:6px 0">— або —</div>'+
    '<div class="f"><label>Посилання на фото/відео</label><input type="text" id="lmUrl" placeholder="https://…" value="'+esc(curUrl)+'"></div>'+
    '<div class="hint" style="margin-bottom:8px">До появи бекенду медіа зберігається локально на цьому пристрої, тож великі відео краще давати посиланням.</div>'+
    '<button class="btn btn-green" id="lmMediaBtn" onclick="sectorMediaSave(\''+kind+'\','+i+')">💾 Зберегти</button>'
  );
}
function sectorMediaClear(kind, i) {
  var obj = sectorItem(kind, i);
  if (!obj) return;
  delete obj.media; delete obj.video;
  saveSectors(); closeModal(); renderView();
  toast('🗑 Медіа прибрано');
}
function sectorMediaSave(kind, i) {
  var obj = sectorItem(kind, i);
  if (!obj) return;
  var url = ($('lmUrl').value || '').trim();
  var fileEl = $('lmFile');
  var file = fileEl && fileEl.files && fileEl.files[0];
  function apply(media) {
    var prev = obj.media, prevV = obj.video;
    obj.media = media; delete obj.video;
    try {
      localStorage.setItem('wh_sectors', JSON.stringify(SECTORS));
    } catch(e) {
      obj.media = prev; obj.video = prevV;   // відкат, сховище переповнене
      toast('❌ Замало місця для файлу локально — постав менший або дай посилання', true);
      return;
    }
    closeModal(); renderView();
    toast('🎬 Медіа збережено');
  }
  if (file) {
    var btn = $('lmMediaBtn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Читання…'; }
    var type = file.type.indexOf('video') === 0 ? 'video' : 'image';
    var reader = new FileReader();
    reader.onload = function(){ apply({ type: type, src: String(reader.result) }); };
    reader.onerror = function(){ if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; } toast('❌ Не вдалося прочитати файл', true); };
    reader.readAsDataURL(file);
  } else if (url) {
    apply({ type: /\.(mp4|webm|mov|ogg|m4v)(\?|#|$)/i.test(url) ? 'video' : 'image', src: url });
  } else {
    toast('⚠ Обери файл або встав посилання', true);
  }
}
function sectorDeleteCur() {
  var sec = sectorById(sectorSel);
  if (!sec) return;
  if (!confirm('🗑 Видалити сектор «'+sec.name+'» з усіма позиціями й орієнтирами?\nРозподіл людей у цей сектор буде знято.')) return;
  SECTORS = SECTORS.filter(function(s){ return s.id !== sec.id; });
  sectorSel = SECTORS.length ? SECTORS[0].id : '';
  sectorDraw = null; sectorMoveTarget = null;
  saveSectorsLocal(); renderView();
  // Бекенд сам чистить посилання на сектор у Персоналі та екіпажах
  rpc('deleteSector', [sec.id], function(){ loadAll(); }, function(e){
    toast('⚠ Не видалено з таблиці: ' + ((e && e.message) || e), true);
  });
  toast('🗑 Сектор «'+sec.name+'» видалено');
}
function sectorAddModal() {
  openModal('➕ Новий сектор',
    '<div class="f"><label>Назва сектору *</label><input type="text" id="nsName" placeholder="напр. ПОЛІГОН-2"></div>'+
    '<div class="hint" style="margin-bottom:8px">Після створення застосунок увімкне режим редагування — намалюй межі кліками по карті й постав позицію.</div>'+
    '<button class="btn btn-green" onclick="sectorAddDo()">➕ Створити</button>'
  );
}
function sectorAddDo() {
  var name = $('nsName').value.trim();
  if (!name) { toast('⚠ Вкажи назву', true); return; }
  var maxN = 0;
  SECTORS.forEach(function(s){ var m = String(s.id).match(/-(\d+)$/); if (m) maxN = Math.max(maxN, +m[1]); });
  var id = 'SEC-' + (maxN + 1);
  SECTORS.push({ id: id, name: name, status: 'Активний', bounds: [], positions: [], landmarks: [] });
  sectorSel = id;
  saveSectors();
  closeModal();
  sectorArm('bounds');
}

function renderSectorMap(sec) {
  ensureLeaflet(function(){
    if (_sectorMapObj) { try { _sectorMapObj.remove(); } catch(e) {} _sectorMapObj = null; }
    _sectorDrawLayer = null;
    var el = $('sectorMap');
    if (!el) return;
    el.innerHTML = '';
    // Підказка режиму малювання поверх карти
    if (sectorDraw) {
      var hint = document.createElement('div');
      hint.className = 'map-hint';
      hint.textContent = sectorDraw === 'bounds' ? '✎ Тягни вершини · клік по вершині — видалити · клік по карті — нова'
        : sectorDraw === 'position' ? '📍 Клікни точку нової позиції'
        : sectorDraw === 'move' ? '✥ Клікни нову точку маркера'
        : '🔶 Клікни точку орієнтира';
      el.parentElement.appendChild(hint);
      el._hint = hint;
    }
    var map = hudMap(el);
    _sectorMapObj = map;

    // Межі області роботи — пунктирний янтарний полігон.
    // У режимі «Межі» замість нього — редагована копія з ручками-вершинами.
    if (sectorDraw === 'bounds') {
      _secHandles = [];
      sectorBoundsRefresh(map);
      sectorBoundsHandles(map);
    } else if (sec.bounds && sec.bounds.length >= 3) {
      L.polygon(sec.bounds, { color: '#ffb800', weight: 2, dashArray: '6 4', fillColor: '#ffb800', fillOpacity: .06 })
        .addTo(map).bindTooltip('Межі роботи · '+sec.name, { sticky: true });
    }
    // Позиції — зелені ромби з підписами; їх може бути кілька
    sectorPositions(sec).forEach(function(ps, i){
      var posMk = hudMarker(ps.coords, 'diamond', '#2ecc71', ps.name || 'Позиція')
        .addTo(map).bindTooltip('🟢 '+(ps.name||'Позиція'), { direction: 'top', offset: [0, -10] });
      posMk.bindPopup('<div style="font-family:monospace;font-size:12px;min-width:200px"><b>🟢 '+esc(ps.name||'Позиція')+'</b>'+
        '<br><span style="color:#888">'+ps.coords[0].toFixed(5)+', '+ps.coords[1].toFixed(5)+'</span>'+
        '<br>'+sectorMediaHtml(ps)+
        (sectorEdit ? '<br><a href="#" onclick="sectorMoveArm(\'pos\','+i+');return false">✥ перемістити</a> · '+
          '<a href="#" onclick="sectorPosRename('+i+');return false">✎ назва</a>'+
          '<br><a href="#" onclick="sectorMedia(\'pos\','+i+');return false">🎬 медіа</a> · '+
          '<a href="#" style="color:#e74c3c" onclick="sectorPosDelete('+i+');return false">🗑 видалити</a>' : '')+
        '</div>', { maxWidth: 260 });
    });
    // Орієнтири — янтарні ромби; картка з відео-заглушкою, в редагуванні ✎/🗑
    sec.landmarks.forEach(function(lm, i){
      var short = String(lm.name).split('·')[0].trim();
      hudMarker(lm.coords, 'diamond', '#ffb800', short)
        .addTo(map)
        .bindTooltip('🔶 '+lm.name, { direction: 'top', offset: [0, -10] })
        .bindPopup('<div style="font-family:monospace;font-size:12px;min-width:200px"><b>🔶 '+esc(lm.name)+'</b>'+
          '<br><span style="color:#888">'+lm.coords[0].toFixed(5)+', '+lm.coords[1].toFixed(5)+'</span>'+
          '<br>'+sectorMediaHtml(lm)+
          (sectorEdit ? '<br><a href="#" onclick="sectorMoveArm(\'lm\','+i+');return false">✥ перемістити</a> · '+
            '<a href="#" onclick="sectorLmRename('+i+');return false">✎ назва</a>'+
            '<br><a href="#" onclick="sectorMedia(\'lm\','+i+');return false">🎬 медіа</a> · '+
            '<a href="#" style="color:#e74c3c" onclick="sectorLmDelete('+i+');return false">🗑 видалити</a>' : '')+
        '</div>', { maxWidth: 260 });
    });
    // Втрати з реальної карти втрат — червоні ✕, якщо дані вже завантажені
    (S.lostMap || []).filter(function(x){ return x.lat && x.lng; }).forEach(function(x){
      hudMarker([x.lat, x.lng], 'x', '#e74c3c', x.id || '')
        .addTo(map).bindTooltip('❌ '+(x.imei||x.id)+(x.date?' · '+x.date:''), { direction: 'top', offset: [0, -10] });
    });

    // Кліки малювання (орієнтир / позиція / межі)
    map.on('click', function(ev){
      if (!sectorEdit || !sectorDraw) return;
      var ll = [ +ev.latlng.lat.toFixed(6), +ev.latlng.lng.toFixed(6) ];
      if (sectorDraw === 'landmark') {
        var name = prompt('Назва орієнтира:', 'Орієнтир-'+(sec.landmarks.length+1));
        if (name === null || !name.trim()) return;
        sec.landmarks.push({ name: name.trim(), coords: ll, video: '' });
        sectorDraw = null;
        saveSectors(); renderView();
        toast('🔶 Орієнтир «'+name.trim()+'» додано');
      } else if (sectorDraw === 'position') {
        var ps = sectorPositions(sec);
        var pname = prompt('Назва позиції:', 'Позиція'+(ps.length ? '-'+(ps.length+1) : ''));
        if (pname === null || !pname.trim()) return;
        ps.push({ name: pname.trim(), coords: ll });
        sectorDraw = null;
        saveSectors(); renderView();
        toast('📍 Позицію «'+pname.trim()+'» додано');
      } else if (sectorDraw === 'move' && sectorMoveTarget) {
        var t = sectorMoveTarget;
        if (t.kind === 'pos') { var ps = sectorPositions(sec); if (ps[t.i]) ps[t.i].coords = ll; }
        else if (sec.landmarks[t.i]) sec.landmarks[t.i].coords = ll;
        sectorDraw = null; sectorMoveTarget = null;
        saveSectors(); renderView();
        toast('✥ Переміщено');
      } else if (sectorDraw === 'bounds') {
        sectorInsertVertex(ll, map);
      }
    });

    if (sec.bounds && sec.bounds.length >= 3) map.fitBounds(sec.bounds, { padding: [30, 30] });
    else if (sectorPositions(sec).length) map.setView(sectorPositions(sec)[0].coords, 13);
    else map.setView([48.5, 35.0], 6);
    setTimeout(function(){ map.invalidateSize(); }, 150);
  });
}

/* ── Погода для FPV: open-meteo (координати огрублені до ~1 км) + KP-індекс ── */
var _wx = { ts: 0, data: null, kp: null };
function loadSectorWeather(sec) {
  function paint() {
    var w = _wx.data;
    var el;
    if ((el = $('wxWind'))) {
      if (w) {
        var dirs = ['Пн','ПнСх','Сх','ПдСх','Пд','ПдЗх','Зх','ПнЗх'];
        var d = dirs[Math.round((w.dir||0) / 45) % 8];
        el.textContent = '≋ Вітер: '+Math.round(w.wind)+' м/с ('+d+') · пориви '+Math.round(w.gust);
        el.style.color = w.gust >= 12 ? 'var(--red)' : (w.gust >= 8 ? 'var(--yellow)' : '');
        el.title = w.gust >= 8 ? 'Сильний вітер — обережно з легкими бортами' : '';
      } else el.textContent = '≋ Вітер: —';
    }
    if ((el = $('wxTemp'))) el.textContent = w ? '🌡 '+(w.temp > 0 ? '+' : '')+Math.round(w.temp)+'°C' : '🌡 —';
    if ((el = $('wxKp'))) {
      el.textContent = 'KP: '+(_wx.kp === null ? '—' : _wx.kp);
      el.style.color = _wx.kp >= 7 ? 'var(--red)' : (_wx.kp >= 5 ? 'var(--yellow)' : '');
    }
  }
  var p0 = sec ? sectorPositions(sec)[0] : null;
  var c = (p0 && p0.coords) ||
          (sec && sec.bounds && sec.bounds.length ? sec.bounds[0] : null);
  if (!c || typeof fetch === 'undefined') { paint(); return; }
  if (_wx.data && Date.now() - _wx.ts < 10*60*1000) { paint(); return; }
  paint(); // «…» → показати одразу, оновиться після відповіді
  var lat = c[0].toFixed(2), lng = c[1].toFixed(2); // огрублення координат
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+
    '&current=temperature_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m&wind_speed_unit=ms')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var cu = j && j.current;
      if (!cu) return;
      _wx.data = { temp: cu.temperature_2m, wind: cu.wind_speed_10m, gust: cu.wind_gusts_10m, dir: cu.wind_direction_10m };
      _wx.ts = Date.now();
      paint();
    }).catch(function(){});
  fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json')
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if (!Array.isArray(rows) || !rows.length) return;
      // Формат буває масивом обʼєктів {Kp: 2.33} або масивом рядків [time, Kp, …]
      var last = rows[rows.length - 1];
      var kp = parseFloat(last && last.Kp !== undefined ? last.Kp : (last && last[1]));
      if (!isNaN(kp)) { _wx.kp = Math.round(kp); paint(); }
    }).catch(function(){});
}

/* ── Вкладка «Статистика»: конструктор графіків ──
   Кожна картка — вибір даних + вигляду + періоду; «+» додає картку, 🗑 прибирає.
   Набір карток зберігається локально (wh_sector_charts) — у кожного свій. */

// Доступні дані. kind: series (по днях) | cat (по екіпажах) | parts (частки).
// Період застосовний до всього, що рахується з вильотів; noDays — зрізу немає.
var SC_METRICS = {
  flights:    { name: 'Вильоти',                 kind: 'series', unit: 'вильотів', color: '#3498db' },
  losses:     { name: 'Втрати бортів',           kind: 'series', unit: 'втрат',    color: '#e74c3c' },
  avgdur:     { name: 'Сер. тривалість (хв)',    kind: 'series', unit: 'хв',       color: '#3498db' },
  flByCrew:   { name: 'Вильоти по екіпажах',     kind: 'cat',    color: '#3498db' },
  lossByCrew: { name: 'Втрати по екіпажах',      kind: 'cat',    color: '#e74c3c' },
  outcome:    { name: 'Результат вильотів',      kind: 'parts' },
  invStatus:  { name: 'Інвентар за статусами',   kind: 'parts', noDays: true, idFilter: true },
  trkStatus:  { name: 'Трекери за статусами',    kind: 'parts', noDays: true }
};
var SC_TYPES = { series: [['bar','Стовпчики'],['line','Лінія']], cat: [['hbar','Смуги']], parts: [['share','Частки']] };

var SC_CHARTS = (function(){
  try {
    var s = JSON.parse(localStorage.getItem('wh_sector_charts') || 'null');
    if (Array.isArray(s) && s.length) return s.filter(function(x){ return SC_METRICS[x.m]; });
  } catch(e) {}
  return [ { m:'flights', t:'bar', days:14 }, { m:'outcome', t:'share', days:0 }, { m:'flByCrew', t:'hbar', days:30 } ];
})();
function scSave() { try { localStorage.setItem('wh_sector_charts', JSON.stringify(SC_CHARTS)); } catch(e) {} }
function scAdd() { SC_CHARTS.push({ m:'flights', t:'bar', days:14 }); scSave(); renderView(); }
function scDel(i) { SC_CHARTS.splice(+i, 1); scSave(); renderView(); }
function scSet(i, key, val) {
  var c = SC_CHARTS[+i];
  if (!c) return;
  if (key === 'days') c.days = +val;
  else c[key] = val;
  // Дані іншого роду — вигляд скидається на перший сумісний, фільтр типу теж
  if (key === 'm') { c.t = SC_TYPES[SC_METRICS[c.m].kind][0][0]; delete c.f; }
  scSave(); renderView();
}

// Тип предмета за ID: префікс до дефіса (STNG-3 → STNG, FPV-101 → FPV)
function scIdPrefix(id) {
  return String(id || '').split('-')[0].trim().toUpperCase();
}

// Зріз вильотів за період (0 = увесь час)
function scFilterDays(flts, days) {
  if (!days) return flts;
  var from = Date.now() - days * 864e5;
  return flts.filter(function(f){
    var d = new Date(sectorYmd(f.date));
    return !isNaN(d) && d.getTime() >= from;
  });
}

// Ряд по днях для метрики
function scSeries(m, flts, days) {
  var D = days || 14, byDay = {}, durByDay = {};
  flts.forEach(function(f){
    var d = sectorYmd(f.date);
    if (!d) return;
    if (m === 'flights') byDay[d] = (byDay[d]||0)+1;
    else if (m === 'losses') { if (f.status === 'Втрачений') byDay[d] = (byDay[d]||0)+1; }
    else if (m === 'avgdur') {
      var toMin = function(t){ var x = String(t||'').match(/(\d{1,2}):(\d{2})/); return x ? (+x[1])*60 + (+x[2]) : null; };
      var a = toMin(f.start), b = toMin(f.end);
      if (a === null || b === null) return;
      var dur = b - a; if (dur < 0) dur += 24*60;
      if (dur > 0 && dur < 6*60) (durByDay[d] = durByDay[d] || []).push(dur);
    }
  });
  if (m === 'avgdur') Object.keys(durByDay).forEach(function(d){
    byDay[d] = Math.round(durByDay[d].reduce(function(s,x){ return s+x; }, 0) / durByDay[d].length);
  });
  var out = [];
  for (var i = D - 1; i >= 0; i--) {
    var dt = new Date(Date.now() - i*864e5).toISOString().slice(0,10);
    out.push({ d: dt, n: byDay[dt] || 0 });
  }
  return out;
}

// Стовпчики по днях (адаптивно до довжини періоду; сьогодні — акцент)
function scChartBar(series, unit, color) {
  var D = series.length;
  var maxN = Math.max(1, Math.max.apply(null, series.map(function(x){ return x.n; })));
  var W = 560, H = 150, padL = 26, plotW = W - padL - 6, plotH = H - 22 - 12;
  var bw = plotW / D, gap = Math.min(6, Math.max(1, Math.round(bw/3)));
  var step = Math.max(1, Math.ceil(D / 7));   // ~7 підписів дат
  var bars = series.map(function(x, i){
    var h = Math.round(x.n / maxN * plotH);
    var bx = padL + i*bw + gap/2, by = 12 + plotH - h;
    var isToday = i === D - 1;
    var lbl = (isToday || x.n === maxN) && x.n && bw >= 10
      ? '<text x="'+(bx + (bw-gap)/2)+'" y="'+(by - 3)+'" text-anchor="middle" font-size="9" font-family="monospace" fill="#a8a5a2">'+x.n+'</text>' : '';
    var xLbl = ((D - 1 - i) % step === 0)
      ? '<text x="'+(bx + (bw-gap)/2)+'" y="'+(H - 8)+'" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#7f7c78">'+x.d.slice(8,10)+'.'+x.d.slice(5,7)+'</text>' : '';
    return '<rect x="'+bx+'" y="'+by+'" width="'+Math.max(bw-gap, 1)+'" height="'+Math.max(h, x.n?2:0)+'" rx="'+(bw>=8?2:0)+'" fill="'+(isToday ? '#ffb800' : color)+'">'+
      '<title>'+x.d+' · '+x.n+' '+unit+'</title></rect>'+lbl+xLbl;
  }).join('');
  var grid = [0, .5, 1].map(function(t){
    var y = 12 + plotH - t*plotH;
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#2a2a2a" stroke-width="1"/>'+
      '<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="8" font-family="monospace" fill="#7f7c78">'+Math.round(t*maxN)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+bars+'</svg>';
}

// Лінія по днях (точки з підказками; остання — акцент)
function scChartLine(series, unit, color) {
  var D = series.length;
  var maxN = Math.max(1, Math.max.apply(null, series.map(function(x){ return x.n; })));
  var W = 560, H = 150, padL = 26, plotW = W - padL - 12, plotH = H - 22 - 12;
  var step = Math.max(1, Math.ceil(D / 7));
  function px(i) { return padL + (D === 1 ? plotW/2 : i * plotW / (D - 1)); }
  function py(n) { return 12 + plotH - n / maxN * plotH; }
  var pts = series.map(function(x, i){ return px(i).toFixed(1)+','+py(x.n).toFixed(1); }).join(' ');
  var area = padL+','+(12+plotH)+' '+pts+' '+px(D-1).toFixed(1)+','+(12+plotH);
  var dots = series.map(function(x, i){
    var last = i === D - 1;
    var xLbl = ((D - 1 - i) % step === 0)
      ? '<text x="'+px(i)+'" y="'+(H - 8)+'" text-anchor="middle" font-size="7.5" font-family="monospace" fill="#7f7c78">'+x.d.slice(8,10)+'.'+x.d.slice(5,7)+'</text>' : '';
    var vLbl = (last || x.n === maxN) && x.n
      ? '<text x="'+px(i)+'" y="'+(py(x.n) - 6)+'" text-anchor="middle" font-size="9" font-family="monospace" fill="#a8a5a2">'+x.n+'</text>' : '';
    return '<circle cx="'+px(i)+'" cy="'+py(x.n)+'" r="8" fill="transparent"><title>'+x.d+' · '+x.n+' '+unit+'</title></circle>'+
      '<circle cx="'+px(i)+'" cy="'+py(x.n)+'" r="'+(last?3.5:2.5)+'" fill="'+(last?'#ffb800':color)+'" pointer-events="none"/>'+vLbl+xLbl;
  }).join('');
  var grid = [0, .5, 1].map(function(t){
    var y = 12 + plotH - t*plotH;
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(W-6)+'" y2="'+y+'" stroke="#2a2a2a" stroke-width="1"/>'+
      '<text x="'+(padL-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="8" font-family="monospace" fill="#7f7c78">'+Math.round(t*maxN)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+
    '<polygon points="'+area+'" fill="'+color+'" opacity=".08"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2"/>'+dots+'</svg>';
}

// Горизонтальні смуги по екіпажах (свій — акцент)
function scChartHBar(rows, color) {
  if (!rows.length) return '<div class="empty">Даних немає</div>';
  var maxC = Math.max(1, rows[0][1]);
  return rows.map(function(r){
    var own = S.auth && S.auth.crewId === r[0];
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px" title="'+esc(crewNameOnly(r[0]))+': '+r[1]+'">'+
      '<span style="width:120px;flex-shrink:0;font:700 10px var(--font-data);color:var(--muted);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(crewNameOnly(r[0]))+(own?' ·мій':'')+'</span>'+
      '<div style="flex:1;background:var(--panel-2)"><div style="width:'+Math.round(r[1]/maxC*100)+'%;height:12px;background:'+(own?'#ffb800':color)+'"></div></div>'+
      '<span style="width:26px;font:700 11px var(--font-data);color:#e5e2e1;text-align:right">'+r[1]+'</span>'+
    '</div>';
  }).join('');
}

// Сегментна смуга часток + легенда (+ опційне велике число зліва)
function scChartShare(segs, hero) {
  segs = segs.filter(function(s){ return s[1] > 0; });
  var total = segs.reduce(function(s, x){ return s + x[1]; }, 0);
  if (!total) return '<div class="empty">Даних немає</div>';
  var bar = segs.map(function(s){
    return '<div title="'+esc(s[0])+': '+s[1]+'" style="width:calc('+(s[1]/total*100)+'% - 2px);margin-right:2px;background:'+s[2]+';height:18px"></div>';
  }).join('');
  var legend = segs.map(function(s){
    return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-family:var(--font-data);font-size:10px;color:var(--muted)">'+
      '<span style="width:8px;height:8px;background:'+s[2]+';display:inline-block"></span>'+esc(s[0])+' · <b style="color:#e5e2e1">'+s[1]+'</b></span>';
  }).join('');
  return '<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
    (hero ? '<div style="font:700 34px var(--font-data);color:'+hero.color+'">'+hero.value+
      '<div style="font:700 9px var(--font-data);color:var(--muted);text-transform:uppercase;letter-spacing:.5px">'+hero.label+'</div></div>' : '')+
    '<div style="flex:1;min-width:200px"><div style="display:flex">'+bar+'</div>'+
    '<div style="margin-top:8px">'+legend+'</div></div></div>';
}

// Кольори статусів для часток
function scStatusColor(st) {
  return { 'Робочий':'#2ecc71','Активний':'#3498db','Завершений':'#2ecc71','Ремонт':'#f1c40f',
    'На перевірці':'#9b59b6','Несправний':'#e67e22','Зламаний':'#e67e22','Втрачений':'#e74c3c',
    'Списаний':'#7f8c8d','Резерв':'#3498db' }[st] || '#7f8c8d';
}

// Тіло однієї картки за конфігом {m, t, days}
function scChartBody(cfg, allFlts) {
  var M = SC_METRICS[cfg.m];
  var flts = M.noDays ? allFlts : scFilterDays(allFlts, cfg.days);
  if (M.kind === 'series') {
    var series = scSeries(cfg.m, allFlts, cfg.days || 14);
    return cfg.t === 'line' ? scChartLine(series, M.unit, M.color) : scChartBar(series, M.unit, M.color);
  }
  if (M.kind === 'cat') {
    var byCrew = {};
    flts.forEach(function(f){
      if (cfg.m === 'lossByCrew' && f.status !== 'Втрачений') return;
      var k = String(f.crew||'').trim() || '—';
      byCrew[k] = (byCrew[k]||0)+1;
    });
    var rows = Object.keys(byCrew).map(function(k){ return [k, byCrew[k]]; })
      .sort(function(a,b){ return b[1]-a[1]; }).slice(0, 8);
    return scChartHBar(rows, M.color);
  }
  // parts
  if (cfg.m === 'outcome') {
    var cnt = {};
    flts.forEach(function(f){ var s = f.status || 'Інше'; cnt[s] = (cnt[s]||0)+1; });
    var segs = ['Завершений','Активний','Втрачений'].map(function(s){ return [s, cnt[s]||0, scStatusColor(s)]; });
    var oth = Object.keys(cnt).filter(function(s){ return ['Завершений','Активний','Втрачений'].indexOf(s) === -1; })
      .reduce(function(a, s){ return a + cnt[s]; }, 0);
    if (oth) segs.push(['Інше', oth, '#7f8c8d']);
    var done = cnt['Завершений']||0, lostN = cnt['Втрачений']||0;
    var pct = (done + lostN) ? Math.round(done / (done + lostN) * 100) : null;
    return scChartShare(segs, pct === null ? null : { value: pct+'%', label: 'успішність',
      color: pct>=80 ? '#2ecc71' : (pct>=50 ? '#f1c40f' : '#e74c3c') });
  }
  var src = cfg.m === 'invStatus' ? S.items : S.trackers;
  // Зріз за типом предмета (префікс ID: STNG, FPV, GNST…) — якщо обрано
  if (M.idFilter && cfg.f) src = (src||[]).filter(function(x){ return scIdPrefix(x.id) === cfg.f; });
  var cnt2 = {};
  (src||[]).forEach(function(x){ var s = String(x.status||'').trim() || '—'; cnt2[s] = (cnt2[s]||0)+1; });
  return scChartShare(Object.keys(cnt2).sort(function(a,b){ return cnt2[b]-cnt2[a]; })
    .map(function(s){ return [s, cnt2[s], scStatusColor(s)]; }), null);
}

function renderSectorStats(flts) {
  var selStyle = 'style="font:700 10px var(--font-data);padding:3px 6px;min-width:0;width:auto"';
  var cards = SC_CHARTS.map(function(cfg, i){
    var M = SC_METRICS[cfg.m];
    var mOpts = Object.keys(SC_METRICS).map(function(k){
      return '<option value="'+k+'"'+(k===cfg.m?' selected':'')+'>'+SC_METRICS[k].name+'</option>';
    }).join('');
    var tList = SC_TYPES[M.kind];
    var tSel = tList.length > 1
      ? '<select '+selStyle+' data-i="'+i+'" onchange="scSet(this.dataset.i,\'t\',this.value)">'+
          tList.map(function(t){ return '<option value="'+t[0]+'"'+(t[0]===cfg.t?' selected':'')+'>'+t[1]+'</option>'; }).join('')+'</select>'
      : '';
    var dSel = M.noDays ? '' :
      '<select '+selStyle+' data-i="'+i+'" onchange="scSet(this.dataset.i,\'days\',this.value)">'+
        [[7,'7 дн.'],[14,'14 дн.'],[30,'30 дн.'],[90,'90 дн.'],[0,'Увесь час']].map(function(d){
          if (M.kind === 'series' && !d[0]) return ''; // ряд по днях без межі не має сенсу
          return '<option value="'+d[0]+'"'+(d[0]===(cfg.days||0)?' selected':'')+'>'+d[1]+'</option>';
        }).join('')+'</select>';
    // Зріз за типом предмета — список префіксів ID, зібраний із самого інвентарю
    var fSel = '';
    if (M.idFilter) {
      var seen = {};
      (S.items||[]).forEach(function(x){ var p = scIdPrefix(x.id); if (p) seen[p] = 1; });
      fSel = '<select '+selStyle+' data-i="'+i+'" onchange="scSet(this.dataset.i,\'f\',this.value)">'+
        '<option value="">Всі типи</option>'+
        Object.keys(seen).sort().map(function(p){
          return '<option value="'+p+'"'+(p===(cfg.f||'')?' selected':'')+'>'+p+'</option>';
        }).join('')+'</select>';
    }
    return '<div class="matrix-panel">'+
      '<div class="matrix-panel-head" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+
        '<select '+selStyle+' data-i="'+i+'" onchange="scSet(this.dataset.i,\'m\',this.value)">'+mOpts+'</select>'+
        tSel + dSel + fSel +
        '<button class="inv-act inv-act--del" title="Прибрати графік" style="margin-left:auto" data-i="'+i+'" onclick="scDel(this.dataset.i)">'+svgIcon('x')+'</button>'+
      '</div>'+
      '<div style="padding:12px">'+scChartBody(cfg, flts)+'</div>'+
    '</div>';
  }).join('');
  // Свідомо НЕ filter-row: та на мобільному розкладається у стовпчик і
  // розтягує кнопку «+» на весь рядок. Тут кнопка завжди компактна праворуч,
  // а підказка переносить текст усередині себе.
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px">'+
      '<div class="hint" style="min-width:0">Конструктор: обери дані, вигляд і період · набір зберігається на цьому пристрої</div>'+
      '<button class="icon-btn" title="Додати графік" style="background:var(--accent);color:var(--on-accent);flex:0 0 auto" onclick="scAdd()">'+svgIcon('plus')+'</button>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:12px">'+
    (cards || '<div class="empty">Графіків немає — додай перший кнопкою «+»</div>')+
  '</div>';
}

/* ── Вкладка «Розподіл»: особовий склад по секторах ──────────────
   Переміщає ТІЛЬКИ адмін (бекенд перевіряє теж). Людина, розподілена в
   сектор, у «чужих» секторах — «Відряджена»: не може бути в їхніх екіпажах
   і злітати. Без сектора — доступна скрізь (старі дані нічого не ламають). */
function renderSectorDist() {
  var isAdm = isAdminUser();
  var groups = SECTORS.map(function(s){ return { id: s.id, name: s.name }; });
  groups.push({ id: '', name: 'Не розподілені' });
  var secOpts = function(cur){
    return '<option value="">— без сектора —</option>' + SECTORS.map(function(s){
      return '<option value="'+esc(s.id)+'"'+(s.id===cur?' selected':'')+'>'+esc(s.name)+'</option>';
    }).join('');
  };
  var html = groups.map(function(g){
    var people = S.personnel.filter(function(p){ return (p.sector || '') === g.id; });
    var rows = people.map(function(p){
      var crewCell = p.crewId ? esc(p.crewName || p.crewId) : '<span class="hint">—</span>';
      var secCell = isAdm
        ? '<select style="width:auto;min-width:130px" data-op="'+esc(p.id)+'" onchange="sectorAssign(this.dataset.op, this.value)">'+secOpts(g.id)+'</select>'
        : (g.id ? esc(g.name) : '<span class="hint">—</span>');
      return '<tr><td>'+esc(p.callsign)+(p.name?' <span class="hint">('+esc(p.name)+')</span>':'')+'</td>'+
        '<td>'+esc(p.role || '—')+'</td><td>'+crewCell+'</td><td>'+secCell+'</td></tr>';
    }).join('');
    return '<div class="matrix-panel" style="margin-top:12px">'+
      '<div class="matrix-panel-head"><span class="cap">'+(g.id?'⬡ ':'')+esc(g.name)+'</span>'+
        '<span class="count-pill">'+people.length+'</span></div>'+
      (rows
        ? '<div style="overflow-x:auto"><table class="crew-table"><tr><th>Позивний</th><th>Роль</th><th>Екіпаж</th><th>Сектор</th></tr>'+rows+'</table></div>'
        : '<div class="empty">Нікого немає</div>')+
    '</div>';
  }).join('');
  return '<div class="hint" style="margin-top:12px">'+
    (isAdm
      ? 'Розподіл змінює тільки адміністратор. Людина, розподілена в сектор, у решті секторів — «Відряджена»: не може входити в їхні екіпажі та злітати. Без сектора — доступна скрізь.'
      : 'Розподіл особового складу по секторах змінює адміністратор.')+
    '</div>' + html;
}
function sectorAssign(opId, secId) {
  var p = personById(opId);
  if (!p) return;
  // Людина в екіпажі іншого сектора — спершу прибрати з екіпажу, інакше
  // з'явиться екіпаж із «відрядженим» членом, якого бекенд далі не пропустить
  if (secId && p.crewId) {
    var cr = crewById(p.crewId);
    if (cr && cr.sector && cr.sector !== secId) {
      toast('⚠ '+p.callsign+' в екіпажі '+(cr.crewName || cr.id)+' сектору «'+sectorName(cr.sector)+'» — спершу прибери з екіпажу', true);
      renderView(); return;
    }
  }
  rpc('setPersonSector', [opId, secId], function(){
    p.sector = secId;
    toast('✓ '+p.callsign+' → '+(secId ? sectorName(secId) : 'без сектора'));
    renderView();
  }, function(e){ toast('❌ '+((e && e.message) || e), true); renderView(); });
}

/* ═══════════ ВИД: GPS ТРЕКЕРИ ═══════════ */
/* Вкладка GPS трекерів — той самий патерн, що Інвентар/Екіпаж:
   заголовок + пошук праворуч, плитки-фільтри, вкладки, Перегляд/Редагування + «+», таблиця */
var trkTab = 'trk';   // trk | sim
var trkMode = 'view';
var trkFilter = { q: '', status: 'all' };
var TRK_STATUSES = ['Робочий', 'Зламаний', 'Втрачений'];
var SIM_STATUSES = ['Активна', 'Заблокована', 'Втрачена', 'Невідомо'];

function trkCanEdit() { return canEditInv() || !!(S.auth && S.auth.isMain); }
// Перемикання фільтра плиткою в межах поточної вкладки (повторний клік скидає)
function trkTile(st) {
  trkFilter.status = trkFilter.status === st ? 'all' : st;
  renderView();
}
// Вільний трекер = робочий і не зайнятий жодним активним екіпажем
function trkIsFree(t) {
  return String(t.status||'').trim() === 'Робочий' && !invTrackerCrew(t.id);
}

function renderTrackers(c) {
  var canEdit = trkCanEdit();
  var stats = {};
  S.trackers.forEach(function(t){ var s = String(t.status||'').trim(); stats[s] = (stats[s]||0)+1; });
  var freeTrks = S.trackers.filter(trkIsFree).length;
  var simStats = {};
  S.sims.forEach(function(s){ var x = String(s.status||'').trim(); simStats[x] = (simStats[x]||0)+1; });
  var freeSims = S.sims.filter(function(s){ return !s.binding; }).length;

  var sub = S.trackers.length + ' трекерів · ' + S.sims.length + ' SIM · ' +
    (canEdit ? (trkMode==='edit' ? 'редагування' : 'перегляд') : 'перегляд');

  var modeToggle = canEdit
    ? '<div class="inv-mode">'+
        '<button class="inv-mode-btn'+(trkMode!=='edit'?' active':'')+'" onclick="trkMode=\'view\';renderView()">Перегляд</button>'+
        '<button class="inv-mode-btn'+(trkMode==='edit'?' active':'')+'" onclick="trkMode=\'edit\';renderView()">Редагування</button>'+
      '</div>'
    : '';
  var addBtn = (canEdit && trkMode==='edit' && trkTab !== 'map')
    ? '<button class="icon-btn" title="'+(trkTab==='sim'?'Додати SIM-карту':'Додати трекер')+'" style="background:var(--accent);color:var(--on-accent)" onclick="'+(trkTab==='sim'?'openAddSim()':'openAddTracker()')+'">'+svgIcon('plus')+'</button>'
    : '';

  c.innerHTML = '<div class="flex-head" style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px">'+
    '<div><div class="view-title">GPS <span class="accent">трекери</span></div>'+
    '<div class="view-sub">'+sub+'</div></div>'+
    '<div style="margin-bottom:12px"><input type="text" id="trkSearch" placeholder="Пошук: IMEI, модель, SIM, борт…" value="'+esc(trkFilter.q)+'" oninput="trkFilter.q=this.value;renderTrkTable()" style="width:220px"></div>'+
  '</div>'+
    // Плитки-фільтри — незалежні для кожної вкладки
    (trkTab === 'map'
      ? lossTilesHtml()
      : trkTab === 'trk'
      ? '<div class="stat-row">'+
          '<div class="stat-tile green click'+(trkFilter.status==='Робочий'?' active':'')+'" onclick="trkTile(\'Робочий\')"><div class="stat-num">'+(stats['Робочий']||0)+'</div><div class="stat-lbl">Робочі</div></div>'+
          '<div class="stat-tile click'+(trkFilter.status==='Зламаний'?' active':'')+'" onclick="trkTile(\'Зламаний\')"><div class="stat-num">'+(stats['Зламаний']||0)+'</div><div class="stat-lbl">Зламані</div></div>'+
          '<div class="stat-tile red click'+(trkFilter.status==='Втрачений'?' active':'')+'" onclick="trkTile(\'Втрачений\')"><div class="stat-num">'+(stats['Втрачений']||0)+'</div><div class="stat-lbl">Втрачені</div></div>'+
          '<div class="stat-tile blue click'+(trkFilter.status==='freeTrk'?' active':'')+'" onclick="trkTile(\'freeTrk\')" title="Робочі, не зайняті екіпажем"><div class="stat-num">'+freeTrks+'</div><div class="stat-lbl">Вільні трекери</div></div>'+
        '</div>'
      : '<div class="stat-row">'+
          '<div class="stat-tile green click'+(trkFilter.status==='Активна'?' active':'')+'" onclick="trkTile(\'Активна\')"><div class="stat-num">'+(simStats['Активна']||0)+'</div><div class="stat-lbl">Активні</div></div>'+
          '<div class="stat-tile click'+(trkFilter.status==='Невідомо'?' active':'')+'" onclick="trkTile(\'Невідомо\')"><div class="stat-num">'+(simStats['Невідомо']||0)+'</div><div class="stat-lbl">Невідомо</div></div>'+
          '<div class="stat-tile red click'+(trkFilter.status==='blocked'?' active':'')+'" onclick="trkTile(\'blocked\')"><div class="stat-num">'+((simStats['Втрачена']||0)+(simStats['Заблокована']||0))+'</div><div class="stat-lbl">Втрачені + заблоковані</div></div>'+
          '<div class="stat-tile blue click'+(trkFilter.status==='free'?' active':'')+'" onclick="trkTile(\'free\')"><div class="stat-num">'+freeSims+'</div><div class="stat-lbl">Вільні SIM</div></div>'+
        '</div>')+
    '<div class="inv-tabs">'+
      '<button class="inv-tab'+(trkTab==='trk'?' active':'')+'" onclick="trkTab=\'trk\';trkFilter.status=\'all\';renderView()">Трекери</button>'+
      '<button class="inv-tab'+(trkTab==='sim'?' active':'')+'" onclick="trkTab=\'sim\';trkFilter.status=\'all\';renderView()">SIM-карти</button>'+
      '<button class="inv-tab'+(trkTab==='map'?' active':'')+'" onclick="trkTab=\'map\';renderView()">🗺 Карта втрат</button>'+
    '</div>'+
    (trkTab === 'map'
      ? '<div id="lostMap" style="height:56vh;border:1px solid var(--line);background:var(--panel-2)"></div>'+
        '<div id="lostList" style="margin-top:10px"></div>'
      : '<div class="filter-row"><div class="staff-actions">'+(trkTab==='trk' ? invCompactBtn() : '')+modeToggle+addBtn+'</div></div>'+
        '<div class="table-wrap"><table class="data-table" id="trkTable"></table></div>');
  if (trkTab === 'map') renderTrkMap();
  else renderTrkTable();
}

function renderTrkTable() {
  var el = $('trkTable');
  if (!el) return;
  var q = trkFilter.q.toLowerCase();
  var edit = trkMode === 'edit' && trkCanEdit();
  var head, rows;

  if (trkTab === 'trk') {
    var list = S.trackers.filter(function(t){
      if (trkFilter.status === 'freeTrk') { if (!trkIsFree(t)) return false; }
      else if (trkFilter.status !== 'all' && String(t.status||'').trim() !== trkFilter.status) return false;
      if (q && ((t.imei||'')+' '+t.id+' '+(t.model||'')+' '+(t.simContact||'')+' '+(t.simNumber||'')+' '+(t.binding||'')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    head = '<thead><tr><th>ID'+(edit?' / дії':'')+'</th>'+
      (invCompact ? '' : '<th>Модель</th>')+
      '<th>SIM</th>'+
      (invCompact ? '' : '<th>Борт</th><th>Екіпаж</th>')+
      '<th>Статус</th><th>Примітка</th></tr></thead>';
    rows = list.map(function(t){
      var crew = invTrackerCrew(t.id);
      var acts = '';
      if (edit) {
        acts = '<div class="inv-acts">'+
          (t.simContact
            ? '<button class="inv-act inv-act--del" title="Відв\'язати SIM" onclick="doUnbindSim(this.dataset.id)" data-id="'+esc(t.id)+'">'+svgIcon('x')+'</button>'
            : '<button class="inv-act inv-act--ok" title="Прив\'язати SIM" onclick="openBindSim(this.dataset.id)" data-id="'+esc(t.id)+'">'+svgIcon('plus')+'</button>')+
        '</div>';
      }
      var stCell = edit
        ? '<select class="inv-status-sel" style="width:auto;min-width:100px" data-id="'+esc(t.id)+'" onchange="doTrkStatus(this.dataset.id, this.value)">'+
            TRK_STATUSES.map(function(s){ return '<option value="'+s+'"'+(String(t.status).trim()===s?' selected':'')+'>'+s+'</option>'; }).join('')+
          '</select>'
        : statusChip(t.status);
      return '<tr>'+
        '<td class="mono accent">'+esc(t.imei||t.id)+(t.imei?'<div class="hint">'+esc(t.id)+'</div>':'')+acts+'</td>'+
        (invCompact ? '' : '<td class="mono">'+esc(t.model||'')+'</td>')+
        '<td class="mono">'+(t.simContact ? esc(t.simContact)+'<div class="hint">'+esc(t.simNumber||'')+'</div>' : '<span class="hint">— без SIM</span>')+'</td>'+
        (invCompact ? '' :
        '<td class="mono">'+esc(t.binding||'—')+'</td>'+
        '<td class="mono">'+(crew ? esc(crew.crewName || crew.id) : '—')+'</td>')+
        '<td>'+stCell+'</td>'+
        '<td class="mono" style="max-width:200px">'+noteCellHtml('trk', t.id, t.note, edit)+'</td>'+
      '</tr>';
    }).join('');
    el.innerHTML = head + '<tbody>'+(rows || '<tr><td colspan="'+(invCompact ? 4 : 7)+'" class="empty">Нічого не знайдено</td></tr>')+'</tbody>';
  } else {
    var slist = S.sims.filter(function(s){
      var st = String(s.status||'').trim();
      if (trkFilter.status === 'free') { if (s.binding) return false; }
      else if (trkFilter.status === 'blocked') { if (st !== 'Втрачена' && st !== 'Заблокована') return false; }
      else if (trkFilter.status !== 'all' && st !== trkFilter.status) return false;
      if (q && (s.id+' '+(s.contact||'')+' '+(s.number||'')+' '+(s.binding||'')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    head = '<thead><tr><th>ID</th><th>Контакт</th><th>Номер</th><th>Трекер</th><th>Статус</th></tr></thead>';
    rows = slist.map(function(s){
      var stCell = edit
        ? '<select class="inv-status-sel" style="width:auto;min-width:110px" data-id="'+esc(s.id)+'" onchange="doSimStatus(this.dataset.id, this.value)">'+
            SIM_STATUSES.map(function(x){ return '<option value="'+x+'"'+(String(s.status).trim()===x?' selected':'')+'>'+x+'</option>'; }).join('')+
          '</select>'
        : statusChip(s.status);
      return '<tr>'+
        '<td class="mono accent">'+esc(s.id)+'</td>'+
        '<td class="mono">'+esc(s.contact||'')+'</td>'+
        '<td class="mono">'+esc(s.number||'')+'</td>'+
        '<td class="mono">'+(s.binding ? esc(s.binding) : '<span class="hint">— вільна</span>')+'</td>'+
        '<td>'+stCell+'</td>'+
      '</tr>';
    }).join('');
    el.innerHTML = head + '<tbody>'+(rows || '<tr><td colspan="5" class="empty">Нічого не знайдено</td></tr>')+'</tbody>';
  }
}
function doTrkStatus(id, st) {
  if (st === 'Втрачений') { renderTrkTable(); trkLostModal(id); return; }
  var t = S.trackers.find(function(x){ return x.id === id; });
  var oldSt = t ? String(t.status||'').trim() : '—';
  rpc('updateSinotrackStatus', [id, st, ''], function(){ S.lostMap = null; showStatusToast('trk', id, oldSt, st); loadAll(); });
}

/* ── Карта втрат (Leaflet + OSM, вантажиться ліниво при відкритті) ── */
var _leafletLoading = false;
var _lostMapObj = null;
function ensureLeaflet(cb) {
  if (window.L) { cb(); return; }
  if (_leafletLoading) { setTimeout(function(){ ensureLeaflet(cb); }, 250); return; }
  _leafletLoading = true;
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  var s = document.createElement('script');
  s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload = function(){ cb(); };
  s.onerror = function(){
    _leafletLoading = false;
    var el = $('lostMap');
    if (el) el.innerHTML = '<div class="empty" style="padding-top:24vh">❌ Не вдалося завантажити бібліотеку карти (перевір інтернет)</div>';
  };
  document.head.appendChild(s);
}

var mapLayer = 'osm';   // osm | sat
var lossTab = 'nocoord'; // nocoord | trkdrone | trkonly | drones
var lossEdit = false;

function lossKindOf(x) {
  if (x.kind === 'drone') return 'drones';
  return (x.binding || x.probableDrone) ? 'trkdrone' : 'trkonly';
}
// Групи втрат для плиток і підвкладок
function lossGroups(data) {
  data = data || [];
  return {
    nocoord:  data.filter(function(x){ return !(x.lat && x.lng); }),
    drones:   data.filter(function(x){ return lossKindOf(x) === 'drones'; }),
    trkdrone: data.filter(function(x){ return lossKindOf(x) === 'trkdrone'; }),
    trkonly:  data.filter(function(x){ return lossKindOf(x) === 'trkonly'; })
  };
}
// Групи втрат: ключ, назва, колір — той самий, що й у маркерів на карті
// (плитки й чіпи = легенда)
var LOSS_TABS = [['nocoord','Без координат','grey'],['drones','Втрачені борти','red'],['trkdrone','Трекер із бортом','orange'],['trkonly','Трекер (без борта)','purple']];
// Плитки для вкладки карти: клік перемикає підвкладку таблиці (карта не чіпається)
function lossTilesHtml() {
  var g = lossGroups(S.lostMap);
  return '<div class="stat-row" id="lossTiles">'+LOSS_TABS.map(function(t){
    return '<div class="stat-tile '+t[2]+' click'+(lossTab===t[0]?' active':'')+'" onclick="lossTab=\''+t[0]+'\';renderLossTables(S.lostMap||[])">'+
      '<div class="stat-num">'+(S.lostMap ? g[t[0]].length : '…')+'</div><div class="stat-lbl">'+t[1]+'</div></div>';
  }).join('')+'</div>';
}
function lossColor(x) { return x.kind === 'drone' ? '#e74c3c' : ((x.binding || x.probableDrone) ? '#f39c12' : '#9b59b6'); }

function renderTrkMap() {
  var mapEl = $('lostMap');
  if (!mapEl) return;
  function draw(data) {
    renderLossTables(data);
    ensureLeaflet(function(){
      if (_lostMapObj) { try { _lostMapObj.remove(); } catch(e) {} _lostMapObj = null; }
      var el = $('lostMap');
      if (!el) return;
      el.innerHTML = '';
      // Спільна ініціалізація з картою сектора: темні квадратні контролі
      // (зум + перемикач топооснови ⧉) праворуч
      var map = hudMap(el);
      _lostMapObj = map;

      var pts = [];
      data.filter(function(x){ return x.lat && x.lng; }).forEach(function(x){
        var col = lossColor(x);
        var kindLbl = x.kind === 'drone' ? '🛸 Втрачений борт'
          : (x.binding ? '📡 Трекер · борт '+esc(x.binding)
          : (x.probableDrone ? '📡 Трекер · імовірно '+esc(x.probableDrone) : '📡 Трекер (борт не задокументовано)'));
        var popupFor = function(editOn){
          return '<div style="font-family:monospace;font-size:12px;min-width:200px">'+
            '<b>'+kindLbl+'</b><br><b>'+esc(x.imei||x.id)+'</b>'+(x.name ? ' — '+esc(x.name) : '')+
            (x.date ? '<br>📅 '+esc(x.date) : '')+
            (x.conditions ? '<br>📋 '+esc(x.conditions) : '')+
            (x.link ? '<br><a href="'+esc(x.link)+'" target="_blank">🗺 відкрити посилання</a>' : '')+
            '<br><span style="color:#888">'+x.lat.toFixed(5)+', '+x.lng.toFixed(5)+'</span>'+
            (editOn ? '<br><a href="#" onclick="lossEditModal(\''+esc(x.kind)+'\',\''+esc(x.id)+'\');return false">✎ редагувати</a>' : '')+
          '</div>';
        };
        var tip = (x.kind === 'drone' ? '🛸 ' : '📡 ') + (x.imei || x.id) + (x.name ? ' — ' + x.name : '') + (x.date ? ' · ' + x.date : '');
        // ✕ у кольорі категорії з підписом-ID — той самий стиль, що на карті сектора
        var mk = hudMarker([x.lat, x.lng], 'x', col, x.id || '')
          .addTo(map)
          .bindTooltip(tip, { direction: 'top', offset: [0, -10] })  // при наведенні
          .bindPopup(popupFor(lossEdit));                              // повна картка при кліку
        mk._lossPopupFor = popupFor;
        pts.push([x.lat, x.lng]);
      });
      if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
      else map.setView([48.5, 35.0], 6);
      setTimeout(function(){ map.invalidateSize(); }, 150);
    });
  }
  // Дані втрат: тягнемо при першому відкритті вкладки і за кнопкою ⟳
  // (або після зміни статусу — там кеш скидається). Решта дій на вкладці
  // (перегляд/редагування, підвкладки, шар) карту й дані НЕ перезавантажують.
  if (S.lostMap) { draw(S.lostMap); return; }
  mapEl.innerHTML = '<div class="loading-view" style="padding-top:22vh"><span class="pulse-dot"></span>Завантаження точок втрат…</div>';
  rpc('getLostMapData', [], function(v){
    S.lostMap = Array.isArray(v) ? v : [];
    var backendV = S.lostMap.length && S.lostMap[0]._v ? S.lostMap[0]._v : (S.lostMap.length ? 1 : 0);
    S.lostMapV = backendV;
    draw(S.lostMap);
  }, function(e){
    mapEl.innerHTML = '<div class="empty" style="padding-top:24vh">❌ '+esc(e.message)+'</div>';
  });
}

// Таблиці під картою: 4 підвкладки + перегляд/редагування
function renderLossTables(data) {
  var el = $('lostList');
  if (!el) return;
  var groups = lossGroups(data);
  var canEdit = canEditInv() || !!(S.auth && S.auth.isMain);
  // Плитки зверху сторінки — оновити активну і числа без ререндеру карти
  var tilesEl = $('lossTiles');
  if (tilesEl) tilesEl.outerHTML = lossTilesHtml();
  // Чіпи-фільтри в кольорах легенди (як типи в інвентарі) — в одному рядку
  // з компактом та Перегляд/Редагування; окрема легенда не потрібна
  var chips = '<div class="type-chips">'+LOSS_TABS.map(function(t){
    return '<button class="filter-chip c-'+t[2]+(lossTab===t[0]?' active':'')+'" onclick="lossTab=\''+t[0]+'\';renderLossTables(S.lostMap||[])">'+t[1]+' ('+groups[t[0]].length+')</button>';
  }).join('')+'</div>';
  // Бекенд старої версії (без _v) не вміє читати нотатки sidebar-форм
  var oldBackend = MODE !== 'demo' && data.length && !(S.lostMapV >= 3);
  var h = (oldBackend ? '<div class="warn" style="margin:12px 0 0">⚠ Бекенд таблиці застарілий — оновіть Код.gs (parseLossNote_/getLostMapData) і зробіть нову версію деплою, інакше нотатки зі старих sidebar-форм не читаються</div>' : '');
  h += '<div class="filter-row" style="margin-top:12px">'+chips+
    '<div class="staff-actions">'+
      // Компакт: ID · Координати · Обставини (як «/» в інвентарі); лише таблиця, карта не чіпається
      '<button class="icon-btn" title="'+(invCompact ? 'Показати всі стовпці' : 'Компактне подання')+'" style="border:1px solid var(--line-2);font-family:var(--font-data);font-weight:700" onclick="invCompact=!invCompact;renderLossTables(S.lostMap||[])">'+(invCompact ? '»' : '«')+'</button>'+
      // Перемикач режиму перемальовує ЛИШЕ таблицю під картою (карта не чіпається)
      (canEdit ? '<div class="inv-mode">'+
        '<button class="inv-mode-btn'+(!lossEdit?' active':'')+'" onclick="lossEdit=false;renderLossTables(S.lostMap||[])">Перегляд</button>'+
        '<button class="inv-mode-btn'+(lossEdit?' active':'')+'" onclick="lossEdit=true;renderLossTables(S.lostMap||[])">Редагування</button>'+
      '</div>' : '')+
    '</div></div>';
  var list = groups[lossTab] || [];
  var rows = list.map(function(x){
    var acts = (lossEdit && canEdit)
      ? '<div class="inv-acts"><button class="inv-act" title="Редагувати запис втрати" data-k="'+esc(x.kind)+'" data-id="'+esc(x.id)+'" onclick="lossEditModal(this.dataset.k, this.dataset.id)">'+svgIcon('edit')+'</button></div>'
      : '';
    // Координати — гіперпосилання: на карту з нотатки, або на Google Maps за lat,lng
    var coordCell;
    if (x.lat && x.lng) {
      var href = x.link || ('https://maps.google.com/?q=' + x.lat + ',' + x.lng);
      coordCell = '<a href="'+esc(href)+'" target="_blank" title="Відкрити в картах" style="color:var(--accent);text-decoration:underline dotted">'+x.lat.toFixed(4)+', '+x.lng.toFixed(4)+'</a>';
    } else if (x.link) {
      coordCell = '<a href="'+esc(x.link)+'" target="_blank" style="color:var(--accent)">🗺 посилання</a>';
    } else coordCell = '<span class="hint">—</span>';
    // Борт: для трекера — привʼязаний/імовірний; для борта — згаданий у нотатці трекер
    var refCell = x.kind==='tracker' ? esc(x.binding || x.probableDrone || '—')
      : (x.trackerRef ? '<span class="hint" title="трекер, згаданий у нотатці">📡 '+esc(x.trackerRef)+'</span>' : '');
    return '<tr>'+
      '<td class="mono accent">'+(x.kind==='drone'?'🛸 ':'📡 ')+esc(x.imei||x.id)+(x.imei?'<div class="hint">'+esc(x.id)+'</div>':'')+acts+'</td>'+
      (invCompact ? '' :
      '<td>'+esc(x.name||'')+'</td>'+
      '<td class="mono">'+esc(x.date||'—')+'</td>')+
      '<td class="mono">'+coordCell+'</td>'+
      (invCompact ? '' : '<td class="mono">'+refCell+'</td>')+
      '<td style="max-width:320px;white-space:normal;line-height:1.4">'+esc(x.conditions||'')+'</td>'+
    '</tr>';
  }).join('');
  h += '<div class="table-wrap" style="max-height:40vh"><table class="data-table"><thead><tr><th>ID'+(lossEdit&&canEdit?' / дії':'')+'</th>'+
    (invCompact ? '' : '<th>Назва</th><th>Дата втрати</th>')+
    '<th>Координати</th>'+
    (invCompact ? '' : '<th>Борт</th>')+
    '<th>Обставини</th></tr></thead>'+
    '<tbody>'+(rows || '<tr><td colspan="'+(invCompact ? 3 : 6)+'" class="empty">Порожньо</td></tr>')+'</tbody></table></div>';
  el.innerHTML = h;
  // Спливашки маркерів залежать від lossEdit (посилання ✎) — оновити їх без
  // перебудови карти
  if (_lostMapObj) _lostMapObj.eachLayer(function(l){
    if (l.getPopup && l.getPopup() && l._lossPopupFor) l.setPopupContent(l._lossPopupFor(lossEdit));
  });
}

// Редагування запису втрати (дата, координати, посилання, обставини, імовірний борт)

function doLossSave(kind, id) {

    link: $('leLink').value.trim(), conditions: $('leCond').value.trim(),
    probableDrone: $('leDrone') ? $('leDrone').value.trim() : '' };
  var btn = $('leBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('webUpdateLossRecord', [d, crewToken() || null], function(){
    toast('💾 Запис втрати '+id+' оновлено');
    S.lostMap = null; closeModal(); renderView();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '💾 Зберегти'; }

  });
}

    '<div class="f"><label>📍 Координати</label><input type="text" id="tlCoords" placeholder="напр. 48.123, 35.456"></div>'+
    '<div class="f"><label>🗺 Посилання з трекера / карти</label><input type="text" id="tlLink" placeholder="необов\'язково"></div>'+
    '<div class="f"><label>🛸 Втрачений борт (якщо не задокументовано вильотом)</label><input type="text" id="tlDrone" placeholder="напр. STNG-0099" value="'+esc((t && t.binding) || '')+'"></div>'+

    '<div class="hint">⚠️ SIM трекера теж стане втраченою. Деталі потраплять у примітку трекера, Журнал руху і на Карту втрат</div>'+
    '<button class="btn btn-red" id="tlBtn" onclick="doTrkMarkLost(\''+esc(id)+'\')" style="margin-top:8px">❌ Підтвердити втрату</button>'
  );
  setTimeout(function(){ var i = $('tlCoords'); if (i) i.focus(); }, 60);

function doTrkMarkLost(id) {
  var btn = $('tlBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ Запис…'; }
  var coords = $('tlCoords').value.trim(), link = $('tlLink').value.trim(), circ = $('tlCirc').value.trim();
  var drone = $('tlDrone') ? $('tlDrone').value.trim() : '';
  var lostDate = ($('tlDate') && $('tlDate').value) || new Date().toISOString().slice(0, 10);
  var note = '⚠️ ВТРАЧЕНО ' + lostDate +
    (coords ? '\n📍 ' + coords : '') +
    (link ? '\n🗺️ ' + link : '') +
    (circ ? '\n📋 ' + circ : '') +
    (drone ? '\n🛸 імовірно борт: ' + drone : '');
  var t = S.trackers.find(function(x){ return x.id === id; });
  var oldSt = t ? String(t.status||'').trim() : '—';
  rpc('updateSinotrackStatus', [id, 'Втрачений', note], function(){
    // Причина одразу в Журнал руху (без окремої спливашки)
    var comment = [coords, link, circ].filter(Boolean).join(' | ') || 'без деталей';
    rpc('webLogStatusChange', ['trk', id, oldSt, 'Втрачений', comment], function(){}, function(){});
    S.lostMap = null; // кеш карти втрат застарів
    toast('❌ '+id+' позначено втраченим');
    closeModal(); loadAll();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '❌ Підтвердити втрату'; }
    toast('❌ '+e.message, true);
  });
}
function doSimStatus(id, st) {

  rpc('updateSimStatus', [id, st], function(){ showStatusToast('sim', id, oldSt, st); loadAll(); });
}
function openAddTracker() {

function doAddTracker() {
  var model = $('atModel').value.trim();
  if (!model) { toast('⚠ Вкажи модель', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('atBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() { if (btn) { btn.disabled = false; btn.textContent = '➕ Додати трекер'; } }
  var simId = $('atSim').value;
  rpc('addSinotrack', [{ model: model, imei: $('atImei').value.trim(), note: $('atNote').value.trim() }], function(newId){

      rpc('bindSimToTracker', [simId, newId, false], function(){ toast('📡 '+newId+' додано + SIM'); closeModal(); loadAll(); },

function openAddSim() {

    '<div class="f"><label>Назва контакту *</label><input type="text" id="asContact" placeholder="Vodafone-07"></div>'+

function doAddSim() {
