<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILD HORNETS — Tactical OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ═══ HORNET TACTICAL OS · Web App ═══ */
:root {
  --bg: #131313; --bg-low: #0e0e0e;
  --panel: #1c1b1b; --panel-2: #201f1f; --panel-3: #2a2a2a; --panel-4: #353534;
  --line: #353534; --line-2: #514532;
  --text: #e5e2e1; --muted: #a8a5a2; --dim: #7f7c78;
  --accent: #ffb800; --accent-hi: #ffca3d; --accent-soft: #ffdca1; --on-accent: #1a1300;
  --blue: #3498db; --blue-deep: #2a486b; --blue-soft: #abc9f2;
  --green: #2ecc71; --green-bg: #11301d;
  --red: #e74c3c; --red-soft: #ff8580; --red-bg: #3a1512;
  --orange: #f39c12; --orange-bg: #33270e;
  --yellow: #f1c40f; --purple: #9b59b6; --grey: #7f8c8d;
  --font-ui: 'Archivo Narrow', Arial, sans-serif;
  --font-data: 'JetBrains Mono', Consolas, monospace;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui); font-size: 14px; color: var(--text);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    var(--bg);
  overflow: hidden;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ── Каркас ── */
#app { display: flex; flex-direction: column; height: 100vh; }
header.topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line-2); z-index: 40;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-name { font-size: 20px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
.brand-sub { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .2em; }
.top-stats { display: flex; align-items: center; gap: 18px; font-family: var(--font-data); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.top-stats b { color: var(--accent); font-weight: 700; }
.top-stats .warn-b { color: var(--red-soft); }
.icon-btn { background: none; border: 1px solid transparent; color: var(--accent); font-size: 16px; cursor: pointer; padding: 6px 9px; }
.icon-btn:hover { border-color: var(--accent); background: var(--panel-3); }
#layout { display: flex; flex: 1; min-height: 0; }

/* ── Сайдбар ── */
aside.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-low); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 0 10px; overflow-y: auto;
}
.unit-box { padding: 0 16px 14px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.unit-name { font-size: 17px; font-weight: 700; color: var(--accent-soft); text-transform: uppercase; letter-spacing: .05em; }
.unit-status { display: flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 9px; color: var(--green); text-transform: uppercase; letter-spacing: .12em; margin-top: 5px; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.new-flight-btn {
  margin: 0 16px 16px; padding: 12px; background: var(--accent); color: var(--on-accent);
  border: none; font-family: var(--font-data); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
}
.new-flight-btn:hover { background: var(--accent-hi); }
nav.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer;
  font-family: var(--font-data); font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); border-left: 3px solid transparent;
  background: none; border-top: none; border-right: none; border-bottom: none; text-align: left; width: 100%;
}
.nav-item:hover { color: var(--text); background: var(--panel); }
.nav-item.active {
  color: var(--on-accent); background: var(--accent); border-left-color: var(--accent-hi);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
}
.nav-icon { font-size: 14px; width: 18px; text-align: center; }
.sidebar-foot { margin-top: auto; padding: 12px 16px 4px; border-top: 1px solid var(--line); }
.user-email { font-family: var(--font-data); font-size: 9px; color: var(--dim); word-break: break-all; margin-bottom: 8px; }
.sync-line { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.sync-line b { color: var(--green); }

/* ── Контент ── */
main.content { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 40px; }
.view-title { font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin-bottom: 4px; }
.view-title .accent { color: var(--accent); }
.view-sub { font-family: var(--font-data); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 18px; }

/* ── Загальні елементи ── */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; }
.panel-title { font-family: var(--font-data); font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; border-left: 3px solid var(--accent); padding-left: 8px; margin-bottom: 10px; }
.panel-title.red { color: var(--red-soft); border-left-color: var(--red); }
.panel-title.blue { color: var(--blue-soft); border-left-color: var(--blue); }
label { display: block; font-weight: 700; color: var(--dim); margin-bottom: 4px; font-size: 9px; text-transform: uppercase; letter-spacing: .12em; font-family: var(--font-data); }
select, input, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 0;
  font-size: 13px; background: var(--bg-low); color: var(--text); font-family: var(--font-data);
}
select:focus, input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: inset 0 -1px 0 0 var(--accent); }
input::placeholder, textarea::placeholder { color: #5c5955; }
select option, select optgroup { background: var(--bg-low); color: var(--text); }
textarea { height: 54px; resize: vertical; }
.f { margin-bottom: 11px; }
.hint { font-size: 10px; color: var(--dim); margin-top: 3px; font-family: var(--font-data); }
.btn {
  width: 100%; padding: 10px; background: var(--accent); color: var(--on-accent); border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 8px;
  font-family: var(--font-data); text-transform: uppercase; letter-spacing: .06em;
}
.btn:hover { background: var(--accent-hi); }
.btn:disabled { background: var(--panel-3); color: var(--dim); cursor: not-allowed; }
.btn-green { background: var(--green-bg); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.btn-green:hover { background: var(--green); color: #04180c; }
.btn-red { background: var(--red-bg); color: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.btn-red:hover { background: var(--red); color: #1c0503; }
.btn-sec { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-sec:hover { background: var(--panel-3); color: var(--text); }
.btn-mini { width: auto; padding: 4px 10px; margin: 0; font-size: 10px; }
.btn-row { display: flex; gap: 6px; }
.btn-row .btn { flex: 1; }
.chip { display: inline-block; background: var(--panel-3); color: var(--text); border: 1px solid var(--line-2); padding: 3px 8px; font-size: 11px; margin: 2px; font-family: var(--font-data); }
.chip.click { cursor: pointer; }
.chip.click:hover { background: var(--red-bg); border-color: var(--red); color: var(--red-soft); }
.chip-freq { border-color: var(--blue); color: var(--blue-soft); }
.chip-main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.st-chip { display: inline-flex; align-items: center; font-size: 10px; padding: 2px 8px 2px 6px; white-space: nowrap; font-family: var(--font-data); font-weight: 700; border-left: 4px solid; }
.st-green  { background: var(--green-bg);  color: var(--green);    border-left-color: var(--green); }
.st-orange { background: var(--orange-bg); color: var(--orange);   border-left-color: var(--orange); }
.st-red    { background: var(--red-bg);    color: var(--red-soft); border-left-color: var(--red); }
.st-dark   { background: #2a0505;          color: var(--red-soft); border-left-color: #7a2020; }
.st-grey   { background: var(--panel-3);   color: var(--muted);    border-left-color: var(--grey); }
.st-blue   { background: #152535;          color: var(--blue-soft);border-left-color: var(--blue); }
.msg-box { padding: 9px; margin-top: 9px; font-size: 12px; display: none; font-family: var(--font-data); }
.msg-box.ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); display: block; }
.msg-box.err { background: var(--red-bg); color: var(--red-soft); border: 1px solid var(--red); display: block; }
.empty { text-align: center; color: var(--dim); padding: 18px; font-size: 12px; font-family: var(--font-data); }
.loading-view { text-align: center; padding: 80px 0; color: var(--dim); font-family: var(--font-data); font-size: 12px; text-transform: uppercase; letter-spacing: .15em; }
.loading-view .pulse-dot { display: inline-block; margin-right: 8px; }

/* ── Стат-плитки ── */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat-tile { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 12px; }
.stat-tile.green { border-left-color: var(--green); }
.stat-tile.red { border-left-color: var(--red); }
.stat-tile.blue { border-left-color: var(--blue); }
.stat-num { font-family: var(--font-data); font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
.stat-lbl { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }

/* ── Тактичні картки ── */
.tcard {
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue);
  padding: 10px 12px; margin-bottom: 8px; position: relative;
}
.tcard.mine { border-left-color: var(--accent); background: #211d10; }
.tcard.other { opacity: .75; }
.tcard.lost { border-left-color: #7a2020; background: #1d0a0a; }
.tcard.ok { border-left-color: var(--green); }
.tcard.bad { border-left-color: var(--red); }
.tcard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.tcard-id { font-family: var(--font-data); font-size: 14px; font-weight: 700; color: var(--accent-soft); }
.tcard-meta { font-size: 12px; color: var(--muted); line-height: 1.8; }
.tcard-meta b { color: var(--text); }
.tcard-meta .mono { font-family: var(--font-data); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

/* ── Статусні кнопки вильоту ── */
.st-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; }
@media (max-width: 600px) { .st-grid { grid-template-columns: 1fr 1fr; } }
.st-btn { padding: 7px 4px; border: 1px solid var(--line-2); text-align: center; cursor: pointer; font-size: 10px; font-weight: 700; font-family: var(--font-data); color: var(--muted); background: var(--bg-low); }
.st-btn:hover { color: var(--text); }
.st-btn.sel-ok   { background: var(--green-bg);  color: var(--green);    border-color: var(--green);  box-shadow: 0 0 0 1px var(--green); }
.st-btn.sel-fix  { background: var(--orange-bg); color: var(--orange);   border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.st-btn.sel-bad  { background: var(--red-bg);    color: var(--red-soft); border-color: var(--red);    box-shadow: 0 0 0 1px var(--red); }
.st-btn.sel-lost { background: #2a0505;          color: var(--red-soft); border-color: #7a2020;       box-shadow: 0 0 0 1px #7a2020; }
.lost-box { background: #1d0a0a; border: 1px solid var(--red); padding: 10px; margin-top: 8px; }
.lost-box label { color: var(--red-soft); }
.lost-box input, .lost-box textarea { background: #140505; border-color: #7a2020; color: #ffcccc; }

/* ── Таблиці ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  font-family: var(--font-data); font-size: 9px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); text-align: left; padding: 8px; background: var(--panel-3);
  border: 1px solid var(--line); position: sticky; top: 0; z-index: 2;
}
.data-table td { padding: 7px 8px; border: 1px solid #262525; color: var(--text); }
.data-table tr:nth-child(odd) td { background: #161616; }
.data-table tr:nth-child(even) td { background: var(--panel); }
.data-table tr:hover td { background: var(--panel-3); }
.data-table .mono { font-family: var(--font-data); }
.data-table .accent { color: var(--accent); }
.table-wrap { overflow: auto; border: 1px solid var(--line); max-height: 62vh; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filter-row input, .filter-row select { width: auto; min-width: 160px; flex: 0 1 auto; }
.filter-chip { padding: 5px 10px; font-family: var(--font-data); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--panel); border: 1px solid var(--line-2); color: var(--muted); cursor: pointer; }
.filter-chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ── Інвентар: режим редагування ── */
.inv-mode { display: flex; margin-left: auto; border: 1px solid var(--line-2); background: var(--panel); }
.inv-mode-btn { padding: 5px 12px; font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: none; color: var(--muted); cursor: pointer; }
.inv-mode-btn.active { background: var(--accent); color: var(--on-accent); }
.inv-status-sel { width: 100%; min-width: 110px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text); font-family: var(--font-data); font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 4px; cursor: pointer; }
.inv-status-sel:disabled { opacity: .5; cursor: wait; }
.inv-act { background: transparent; border: 1px solid var(--line-2); border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; color: var(--muted); flex-shrink: 0; }
.inv-act:hover { background: var(--panel-3); }
.inv-act:disabled { opacity: .4; cursor: wait; }
.inv-act--ok { color: var(--green); border-color: var(--green); }
.inv-act--ok:hover { background: var(--green-bg); }
.inv-act--crew { color: var(--accent); border-color: var(--accent); }
.inv-act--crew:hover { background: rgba(255,184,0,.12); }
.inv-act--del { color: var(--red); border-color: var(--red); }
.inv-act--del:hover { background: var(--red-bg); }
.inv-acts { display: flex; gap: 5px; margin-top: 6px; white-space: nowrap; }
.inv-tabs { display: flex; border-bottom: 1px solid var(--line-2); margin-bottom: 12px; font-family: var(--font-data); }
.inv-tab { padding: 8px 18px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
.inv-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,184,0,.05); }
.inv-crew-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 12px; }
.inv-crew-bar label { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.inv-crew-bar select { width: auto; min-width: 170px; }

/* ── Карта частот ── */
.freq-topbar { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; margin-bottom: 12px; }
.freq-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.freq-legend .li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-sq { width: 11px; height: 11px; flex-shrink: 0; }
.freq-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: stretch; }
@media (max-width: 1100px) { .freq-layout { grid-template-columns: 1fr; } }
.matrix-panel { background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.matrix-panel-head { padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel-3); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.matrix-panel-head .cap { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.matrix-wrap { overflow: auto; flex: 1; padding: 6px 8px 8px; }
.matrix { border-collapse: collapse; width: 100%; table-layout: fixed; font-family: var(--font-data); min-width: 620px; }
.matrix th { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 7px 2px; border-bottom: 1px solid var(--line-2); text-align: center; position: sticky; top: -6px; background: var(--panel-2); z-index: 3; }
.matrix th.band-col, .matrix td.band { width: 104px; text-align: left; padding-left: 8px; }
.matrix td.band { color: var(--accent); font-size: 10px; line-height: 1.25; white-space: normal; overflow-wrap: break-word; border-right: 1px solid var(--line-2); font-weight: 700; }
.matrix td { padding: 3px; }
.cell { height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 12px; background: var(--panel-3); border: 1px solid rgba(81,69,50,.45); color: var(--muted); overflow: hidden; }
.cell:hover { border-color: var(--accent); color: var(--text); }
.cell .ctag { font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 58%; }
.cell-mine     { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 700; }
.cell-unit     { background: rgba(52,152,219,.16); border: 1px solid var(--blue); color: var(--blue); font-weight: 700; }
.cell-ext      { background: var(--grey); border-color: var(--grey); color: #10171a; font-weight: 700; }
.cell-critical { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; animation: pulse 1.6s infinite; }
.cell-serious  { background: var(--orange); border-color: var(--orange); color: #231604; font-weight: 700; }
.cell-moderate { background: var(--yellow); border-color: var(--yellow); color: #231d04; font-weight: 700; }
.cell-warning  { background: var(--orange-bg); border: 1px solid var(--orange); color: var(--orange); }
.cell-reserve  { background: transparent; border: 1px dashed var(--purple); color: #c9a6dd; }
/* Вільні, але небезпечні клітинки — приглушені відтінки (без пульсації) */
.cell-critF { background: rgba(231,76,60,.15);  border-color: rgba(231,76,60,.55);  color: #ff9a94; }
.cell-serF  { background: rgba(243,156,18,.13); border-color: rgba(243,156,18,.5);  color: var(--orange); }
.cell-modF  { background: rgba(241,196,15,.11); border-color: rgba(241,196,15,.45); color: #e8d44d; }
/* ── Права панель частот ── */
.side-panel { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; margin-bottom: 10px; min-height: 0; }
.side-head { background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.side-head:hover { background: var(--panel-3); }
.side-head .cap { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 7px; }
.side-head .arr { color: var(--accent); font-size: 11px; }
.count-pill { background: var(--panel-4); padding: 1px 8px; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.side-body { padding: 8px; overflow-y: auto; max-height: 46vh; }

/* ═══════════ RPC-ОБГОРТКА ═══════════ */
function rpc(fn, args, ok, fail) {
  args = args || [];
  if (DEMO) {
    setTimeout(function(){
      if (DEMO_DATA.hasOwnProperty(fn)) { ok && ok(JSON.parse(JSON.stringify(DEMO_DATA[fn]))); }
      else { ok && ok({demo:true}); }
    }, 120);
    return;
  }
  var runner = google.script.run
    .withSuccessHandler(function(res){ ok && ok(res); })
    .withFailureHandler(function(e){ if (fail) fail(e); else toast('❌ ' + e.message, true); });
  runner[fn].apply(runner, args);
}

}

    // Суфікс як окреме слово АБО в кінці назви (StingHVD, Sting HVD, Sting-HVD)
    var re = new RegExp('(^|[\\s\\-_])' + suf + '($|[\\s\\-_0-9])');
    if (re.test(upper)) return NAME_SUFFIXES[suf];
    if (upper.endsWith(suf)) return NAME_SUFFIXES[suf];
  }
  return '';
}

/* ═══════════ ВИД: КАРТА ЧАСТОТ ═══════════ */
var bandGroup = 'all';
function bandOf(band) {
  var f = BANDS[band][0];
  if (f >= 5600) return '5.8';
  if (f >= 4900) return '5.0';
  return '3.3';
}
function cleanCode(fc) { return String(fc||'').replace(/\s*\(\d+\)/, '').trim(); }
function freqToCodeLocal(freq) {
  for (var b in BANDS) { var i = BANDS[b].indexOf(Number(freq)); if (i !== -1) return b + (i+1); }
  return '?';
}
function countConflicts() {
  if (!S.freq) return 0;
  var occupied = (S.freq.active||[]).filter(function(a){ return a.freq; });
  var n = 0;
  for (var i = 0; i < occupied.length; i++)
    for (var j = i+1; j < occupied.length; j++) {
      if (occupied[i].crew === occupied[j].crew) continue;
      if (Math.abs(occupied[i].freq - occupied[j].freq) < 40) n++;
    }
  return n;
}
var specOpen = true;
var sidePanels = { af: true, crews: true, conf: true };
function togglePanel(key) { sidePanels[key] = !sidePanels[key]; renderView(); }
function toggleSpec() { specOpen = !specOpen; renderView(); }

function renderFreq(c) {
  var d = S.freq;
  if (!d) { c.innerHTML = '<div class="empty">Дані частот недоступні</div>'; return; }
  var active = d.active || [];
  var bands = d.bands || BANDS;
  var bandOrder = (d.bandOrder || Object.keys(bands)).filter(function(b){ return bands[b]; });
  var warningFreqs = d.warningFreqs || {};
  var reserves = d.reserves || [];

  var codeSource = {};
  active.forEach(function(a){
    var code = cleanCode(a.freqCode);
    if (code && code !== '?') codeSource[code] = a;
    else if (a.freq) codeSource['_mhz_'+a.freq] = a;
  });
  var occupied = active.filter(function(a){ return a.freq; });
  var reserveMap = {};
  reserves.forEach(function(r){ var code = cleanCode(r.freqCode); if (code) reserveMap[code] = r; });
  var crewInfoMap = {};
  (d.crewFreqInfo||[]).forEach(function(ci){ crewInfoMap[ci.crew] = ci; });

  function freqLevel(f, code) {
    var level = 'free';
    var selfSrc = code ? (codeSource[code] || codeSource['_mhz_'+f] || null) : null;
    occupied.forEach(function(o){
      if (selfSrc && o.crew === selfSrc.crew && o.freq === f) return;
      var dd = Math.abs(f - o.freq);
      if (dd < 20) level = 'critical';
      else if (dd < 40 && level !== 'critical') level = 'serious';
    });
    if (level !== 'critical' && level !== 'serious') {
      for (var i = 0; i < occupied.length; i++)
        for (var j = 0; j < occupied.length; j++) {
          if (i === j) continue;
          if (Math.abs(f - (2*occupied[i].freq - occupied[j].freq)) < 10) level = 'moderate';
        }
    }
    return level;
  }
  // Конфлікти конкретного екіпажу (для бейджів на картках)
  function conflictOf(a) {
    if (!a.freq) return null;
    for (var i = 0; i < occupied.length; i++) {
      var o = occupied[i];
      if (o.crew === a.crew) continue;
      var gap = Math.abs(a.freq - o.freq);
      if (gap < 20) return { with: o, gap: gap, level: 'critical' };
    }
    for (var k = 0; k < occupied.length; k++) {
      var o2 = occupied[k];
      if (o2.crew === a.crew) continue;
      var g2 = Math.abs(a.freq - o2.freq);
      if (g2 < 40) return { with: o2, gap: g2, level: 'serious' };
    }
    return null;
  }

  // ── Верхня панель: легенда як у макеті ──
  var legend = '<div class="freq-topbar"><div class="freq-legend">'+
    '<div class="li"><span class="lg-sq" style="background:#2ecc71"></span>Своя частота</div>'+
    '<div class="li"><span class="lg-sq" style="border:1px solid #3498db;background:rgba(52,152,219,.2)"></span>Екіпаж підрозділу</div>'+
    '<div class="li"><span class="lg-sq" style="background:#7f8c8d"></span>Зовнішні (інші)</div>'+
    '<div class="li"><span class="lg-sq" style="background:#e74c3c"></span>Конфлікт</div>'+
    '<div class="li"><span class="lg-sq" style="background:#f39c12"></span>Близько до конфлікту</div>'+
    '<div class="li"><span class="lg-sq" style="background:#f1c40f"></span>Інтермодуляція</div>'+
    '<div class="li"><span class="lg-sq" style="border:1px dashed #9b59b6"></span>Резерв</div>'+
    '<div class="li"><span class="lg-sq" style="background:#33270e;border:1px solid #f39c12"></span>⚠ Нерекомендована</div>'+
  '</div></div>';

  // ── Матриця (на всю ширину, table-layout: fixed) ──
  var visibleBands = bandOrder.filter(function(b){ return bandGroup==='all' || bandOf(b)===bandGroup; });
  var maxCh = 0;
  visibleBands.forEach(function(b){ if (bands[b].length > maxCh) maxCh = bands[b].length; });
  var groupLbl = bandGroup==='all' ? 'ВСІ БЕНДИ' : bandGroup + ' GHz';
  var filters = ['all','5.8','5.0','3.3'].map(function(g){
    var lbl = g==='all' ? 'ВСІ' : g + ' GHz';
    return '<button class="filter-chip'+(bandGroup===g?' active':'')+'" onclick="bandGroup=\''+g+'\';renderView()">'+lbl+'</button>';
  }).join('');

  var m = '<div class="matrix-panel">'+
    '<div class="matrix-panel-head"><span class="cap">Сітка каналів · '+groupLbl+'</span><div style="display:flex;gap:6px">'+filters+'</div></div>'+
    '<div class="matrix-wrap"><table class="matrix"><tr><th class="band-col">Band / CH</th>';
  for (var ch = 1; ch <= maxCh; ch++) m += '<th>'+ch+'</th>';
  m += '</tr>';
  visibleBands.forEach(function(band){
    m += '<tr><td class="band">'+esc(band)+'</td>';
    bands[band].forEach(function(freq, idx){
      var code = band + (idx + 1);
      var lvl = freqLevel(freq, code);
      var src = codeSource[code] || codeSource['_mhz_'+freq];
      var resv = reserveMap[code];
      var cls, tag = '';
      if (src) {
        // Зайнята клітинка: конфлікт перекриває колір власника
        if (lvl === 'critical') cls = 'cell-critical';
        else if (lvl === 'serious') cls = 'cell-serious';
        else if (src.source === 'mine') cls = 'cell-mine';
        else if (src.source === 'external') cls = 'cell-ext';
        else cls = 'cell-unit';
        tag = '<span class="ctag">('+esc(src.source==='mine' ? 'ВИ' : (src.crew||'чужий'))+')</span>';
      } else if (resv) {
        cls = 'cell-reserve';
        tag = '<span class="ctag">('+esc(resv.crew)+')</span>';
      } else if (lvl !== 'free') {
        cls = lvl==='critical' ? 'cell-critF' : (lvl==='serious' ? 'cell-serF' : 'cell-modF');
      } else if (warningFreqs[freq]) {
        cls = 'cell-warning';
      } else {
        cls = '';
      }
      m += '<td><div class="cell '+cls+'" onclick="cellClick('+freq+')" title="'+code+' — '+freq+' МГц'+(warningFreqs[freq]?' ⚠':'')+'">'+
        freq + tag + '</div></td>';
    });
    for (var pad = bands[band].length; pad < maxCh; pad++) m += '<td></td>';
    m += '</tr>';
  });
  m += '</table></div></div>';

  // ── Права панель ──
  var flightsList = active.filter(function(a){ return a.source==='mine' || a.source==='unit'; });
  var crewsList = active.filter(function(a){ return a.source==='crew'; });
  var extList = active.filter(function(a){ return a.source==='external'; });

  function afCard(a) {
    var cc = cleanCode(a.freqCode) || freqToCodeLocal(a.freq);
    var conf = conflictOf(a);
    var isExt = a.source === 'external';
    var isMineA = a.source === 'mine';
    var info = crewInfoMap[a.crew];
    var canSwitch = !isExt && info && info.reserves && info.reserves.length &&
      (info.author === S.me || S.me === d.adminEmail);
    var swId = 'sw-' + String(a.crew).replace(/[^\w-]/g, '_');
    var freqCls = conf && conf.level==='critical' ? 'red' : (isMineA ? '' : (isExt ? 'grey' : 'blue'));

    var h = '<div class="af-card'+(isMineA?' mine':'')+(isExt?' ext':'')+(conf&&conf.level==='critical'?' conflict':'')+'">'+
      '<div class="af-bar"></div>'+
      (conf&&conf.level==='critical'?'<div class="af-badge">КОНФЛІКТ!</div>':'')+
      '<div class="af-head">'+
        '<div class="af-title">'+esc(a.crew)+(isMineA?' (ВИ)':'')+(isExt?' (ЗОВН)':'')+'</div>'+
        '<div class="af-freq '+freqCls+'">📶 '+(a.freq?esc(cc)+' ('+esc(a.freq)+')':'—')+'</div>'+
      '</div>'+
      ((a.pilot||a.system)?'<div class="af-meta">'+(a.pilot?'👤 '+esc(a.pilot):'')+(a.pilot&&a.system?' · ':'')+(a.system&&a.system!=='Зовнішній'?esc(a.system):'')+'</div>':'');
    if (conf) h += '<div class="af-note">&gt; Δ'+conf.gap+' МГц з '+esc(conf.with.crew)+'</div>';
    if (canSwitch) {
      h += '<button class="af-btn" onclick="document.getElementById(\''+swId+'\').classList.toggle(\'open\')">Змінити частоту</button>'+
        '<div class="swap-menu" id="'+swId+'">';
      info.reserves.forEach(function(r){
        h += '<button class="vtx-btn" onclick="doSwapFreq(\''+esc(a.crew)+'\',\''+esc(r)+'\')">→ '+esc(cleanCode(r))+'</button>';
      });
      h += '</div>';
    }
    if (isExt) h += '<button class="af-btn red" onclick="delExt('+a.freq+')">✕ Зняти позначку</button>';
    return h + '</div>';
  }

  var afList = flightsList.concat(extList);
  var side = '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'af\')"><span class="cap">✈ Активні вильоти</span>'+
    '<span><span class="count-pill">'+afList.length+' В ЕФІРІ</span> <span class="arr">'+(sidePanels.af?'▲':'▼')+'</span></span></div>'+
    '<div class="side-body'+(sidePanels.af?'':' hid')+'">'+
    (afList.length ? afList.map(afCard).join('') : '<div class="empty">Немає активних вильотів</div>')+
    '</div></div>';

  // Наші екіпажі — таблиця як у макеті
  var crewRows = '';
  crewsList.forEach(function(a){
    var cc = cleanCode(a.freqCode) || freqToCodeLocal(a.freq);
    var info = crewInfoMap[a.crew];
    var canSwitch = info && info.reserves && info.reserves.length && (info.author === S.me || S.me === d.adminEmail);
    var swId = 'swc-' + String(a.crew).replace(/[^\w-]/g, '_');
    crewRows += '<tr><td><span class="crew-dot"></span>'+esc(a.crew)+'</td>'+
      '<td><span class="crew-freq">'+esc(cc)+' ('+esc(a.freq)+')</span>'+
      (canSwitch?' <button class="vtx-btn" style="padding:1px 6px;margin-left:4px" onclick="document.getElementById(\''+swId+'\').classList.toggle(\'open\')">🎚</button>':'')+
      '</td></tr>';
    if (canSwitch) {
      crewRows += '<tr><td colspan="2" style="padding:0 8px"><div class="swap-menu" id="'+swId+'" style="margin:0 0 6px">';
      info.reserves.forEach(function(r){
        crewRows += '<button class="vtx-btn" onclick="doSwapFreq(\''+esc(a.crew)+'\',\''+esc(r)+'\')">→ '+esc(cleanCode(r))+'</button>';
      });
      crewRows += '</div></td></tr>';
    }
  });
  reserves.forEach(function(r){
    crewRows += '<tr><td><span class="crew-dot purple"></span>'+esc(r.crew)+'</td>'+
      '<td><span class="crew-freq purple">РЕЗЕРВ '+esc(cleanCode(r.freqCode))+'</span></td></tr>';
  });
  side += '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'crews\')"><span class="cap">👥 Наші екіпажі</span><span class="arr">'+(sidePanels.crews?'▲':'▼')+'</span></div>'+
    '<div class="side-body'+(sidePanels.crews?'':' hid')+'" style="padding:0">'+
    (crewRows ? '<table class="crew-table"><tr><th>Позивний</th><th>Частота</th></tr>'+crewRows+'</table>' : '<div class="empty">Екіпажів немає</div>')+
    '</div></div>';

  // Конфлікти (активні + резервні)
  var realConf = [];
  for (var i = 0; i < occupied.length; i++)
    for (var j = i+1; j < occupied.length; j++) {
      var a1 = occupied[i], a2 = occupied[j];
      if (a1.crew === a2.crew) continue;
      var gap = Math.abs(a1.freq - a2.freq);
      if (gap < 20) realConf.push({lvl:'🔴', t:'Прямий', d:a1.crew+' @'+a1.freq+' ↔ '+a2.crew+' @'+a2.freq+' (Δ'+gap+' МГц)'});
      else if (gap < 40) realConf.push({lvl:'🟠', t:'Близькі канали', d:a1.crew+' @'+a1.freq+' ↔ '+a2.crew+' @'+a2.freq+' (Δ'+gap+' МГц)'});
    }
  reserves.forEach(function(r){
    occupied.forEach(function(o){
      if (o.crew === r.crew) return;
      var dd = Math.abs(r.freq - o.freq);
      if (dd < 20) realConf.push({lvl:'🔴', t:'Резерв ↔ активна', d:'🔄 '+r.crew+' резерв '+r.freq+' ↔ '+o.crew+' '+o.freq+' (Δ'+dd+')'});
      else if (dd < 40) realConf.push({lvl:'🟠', t:'Резерв ↔ активна', d:'🔄 '+r.crew+' резерв '+r.freq+' ↔ '+o.crew+' '+o.freq+' (Δ'+dd+')'});
    });
  });
  side += '<div class="side-panel">'+
    '<div class="side-head" onclick="togglePanel(\'conf\')"><span class="cap">⚠ Конфлікти</span>'+
    '<span>'+(realConf.length?'<span class="count-pill" style="color:var(--red-soft)">'+realConf.length+'</span> ':'')+'<span class="arr">'+(sidePanels.conf?'▲':'▼')+'</span></span></div>'+
    '<div class="side-body'+(sidePanels.conf?'':' hid')+'">'+
    (realConf.length
      ? realConf.map(function(cf){ return '<div class="conflict-item">'+cf.lvl+' '+esc(cf.t)+'<div class="detail">'+esc(cf.d)+'</div></div>'; }).join('')
      : '<div class="empty">✅ Конфліктів немає</div>')+
    '</div></div>';

  // ── Спектр-аналізатор ──
  var range;
  if (bandGroup === '5.8') range = [5600, 6200];
  else if (bandGroup === '5.0') range = [4900, 5700];
  else if (bandGroup === '3.3') range = [3000, 3600];
  else {
    var fs = occupied.map(function(o){ return o.freq; }).concat(reserves.map(function(r){ return r.freq; }));
    if (fs.length) range = [Math.min.apply(null, fs) - 100, Math.max.apply(null, fs) + 100];
    else range = [5600, 6000];
  }
  function pos(f) { return Math.max(1.5, Math.min(98.5, (f - range[0]) / (range[1] - range[0]) * 100)); }
  var marks = '';
  occupied.forEach(function(o){
    if (o.freq < range[0] || o.freq > range[1]) return;
    var conf = conflictOf(o);
    var col = conf && conf.level==='critical' ? '#e74c3c' : (o.source==='mine' ? '#2ecc71' : (o.source==='external' ? '#7f8c8d' : '#3498db'));
    var lbl = (o.source==='mine' ? 'ВИ' : o.crew) + ' (' + o.freq + ')';
    marks += '<div class="spec-mark'+(conf&&conf.level==='critical'?' dash':'')+'" style="left:'+pos(o.freq)+'%;border-color:'+col+'">'+
      '<div class="spec-lbl" style="background:'+col+'">'+esc(lbl)+'</div></div>';
  });
  reserves.forEach(function(r){
    if (r.freq < range[0] || r.freq > range[1]) return;
    marks += '<div class="spec-mark dash" style="left:'+pos(r.freq)+'%;border-color:#9b59b6">'+
      '<div class="spec-lbl" style="background:#9b59b6">🔄 '+esc(r.crew)+' ('+r.freq+')</div></div>';
  });
  var spectrum = '<div class="spectrum">'+
    '<div class="spec-head"><span>'+(range[0]/1000).toFixed(1)+' GHz</span><span>Аналізатор спектру · зайнятість</span>'+
    '<span>'+(range[1]/1000).toFixed(1)+' GHz <button class="tgl" onclick="toggleSpec()">'+(specOpen?'▼':'▲')+'</button></span></div>'+
    '<div class="spec-area'+(specOpen?'':' hid')+'">'+marks+'</div></div>';

  c.innerHTML = '<div class="view-title">Матриця <span class="accent">частот</span> <span style="font-size:14px;color:var(--dim)">(VHF/UHF)</span></div>'+
    '<div class="view-sub">Клік по клітинці — позначити/зняти чужу частоту</div>'+
    legend +
    '<div class="freq-layout">'+ m +'<div>'+ side +'</div></div>'+
    spectrum;
}
function cellClick(freq) {
  var ext = (S.freq && S.freq.active || []).filter(function(a){ return a.source==='external' && a.freq===freq; });
  if (ext.length) { delExt(freq); return; }
  openModal('⚫ Чужа частота',
    '<div class="tcard-meta mono" style="margin-bottom:10px">'+freq+' МГц ('+esc(freqToCodeLocal(freq))+')</div>'+
    '<div class="f"><label>Опис</label><input type="text" id="extDesc" placeholder="Напр. Сусідній підрозділ"></div>'+
    '<button class="btn" onclick="confirmExt('+freq+')">Позначити зайнятою</button>'
  );
}
function confirmExt(freq) {
  var desc = $('extDesc').value.trim() || 'Чужий підрозділ';
  rpc('addExternalFreq', [freq, desc], function(){ closeModal(); toast('⚫ '+freq+' МГц позначено'); reloadFreq(); });
}
function delExt(freq) {
  rpc('removeExternalFreq', [freq], function(){ toast('✅ '+freq+' МГц звільнено'); reloadFreq(); });
}
function doSwapFreq(crewId, code) {
  rpc('swapCrewFrequency', [crewId, code], function(){ toast('🎚 '+crewId+' → '+code); loadAll(); });
}
function reloadFreq() {
  rpc('getFrequencyAnalysis', [], function(v){ S.freq = v; updateTopStats(); renderView(); });
}

/* ═══════════ ВИД: GPS ТРЕКЕРИ ═══════════ */
function renderTrackers(c) {
  var trks = S.trackers, sims = S.sims;
  var html = '<div class="view-title">GPS <span class="accent">трекери</span></div>'+
    '<div class="view-sub">Sinotrack · SIM-карти · прив\'язки</div>'+
    '<div class="btn-row" style="max-width:420px;margin-bottom:16px">'+
      '<button class="btn btn-mini" onclick="openAddTracker()">+ Трекер</button>'+
      '<button class="btn btn-mini btn-sec" onclick="openAddSim()">+ SIM-карта</button>'+
    '</div>'+
    '<div class="grid-2">';

  html += '<div><div class="panel-title">📡 Трекери ('+trks.length+')</div>';
  html += trks.length ? trks.map(function(t){
    var cls = t.status==='Зламаний' ? 'bad' : (t.status==='Втрачений' ? 'lost' : 'ok');
    return '<div class="tcard '+cls+'">'+
      '<div class="tcard-head"><span class="tcard-id">'+esc(t.imei||t.id)+(t.imei?' <span style="font-size:10px;color:var(--dim)">('+esc(t.id)+')</span>':'')+'</span>'+statusChip(t.status)+'</div>'+
      '<div class="tcard-meta mono">'+esc(t.model)+
      '<br>📱 '+(t.simContact?esc(t.simContact)+' · '+esc(t.simNumber):'SIM не прив\'язана')+
      (t.binding?'<br>🔗 Борт: '+esc(t.binding):'')+'</div>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn btn-mini btn-sec" onclick="doTrkStatus(\''+esc(t.id)+'\',\'Робочий\')">✅</button>'+
        '<button class="btn btn-mini btn-sec" onclick="doTrkStatus(\''+esc(t.id)+'\',\'Зламаний\')">🔧</button>'+
        '<button class="btn btn-mini btn-sec" onclick="doTrkStatus(\''+esc(t.id)+'\',\'Втрачений\')">❌</button>'+
        (t.simContact
          ? '<button class="btn btn-mini btn-red" onclick="doUnbindSim(\''+esc(t.id)+'\')">🔌 Відв\'язати SIM</button>'
          : '<button class="btn btn-mini btn-green" onclick="openBindSim(\''+esc(t.id)+'\')">🔗 SIM</button>')+
      '</div>'+
    '</div>';
  }).join('') : '<div class="empty">Трекерів ще немає</div>';
  html += '</div>';

  html += '<div><div class="panel-title">📱 SIM-карти ('+sims.length+')</div>';
  html += sims.length ? sims.map(function(s){
    var cls = s.status==='Втрачена' ? 'lost' : (s.status==='Активна' ? 'ok' : 'bad');
    return '<div class="tcard '+cls+'">'+
      '<div class="tcard-head"><span class="tcard-id">'+esc(s.id)+' — '+esc(s.contact)+'</span>'+statusChip(s.status)+'</div>'+
      '<div class="tcard-meta mono">📞 '+esc(s.number)+
      (s.binding?'<br>🔗 Трекер: <b>'+esc(s.binding)+'</b>':'<br><span style="color:var(--dim)">— вільна</span>')+'</div>'+
      '<div class="btn-row" style="margin-top:8px">'+
        '<button class="btn btn-mini btn-sec" onclick="doSimStatus(\''+esc(s.id)+'\',\'Активна\')">✅</button>'+
        '<button class="btn btn-mini btn-sec" onclick="doSimStatus(\''+esc(s.id)+'\',\'Заблокована\')">🚫</button>'+
        '<button class="btn btn-mini btn-sec" onclick="doSimStatus(\''+esc(s.id)+'\',\'Втрачена\')">❌</button>'+
        '<button class="btn btn-mini btn-sec" onclick="doSimStatus(\''+esc(s.id)+'\',\'Невідомо\')">❓</button>'+
      '</div>'+
    '</div>';
  }).join('') : '<div class="empty">SIM-карт ще немає</div>';
  html += '</div></div>';
  c.innerHTML = html;
}
function doTrkStatus(id, st) {
  if (st === 'Втрачений' && !confirm('❗ Позначити трекер '+id+' ВТРАЧЕНИМ? Це незворотньо, SIM теж стане втраченою.')) return;
  rpc('updateSinotrackStatus', [id, st, ''], function(){ toast('📡 '+id+' → '+st); loadAll(); });
}
function doSimStatus(id, st) {
  rpc('updateSimStatus', [id, st], function(){ toast('📱 '+id+' → '+st); loadAll(); });
}
function openAddTracker() {
  var simOpts = S.sims.filter(function(s){ return !s.binding; }).map(function(s){
    return '<option value="'+esc(s.id)+'">'+esc(s.contact)+' · '+esc(s.number)+'</option>';
  }).join('');
  openModal('📡 Новий трекер',
    '<div class="f"><label>Модель *</label><input type="text" id="atModel" placeholder="ST-901"></div>'+
    '<div class="f"><label>Заводський ID / IMEI</label><input type="text" id="atImei" placeholder="8641290055512"></div>'+
    '<div class="f"><label>SIM-карта</label><select id="atSim"><option value="">— без SIM —</option>'+simOpts+'</select></div>'+
    '<div class="f"><label>Примітка</label><input type="text" id="atNote"></div>'+
    '<button class="btn" id="atBtn" onclick="doAddTracker()">➕ Додати трекер</button>'
  );
}
function doAddTracker() {
  var model = $('atModel').value.trim();
  if (!model) { toast('⚠ Вкажи модель', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('atBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() { if (btn) { btn.disabled = false; btn.textContent = '➕ Додати трекер'; } }
  var simId = $('atSim').value;
  rpc('addSinotrack', [{ model: model, imei: $('atImei').value.trim(), note: $('atNote').value.trim() }], function(newId){
    if (simId) {
      rpc('bindSimToTracker', [simId, newId, false], function(){ toast('📡 '+newId+' додано + SIM'); closeModal(); loadAll(); },
        function(e){ toast('📡 '+newId+' додано, але SIM не прив\'язано: ' + e.message, true); closeModal(); loadAll(); });
    } else { toast('📡 '+newId+' додано'); closeModal(); loadAll(); }
  }, function(e){ unlock(); toast('❌ ' + e.message, true); });
}
function openAddSim() {
  openModal('📱 Нова SIM-карта',
    '<div class="f"><label>Назва контакту *</label><input type="text" id="asContact" placeholder="Vodafone-07"></div>'+
    '<div class="f"><label>Номер *</label><input type="text" id="asNumber" placeholder="+380671112233"></div>'+
    '<button class="btn" id="asBtn" onclick="doAddSim()">➕ Додати SIM</button>'
  );
}
function doAddSim() {
  var contact = $('asContact').value.trim(), number = $('asNumber').value.trim();
  if (!contact || !number) { toast('⚠ Заповни контакт і номер', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('asBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  rpc('addSim', [{ contact: contact, number: number }], function(newId){ toast('📱 '+newId+' додано'); closeModal(); loadAll(); },
    function(e){ if (btn) { btn.disabled = false; btn.textContent = '➕ Додати SIM'; } toast('❌ ' + e.message, true); });
}
function openBindSim(trackerId) {
  var freeSims = S.sims.filter(function(s){ return !s.binding && s.status !== 'Втрачена'; });
  if (!freeSims.length) { toast('⚠ Немає вільних SIM-карт', true); return; }
  openModal('🔗 Прив\'язати SIM до '+esc(trackerId),
    '<div class="f"><label>SIM-карта</label><select id="bsSim">'+
    freeSims.map(function(s){ return '<option value="'+esc(s.id)+'">'+esc(s.id)+' — '+esc(s.contact)+' · '+esc(s.number)+'</option>'; }).join('')+
    '</select></div>'+
    '<button class="btn" id="bsBtn" onclick="doBindSim(\''+esc(trackerId)+'\')">🔗 Прив\'язати</button>'
  );
}
function doBindSim(trackerId) {
  var simId = $('bsSim').value;
  // Захист від повторного натискання поки виконується запит
  var btn = $('bsBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() { if (btn) { btn.disabled = false; btn.textContent = '🔗 Прив\'язати'; } }
  rpc('bindSimToTracker', [simId, trackerId, false], function(){
    toast('🔗 SIM прив\'язано'); closeModal(); loadAll();
  }, function(e){
    if (confirm('⚠ ' + e.message + '\n\nПрив\'язати примусово?')) {
      rpc('bindSimToTracker', [simId, trackerId, true], function(){ toast('🔗 SIM прив\'язано (примусово)'); closeModal(); loadAll(); },
        function(e2){ unlock(); toast('❌ ' + e2.message, true); });
    } else { unlock(); }
  });
}
function doUnbindSim(trackerId) {
  if (!confirm('🔌 Відв\'язати SIM від '+trackerId+'?')) return;
  rpc('unbindSimFromTracker', [trackerId], function(){ toast('🔌 SIM відв\'язано'); loadAll(); });
}

/* ═══════════ ВИД: ІНВЕНТАР ═══════════ */
var invFilter = { q:'', type:'all', status:'all' };
var invMode = 'view';   // 'view' | 'edit'
var invTab = 'all';     // 'all' — загальний | 'crew' — інвентар екіпажу
var invCrewSel = '';    // вибраний екіпаж на вкладці екіпажу
var invBusy = {};       // id → true поки виконується запит по рядку
var myCallsign = '';    // запам'ятований позивний для «Прийняти»
var INV_STATUSES = ['Робочий','Ремонт','На перевірці','Несправний','Втрачений','Списаний','Резерв'];
var TRK_STATUSES = ['Робочий','Зламаний','Втрачений'];

function invIsAdmin() { return !!(S.invCaps && S.invCaps.admin); }
function invStatuses() { return (S.invCaps && S.invCaps.statuses && S.invCaps.statuses.length) ? S.invCaps.statuses : INV_STATUSES; }

function renderInventory(c) {
  var types = {};
  S.items.forEach(function(it){ var t = String(it.type||'').split('-')[0]; if (t) types[t] = 1; });
  var typeChips = ['all'].concat(Object.keys(types).sort()).map(function(t){
    return '<button class="filter-chip'+(invFilter.type===t?' active':'')+'" onclick="invFilter.type=\''+t+'\';renderView()">'+(t==='all'?'ВСІ':esc(t))+'</button>';
  }).join('');
  var stats = {};
  S.items.forEach(function(it){ var s = String(it.status||'').trim(); stats[s] = (stats[s]||0)+1; });

  var canEdit = !!S.invCaps;
  var sub;
  if (!canEdit) {
    sub = S.items.length+' одиниць · довідково (редагування — в таблиці)';
  } else if (invMode !== 'edit') {
    sub = S.items.length+' одиниць · перегляд';
  } else if (S.invCaps.mode === 'status-only') {
    sub = S.items.length+' одиниць · редагування: статуси (синк переносить в основну таблицю)';
  } else if (invIsAdmin()) {
    sub = S.items.length+' одиниць · редагування: статуси (списання — через статус) · прийняти · до екіпажу · видалити';
  } else {
    sub = S.items.length+' одиниць · редагування: статуси · прийняти обладнання';
  }

  var modeToggle = canEdit
    ? '<div class="inv-mode">'+
        '<button class="inv-mode-btn'+(invMode!=='edit'?' active':'')+'" onclick="invSetMode(\'view\')">Перегляд</button>'+
        '<button class="inv-mode-btn'+(invMode==='edit'?' active':'')+'" onclick="invSetMode(\'edit\')">Редагування</button>'+
      '</div>'
    : '';

  // Вкладки: загальний інвентар / інвентар екіпажу
  var tabs = '<div class="inv-tabs">'+
    '<button class="inv-tab'+(invTab==='all'?' active':'')+'" onclick="invSetTab(\'all\')">Загальний інвентар</button>'+
    '<button class="inv-tab'+(invTab==='crew'?' active':'')+'" onclick="invSetTab(\'crew\')">Інвентар екіпажу</button>'+
  '</div>';

  // Панель вибору екіпажу (вкладка екіпажу)
  var crewBar = '';
  if (invTab === 'crew') {
    var crews = activeCrews();
    if (!invCrewSel || !crews.find(function(cr){ return cr.id === invCrewSel; })) {
      invCrewSel = crews.length ? crews[0].id : '';
    }
    var crewOpts = crews.map(function(cr){
      return '<option value="'+esc(cr.id)+'"'+(cr.id===invCrewSel?' selected':'')+'>'+esc(cr.id)+(cr.bind?' ['+esc(cr.bind)+']':'')+'</option>';
    }).join('');
    var addDroneBtn = (invMode==='edit' && canEdit && S.invCaps.mode!=='status-only' && invIsAdmin() && invCrewSel)
      ? '<button class="btn btn-mini btn-green" onclick="invAddDroneToCrewModal()">➕ Додати борт</button>' : '';
    crewBar = '<div class="inv-crew-bar">'+
      '<label>Вибір підрозділу:</label>'+
      (crews.length
        ? '<select onchange="invCrewSel=this.value;renderView()">'+crewOpts+'</select>'
        : '<span class="hint">Немає активних екіпажів</span>')+
      addDroneBtn+
    '</div>';
  }

  c.innerHTML = '<div class="view-title">Інвентар <span class="accent">підрозділу</span></div>'+
    '<div class="view-sub">'+sub+'</div>'+
    '<div class="stat-row">'+
      '<div class="stat-tile green"><div class="stat-num">'+(stats['Робочий']||0)+'</div><div class="stat-lbl">Робочі</div></div>'+
      '<div class="stat-tile"><div class="stat-num">'+(stats['Ремонт']||0)+'</div><div class="stat-lbl">В ремонті</div></div>'+
      '<div class="stat-tile red"><div class="stat-num">'+((stats['Несправний']||0)+(stats['Втрачений']||0))+'</div><div class="stat-lbl">Несправні + втрачені</div></div>'+
      '<div class="stat-tile blue"><div class="stat-num">'+(stats['Резерв']||0)+'</div><div class="stat-lbl">Резерв</div></div>'+
    '</div>'+
    tabs+
    crewBar+
    '<div class="filter-row">'+
      '<input type="text" id="invSearch" placeholder="Пошук: ID, назва, відповідальний…" value="'+esc(invFilter.q)+'" oninput="invFilter.q=this.value;renderInvTable()">'+
      (invTab==='all' ? typeChips : '')+
      modeToggle+
    '</div>'+
    '<div class="table-wrap"><table class="data-table" id="invTable"></table></div>';
  renderInvTable();
}

function invSetMode(m) { invMode = m; renderView(); }
function invSetTab(t) { invTab = t; renderView(); }

// Чи можна предмет додати до екіпажу (борти)
function invIsDrone(it) {
  var t = String(it.type||'');
  return t.indexOf('FPV')===0 || t.indexOf('STNG')===0 || t.indexOf('WING')===0;
}

function invStatusSelectHtml(it) {
  var cur = String(it.status||'').trim();
  var sts = invStatuses();
  var opts = sts.map(function(s){
    return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';
  });
  if (cur && sts.indexOf(cur) === -1) {
    opts.unshift('<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>');
  }
  var busy = invBusy[it.id] ? ' disabled' : '';
  return '<select class="inv-status-sel" data-id="'+esc(it.id)+'" onchange="invChangeStatus(this)"'+busy+'>'+opts.join('')+'</select>';
}

// В якому активному екіпажі зараз предмет (по пулу бортів)
function invItemCrew(id) {
  return activeCrews().find(function(c){
    var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }) : [];
    return dl.indexOf(id) !== -1;
  }) || null;
}

function invActionsHtml(it) {
  if (S.invCaps.mode === 'status-only') return '';
  if (invBusy[it.id]) return '<div class="inv-acts"><span class="hint">⏳</span></div>';
  // Дії під ID, однакові на обох вкладках. Списання — через статус «Списаний».
  var h = '<div class="inv-acts">';
  h += '<button class="inv-act inv-act--ok" title="Прийняти обладнання (стати відповідальним)" onclick="invAcceptItem(this.dataset.id)" data-id="'+esc(it.id)+'">✓</button>';
  if (invIsAdmin()) {
    if (invIsDrone(it)) {
      // Одна кнопка-перемикач: в екіпажі → прибрати (✕), поза екіпажем → додати (+)
      var inCrew = invItemCrew(it.id);
      h += inCrew
        ? '<button class="inv-act inv-act--crew" title="Прибрати з екіпажу '+esc(inCrew.id)+'" onclick="invCrewToggle(this.dataset.id)" data-id="'+esc(it.id)+'">✕</button>'
        : '<button class="inv-act inv-act--crew" title="Додати до екіпажу" onclick="invCrewToggle(this.dataset.id)" data-id="'+esc(it.id)+'">+</button>';
    }
    h += '<button class="inv-act inv-act--del" title="Видалити з обліку" onclick="invDelete(this.dataset.id)" data-id="'+esc(it.id)+'">🗑</button>';
  }
  return h + '</div>';
}

// Перемикач екіпажу: в екіпажі → прибрати з пулу, інакше → вибір екіпажу
function invCrewToggle(id) {
  var c = invItemCrew(id);
  if (c) invRemoveFromCrew(id, c.id);
  else invAddToCrew(id);
}

function invRemoveFromCrew(id, crewId) {
  var c = crewById(crewId);
  if (!c) return;
  var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  var rest = dl.filter(function(x){ return x !== id; });
  var warn = rest.length ? '' : '\n⚠ Це останній борт у пулі — екіпаж лишиться без бортів.';
  if (!confirm('✕ Прибрати '+id+' з пулу екіпажу '+crewId+'?'+warn)) return;
  if (invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  rpc('updateCrew', [crewId, { drones: rest.join('|') }], function(){
    c.drones = rest.join('|');
    delete invBusy[id];
    toast('✕ '+id+' прибрано з '+crewId);
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// Предмети інвентарю вибраного екіпажу (борти пулу + наземка)
function invCrewItems() {
  var c = crewById(invCrewSel);
  if (!c) return [];
  var ids = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  if (c.gnst) ids.push(c.gnst.trim());
  return S.items.filter(function(it){ return ids.indexOf(it.id) !== -1; });
}

// Трекери вибраного екіпажу — рядки з власним списком статусів
function invCrewTrackers() {
  var c = crewById(invCrewSel);
  if (!c || !c.tracker) return [];
  var ids = c.tracker.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
  return S.trackers.filter(function(t){ return ids.indexOf(t.id) !== -1; });
}

function invTrkStatusSelectHtml(t) {
  var cur = String(t.status||'').trim();
  var opts = TRK_STATUSES.map(function(s){
    return '<option value="'+esc(s)+'"'+(s===cur?' selected':'')+'>'+esc(s)+'</option>';
  });
  if (cur && TRK_STATUSES.indexOf(cur) === -1) {
    opts.unshift('<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>');
  }
  var busy = invBusy[t.id] ? ' disabled' : '';
  return '<select class="inv-status-sel" data-id="'+esc(t.id)+'" onchange="invTrkChangeStatus(this)"'+busy+'>'+opts.join('')+'</select>';
}

function invTrkChangeStatus(sel) {
  var id = sel.dataset.id;
  var t = S.trackers.find(function(x){ return x.id === id; });
  if (!t) return;
  var newSt = sel.value;
  var oldSt = String(t.status||'').trim();
  if (newSt === oldSt) return;
  if (newSt === 'Втрачений' && !confirm('❗ Трекер '+id+' — ВТРАЧЕНИЙ? Це незворотньо, SIM теж стане втраченою.')) { sel.value = oldSt; return; }
  invBusy[id] = true; renderInvTable();
  rpc('updateSinotrackStatus', [id, newSt, ''], function(){
    t.status = newSt;
    delete invBusy[id];
    toast('📡 '+id+': '+oldSt+' → '+newSt);
    renderInvTable();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

function renderInvTable() {
  var q = invFilter.q.toLowerCase();
  var source = invTab === 'crew' ? invCrewItems() : S.items;
  var list = source.filter(function(it){
    if (invTab === 'all' && invFilter.type !== 'all' && String(it.type||'').split('-')[0] !== invFilter.type) return false;
    if (q && (it.id+' '+it.name+' '+it.type+' '+it.responsible+' '+it.assignment).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  var edit = invMode === 'edit' && !!S.invCaps;
  var showActs = edit && S.invCaps.mode !== 'status-only';

  var head = '<thead><tr><th>ID'+(showActs?' / дії':'')+'</th><th>Назва</th><th>Тип</th><th>Закріплення</th><th>Статус</th><th>Відповідальний</th><th>Дата</th><th>Компл.</th><th>Примітка</th></tr></thead>';
  var cols = 9;

  var rows = list.map(function(it){
    return '<tr><td class="mono accent">'+esc(it.id)+(showActs ? invActionsHtml(it) : '')+'</td>'+
      '<td>'+esc(it.name)+'</td><td class="mono">'+esc(it.type)+'</td>'+
      '<td>'+esc(it.assignment)+'</td>'+
      '<td>'+(edit ? invStatusSelectHtml(it) : statusChip(it.status))+'</td>'+
      '<td>'+esc(it.responsible)+'</td>'+
      '<td class="mono">'+esc(it.date||'')+'</td>'+
      '<td class="mono">'+esc(it.kit)+'</td>'+
      '<td class="mono" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(it.note||'')+'">'+esc(it.note||'')+'</td>'+
    '</tr>';
  }).join('');

  // Вкладка екіпажу: додаємо рядки GPS трекерів екіпажу (свій список статусів)
  if (invTab === 'crew') {
    var trks = invCrewTrackers().filter(function(t){
      if (q && ((t.imei||'')+' '+t.id+' '+(t.model||'')).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    rows += trks.map(function(t){
      var c = crewById(invCrewSel);
      var bind = t.binding ? 'Борт '+t.binding : (c ? c.id : '');
      return '<tr><td class="mono accent">'+esc(t.imei||t.id)+'</td><td>'+esc(t.model||'')+'</td><td class="mono">GPS Трекер</td>'+
        '<td>'+esc(bind)+'</td>'+
        '<td>'+(edit ? invTrkStatusSelectHtml(t) : statusChip(t.status))+'</td>'+
        '<td></td>'+
        '<td class="mono"></td>'+
        '<td class="mono">'+esc(t.simContact||'')+'</td>'+
        '<td class="mono" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(t.note||'')+'">'+esc(t.note||'')+'</td>'+
      '</tr>';
    }).join('');
  }

  $('invTable').innerHTML = head+
    '<tbody>'+(rows || '<tr><td colspan="'+cols+'" class="empty">Нічого не знайдено</td></tr>')+'</tbody>';
}

// ── Зміна статусу (випадаючий список у рядку) ──
function invChangeStatus(sel) {
  var id = sel.dataset.id;
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  var newSt = sel.value;
  var oldSt = String(it.status||'').trim();
  if (newSt === oldSt) return;
  if (newSt === 'Втрачений') { sel.value = oldSt; openLostModal(id); return; }
  if (newSt === 'Списаний' && !confirm('📉 Списати '+id+'? Відповідальний очиститься.')) { sel.value = oldSt; return; }
  invBusy[id] = true; renderInvTable();
  rpc('updateItemStatusById', [{ id:id, status:newSt }], function(){
    it.status = newSt;
    if (newSt === 'Списаний') it.responsible = '';
    delete invBusy[id];
    toast('✅ '+id+': '+oldSt+' → '+newSt);
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// ── Втрата: модалка з деталями ──
function openLostModal(id) {
  openModal('❌ Втрата: '+esc(id),
    '<div class="f"><label>📍 Координати</label><input type="text" id="lmCoords" placeholder="напр. 48.123, 35.456"></div>'+
    '<div class="f"><label>🗺 Посилання з трекера</label><input type="text" id="lmLink" placeholder="необов\'язково"></div>'+
    '<div class="f"><label>📋 Обставини втрати</label><input type="text" id="lmCirc" placeholder="необов\'язково"></div>'+
    '<div class="hint">⚠️ Прив\'язаний трекер і його SIM теж стануть втраченими</div>'+
    '<button class="btn btn-red" id="lmBtn" onclick="doMarkLost(\''+esc(id)+'\')" style="margin-top:8px">❌ Підтвердити втрату</button>'
  );
}
function doMarkLost(id) {
  var btn = $('lmBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ Запис…'; }
  var lost = { coords: $('lmCoords').value.trim(), mapsLink: $('lmLink').value.trim(), conditions: $('lmCirc').value.trim() };
  rpc('updateItemStatusById', [{ id:id, status:'Втрачений', lostData: lost }], function(){
    var it = S.items.find(function(x){ return x.id === id; });
    if (it) it.status = 'Втрачений';
    toast('❌ '+id+' позначено втраченим');
    closeModal(); loadAll();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '❌ Підтвердити втрату'; }
    toast('❌ '+e.message, true);
  });
}

// ── Прийняти обладнання (стати відповідальним) ──
function invAcceptItem(id) {
  var it = S.items.find(function(x){ return x.id === id; });
  if (!it) return;
  var name = prompt('✅ Прийняти '+id+' ('+it.name+').\nХто приймає? Позивний або ПІБ:', myCallsign || '');
  if (name === null) return;
  name = name.trim();
  if (!name) { toast('⚠ Вкажи позивний', true); return; }
  myCallsign = name;
  if (invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  rpc('executeMovement', [{ id:id, to:name, responsible:name, comment:'Прийнято через веб-застосунок' }], function(){
    it.responsible = name;
    delete invBusy[id];
    toast('✅ '+id+' прийнято: '+name);
    renderInvTable();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// ── Видалення з обліку (адмін) ──
function invDelete(id) {
  var reason = prompt('🗑 Видалити '+id+' з обліку БЕЗПОВОРОТНО?\nВкажи причину:', '');
  if (reason === null) return;
  if (invBusy[id]) return;
  invBusy[id] = true; renderInvTable();
  rpc('webDeleteInventoryItem', [id, reason.trim()], function(){
    S.items = S.items.filter(function(x){ return x.id !== id; });
    delete invBusy[id];
    toast('🗑 '+id+' видалено з обліку');
    renderView();
  }, function(e){ delete invBusy[id]; renderInvTable(); toast('❌ '+e.message, true); });
}

// ── Додати борт до екіпажу (адмін) ──
function invAddToCrew(id) {
  var crews = activeCrews();
  if (!crews.length) { toast('⚠ Немає активних екіпажів', true); return; }
  var opts = crews.map(function(c){
    var dl = c.drones ? c.drones.split('|').filter(Boolean) : [];
    var inCrew = dl.indexOf(id) !== -1;
    return '<option value="'+esc(c.id)+'"'+(inCrew?' disabled':'')+'>'+esc(c.id)+(c.bind?' ['+esc(c.bind)+']':'')+' — '+dl.length+' борт.'+(inCrew?' (вже там)':'')+'</option>';
  }).join('');
  openModal('👥 '+esc(id)+' → екіпаж',
    '<div class="f"><label>Екіпаж</label><select id="acCrew">'+opts+'</select></div>'+
    '<button class="btn btn-green" id="acBtn" onclick="doAddToCrew(\''+esc(id)+'\')">➕ Додати в пул екіпажу</button>'
  );
}
function doAddToCrew(id) {
  var crewId = $('acCrew').value;
  var c = crewById(crewId);
  if (!c) { toast('❌ Екіпаж не знайдено', true); return; }
  var dl = c.drones ? c.drones.split('|').filter(Boolean) : [];
  if (dl.indexOf(id) !== -1) { toast('⚠ '+id+' вже в пулі '+crewId, true); return; }
  var btn = $('acBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ Запис…'; }
  var drones = dl.concat([id]).join('|');
  rpc('updateCrew', [crewId, { drones: drones }], function(){
    c.drones = drones;
    toast('✅ '+id+' додано до '+crewId);
    closeModal(); renderView();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '➕ Додати в пул екіпажу'; }
    toast('❌ '+e.message, true);
  });
}

// ── Додати борт до вибраного екіпажу (кнопка на вкладці екіпажу) ──
function invAddDroneToCrewModal() {
  var c = crewById(invCrewSel);
  if (!c) { toast('⚠ Обери екіпаж', true); return; }
  var inCrew = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  var free = S.items.filter(function(it){ return invIsDrone(it) && inCrew.indexOf(it.id) === -1; });
  if (!free.length) { toast('⚠ Немає вільних бортів', true); return; }
  var opts = free.map(function(it){
    return '<option value="'+esc(it.id)+'">'+esc(it.id)+' — '+esc(it.name)+' ('+esc(it.status)+')</option>';
  }).join('');
  openModal('➕ Борт → '+esc(invCrewSel),
    '<div class="f"><label>Борт</label><select id="adDrone">'+opts+'</select></div>'+
    '<button class="btn btn-green" id="adBtn" onclick="doAddDroneToCrew()">➕ Додати в пул '+esc(invCrewSel)+'</button>'
  );
}
function doAddDroneToCrew() {
  var id = $('adDrone').value;
  var c = crewById(invCrewSel);
  if (!c || !id) return;
  var dl = c.drones ? c.drones.split('|').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  if (dl.indexOf(id) !== -1) { toast('⚠ '+id+' вже в пулі', true); return; }
  var btn = $('adBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳ Запис…'; }
  var drones = dl.concat([id]).join('|');
  rpc('updateCrew', [c.id, { drones: drones }], function(){
    c.drones = drones;
    toast('✅ '+id+' додано до '+c.id);
    closeModal(); renderView();
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '➕ Додати в пул '+invCrewSel; }
    toast('❌ '+e.message, true);
  });
}

/* ═══════════ ВИД: ЕКІПАЖ ═══════════ */
var crewForm = { drones: [], trackers: [], reserves: [], editId: null };
function renderCrews(c) {
  var crews = activeCrews();
  var html = '<div class="view-title">Екіпажі <span class="accent">підрозділу</span></div>'+
    '<div class="view-sub">'+crews.length+' активних</div>'+
    '<div class="grid-2">';

  html += '<div><div class="panel-title">👥 Активні екіпажі</div>';
  html += crews.length ? crews.map(function(cr){
    var mine = isMine(cr);
    var dl = cr.drones ? cr.drones.split('|').filter(Boolean) : [];
    return '<div class="tcard '+(mine?'mine':'other')+'">'+
      '<div class="tcard-head"><span class="tcard-id">'+esc(cr.id)+'</span>'+(mine?'<span class="chip chip-main">МІЙ</span>':'')+'</div>'+
      '<div class="tcard-meta mono">'+
        (cr.gnst?'📡 '+esc(cr.gnst)+'<br>':'')+
        (cr.bind?'🔗 Bind: <b>'+esc(cr.bind)+'</b><br>':'')+
        (cr.tracker?'🛰 '+esc(cr.tracker.split('|').join(', '))+'<br>':'')+
        (cr.system?'📹 '+esc(cr.system)+'<br>':'')+
        (cr.freq?'📻 <b>'+esc(cr.freq)+'</b>'+(cr.reserves?' · 🔄 '+esc(cr.reserves.split('|').join(', ')):'')+'<br>':'')+
        '🛸 '+dl.map(function(d){ return '<span class="chip">'+esc(d)+'</span>'; }).join('')+
      '</div>'+
      (mine
        ? '<div class="btn-row" style="margin-top:8px">'+
            '<button class="btn btn-mini btn-green" onclick="openCrewForm(\''+esc(cr.id)+'\')">✏️ Редагувати</button>'+
            '<button class="btn btn-mini btn-red" onclick="doCloseCrew(\''+esc(cr.id)+'\')">🔴 Завершити</button>'+
          '</div>'
        : '')+
    '</div>';
  }).join('') : '<div class="empty">Активних екіпажів немає</div>';
  html += '</div>';

  html += '<div><div class="panel-title">➕ Новий екіпаж</div><div class="panel" id="crewFormPanel"></div></div>';
  html += '</div>';
  c.innerHTML = html;
  crewForm = { drones: [], trackers: [], reserves: [], editId: null };
  renderCrewForm();
}
function renderCrewForm() {
  var panel = $('crewFormPanel');
  if (!panel) return;
  var editing = !!crewForm.editId;
  var cr = editing ? crewById(crewForm.editId) : null;

  var busyGnst = {};
  activeCrews().forEach(function(c2){ if (c2.gnst && c2.id !== crewForm.editId) busyGnst[c2.gnst] = (busyGnst[c2.gnst]||[]).concat(c2.id); });
  var gnstOpts = '<option value="">— без наземки —</option>' +
    S.items.filter(function(it){ return it.type && it.type.indexOf('GNST')===0; }).map(function(it){
      var busy = busyGnst[it.id];
      var selected = cr && cr.gnst === it.id ? ' selected' : '';
      return '<option value="'+esc(it.id)+'"'+selected+'>'+esc(it.id+' — '+it.name+(busy?' 🔒 '+busy.join(', '):''))+'</option>';
    }).join('');
  var sysOpts = '<option value="">— не вказано —</option>' + VIDEO_SYSTEMS.map(function(s){
    return '<option value="'+s+'"'+(cr && cr.system===s?' selected':'')+'>'+s+'</option>';
  }).join('');

  panel.innerHTML =
    (editing?'<div class="chip chip-main" style="margin-bottom:10px">РЕДАГУВАННЯ '+esc(crewForm.editId)+'</div>':'')+
    '<div class="f"><label>Наземна станція</label><select id="cfGnst">'+gnstOpts+'</select></div>'+
    '<div class="f"><label>Bind фраза</label><input type="text" id="cfBind" placeholder="спільна для всіх бортів…" value="'+esc(cr?cr.bind:'')+'"></div>'+
    '<div class="f"><label>Борти (пул)</label>'+
      '<div class="ac-wrap"><input type="text" id="cfDroneSearch" placeholder="Пошук борту…" oninput="cfFilterDrones()" autocomplete="off"><div class="ac-list" id="cfDroneDd"></div></div>'+
      '<div id="cfDroneList" style="margin-top:6px"></div></div>'+
    '<div class="f"><label>Sinotrack трекери</label>'+
      '<div class="ac-wrap"><input type="text" id="cfTrkSearch" placeholder="Пошук трекера…" oninput="cfFilterTrackers()" onfocus="cfFilterTrackers()" autocomplete="off"><div class="ac-list" id="cfTrkDd"></div></div>'+
      '<div id="cfTrkList" style="margin-top:6px"></div>'+
      '<div class="hint">💡 Перевірка: SMS 669000 на номер SIM → ID і координати</div></div>'+
    '<div class="f"><label>Відеосистема</label><select id="cfSystem" onchange="cfSystemChange()">'+sysOpts+'</select>'+
      '<div class="hint" id="cfSysHint"></div></div>'+
    '<div class="f"><label>Основна частота</label><select id="cfFreq" onchange="freqWarn(this)"><option value="">— не вказано —</option>'+freqOptionsHtml(cr ? cr.system : '')+'</select></div>'+
    '<div class="f"><label>📻 Резервні VTX (до 10)</label>'+
      '<select id="cfReserveSel" onchange="cfAddReserve()"><option value="">+ додати резервну</option>'+freqOptionsHtml(cr ? cr.system : '')+'</select>'+
      '<div id="cfReserveList" style="margin-top:6px"></div></div>'+
    (editing
      ? '<div class="btn-row"><button class="btn btn-green" id="cfBtn" onclick="doSaveCrew()">💾 Зберегти</button>'+
        '<button class="btn btn-sec" onclick="crewForm={drones:[],trackers:[],reserves:[],editId:null};renderView()">Скасувати</button></div>'
      : '<button class="btn btn-green" id="cfBtn" onclick="doSaveCrew()">👥 Створити екіпаж</button>');

  if (cr && cr.freq) cfSetFreqValue(cr.freq);
  cfRenderChips();
}
// Виставити частоту; якщо її немає в списку (інша система) — додати окремою опцією щоб не загубити
function cfSetFreqValue(freq) {
  var fs = $('cfFreq');
  if (!fs || !freq) return;
  fs.value = freq;
  if (fs.value !== freq) {
    var o = document.createElement('option');
    o.value = freq; o.textContent = freq;
    fs.appendChild(o);
    fs.value = freq;
  }
}
// Перебудувати списки частот (основна + резервні) під відеосистему
function cfRebuildFreqs(system) {
  var fs = $('cfFreq'), rs = $('cfReserveSel');
  var opts = freqOptionsHtml(system);
  if (fs) {
    var cur = fs.value;
    fs.innerHTML = '<option value="">— не вказано —</option>' + opts;
    if (cur) cfSetFreqValue(cur);
  }
  if (rs) rs.innerHTML = '<option value="">+ додати резервну</option>' + opts;
}
function cfSystemChange() {
  var hint = $('cfSysHint');
  if (hint) hint.innerHTML = '';
  cfRebuildFreqs($('cfSystem').value);
}
// Авто-визначення відеосистеми екіпажу по назвах бортів у пулі
function cfAutoDetectSystem() {
  var sel = $('cfSystem');
  if (!sel) return;
  var detected = '';
  for (var i = 0; i < crewForm.drones.length; i++) {
    var it = S.items.find(function(x){ return x.id === crewForm.drones[i]; });
    var d = detectSystemFromName(it ? it.name : '');
    if (d) { detected = d; break; }
  }
  if (detected) {
    sel.value = detected;
    var hint = $('cfSysHint');
    if (hint) hint.innerHTML = '✅ Авто з борту: <b>'+esc(detected)+'</b>';
    cfRebuildFreqs(detected);
  }
}
function cfFilterDrones() {
  var q = $('cfDroneSearch').value.toLowerCase();
  var dd = $('cfDroneDd');
  if (!q) { dd.style.display='none'; return; }
  var busy = busyDrones();
  var list = S.items.filter(function(it){
    return (it.type.indexOf('FPV')===0 || it.type.indexOf('STNG')===0 || it.type.indexOf('WING')===0) &&
      (it.id.toLowerCase().indexOf(q)!==-1 || it.name.toLowerCase().indexOf(q)!==-1) &&
      crewForm.drones.indexOf(it.id) === -1;
  }).slice(0, 10);
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(it){
    return '<div class="ac-item" onmousedown="cfAddDrone(\''+esc(it.id)+'\')">'+
      '<div class="ac-id">'+esc(it.id)+(busy[it.id]?' ⚠ в повітрі':'')+'</div>'+
      '<div class="ac-meta">'+esc(it.name)+' · '+esc(it.status)+'</div></div>';
  }).join('');
  dd.style.display = 'block';
}
function cfAddDrone(id) { if (crewForm.drones.indexOf(id)===-1) crewForm.drones.push(id); $('cfDroneSearch').value=''; $('cfDroneDd').style.display='none'; cfRenderChips(); cfAutoDetectSystem(); }
function cfRemoveDrone(id) { crewForm.drones = crewForm.drones.filter(function(x){ return x !== id; }); cfRenderChips(); cfAutoDetectSystem(); }
function cfFilterTrackers() {
  var q = $('cfTrkSearch').value.toLowerCase().trim();
  var dd = $('cfTrkDd');
  var busyTrk = {};
  activeCrews().forEach(function(c2){
    if (c2.tracker && c2.id !== crewForm.editId) c2.tracker.split('|').forEach(function(t){ t=t.trim(); if(t) busyTrk[t]=(busyTrk[t]||[]).concat(c2.id); });
  });
  var list = S.trackers.filter(function(t){
    return crewForm.trackers.indexOf(t.id)===-1 &&
      (!q || t.id.toLowerCase().indexOf(q)!==-1 || (t.model||'').toLowerCase().indexOf(q)!==-1 || (t.imei||'').toLowerCase().indexOf(q)!==-1);
  }).slice(0, 10);
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(t){
    var busy = busyTrk[t.id];
    var flag = busy ? ' 🔒 '+busy.join(',') : (t.status!=='Робочий' ? ' ⚠ '+t.status : '');
    return '<div class="ac-item" '+(busy?'style="opacity:.5;cursor:not-allowed"':'onmousedown="cfAddTracker(\''+esc(t.id)+'\')"')+'>'+
      '<div class="ac-id">'+esc(t.imei||t.id)+flag+'</div>'+
      '<div class="ac-meta">'+esc(t.model)+' · '+esc(t.simContact||'без SIM')+'</div></div>';
  }).join('');
  dd.style.display = 'block';
}
function cfAddTracker(id) {
  var t = S.trackers.find(function(x){ return x.id===id; });
  if (t && t.status !== 'Робочий' && !confirm('⚠ Трекер '+id+' — '+t.status+'! Додати все одно?')) return;
  if (crewForm.trackers.indexOf(id)===-1) crewForm.trackers.push(id);
  $('cfTrkSearch').value=''; $('cfTrkDd').style.display='none'; cfRenderChips();
}
function cfAddReserve() {
  var sel = $('cfReserveSel');
  if (!sel.value) return;
  if (crewForm.reserves.length >= 10) { toast('⚠ Максимум 10 резервних', true); sel.value=''; return; }
  if (crewForm.reserves.indexOf(sel.value)===-1) crewForm.reserves.push(sel.value);
  sel.value=''; cfRenderChips();
}
function cfRenderChips() {
  if ($('cfDroneList')) $('cfDroneList').innerHTML = crewForm.drones.map(function(d){
    return '<span class="chip click" onclick="cfRemoveDrone(\''+esc(d)+'\')">'+esc(d)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
  if ($('cfTrkList')) $('cfTrkList').innerHTML = crewForm.trackers.map(function(t){
    var tr = S.trackers.find(function(x){ return x.id===t; });
    return '<span class="chip click" onclick="crewForm.trackers=crewForm.trackers.filter(function(x){return x!==\''+esc(t)+'\'});cfRenderChips()">'+esc(tr&&tr.imei?tr.imei:t)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
  if ($('cfReserveList')) $('cfReserveList').innerHTML = crewForm.reserves.map(function(r){
    return '<span class="chip click chip-freq" onclick="crewForm.reserves=crewForm.reserves.filter(function(x){return x!==\''+esc(r)+'\'});cfRenderChips()">'+esc(r)+' ✕</span>';
  }).join('') || '<span class="hint">— порожньо —</span>';
}
function openCrewForm(crewId) {
  var cr = crewById(crewId);
  if (!cr) return;
  crewForm = {
    editId: crewId,
    drones: cr.drones ? cr.drones.split('|').filter(Boolean) : [],
    trackers: cr.tracker ? cr.tracker.split('|').map(function(s){return s.trim();}).filter(Boolean) : [],
    reserves: cr.reserves ? cr.reserves.split('|').filter(Boolean) : []
  };
  renderCrewForm();
  $('crewFormPanel').scrollIntoView({behavior:'smooth', block:'start'});
}
function doSaveCrew() {
  if (!crewForm.drones.length) { toast('⚠ Додай хоча б один борт', true); return; }
  // Захист від повторного натискання поки виконується запит
  var btn = $('cfBtn');
  if (btn) {
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '⏳ Запис…';
  }
  function unlock() {
    if (btn) { btn.disabled = false; btn.textContent = crewForm.editId ? '💾 Зберегти' : '👥 Створити екіпаж'; }
  }
  var data = {
    gnst: $('cfGnst').value, bind: $('cfBind').value.trim(),
    drones: crewForm.drones.join('|'), tracker: crewForm.trackers.join('|'),
    system: $('cfSystem').value, freq: $('cfFreq').value, reserves: crewForm.reserves.join('|')
  };
  if (crewForm.editId) {
    rpc('updateCrew', [crewForm.editId, data], function(){
      toast('💾 '+crewForm.editId+' збережено');
      crewForm = {drones:[],trackers:[],reserves:[],editId:null};
      loadAll();
    }, function(e){ unlock(); toast('❌ ' + e.message, true); });
  } else {
    data.pilot = '';
    rpc('createCrew', [data], function(newId){
      toast('👥 Екіпаж '+newId+' створено');
      crewForm = {drones:[],trackers:[],reserves:[],editId:null};
      loadAll();
    }, function(e){ unlock(); toast('❌ ' + e.message, true); });
  }
}
function doCloseCrew(crewId) {
  var act = activeFlights().filter(function(f){ return f.crew===crewId; });
  if (act.length) { toast('⚠ Спочатку заверши вильоти: '+act.map(function(f){return f.id;}).join(', '), true); return; }
  if (!confirm('🔴 Завершити екіпаж '+crewId+'?')) return;
  rpc('endFlight', [crewId, [], 'Екіпаж завершено'], function(){ toast('🔴 '+crewId+' завершено'); loadAll(); });
}

/* ═══════════ МОДАЛКИ ═══════════ */
function openModal(title, bodyHtml, wide) {
  $('modalBox').className = 'modal' + (wide ? ' wide' : '');
  $('modalBox').innerHTML = '<div class="modal-title"><span>'+title+'</span>'+
    '<button class="modal-close" onclick="closeModal()">✕</button></div>' + bodyHtml;
  $('modalBg').classList.add('open');
}
function closeModal() { $('modalBg').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

/* ═══════════ СТАРТ ═══════════ */
if (DEMO) $('demoBanner').style.display = 'block';
loadAll();
setInterval(function(){ if (!document.hidden) loadAll(); }, 90000);
</script>
