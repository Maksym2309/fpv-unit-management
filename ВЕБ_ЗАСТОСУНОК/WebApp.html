<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILD HORNETS — Tactical OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ═══ HORNET TACTICAL OS · Web App ═══ */
:root {
  --bg: #131313; --bg-low: #0e0e0e;
  --panel: #1c1b1b; --panel-2: #201f1f; --panel-3: #2a2a2a; --panel-4: #353534;
  --line: #353534; --line-2: #514532;
  --text: #e5e2e1; --muted: #a8a5a2; --dim: #7f7c78;
  --accent: #ffb800; --accent-hi: #ffca3d; --accent-soft: #ffdca1; --on-accent: #1a1300;
  --blue: #3498db; --blue-deep: #2a486b; --blue-soft: #abc9f2;
  --green: #2ecc71; --green-bg: #11301d;
  --red: #e74c3c; --red-soft: #ff8580; --red-bg: #3a1512;
  --orange: #f39c12; --orange-bg: #33270e;
  --yellow: #f1c40f; --purple: #9b59b6; --grey: #7f8c8d;
  --font-ui: 'Archivo Narrow', Arial, sans-serif;
  --font-data: 'JetBrains Mono', Consolas, monospace;
  --sidebar-w: 264px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; max-width: 100%; overflow-x: hidden; }
body {
  font-family: var(--font-ui); font-size: 14px; color: var(--text);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    var(--bg);
  overflow: hidden;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ── Каркас ── */
#app { display: flex; flex-direction: column; height: 100vh; }
/* Мобільні браузери: 100vh вищий за видимий екран (адресний рядок) —
   dvh міряє реальний видимий viewport, низ більше не обрізається */
@supports (height: 100dvh) { #app { height: 100dvh; } }
header.topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line-2); z-index: 40;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-name { font-size: 20px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .03em; }
.brand-sub { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .2em; }
.top-stats { display: flex; align-items: center; gap: 18px; font-family: var(--font-data); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.top-stats b { color: var(--accent); font-weight: 700; }
.top-stats .warn-b { color: var(--red-soft); }
.icon-btn { background: none; border: 1px solid transparent; color: var(--accent); font-size: 16px; cursor: pointer; padding: 6px 9px; }
.icon-btn:hover { border-color: var(--accent); background: var(--panel-3); }
#layout { display: flex; flex: 1; min-height: 0; }

/* ── Сайдбар ── */
aside.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-low); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 16px 0 10px; overflow-y: auto;
}
.unit-box { padding: 0 16px 14px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.unit-name { font-size: 17px; font-weight: 700; color: var(--accent-soft); text-transform: uppercase; letter-spacing: .05em; }
.unit-status { display: flex; align-items: center; gap: 6px; font-family: var(--font-data); font-size: 9px; color: var(--green); text-transform: uppercase; letter-spacing: .12em; margin-top: 5px; }
.pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.new-flight-btn {
  margin: 0 16px 16px; padding: 12px; background: var(--accent); color: var(--on-accent);
  border: none; font-family: var(--font-data); font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em; cursor: pointer;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
}
.new-flight-btn:hover { background: var(--accent-hi); }
nav.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer;
  font-family: var(--font-data); font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); border-left: 3px solid transparent;
  background: none; border-top: none; border-right: none; border-bottom: none; text-align: left; width: 100%;
}
.nav-item:hover { color: var(--text); background: var(--panel); }
.nav-item.active {
  color: var(--on-accent); background: var(--accent); border-left-color: var(--accent-hi);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
}
.nav-icon { font-size: 14px; width: 18px; text-align: center; }
/* Векторна іконка в навігації: жовта у спокої і темніє разом із текстом,
   коли пункт вибраний. Саме тому колір заданий тут, а не інлайн-стилем —
   інлайн перебивав би активний стан. Емодзі-іконки колір ігнорують. */
.nav-icon.icon-accent { color: var(--accent); }
.nav-item.active .nav-icon.icon-accent { color: inherit; }
.nav-icon svg { display: inline-block; vertical-align: -0.15em; }
.sidebar-foot { margin-top: auto; padding: 12px 16px 4px; border-top: 1px solid var(--line); }
.user-email { font-family: var(--font-data); font-size: 9px; color: var(--dim); word-break: break-all; margin-bottom: 8px; }
.sync-line { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
.sync-line b { color: var(--green); }

/* ── Контент ── */
main.content { flex: 1; min-width: 0; overflow-y: auto; padding: 20px 24px 40px; }
.view-title { font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text); margin-bottom: 4px; }
.view-title .accent { color: var(--accent); }
.view-sub { font-family: var(--font-data); font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 18px; }

/* ── Загальні елементи ── */
.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; }
.panel-title { font-family: var(--font-data); font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; border-left: 3px solid var(--accent); padding-left: 8px; margin-bottom: 10px; }
.panel-title.red { color: var(--red-soft); border-left-color: var(--red); }
.panel-title.blue { color: var(--blue-soft); border-left-color: var(--blue); }
label { display: block; font-weight: 700; color: var(--dim); margin-bottom: 4px; font-size: 9px; text-transform: uppercase; letter-spacing: .12em; font-family: var(--font-data); }
select, input, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 0;
  font-size: 13px; background: var(--bg-low); color: var(--text); font-family: var(--font-data);
}
select:focus, input:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: inset 0 -1px 0 0 var(--accent); }
input::placeholder, textarea::placeholder { color: #5c5955; }
select option, select optgroup { background: var(--bg-low); color: var(--text); }
textarea { height: 54px; resize: vertical; }
.f { margin-bottom: 11px; }
.hint { font-size: 10px; color: var(--dim); margin-top: 3px; font-family: var(--font-data); }
.btn {
  width: 100%; padding: 10px; background: var(--accent); color: var(--on-accent); border: none;
  font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 8px;
  font-family: var(--font-data); text-transform: uppercase; letter-spacing: .06em;
}
.btn:hover { background: var(--accent-hi); }
.btn:disabled { background: var(--panel-3); color: var(--dim); cursor: not-allowed; }
.btn-green { background: var(--green-bg); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.btn-green:hover { background: var(--green); color: #04180c; }
.btn-red { background: var(--red-bg); color: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.btn-red:hover { background: var(--red); color: #1c0503; }
.btn-sec { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-sec:hover { background: var(--panel-3); color: var(--text); }
.btn-mini { width: auto; padding: 4px 10px; margin: 0; font-size: 10px; }
.btn-row { display: flex; gap: 6px; }
.btn-row .btn { flex: 1; }
.chip { display: inline-block; background: var(--panel-3); color: var(--text); border: 1px solid var(--line-2); padding: 3px 8px; font-size: 11px; margin: 2px; font-family: var(--font-data); }
.chip.click { cursor: pointer; }
.chip.click:hover { background: var(--red-bg); border-color: var(--red); color: var(--red-soft); }
.chip-freq { border-color: var(--blue); color: var(--blue-soft); }
.chip-main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.st-chip { display: inline-flex; align-items: center; font-size: 10px; padding: 2px 8px 2px 6px; white-space: nowrap; font-family: var(--font-data); font-weight: 700; border-left: 4px solid; }
.st-green  { background: var(--green-bg);  color: var(--green);    border-left-color: var(--green); }
.st-orange { background: var(--orange-bg); color: var(--orange);   border-left-color: var(--orange); }
.st-red    { background: var(--red-bg);    color: var(--red-soft); border-left-color: var(--red); }
.st-dark   { background: #2a0505;          color: var(--red-soft); border-left-color: #7a2020; }
.st-grey   { background: var(--panel-3);   color: var(--muted);    border-left-color: var(--grey); }
.st-blue   { background: #152535;          color: var(--blue-soft);border-left-color: var(--blue); }
.msg-box { padding: 9px; margin-top: 9px; font-size: 12px; display: none; font-family: var(--font-data); }
.msg-box.ok  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); display: block; }
.msg-box.err { background: var(--red-bg); color: var(--red-soft); border: 1px solid var(--red); display: block; }
.empty { text-align: center; color: var(--dim); padding: 18px; font-size: 12px; font-family: var(--font-data); }
.loading-view { text-align: center; padding: 80px 0; color: var(--dim); font-family: var(--font-data); font-size: 12px; text-transform: uppercase; letter-spacing: .15em; }
.loading-view .pulse-dot { display: inline-block; margin-right: 8px; }

/* ── Стат-плитки ── */
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat-tile { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 10px 12px; }
.stat-tile.green { border-left-color: var(--green); }
.stat-tile.red { border-left-color: var(--red); }
.stat-tile.blue { border-left-color: var(--blue); }
.stat-tile.grey { border-left-color: var(--grey); }
.stat-tile.orange { border-left-color: var(--orange); }
.stat-tile.purple { border-left-color: var(--purple); }
/* Чіпи-фільтри в кольорах легенди карти втрат */
.filter-chip.c-grey.active   { background: var(--grey);   border-color: var(--grey);   color: #10171a; }
.filter-chip.c-red.active    { background: var(--red);    border-color: var(--red);    color: #fff; }
.filter-chip.c-orange.active { background: var(--orange); border-color: var(--orange); color: #231604; }
.filter-chip.c-purple.active { background: var(--purple); border-color: var(--purple); color: #fff; }
.filter-chip.c-grey   { border-color: var(--grey);   color: var(--muted); }
.filter-chip.c-red    { border-color: var(--red);    color: var(--red-soft); }
.filter-chip.c-orange { border-color: var(--orange); color: var(--orange); }
.filter-chip.c-purple { border-color: var(--purple); color: #c9a6dd; }
/* Компактний варіант (Сектор): вужчі плитки, щоб увесь ряд умістився в один рядок */
.stat-row.compact { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; }
.stat-row.compact .stat-tile { padding: 8px 10px; }
.stat-row.compact .stat-num { font-size: 21px; }
.stat-tile.click { cursor: pointer; }
.stat-tile.click:hover { background: var(--panel-3); }
/* Активна плитка: жовта рамка з трьох боків, ліва смужка лишається кольором легенди */
.stat-tile.active { background: var(--panel-3); border-top-color: var(--accent); border-right-color: var(--accent); border-bottom-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stat-num { font-family: var(--font-data); font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.1; }
.stat-lbl { font-family: var(--font-data); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }

/* ── Тактичні картки ── */
.tcard {
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue);
  padding: 10px 12px; margin-bottom: 8px; position: relative;
}
.tcard.mine { border-left-color: var(--accent); background: #211d10; }
.tcard.other { opacity: .75; }
.tcard.lost { border-left-color: #7a2020; background: #1d0a0a; }
.tcard.ok { border-left-color: var(--green); }
.tcard.bad { border-left-color: var(--red); }
.tcard-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.tcard-id { font-family: var(--font-data); font-size: 14px; font-weight: 700; color: var(--accent-soft); }
.tcard-meta { font-size: 12px; color: var(--muted); line-height: 1.8; }
.tcard-meta b { color: var(--text); }
.tcard-meta .mono { font-family: var(--font-data); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

/* ── Статусні кнопки вильоту ── */
.st-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; }
@media (max-width: 600px) { .st-grid { grid-template-columns: 1fr 1fr; } }
.st-btn { padding: 7px 4px; border: 1px solid var(--line-2); text-align: center; cursor: pointer; font-size: 10px; font-weight: 700; font-family: var(--font-data); color: var(--muted); background: var(--bg-low); }
.st-btn:hover { color: var(--text); }
.st-btn.sel-ok   { background: var(--green-bg);  color: var(--green);    border-color: var(--green);  box-shadow: 0 0 0 1px var(--green); }
.st-btn.sel-fix  { background: var(--orange-bg); color: var(--orange);   border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange); }
.st-btn.sel-bad  { background: var(--red-bg);    color: var(--red-soft); border-color: var(--red);    box-shadow: 0 0 0 1px var(--red); }
.st-btn.sel-lost { background: #2a0505;          color: var(--red-soft); border-color: #7a2020;       box-shadow: 0 0 0 1px #7a2020; }
.lost-box { background: #1d0a0a; border: 1px solid var(--red); padding: 10px; margin-top: 8px; }
.lost-box label { color: var(--red-soft); }
.lost-box input, .lost-box textarea { background: #140505; border-color: #7a2020; color: #ffcccc; }

/* ── Таблиці ── */
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  font-family: var(--font-data); font-size: 9px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--accent); text-align: left; padding: 8px; background: var(--panel-3);
  border: 1px solid var(--line); position: sticky; top: 0; z-index: 2;
}
.data-table td { padding: 7px 8px; border: 1px solid #262525; color: var(--text); }
.data-table tr:nth-child(odd) td { background: #161616; }
.data-table tr:nth-child(even) td { background: var(--panel); }
.data-table tr:hover td { background: var(--panel-3); }
.data-table .mono { font-family: var(--font-data); }
.data-table .accent { color: var(--accent); }
.table-wrap { overflow: auto; border: 1px solid var(--line); max-height: 62vh; }
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.filter-row input, .filter-row select { width: auto; min-width: 160px; flex: 0 1 auto; }
.type-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
/* Додавання предметів: прев'ю ID, кількість, наклейки */
.id-preview { background: var(--panel-2); border: 1px solid var(--accent); padding: 8px 10px; text-align: center; margin-bottom: 12px; font-family: var(--font-data); }
.id-preview .lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; }
.id-preview .short { font-size: 20px; font-weight: 700; letter-spacing: 3px; color: var(--accent); }
.id-preview .range { font-size: 10px; color: var(--muted); margin-top: 2px; }
.qty-row { display: flex; align-items: center; gap: 8px; }
.qty-row input { width: 80px; text-align: center; font-weight: 700; }
.qty-btn { width: 34px; height: 34px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); font-size: 18px; cursor: pointer; flex-shrink: 0; }
.qty-btn:hover { background: var(--accent); color: var(--on-accent); }
.sticker-list { display: flex; flex-direction: column; max-height: 300px; overflow-y: auto; }
.sticker-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 6px 0; }
.sticker-id { font-family: var(--font-data); font-size: 10px; color: var(--muted); word-break: break-all; }
.sticker { background: var(--accent); color: var(--on-accent); font-family: var(--font-data); font-size: 15px; font-weight: 700; letter-spacing: 2px; padding: 6px 10px; white-space: nowrap; }
.filter-chip { padding: 5px 10px; font-family: var(--font-data); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: var(--panel); border: 1px solid var(--line-2); color: var(--muted); cursor: pointer; }
.filter-chip.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* ── Інвентар: режим редагування ── */
.inv-mode { display: flex; margin-left: auto; border: 1px solid var(--line-2); background: var(--panel); }
/* Панель дій розділу «Інформація»: режими ліворуч, дії праворуч */
.info-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.info-acts { margin-left: auto; display: flex; gap: 4px; }
.inv-mode-btn { padding: 5px 12px; font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: none; color: var(--muted); cursor: pointer; }
.inv-mode-btn.active { background: var(--accent); color: var(--on-accent); }
.inv-status-sel { width: 100%; min-width: 110px; background: var(--panel-3); border: 1px solid var(--line-2); color: var(--text); font-family: var(--font-data); font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 4px; cursor: pointer; }
.inv-status-sel:disabled { opacity: .5; cursor: wait; }
.inv-act { background: transparent; border: 1px solid var(--line-2); border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; color: var(--muted); flex-shrink: 0; }
.inv-act:hover { background: var(--panel-3); }
.inv-act:disabled { opacity: .4; cursor: wait; }
.inv-act--ok { color: var(--green); border-color: var(--green); }
.inv-act--ok:hover { background: var(--green-bg); }
.inv-act--crew { color: var(--accent); border-color: var(--accent); }
.inv-act--crew:hover { background: rgba(255,184,0,.12); }
.inv-act--del { color: var(--red); border-color: var(--red); }
.inv-act--del:hover { background: var(--red-bg); }
.inv-acts { display: flex; gap: 5px; margin-top: 6px; white-space: nowrap; }
.inv-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line-2); margin-bottom: 12px; font-family: var(--font-data); max-width: 100%; }
.inv-tab { padding: 8px 18px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
@media (max-width: 800px) { .inv-tab { padding: 8px 10px; font-size: 10px; flex: 1 1 auto; text-align: center; } }
/* Блок під картою — у межах екрана, широка таблиця скролиться всередині */
#lostList { max-width: 100%; min-width: 0; overflow: hidden; }
#lostList .table-wrap { max-width: 100%; }
.inv-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,184,0,.05); }
.inv-crew-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 12px; }
.inv-crew-bar label { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.inv-crew-bar select { width: auto; min-width: 170px; }

/* ── Карта частот ── */
.freq-topbar { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; margin-bottom: 12px; }
.freq-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.freq-legend .li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-sq { width: 11px; height: 11px; flex-shrink: 0; }
.freq-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: stretch; }
@media (max-width: 1100px) { .freq-layout { grid-template-columns: 1fr; } }
.matrix-panel { background: var(--panel-2); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.matrix-panel-head { padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--panel-3); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.matrix-panel-head .cap { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.matrix-wrap { overflow: auto; flex: 1; padding: 6px 8px 8px; }
.matrix { border-collapse: collapse; width: 100%; table-layout: fixed; font-family: var(--font-data); min-width: 620px; }
.matrix th { color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 7px 2px; border-bottom: 1px solid var(--line-2); text-align: center; position: sticky; top: -6px; background: var(--panel-2); z-index: 3; }
.matrix th.band-col, .matrix td.band { width: 76px; text-align: left; padding-left: 6px; }
.matrix td.band { color: var(--accent); font-size: 10px; line-height: 1.25; white-space: normal; overflow-wrap: break-word; border-right: 1px solid var(--line-2); font-weight: 700; }
.matrix td { padding: 3px; }
.cell { height: 40px; display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; font-size: 12px; background: var(--panel-3); border: 1px solid rgba(81,69,50,.45); color: var(--muted); overflow: hidden; }
.cell:hover { border-color: var(--accent); color: var(--text); }
.cell .ctag { font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 58%; }
.cell-mine     { background: var(--green); border-color: var(--green); color: #06210f; font-weight: 700; }
.cell-unit     { background: rgba(52,152,219,.16); border: 1px solid var(--blue); color: var(--blue); font-weight: 700; }
.cell-ext      { background: var(--grey); border-color: var(--grey); color: #10171a; font-weight: 700; }
.cell-critical { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; animation: pulse 1.6s infinite; }
.cell-serious  { background: var(--orange); border-color: var(--orange); color: #231604; font-weight: 700; }
.cell-moderate { background: var(--yellow); border-color: var(--yellow); color: #231d04; font-weight: 700; }
.cell-warning  { background: var(--orange-bg); border: 1px solid var(--orange); color: var(--orange); }
.cell-reserve  { background: transparent; border: 1px dashed var(--purple); color: #c9a6dd; }
/* Вільні, але небезпечні клітинки — приглушені відтінки (без пульсації) */
.cell-critF { background: rgba(231,76,60,.15);  border-color: rgba(231,76,60,.55);  color: #ff9a94; }
.cell-serF  { background: rgba(243,156,18,.13); border-color: rgba(243,156,18,.5);  color: var(--orange); }
.cell-modF  { background: rgba(241,196,15,.11); border-color: rgba(241,196,15,.45); color: #e8d44d; }
/* ── Права панель частот ── */
.side-panel { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; margin-bottom: 10px; min-height: 0; }
.side-head { background: var(--panel-2); border-bottom: 1px solid var(--line); padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.side-head:hover { background: var(--panel-3); }
.side-head .cap { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); display: flex; align-items: center; gap: 7px; }
.side-head .arr { color: var(--accent); font-size: 11px; }
.count-pill { background: var(--panel-4); padding: 1px 8px; font-family: var(--font-data); font-size: 10px; color: var(--muted); }
.side-body { padding: 8px; overflow-y: auto; max-height: 46vh; }
.side-body.hid { display: none; }
.af-card { background: var(--panel-2); border: 1px solid var(--line); padding: 10px 10px 10px 14px; position: relative; margin-bottom: 8px; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.af-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--blue); }
.af-card.mine .af-bar { background: var(--green); }
.af-card.ext .af-bar { background: var(--grey); }
.af-card.conflict { border-color: rgba(231,76,60,.5); }
.af-card.conflict .af-bar { background: var(--red); animation: pulse 1.6s infinite; }
.af-badge { position: absolute; right: 0; top: 0; background: var(--red); color: #1c0503; font-family: var(--font-data); font-size: 8px; font-weight: 700; padding: 2px 5px; letter-spacing: .08em; }
.af-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 5px; }
.af-title { font-weight: 700; font-size: 13px; color: var(--accent-soft); }
.af-freq { font-family: var(--font-data); font-size: 11px; color: var(--green); white-space: nowrap; }
.af-freq.blue { color: var(--blue); } .af-freq.red { color: var(--red-soft); } .af-freq.grey { color: var(--muted); }
.af-meta { font-family: var(--font-data); font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.af-note { font-family: var(--font-data); font-size: 9px; color: var(--red-soft); margin-bottom: 6px; }
.af-btn { width: 100%; border: 1px solid var(--accent); background: transparent; color: var(--accent); padding: 6px; font-family: var(--font-data); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; cursor: pointer; }
.af-btn:hover { background: var(--accent); color: var(--on-accent); }
.af-btn.red { border-color: var(--red); color: var(--red-soft); background: rgba(231,76,60,.08); }
.af-btn.red:hover { background: var(--red); color: #1c0503; }
.crew-table { width: 100%; border-collapse: collapse; font-family: var(--font-data); font-size: 11px; }
.crew-table th { text-align: left; font-weight: 400; color: var(--dim); padding: 6px 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.crew-table th:last-child, .crew-table td:last-child { text-align: right; }
.crew-table td { padding: 7px 8px; border-bottom: 1px solid #242322; color: var(--text); }
.crew-table tr:hover td { background: var(--panel-3); }
.crew-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--blue); background: rgba(52,152,219,.25); margin-right: 7px; vertical-align: middle; }
.crew-dot.purple { border-color: var(--purple); background: transparent; }
.crew-dot.green { border-color: #2ecc71; background: rgba(46,204,113,.35); }
.crew-freq { color: var(--blue); } .crew-freq.purple { color: var(--purple); opacity: .75; }
/* Склад комплекту. Системна підказка (title) тут не годиться: один рядок,
   бліда, зі затримкою, а на телефоні наведення немає взагалі. Тому власна
   плашка по кліку — і на десктопі, і на дотик. */
.kit-chip { cursor: pointer; border-bottom: 1px dotted var(--accent); }
.kit-pop {
  position: fixed; z-index: 60; background: var(--panel-2);
  border: 1px solid var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,.65);
  padding: 8px 10px; font-family: var(--font-data); font-size: 11px;
  color: var(--text); max-width: 320px; max-height: 55vh; overflow: auto;
}
.kit-pop .kp-head { color: var(--accent); font-weight: 700; margin-bottom: 6px; }
.kit-pop .kp-row { padding: 4px 0; border-bottom: 1px solid var(--line); white-space: normal; }
.kit-pop .kp-row:last-child { border-bottom: 0; }
.kit-pop .kp-id { color: var(--accent-soft); }
.kit-pop .kp-name { color: var(--muted); }
/* Підпис CRW-ID: поруч із назвою за замовчуванням… */
.crew-id { font-size: 10px; color: var(--dim); font-family: var(--font-data); }
/* …і окремим рядком у таблиці екіпажів, щоб довга назва не розпирала
   стовпчик. Частота нерозривна — інакше кнопка 🎚 переносилась під неї. */
.crew-table td:first-child { max-width: 150px; }
.crew-table td:first-child .crew-id { display: block; margin-top: 2px; }
.crew-table td:nth-child(2), .crew-table td:last-child { white-space: nowrap; }
.conflict-item { border: 1px solid var(--line); border-left: 3px solid var(--red); background: var(--panel-2); padding: 6px 8px; margin-bottom: 4px; font-size: 11px; }
.conflict-item .detail { font-family: var(--font-data); font-size: 10px; color: var(--red-soft); margin-top: 2px; }
.swap-menu { display: none; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.swap-menu.open { display: flex; }
.vtx-btn { background: var(--panel-2); border: 1px solid var(--blue); padding: 3px 9px; font-size: 10px; cursor: pointer; color: var(--blue-soft); font-weight: 700; font-family: var(--font-data); }
.vtx-btn:hover { background: var(--blue); color: #06121c; }
/* ── Спектр-аналізатор ── */
.spectrum { margin-top: 14px; background: var(--bg-low); border: 1px solid var(--line); position: relative; }
.spec-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-data); font-size: 9px; letter-spacing: .1em; color: rgba(255,184,0,.65); padding: 6px 10px; text-transform: uppercase; }
.spec-head .tgl { cursor: pointer; color: var(--accent); background: none; border: none; font-size: 11px; padding: 0 4px; }
.spec-area { position: relative; height: 130px; margin: 4px 14px 12px; border-bottom: 1px solid var(--line-2); }
.spec-area.hid { display: none; }
/* Лінія маркера тягнеться від «землі» ДО своєї мітки (top задає JS за поверхом) —
   підпис завжди сидить на своїй лінії, не «висить» над чужою */
.spec-mark { position: absolute; top: 14px; bottom: 0; border-left: 1px solid; }
.spec-mark.dash { border-left-style: dashed; }
.spec-mark:hover { z-index: 50 !important; }
.spec-lbl { position: absolute; top: -13px; transform: translateX(-50%); font-family: var(--font-data); font-size: 8px; font-weight: 700; padding: 1px 4px; color: #0d0d0d; white-space: nowrap; cursor: pointer; }
.spec-mark:hover .spec-lbl { z-index: 3; outline: 1px solid #fff; }

/* ── Модалки ── */
#modalBg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 100; backdrop-filter: blur(3px); align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 16px; }
#modalBg.open { display: flex; }
.modal { background: #1a1a1a; border: 1px solid var(--blue); padding: 18px; width: 460px; max-width: 100%; box-shadow: 0 12px 48px rgba(0,0,0,.85); }
.modal.wide { width: 560px; }
/* Повний екран для переглядача. Через CSS, а не requestFullscreen:
   рідний fullscreen для iframe на iOS Safari не працює, а розтягнута
   модалка працює скрізь однаково. */
.viewer-frame { width: 100%; height: 70vh; border: 1px solid var(--line); background: #fff; }
.modal.modal-full {
  position: fixed; inset: 0; width: 100%; height: 100%;
  max-width: none; max-height: none; margin: 0; border: none;
  display: flex; flex-direction: column;
}
.modal.modal-full .viewer-frame { height: auto; flex: 1 1 auto; min-height: 0; }
.modal-title { font-family: var(--font-data); font-weight: 700; color: var(--accent); font-size: 13px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: .08em; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--dim); line-height: 1; }
.modal-close:hover { color: var(--red); }

/* ── Автодоповнення ── */
.ac-wrap { position: relative; }
.ac-list { position: absolute; top: 100%; left: 0; right: 0; background: var(--panel-2); border: 1px solid var(--accent); border-top: none; max-height: 190px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 10px 24px rgba(0,0,0,.7); }
.ac-item { padding: 8px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--line); }
.ac-item:hover { background: var(--panel-3); box-shadow: inset 3px 0 0 var(--accent); }
.ac-id { font-weight: 700; color: var(--accent-soft); font-size: 11px; font-family: var(--font-data); }
.ac-meta { color: var(--dim); font-size: 11px; }

/* ── Головний екран (плитки) ── */
.home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px; }
.home-tile { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 18px 16px; cursor: pointer; transition: background .12s; min-height: 110px; display: flex; flex-direction: column; justify-content: space-between; }
.home-tile:hover { background: var(--panel-3); border-color: var(--accent); }
.home-tile.stub { opacity: .55; border-left-color: var(--line-2); cursor: default; }
.home-tile-icon { font-size: 22px; }
/* Для SVG-іконок (емодзі колір ігнорують, а векторна бере currentColor) */
.home-tile-icon.icon-accent { color: var(--accent); line-height: 1; }
.home-tile-name { font-family: var(--font-data); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin-top: 8px; }
.home-tile-sub { font-family: var(--font-data); font-size: 10px; color: var(--dim); margin-top: 3px; }

/* ── Авторизація ── */
.auth-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel-3); border: 1px solid var(--accent); color: var(--accent); font-family: var(--font-data); font-size: 11px; font-weight: 700; padding: 4px 10px; cursor: pointer; text-transform: uppercase; letter-spacing: .05em; }
.auth-chip:hover { background: rgba(255,184,0,.12); }
.login-card { max-width: 420px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 28px 24px; text-align: center; }
.login-card h3 { font-family: var(--font-data); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--text); margin-bottom: 8px; }
.login-card p { font-size: 12px; color: var(--dim); margin-bottom: 16px; }

/* ── Екіпажі: склад ── */
.member-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; margin-bottom: 6px; }
.member-main { border-left: 3px solid var(--accent); }
.member-cs { font-family: var(--font-data); font-size: 12px; font-weight: 700; color: var(--text); }
.member-name { font-size: 11px; color: var(--dim); }
.member-role { font-family: var(--font-data); font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.badge-main { background: var(--accent); color: var(--on-accent); font-family: var(--font-data); font-size: 8px; font-weight: 700; padding: 2px 6px; letter-spacing: .1em; text-transform: uppercase; }
.crew-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
@media (max-width: 1100px) { .crew-layout { grid-template-columns: 1fr; } }
/* Діти грідів не розпирають колонку своїм вмістом (min-width:auto у grid) */
.crew-layout > *, .freq-layout > *, .grid-2 > * { min-width: 0; }
.side-panel { background: var(--panel-2); border: 1px solid var(--line); margin-bottom: 14px; }
.side-panel-head { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel-3); font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.side-panel-body { padding: 10px 12px; }
.staff-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 12px; }
.staff-bar label { font-family: var(--font-data); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.staff-bar select { width: auto; min-width: 130px; }
.staff-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
/* Мобільний: елементи тулбара — симетрично, на всю ширину */
@media (max-width: 800px) {
  .staff-bar { flex-direction: column; align-items: stretch; gap: 8px; }
  .staff-bar select { width: 100%; min-width: 0; }
  .staff-actions { margin-left: 0; justify-content: space-between; }
  .staff-actions .inv-mode { flex: 1; display: flex; }
  .staff-actions .inv-mode-btn { flex: 1; }
}
.inv-act svg { display: block; }
.st-yellow { background: rgba(255,184,0,.15); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.crew-pick { display: flex; align-items: center; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--line); padding: 8px 12px; margin-bottom: 6px; cursor: pointer; }
.crew-pick:hover { border-color: var(--accent); }
.crew-pick.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.crew-pick .cp-name { font-family: var(--font-data); font-size: 12px; font-weight: 700; color: var(--text); }
.crew-pick .cp-sub { font-size: 10px; color: var(--dim); }
.accept-badge { display: inline-block; font-family: var(--font-data); font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 1px 6px; margin-top: 3px; }
.accept-no { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange); }
.accept-yes { color: var(--green); }

/* ── Карта втрат: ізольований stacking context (isolation) — внутрішні
   z-index Leaflet (тайли 200 / маркери 400 / спливашки 700 / контроли 1000)
   лишаються як є, але назовні вся карта = z-index 0 → сайдбар (60) і
   шапка (40) завжди зверху, а спливашки всередині карти не ховаються ── */
#lostMap { position: relative; z-index: 0; isolation: isolate; }
/* Контролі карт (зум + перемикач топооснови) — темні квадрати як у макеті сектора */
.leaflet-bar { border-radius: 0 !important; border: 1px solid var(--line-2) !important; box-shadow: 0 2px 10px rgba(0,0,0,.55) !important; }
.leaflet-bar a { width: 30px !important; height: 30px !important; line-height: 28px !important; background: var(--panel) !important; color: var(--muted) !important; border-bottom: 1px solid var(--line-2) !important; border-radius: 0 !important; font: 700 16px/28px var(--font-data) !important; }
.leaflet-bar a:hover { background: var(--panel-2) !important; color: var(--accent) !important; }
.leaflet-bar a.map-sq-active { background: var(--accent) !important; color: var(--on-accent) !important; }
.leaflet-bar a svg { vertical-align: middle; }
/* Маркери карт у стилі HUD: ромб / ✕ з моно-підписом під точкою */
.hud-mark { position: relative; }
.hud-mark .hm-shape { position: absolute; left: -7px; top: -7px; width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid rgba(13,13,13,.85); box-shadow: 0 0 8px rgba(0,0,0,.7); }
.hud-mark .hm-x { position: absolute; left: 0; top: 0; transform: translate(-50%,-50%); font: 900 16px/1 var(--font-data); text-shadow: 0 1px 3px #000; }
.hud-mark .hm-lbl { position: absolute; top: 9px; left: 0; transform: translateX(-50%); font: 700 8px var(--font-data); letter-spacing: .5px; text-transform: uppercase; color: #e5e2e1; background: rgba(13,13,13,.78); border: 1px solid #2a2a2a; padding: 1px 4px; white-space: nowrap; }
/* Ручка вершини меж сектора: янтарний квадрат, тягнеться */
.hud-vertex { width: 12px; height: 12px; background: #ffb800; border: 2px solid #0d0d0d; box-shadow: 0 0 8px rgba(0,0,0,.8); cursor: move; }
.hud-vertex:hover { background: #fff; }
/* Підказка режиму малювання поверх карти сектора */
.map-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 800; background: rgba(13,13,13,.85); border: 1px solid var(--accent); color: var(--accent); font: 700 10px var(--font-data); text-transform: uppercase; letter-spacing: .5px; padding: 5px 10px; pointer-events: none; }
.leaflet-popup-content-wrapper { background: #1a1a1a; color: var(--text); border: 1px solid var(--blue); border-radius: 0; }
.leaflet-popup-tip { background: #1a1a1a; }
.leaflet-popup-content a { color: var(--accent); }
.leaflet-tooltip { background: #1a1a1a; color: var(--text); border: 1px solid var(--accent); border-radius: 0; font-family: var(--font-data); font-size: 11px; padding: 3px 7px; }
.leaflet-tooltip-top:before { border-top-color: var(--accent); }

/* ── Тост ── */
#toast { position: fixed; top: 66px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
/* Спливашка дії знизу-праворуч (уточнення причини зміни статусу) */
#actionToast { position: fixed; bottom: 20px; right: 20px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
.atoast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); padding: 10px 12px; font-family: var(--font-data); font-size: 12px; color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,.6); max-width: 360px; display: flex; align-items: center; gap: 12px; }
.atoast .af-btn { width: auto; padding: 6px 10px; flex-shrink: 0; }
.toast-item { padding: 10px 14px; font-family: var(--font-data); font-size: 12px; border-left: 4px solid var(--green); background: var(--panel); border-top: 1px solid var(--line); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--text); box-shadow: 0 6px 20px rgba(0,0,0,.6); max-width: 380px; }
.toast-item.err { border-left-color: var(--red); color: var(--red-soft); }

/* ── Демо-банер ── */
#demoBanner { display: none; background: var(--orange-bg); border-bottom: 1px solid var(--orange); color: var(--orange); font-family: var(--font-data); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; text-align: center; padding: 5px; }

/* ── Мобільний ── */
#burger { display: none; }
@media (max-width: 800px) {
  #burger { display: block; }
  aside.sidebar { position: fixed; left: 0; top: 56px; bottom: 0; z-index: 60; transform: translateX(-100%); transition: transform .18s; }
  aside.sidebar.open { transform: translateX(0); box-shadow: 20px 0 40px rgba(0,0,0,.6); }
  main.content { padding: 14px 12px 40px; }
  .freq-layout { grid-template-columns: 1fr; }

  /* Шапка вміщується в будь-яку ширину екрана */
  header.topbar { padding: 0 8px; gap: 6px; min-width: 0; }
  .brand { min-width: 0; }
  .brand-name { font-size: 15px; white-space: nowrap; }
  .brand-sub { display: none; }
  .top-stats { gap: 6px; min-width: 0; flex-shrink: 1; }
  /* Лічильники приховуємо — вони продубльовані на головній та в розділах */
  .top-stats > span:not(#authBox) { display: none; }
  .icon-btn { padding: 6px 6px; }
  .auth-chip {
    display: inline-block; max-width: 40vw; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; padding: 4px 8px; font-size: 10px;
  }

  .view-title { font-size: 19px; }
  .stat-num { font-size: 20px; }

  /* Тости й модалки — в межах екрана */
  #toast { left: 12px; right: 12px; }
  .toast-item { max-width: none; }
  #actionToast { left: 12px; right: 12px; bottom: 12px; }
  .atoast { max-width: none; justify-content: space-between; }
  #modalBg { padding: 16px 8px; }
  .modal, .modal.wide { width: 100%; }

  /* Панелі екіпажів: не ширші за екран, широкий вміст скролиться всередині */
  .side-panel { max-width: 100%; }
  .side-panel-body { overflow-x: auto; }
  .crew-pick { flex-wrap: wrap; gap: 4px; }

  /* Матриця частот: вужча колонка бендів + щільніші клітинки */
  .matrix { min-width: 520px; }
  .matrix th.band-col, .matrix td.band { width: 58px; font-size: 9px; padding-left: 4px; }
  .matrix td { padding: 2px; }
  .cell { height: 34px; font-size: 11px; }
  .cell .ctag { font-size: 8px; }

  /* Панелі інструментів інвентаря: стовпчиком, на всю ширину */
  .inv-crew-bar, .filter-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .inv-crew-bar select, .filter-row input { width: 100% !important; min-width: 0 !important; }
  .filter-row .inv-mode, .inv-crew-bar .inv-mode { margin-left: 0; display: flex; }
  .filter-row .inv-mode-btn, .inv-crew-bar .inv-mode-btn { flex: 1; }
}

/* ═══════════ RPC-ОБГОРТКА ═══════════ */
function rpc(fn, args, ok, fail) {
  args = args || [];
  if (DEMO) {
    setTimeout(function(){
      try {
        var v = DEMO_DATA[fn];
        if (typeof v === 'function') { var r = v.apply(null, args); ok && ok(r === undefined ? {demo:true} : r); }
        else if (DEMO_DATA.hasOwnProperty(fn)) { ok && ok(JSON.parse(JSON.stringify(v))); }
        else { ok && ok({demo:true}); }
      } catch(e) { if (fail) fail(e); else toast('❌ ' + e.message, true); }
    }, 120);
    return;
  }
  if (MODE === 'api') {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args, token: authToken() })
    }).then(function(r){ return r.json(); }).then(function(j){
      if (j && j.ok) { ok && ok(j.result); return; }
      var msg = (j && j.error) || 'Помилка API';
      if (msg === 'AUTH_REQUIRED') apiAuthLost_();
      if (fail) fail(new Error(msg)); else toast('❌ ' + msg, true);
    }).catch(function(e){
      if (fail) fail(e); else toast('❌ Мережа: ' + e.message, true);
    });
    return;
  }
  var runner = google.script.run
    .withSuccessHandler(function(res){ ok && ok(res); })
    .withFailureHandler(function(e){ if (fail) fail(e); else toast('❌ ' + e.message, true); });
  runner[fn].apply(runner, args);
}

/* ═══════════ УТИЛІТИ ═══════════ */
function esc(s){ return String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(id){ return document.getElementById(id); }
function toast(txt, isErr) {
  var el = document.createElement('div');
  el.className = 'toast-item' + (isErr ? ' err' : '');
  el.textContent = txt;
  $('toast').appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(function(){ el.remove(); }, 400); }, 4200);
}

/* ── Уточнення причини зміни статусу ─────────────────────────
   Статус міняється одразу; знизу-праворуч зʼявляється спливашка
   з кнопкою «Уточнити причину» → модалка «Коментар до зміни» →
   запис у Журнал руху. Ігноруєш спливашку — зміна без причини. */
function showStatusToast(kind, id, fromSt, toSt) {
  var host = $('actionToast');
  if (!host) return;
  var el = document.createElement('div');
  el.className = 'atoast';
  el.innerHTML = '<span>'+esc(id)+': '+esc(fromSt)+' → '+esc(toSt)+'</span>'+
    '<button class="af-btn">📝 Уточнити причину</button>';
  el.querySelector('button').onclick = function(){
    el.remove();
    openStatusCommentModal(kind, id, fromSt, toSt);
  };
  host.appendChild(el);
  setTimeout(function(){
    if (el.parentNode) {
      el.style.opacity = '0'; el.style.transition = 'opacity .4s';
      setTimeout(function(){ el.remove(); }, 400);
    }
  }, 12000);
}
function openStatusCommentModal(kind, id, fromSt, toSt) {
  openModal('📝 Коментар до зміни',
    '<div class="tcard-meta mono" style="margin-bottom:10px">'+esc(id)+': '+esc(fromSt)+' → '+esc(toSt)+'</div>'+
    '<div class="f"><label>Причина / коментар *</label><textarea id="scComment" placeholder="напр. пошкодження після жорсткої посадки"></textarea></div>'+
    '<div class="hint" style="margin-bottom:8px">Запишеться в Журнал руху таблиці</div>'+
    '<button class="btn btn-green" id="scBtn" onclick="doStatusComment(\''+esc(kind)+'\',\''+esc(id)+'\',\''+esc(fromSt)+'\',\''+esc(toSt)+'\')">💾 Зберегти</button>'
  );

/* ── Сітки каналів ────────────────────────────────────────────
   Відеосистема — це модуляція (аналог, DJI…) і мінімальний рознос.
   Сітка — які канали фізично тягне VTX конкретного борту. Це різні
   речі: Sting буває і аналоговий, і Hornet Vision, а екіпаж може мати
   в пулі і Sting, і звичайний борт — тоді ставимо сітку Sting, і список
   звужується до того, що витягнуть обидва.
   Порожня назва = повна сітка (усі бенди системи). */
var FREQ_GRIDS = {
  // За таблицею VTX Sting (STRIDERF7V2): 7 бендів зі стандартними частотами.
  // Немає H, HV-H, HV-L, L (Foxeer), U, O, S і всього 3.3 ГГц.
  'Sting': {
    bands: ['A','B','B Sting','E','F','R','L','X'],
    // Стандартного B5 (5809) у цього борту немає — замість нього 5999,
    // винесений в окремий бенд «B Sting». Тому 5809 тут виключений:
    // інакше застосунок рахував би конфлікт для частоти, якої борт не має.
    skip: [5809]
  }
};
function freqGridNames() { return Object.keys(FREQ_GRIDS); }

// Бенди, що існують тільки в межах конкретної сітки. На карті частот вони
// видимі завжди (щоб зайнята частота мала свою клітинку), але обрати їх
// можна лише там, де борт це справді тягне.
var GRID_ONLY_BANDS = ['B Sting'];

// Сітка екіпажу. Якщо явно не задана — виводимо з бортів пулу, щоб
// наявні екіпажі не треба було відкривати й перезберігати руками.
// Явний вибір у формі завжди головніший за автовизначення.
function crewGrid(cr) {
  if (!cr) return '';
  if (cr.grid) return cr.grid;
  var ids = String(cr.drones || '').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
  for (var i = 0; i < ids.length; i++) {
    var it = S.items.find(function(x){ return x.id === ids[i]; });
    if (isStingAnalog(it)) return 'Sting';
  }
  return '';
}

// Бенди для карти: беремо з бекенду, але додаємо ті, яких він ще не знає.
// Інакше новий бенд зʼявився б лише після перезаливки Code.gs, хоча це
// суто довідкові дані й фронтенд має їх сам.
function allBands(d) {
  var out = {};
  var src = (d && d.bands) || BANDS;
  Object.keys(src).forEach(function(b){ out[b] = src[b]; });
  Object.keys(BANDS).forEach(function(b){ if (!out[b]) out[b] = BANDS[b]; });
  return out;
}
function allBandOrder(d) {
  var order = (d && d.bandOrder) ? d.bandOrder.slice() : Object.keys(BANDS);
  Object.keys(BANDS).forEach(function(b, i){
    if (order.indexOf(b) !== -1) return;
    // ставимо новий бенд туди ж, де він у локальному переліку
    var localIdx = Object.keys(BANDS).indexOf(b);
    var before = Object.keys(BANDS)[localIdx - 1];
    var at = before ? order.indexOf(before) + 1 : order.length;
    order.splice(at < 0 ? order.length : at, 0, b);
  });
  return order;
}

// Чи дозволений бенд у цій сітці
function gridAllowsBand(grid, band) {
  var g = FREQ_GRIDS[grid];
  if (!g) return GRID_ONLY_BANDS.indexOf(band) === -1;   // повна сітка
  return g.bands.indexOf(band) !== -1;
}
// Чи дозволений канал (бенд є, позиція не порожня, канал не виключений)
function gridAllowsFreq(grid, band, freq) {
  if (!freq) return false;                 // порожня позиція в бенді
  if (!gridAllowsBand(grid, band)) return false;
  var g = FREQ_GRIDS[grid];
  if (!g) return true;
  return !(g.skip && g.skip.indexOf(Number(freq)) !== -1);
}

function freqOptionsHtml(system, grid) {
  var html = '';
  if (system === 'Hornet Vision') {
    // Тільки HV частоти
    html += '<optgroup label="Hornet Vision (HV-L)">';
    BANDS['HV-L'].forEach(function(f, i){
      var warn = WARNING_FREQS[f] ? ' ⚠️' : '';
      html += '<option value="HV-L'+(i+1)+' ('+f+')">HV-L'+(i+1)+' — '+f+' МГц'+warn+'</option>';
    });
    html += '</optgroup><optgroup label="Hornet Vision (HV-H)">';
    BANDS['HV-H'].forEach(function(f, i){
      html += '<option value="HV-H'+(i+1)+' ('+f+')">HV-H'+(i+1)+' — '+f+' МГц</option>';
    });
    html += '</optgroup>';
  } else {
    Object.keys(BANDS).forEach(function(band){
      if (band.indexOf('HV-') === 0) return; // HV бенди тільки для Hornet Vision
      if (!gridAllowsBand(grid, band)) return;
      var opts = '';
      BANDS[band].forEach(function(f, i){
        if (!gridAllowsFreq(grid, band, f)) return;
        opts += '<option value="'+band+(i+1)+' ('+f+')">'+band+(i+1)+' — '+f+' МГц</option>';
      });
      if (!opts) return;                    // бенд лишився без каналів
      html += '<optgroup label="Бенд '+band+'">'+opts+'</optgroup>';
    });
  }
  return html;
}
// Суфікси назв бортів → відеосистема (як у sidebar-формах)
var NAME_SUFFIXES = {
  'AD':'Аналог','AT':'Аналог',
  'HVD':'Hornet Vision','HVT':'Hornet Vision',
  'HDD':'HDZero','HDT':'HDZero',
  'DJD':'DJI','DJT':'DJI',
  'WSD':'Walksnail','WST':'Walksnail'
};
var WARNING_FREQS = { 5240: 'Канал HV-L1 (5240 МГц) використовувати НЕ рекомендовано! Можливі проблеми зв\'язку. Тільки короткочасно.' };
function detectSystemFromName(name) {
  if (!name) return '';
  var upper = String(name).toUpperCase().trim();
  var keys = Object.keys(NAME_SUFFIXES).sort(function(a,b){ return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var suf = keys[i];
    // Суфікс як окреме слово АБО в кінці назви (StingHVD, Sting HVD, Sting-HVD)
    var re = new RegExp('(^|[\\s\\-_])' + suf + '($|[\\s\\-_0-9])');
    if (re.test(upper)) return NAME_SUFFIXES[suf];
    if (upper.endsWith(suf)) return NAME_SUFFIXES[suf];
  }
  return '';
}
// Попередження про нерекомендовану частоту
function freqWarn(sel) {
  var m = String(sel.value || '').match(/\((\d+)\)/);
  if (m && WARNING_FREQS[Number(m[1])]) toast('⚠ ' + WARNING_FREQS[Number(m[1])], true);
}

/* ═══════════ ЗАВАНТАЖЕННЯ ДАНИХ ═══════════ */
var _loading = 0;
var _loadPending = false;   // запит на оновлення прийшов, поки тривало інше — виконати після
var _loadStarted = 0;
// Завершення будь-якого шляху завантаження — спільне
function _loadFinish(showToast, silent) {
  S.loadedAt = new Date();
  $('syncTime').textContent = S.loadedAt.toTimeString().slice(0,8);
  updateTopStats();
  saveSnapshot();
  if (!silent) renderView();
  if (showToast) toast('✅ Дані оновлено');
  if (_loadPending) { _loadPending = false; setTimeout(function(){ loadAll(); }, 200); }
}

function loadAll(showToast, silent) {
  if (_loading) {
    // Якщо завантаження триває — не губимо запит, а ставимо в чергу.
    // Якщо воно «застрягло» (>25 с без відповіді) — скидаємо і вантажимо заново.
    if (Date.now() - _loadStarted < 25000) { _loadPending = true; return; }
    _loading = 0;
  }
  _loadStarted = Date.now();
  _loading = 1;
  var needCaps = S.invCaps === undefined;
  // Один пакетний запит замість девʼяти: кожен окремий POST — це власний
  // round-trip і власна перевірка сесії з читанням аркуша «Персонал».
  rpc('getAllData', [needCaps], function(d){
    if (!d || d.items === undefined) { loadAllLegacy(showToast, silent); return; }
    S.me = d.me || ''; $('userEmail').textContent = S.me;
    S.admin = d.admin || '';
    S.items = d.items || [];
    S.trackers = d.trackers || [];
    S.flights = d.flights || [];
    S.sims = d.sims || [];
    S.freq = d.freq || null;
    S.personnel = Array.isArray(d.personnel) ? d.personnel : [];
    if (needCaps) S.invCaps = (d.caps && d.caps.mode) ? d.caps : null;
    // Адопт секторів — ПІСЛЯ invCaps: разова міграція локальних секторів у
    // таблицю дивиться на права (canEditCrews), а вони їдуть у тій самій відповіді
    if (Array.isArray(d.sectors)) sectorsAdopt(d.sectors);
    _loading = 0;
    _loadFinish(showToast, silent);
  }, function(){
    // Старий бекенд без getAllData — тихо їдемо по-старому, по одному
    loadAllLegacy(showToast, silent);
  });
}

// Старий шлях: девʼять окремих запитів. Лишається як запасний, поки
// в таблиці може стояти Code.gs без getAllData.
function loadAllLegacy(showToast, silent) {
  _loading = 5;
  function done() {
    _loading--;
    if (_loading > 0) return;
    _loadFinish(showToast, silent);
  }
  rpc('getCurrentUserEmail', [], function(v){ S.me = v || ''; $('userEmail').textContent = S.me; done(); }, function(){ done(); });
  rpc('getAdminEmail', [], function(v){ S.admin = v || ''; done(); }, function(){ done(); });
  rpc('getInventoryList', [], function(v){ S.items = v || []; done(); }, function(){ S.items=[]; done(); });
  rpc('getSinotrackList', [], function(v){ S.trackers = v || []; done(); }, function(){ S.trackers=[]; done(); });
  rpc('getFlightList', [], function(v){ S.flights = v || []; loadFreqAndSims(done); }, function(){ S.flights=[]; loadFreqAndSims(done); });
}

/* ── Снапшот у localStorage: миттєвий старт ───────────────────
   Поки їде свіже (холодний Apps Script — це секунди), застосунок
   показує останні відомі дані, а не порожній екран. Оновлення приходить
   слідом і перемальовує. Дані живуть на тому ж пристрої, що й токен
   сесії, — модель загроз та сама. */
var SNAP_KEY = 'wh_snapshot';
function saveSnapshot() {
  if (MODE !== 'api') return;
  try {
    localStorage.setItem(SNAP_KEY, JSON.stringify({
      ts: Date.now(), me: S.me, admin: S.admin, items: S.items,
      trackers: S.trackers, sims: S.sims, flights: S.flights,
      freq: S.freq, personnel: S.personnel, invCaps: S.invCaps,
      sectors: SECTORS,
    }));
  } catch(e) {}   // квота/приватний режим — просто без снапшота
}
function loadSnapshot() {
  if (MODE !== 'api') return false;
  try {
    var d = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if (!d || !d.ts) return false;
    // Понад добу — краще чесний спінер, ніж дуже стара картина
    if (Date.now() - d.ts > 24 * 3600 * 1000) return false;
    S.me = d.me || ''; S.admin = d.admin || '';
    S.items = d.items || []; S.trackers = d.trackers || [];
    S.sims = d.sims || []; S.flights = d.flights || [];
    S.freq = d.freq || null;
    S.personnel = Array.isArray(d.personnel) ? d.personnel : [];
    if (Array.isArray(d.sectors) && d.sectors.length) { SECTORS = d.sectors; sectorSelFix(); }
    S.invCaps = d.invCaps;
    S.loadedAt = new Date(d.ts);
    $('userEmail').textContent = S.me;
    $('syncTime').textContent = S.loadedAt.toTimeString().slice(0,8) + ' (кеш)';
    updateTopStats();
    return true;
  } catch(e) { return false; }
}
function clearSnapshot() { try { localStorage.removeItem(SNAP_KEY); } catch(e) {} }
function loadFreqAndSims(done) {
  // Права на інвентар не змінюються — тягнемо один раз за сесію
  var needCaps = S.invCaps === undefined;
  var n = needCaps ? 4 : 3;
  function sub(){ n--; if (!n) done(); }
  rpc('getSimList', [], function(v){ S.sims = v || []; sub(); }, function(){ S.sims=[]; sub(); });
  rpc('getFrequencyAnalysis', [], function(v){ S.freq = v; sub(); }, function(){ S.freq=null; sub(); });
  rpc('getPersonnelList', [], function(v){ S.personnel = Array.isArray(v) ? v : []; sub(); }, function(){ S.personnel=[]; sub(); });
  if (needCaps) {
    // Старий бекенд без цієї функції → тільки перегляд
    rpc('getInventoryCaps', [], function(v){ S.invCaps = (v && v.mode) ? v : null; sub(); }, function(){ S.invCaps = null; sub(); });
  }
}

/* ═══════════ НАВІГАЦІЯ ═══════════ */
function setView(v) {
  S.view = v;
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.view === v); });
  document.querySelector('.sidebar').classList.remove('open');
  renderView();
}
var _lastRenderedView = null;
function renderView() {
  var c = $('content');
  // Сектор (sectorFitHeight) звужує нижній відступ контейнера, щоб смуга
  // погоди стояла впритул до краю — для решти розділів повертаємо стандартний
  if (S.view !== 'sector') c.style.paddingBottom = '';
  // Плашка складу комплекту висить на body — інакше лишилась би висіти
  // над уже перемальованим списком
  if (typeof invKitPopClose === 'function') invKitPopClose();
  renderAuthBox();
  if (!S.loadedAt) {
    if (MODE === 'api' && !S.auth && !authToken()) { c.innerHTML = loginGateHtml('Застосунок'); return; }
    c.innerHTML = '<div class="loading-view"><span class="pulse-dot"></span>Завантаження даних…</div>';
    return;
  }
  // Перемальовка того самого розділу (згортання панелей, оновлення даних)
  // не має скидати позицію прокрутки — інакше на мобільному сторінка «стрибає»
  var keepScroll = (_lastRenderedView === S.view) ? c.scrollTop : 0;
  if (S.view === 'home') renderHome(c);
  else if (S.view === 'flights') renderFlights(c);
  else if (S.view === 'freq') renderFreq(c);
  else if (S.view === 'sector') renderSector(c);
  else if (S.view === 'trackers') renderTrackers(c);
  else if (S.view === 'inventory') renderInventory(c);
  else if (S.view === 'crews') renderCrews(c);
  else if (S.view === 'info') renderInfo(c);
  else if (S.view === 'settings') renderSettings(c);
  _lastRenderedView = S.view;
  c.scrollTop = keepScroll;
}

/* ═══════════ АВТОРИЗАЦІЯ ═══════════ */
function renderAuthBox() {
  var el = $('authBox');
  if (!el) return;
  if (S.auth) {
    el.innerHTML = '<button class="auth-chip" title="Профіль і налаштування" onclick="setView(\'settings\')">👤 '+esc(S.auth.callsign)+
      (S.auth.crewId ? ' · '+esc(S.auth.crewName || S.auth.crewId) : '')+'</button>';
  } else {
    el.innerHTML = '<button class="auth-chip" onclick="openLoginModal()">🔑 Вхід</button>';
  }
  // «Вихід» (разом із рискою над ним) — лише після входу; футер тоді
  // втрачає власний auto-відступ, щоб кнопка сиділа впритул над ним
  var lw = $('navLogoutWrap');
  if (lw) lw.style.display = S.auth ? '' : 'none';
  var sf = $('sidebarFoot');
  if (sf) sf.style.marginTop = S.auth ? '0' : '';
}

function openLoginModal(msg) {
  openModal('🔑 Вхід відповідальної особи',
    (msg ? '<div class="hint" style="margin-bottom:10px">'+esc(msg)+'</div>' : '')+
    '<div class="f"><label>Позивний</label><input type="text" id="lgCallsign" autocomplete="off"></div>'+
    '<div class="f"><label>Пароль</label><input type="password" id="lgPassword" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
    '<button class="btn btn-green" id="lgBtn" onclick="doLogin()">🔑 Увійти</button>'+
    (MODE === 'api'
      ? '<div style="text-align:center;margin-top:10px"><a href="#" class="hint" onclick="setApiUrl();return false">⚙ Змінити адресу бази (/exec)</a>'+
        '<div class="hint" style="margin-top:4px;word-break:break-all;opacity:.6">'+esc(API_URL)+'</div></div>'
      : '')
  );
  setTimeout(function(){ var i = $('lgCallsign'); if (i) i.focus(); }, 60);
}

function doLogin() {
  var cs = $('lgCallsign').value.trim(), pw = $('lgPassword').value;
  if (!cs || !pw) { toast('⚠ Вкажи позивний і пароль', true); return; }
  var btn = $('lgBtn');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = '⏳…'; }
  rpc('authLogin', [cs, pw], function(res){
    if (res && res.token && res.op) {
      setAuthToken(res.token);
      S.auth = res.op;
      toast('✅ Вітаю, '+res.op.callsign+'!'+(res.op.crewId ? ' Екіпаж: '+(res.op.crewName || res.op.crewId) : ' Ти поки без екіпажу'));
      closeModal();
      renderView();
      loadAll();
    } else {
      if (btn) { btn.disabled = false; btn.textContent = '🔑 Увійти'; }
      toast('❌ Не вдалося увійти', true);
    }
  }, function(e){
    if (btn) { btn.disabled = false; btn.textContent = '🔑 Увійти'; }
    toast('❌ '+e.message, true);
  });
}

function doLogout() {
  rpc('authLogout', [authToken()], function(){}, function(){});
  setAuthToken('');
  clearSnapshot();   // вихід = спільний пристрій: дані підрозділу не лишаємо
  S.auth = null;
  toast('👋 Вихід виконано');
  setView('home');
}

// Відновлення сесії при старті (токен у localStorage)
function authInit() {
  var t = authToken();
  if (!t) { renderAuthBox(); return; }
  rpc('authWhoAmI', [t], function(op){
    S.auth = (op && op.id) ? op : null;
    if (!S.auth) setAuthToken('');
    renderAuthBox(); renderView();
  }, function(){ renderAuthBox(); });
}

// Заглушка входу для захищених екранів
function loginGateHtml(what) {
  return '<div class="login-card">'+
    '<h3>🔒 Доступ обмежено</h3>'+
    '<p>'+esc(what || 'Цей розділ')+' доступний після входу відповідальної особи.</p>'+
    '<button class="btn btn-green" onclick="openLoginModal()">🔑 Увійти</button>'+
  '</div>';
}
