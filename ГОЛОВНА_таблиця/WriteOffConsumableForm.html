<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 13px; padding: 14px; background: #f8f9fa; }
  h3 { color: #721c24; font-size: 15px; border-bottom: 2px solid #f5c6cb; padding-bottom: 7px; margin-bottom: 14px; }
  .f { margin-bottom: 11px; }
  label { display: block; font-weight: bold; color: #444; margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  input { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: #fff; font-family: Arial, sans-serif; }
  input:focus { border-color: #721c24; outline: none; }
  .info { background: #f8f5f0; border: 1px solid #c8a97e; border-radius: 4px; padding: 8px; font-size: 12px; margin-bottom: 10px; display: none; line-height: 1.6; }
  .qty-wrap { display: flex; align-items: center; gap: 8px; }
  .qty-wrap input { width: 80px; text-align: center; font-size: 15px; font-weight: bold; }
  .qty-btn { width: 34px; height: 34px; border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .qty-btn:hover { background: #721c24; color: #fff; }
  .btn { width: 100%; padding: 10px; background: #721c24; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #501519; }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .btn-sec { background: #6c757d; margin-top: 5px; }
  .msg { padding: 9px; border-radius: 4px; margin-top: 9px; font-size: 12px; display: none; }
  .ok  { background: #d4edda; color: #155724; display: block; }
  .err { background: #f8d7da; color: #721c24; display: block; }
  .loading { text-align: center; color: #888; padding: 30px; }
  .search-wrap { position: relative; }
  .dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-top: none; border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto; z-index: 100; display: none; }
  .dropdown-item { padding: 8px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f0f0f0; }
  .dropdown-item:hover { background: #f8f5f0; }
  .item-id { font-weight: bold; color: #721c24; }
  .item-meta { color: #666; font-size: 11px; }
  .note { font-size: 10px; color: #856404; background: #fff3cd; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; }
</style>
</head>
<body>
<h3>📉 Списання витратника</h3>
<div class="note">⚠️ Тільки для кількісних витратників. Зменшує залишок і фіксує в журналі.</div>
<div id="body" class="loading">⏳ Завантаження...</div>

<script>
var items = [];
var selectedItem = null;

google.script.run
  .withSuccessHandler(function(list) {
    items = list.filter(function(it) { return it.trackType === 'Кількісний'; });
    renderForm();
  })
  .withFailureHandler(function(e) {
    document.getElementById('body').innerHTML = '<div class="err" style="display:block">❌ ' + e.message + '</div>';
  })
  .getConsumablesList();

function renderForm() {
  document.getElementById('body').innerHTML =
    '<div class="f"><label>Пошук витратника *</label>' +
    '<div class="search-wrap">' +
      '<input type="text" id="search" placeholder="Назва або ID..." oninput="filterItems()" onfocus="filterItems()" autocomplete="off">' +
      '<div class="dropdown" id="dropdown"></div>' +
    '</div></div>' +
    '<div class="info" id="infoBox"></div>' +
    '<input type="hidden" id="selectedId">' +
    '<div id="fields" style="display:none">' +
      '<div class="f"><label>Кількість для списання *</label>' +
      '<div class="qty-wrap">' +
        '<button class="qty-btn" onclick="changeQty(-1)">−</button>' +
        '<input type="number" id="qty" value="1" min="1">' +
        '<button class="qty-btn" onclick="changeQty(1)">+</button>' +
      '</div></div>' +
      '<div class="f"><label>Куди використано</label>' +
      '<input type="text" id="purpose" placeholder="напр. FPV-0001, виїзд..."></div>' +
      '<div class="f"><label>Причина / коментар</label>' +
      '<input type="text" id="reason" placeholder="необов\'язково"></div>' +
      '<button class="btn" id="submitBtn" onclick="submit()">📉 Списати</button>' +
      '<button class="btn btn-sec" onclick="reset()">🗑️ Очистити</button>' +
    '</div>' +
    '<div id="msg" class="msg"></div>';
}

function filterItems() {
  var q = document.getElementById('search').value.toLowerCase().trim();
  var dd = document.getElementById('dropdown');
  var filtered = q
    ? items.filter(function(it) { return it.name.toLowerCase().includes(q) || it.id.toLowerCase().includes(q); })
    : items;
  filtered = filtered.slice(0, 12);
  if (!filtered.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = filtered.map(function(it) {
    return '<div class="dropdown-item" onclick="selectItem(\'' + esc(it.id) + '\')">' +
      '<div class="item-id">' + esc(it.id) + '</div>' +
      '<div class="item-meta">' + esc(it.name) + ' · Залишок: <strong>' + (it.qty || 0) + '</strong> · ' + esc(it.status) + '</div>' +
    '</div>';
  }).join('');
  dd.style.display = 'block';
}

function selectItem(id) {
  var it = items.find(function(i) { return i.id === id; });
  if (!it) return;
  selectedItem = it;
  document.getElementById('search').value = it.id + ' — ' + it.name;
  document.getElementById('selectedId').value = it.id;
  document.getElementById('dropdown').style.display = 'none';
  var box = document.getElementById('infoBox');
  box.innerHTML = '<strong>' + esc(it.name) + '</strong><br>Залишок: <strong>' + (it.qty || 0) + '</strong> · Мінімум: ' + (it.minQty || 0) + '<br>Статус: ' + esc(it.status);
  box.style.display = 'block';
  document.getElementById('qty').max = it.qty || 999;
  document.getElementById('fields').style.display = 'block';
}

function changeQty(delta) {
  var el = document.getElementById('qty');
  var max = selectedItem ? (selectedItem.qty || 999) : 999;
  el.value = Math.min(max, Math.max(1, (parseInt(el.value,10)||0) + delta));
}

function submit() {
  var id = document.getElementById('selectedId').value;
  var qty = parseInt(document.getElementById('qty').value, 10);
  if (!id) { showMsg('❌ Оберіть витратник', 'err'); return; }
  if (!qty || qty < 1) { showMsg('❌ Вкажіть кількість', 'err'); return; }
  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '⏳...';
  google.script.run
    .withSuccessHandler(function(r) {
      showMsg('✅ Списано ' + r.written + ' шт — "' + r.name + '". Залишок: ' + r.left + ' (' + r.status + ')', 'ok');
      var it = items.find(function(i) { return i.id === id; });
      if (it) { it.qty = r.left; it.status = r.status; }
      reset();
      btn.disabled = false; btn.textContent = '📉 Списати';
    })
    .withFailureHandler(function(e) {
      showMsg('❌ ' + e.message, 'err');
      btn.disabled = false; btn.textContent = '📉 Списати';
    })
    .writeOffConsumableById({
      id: id, qty: qty,
      purpose: document.getElementById('purpose').value.trim(),
      reason:  document.getElementById('reason').value.trim(),
    });
}

function reset() {
  document.getElementById('search').value = '';
  document.getElementById('selectedId').value = '';
  document.getElementById('infoBox').style.display = 'none';
  document.getElementById('fields').style.display = 'none';
  document.getElementById('dropdown').style.display = 'none';
  selectedItem = null;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showMsg(txt, cls) {
  var el = document.getElementById('msg');
  el.textContent = txt; el.className = 'msg ' + cls;
  if (cls === 'ok') setTimeout(function(){ el.className = 'msg'; }, 8000);
}
document.addEventListener('click', function(e) {
  if (!e.target.closest || !e.target.closest('.search-wrap')) {
    var dd = document.getElementById('dropdown'); if (dd) dd.style.display = 'none';
  }
});
</script>
</body>
</html>
