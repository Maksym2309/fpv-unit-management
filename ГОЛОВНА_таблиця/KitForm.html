<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 13px; padding: 14px; background: #f8f9fa; }
  h3 { color: #1a3a5c; font-size: 15px; border-bottom: 2px solid #2e6da4; padding-bottom: 7px; margin-bottom: 14px; }
  .f { margin-bottom: 11px; }
  label { display: block; font-weight: bold; color: #444; margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  input { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: #fff; font-family: Arial, sans-serif; }
  input:focus { border-color: #2e6da4; outline: none; }
  .tabs { display: flex; border-bottom: 2px solid #2e6da4; margin-bottom: 14px; }
  .tab { padding: 7px 14px; cursor: pointer; font-size: 12px; font-weight: bold; color: #666; border-radius: 4px 4px 0 0; }
  .tab.active { background: #2e6da4; color: #fff; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Картки комплектів */
  .kit-card { background: #fff; border: 1px solid #ddd; border-left: 4px solid #2e6da4; border-radius: 4px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .kit-header { display: flex; justify-content: space-between; align-items: center; }
  .kit-title { font-weight: bold; color: #1a3a5c; font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
  .kit-count { background: #e8f4fd; color: #1a3a5c; border-radius: 10px; padding: 2px 8px; font-size: 11px; font-weight: bold; flex-shrink: 0; }
  .kit-members { margin-top: 8px; display: none; }
  .kit-members.open { display: block; }
  .member-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #f0f0f0; gap: 6px; }
  .member-main { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  .member-id { font-weight: bold; color: #1a3a5c; font-size: 11px; white-space: nowrap; }
  .member-name { color: #555; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .member-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .st { font-size: 10px; padding: 2px 7px; border-radius: 8px; white-space: nowrap; }
  .st-ok   { background: #d4edda; color: #155724; }
  .st-fix  { background: #fff3cd; color: #856404; }
  .st-bad  { background: #f8d7da; color: #721c24; }
  .st-lost { background: #3d0000; color: #ff9999; }
  .btn-x { background: none; border: none; color: #bbb; cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .btn-x:hover { color: #c00; }

  /* Кнопки */
  .btn { width: 100%; padding: 10px; background: #1a3a5c; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #2e6da4; }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .btn-sec { background: #6c757d; margin-top: 5px; }

  .msg { padding: 9px; border-radius: 4px; margin-top: 9px; font-size: 12px; display: none; }
  .ok  { background: #d4edda; color: #155724; display: block; }
  .err { background: #f8d7da; color: #721c24; display: block; }
  .loading { text-align: center; color: #888; padding: 30px; }
  .empty { text-align: center; color: #aaa; padding: 20px; font-size: 12px; }

  .search-wrap { position: relative; }
  .dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; border-top: none; border-radius: 0 0 4px 4px; max-height: 180px; overflow-y: auto; z-index: 100; display: none; }
  .dropdown-item { padding: 7px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid #f0f0f0; }
  .dropdown-item:hover { background: #e8f4fd; }
  .item-id { font-weight: bold; color: #1a3a5c; font-size: 11px; }
  .item-meta { color: #666; font-size: 11px; }
  .kit-badge { font-size: 10px; color: #2e6da4; margin-left: 4px; }

  .info-box { background: #e8f4fd; border: 1px solid #b8daff; border-radius: 4px; padding: 8px; font-size: 12px; margin-bottom: 10px; display: none; line-height: 1.6; }
  .step2 { display: none; }
</style>
</head>
<body>
<h3>🔗 Комплекти</h3>

<div class="tabs">
  <div class="tab active" onclick="switchTab('view')">📋 Перегляд</div>
  <div class="tab" onclick="switchTab('assign')">➕ Прив'язати</div>
</div>

<!-- TAB: Перегляд -->
<div id="tab-view" class="tab-content active">
  <div id="kitList" class="loading">⏳ Завантаження...</div>
</div>

<!-- TAB: Прив'язати компонент до об'єкта -->
<div id="tab-assign" class="tab-content">

  <div class="f">
    <label>1. Головний об'єкт (до якого прив'язуємо) *</label>
    <div class="search-wrap">
      <input type="text" id="searchMain" placeholder="напр. GNST-0004..." oninput="filterMain()" autocomplete="off">
      <div class="dropdown" id="ddMain"></div>
    </div>
    <input type="hidden" id="mainId">
  </div>
  <div class="info-box" id="mainInfo"></div>

  <div class="step2" id="step2">
    <div class="f">
      <label>2. Компонент (що прив'язуємо) *</label>
      <div class="search-wrap">
        <input type="text" id="searchComp" placeholder="напр. TRK-0001..." oninput="filterComp()" autocomplete="off">
        <div class="dropdown" id="ddComp"></div>
      </div>
      <input type="hidden" id="compId">
    </div>
    <div class="info-box" id="compInfo"></div>

    <button class="btn" id="assignBtn" onclick="doAssign()">🔗 Прив'язати до комплекту</button>
    <button class="btn btn-sec" onclick="resetForm()">↺ Скинути</button>
  </div>

  <div id="msg" class="msg"></div>
</div>

<script>
var items = [];

google.script.run
  .withSuccessHandler(function(list) { items = list; renderKits(); })
  .withFailureHandler(function(e) {
    document.getElementById('kitList').innerHTML =
      '<div class="err" style="display:block">❌ ' + e.message + '</div>';
  })
  .getInventoryList();

// ── Перегляд комплектів ──────────────────────────────────
function renderKits() {
  // Групуємо по значенню kit
  var groups = {};
  items.forEach(function(it) {
    var k = (it.kit || '').trim();
    if (!k) return;
    if (!groups[k]) groups[k] = [];
    groups[k].push(it);
  });

  var keys = Object.keys(groups).sort();
  var container = document.getElementById('kitList');

  if (!keys.length) {
    container.innerHTML = '<div class="empty">Комплектів ще немає.<br>Перейди на вкладку "Прив\'язати".</div>';
    return;
  }

  container.innerHTML = keys.map(function(kitId) {
    var members = groups[kitId];
    // Знайти головний об'єкт (той чий ID = назві комплекту)
    var main = items.find(function(it) { return it.id === kitId; });
    var mainLabel = main ? esc(main.name) : esc(kitId);

    var membersHtml = members.map(function(it) {
      var stCls = stClass(it.status);
      return '<div class="member-row">' +
        '<div class="member-main">' +
          '<span class="member-id">' + esc(it.id) + '</span>' +
          '<span class="member-name">' + esc(it.name) + '</span>' +
        '</div>' +
        '<div class="member-right">' +
          '<span class="st ' + stCls + '">' + esc(it.status) + '</span>' +
          '<button class="btn-x" onclick="doRemove(\'' + esc(it.id) + '\')" title="Відв\'язати">✕</button>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="kit-card">' +
      '<div class="kit-header" onclick="toggleKit(\'' + esc(kitId) + '\')">' +
        '<div class="kit-title">🔗 ' + mainLabel + '</div>' +
        '<span class="kit-count">' + members.length + ' шт</span>' +
      '</div>' +
      '<div style="font-size:10px;color:#888;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(kitId) + '</div>' +
      '<div class="kit-members" id="km-' + esc(kitId) + '">' + membersHtml + '</div>' +
    '</div>';
  }).join('');
}

function toggleKit(kitId) {
  var el = document.getElementById('km-' + kitId);
  if (el) el.classList.toggle('open');
}

// ── Прив'язати ───────────────────────────────────────────
function filterMain() {
  filterSearch('searchMain', 'ddMain', function(it) { return true; }, selectMain);
}

function filterComp() {
  // Скинути блокування кнопки при новому пошуку
  var btn = document.getElementById('assignBtn');
  if (btn) { btn.disabled = false; btn.textContent = "🔗 Прив'язати до комплекту"; }
  filterSearch('searchComp', 'ddComp', function(it) { return true; }, selectComp);
}

function filterSearch(inputId, ddId, filterFn, onSelect) {
  var q  = document.getElementById(inputId).value.toLowerCase().trim();
  var dd = document.getElementById(ddId);
  if (!q) { dd.style.display = 'none'; return; }
  var filtered = items.filter(function(it) {
    return filterFn(it) && (it.id.toLowerCase().includes(q) || it.name.toLowerCase().includes(q));
  }).slice(0, 10);
  if (!filtered.length) { dd.style.display = 'none'; return; }
  dd.innerHTML = filtered.map(function(it) {
    var inKit = it.kit && it.kit.trim() !== '';
    var rowStyle = inKit ? 'background:#fff8f0;border-left:3px solid #e67e22;padding-left:7px;' : '';
    var kitInfo = inKit
      ? '<div style="color:#e67e22;font-size:10px;margin-top:2px">🔗 ' + esc(it.kit) + '</div>'
      : '';
    return '<div class="dropdown-item" style="' + rowStyle + '" onclick="' + onSelect.name + '(\'' + esc(it.id) + '\')">' +
      '<div class="item-id" style="' + (inKit ? 'color:#e67e22' : '') + '">' + esc(it.id) + '</div>' +
      '<div class="item-meta">' + esc(it.name) + ' · ' + esc(it.status) + '</div>' +
      kitInfo +
    '</div>';
  }).join('');
  dd.style.display = 'block';
}

function selectMain(id) {
  var it = items.find(function(i) { return i.id === id; });
  if (!it) return;
  document.getElementById('searchMain').value = it.id + ' — ' + it.name;
  document.getElementById('mainId').value = it.id;
  document.getElementById('ddMain').style.display = 'none';
  var box = document.getElementById('mainInfo');
  box.innerHTML = '<strong>' + esc(it.name) + '</strong><br>' + esc(it.type) + ' · ' + esc(it.assignment) + ' · ' + esc(it.status);
  box.style.display = 'block';
  document.getElementById('step2').style.display = 'block';
}

function selectComp(id) {
  var it = items.find(function(i) { return i.id === id; });
  if (!it) return;
  document.getElementById('searchComp').value = it.id + ' — ' + it.name;
  document.getElementById('compId').value = it.id;
  document.getElementById('ddComp').style.display = 'none';
  var box = document.getElementById('compInfo');
  var mainId = document.getElementById('mainId').value;
  var alreadyInThisKit = it.kit && it.kit === mainId;
  var inOtherKit = it.kit && it.kit !== mainId;

  var kitWarning = '';
  if (alreadyInThisKit) {
    kitWarning = '<div style="color:#e67e22;font-weight:bold;margin-top:4px">⚠️ Вже в цьому комплекті!</div>';
  } else if (inOtherKit) {
    kitWarning = '<div style="color:#e67e22;margin-top:4px">🔗 Вже в іншому комплекті: <strong>' + esc(it.kit) + '</strong></div>';
  }

  box.style.background = (alreadyInThisKit || inOtherKit) ? '#fff8f0' : '#e8f4fd';
  box.style.borderColor = (alreadyInThisKit || inOtherKit) ? '#e67e22' : '#b8daff';
  box.innerHTML = '<strong>' + esc(it.name) + '</strong><br>' + esc(it.type) + ' · ' + esc(it.status) + kitWarning;
  box.style.display = 'block';

  // Заблокувати кнопку якщо вже в цьому комплекті
  var btn = document.getElementById('assignBtn');
  if (alreadyInThisKit) {
    btn.disabled = true;
    btn.textContent = "⚠️ Вже в цьому комплекті";
  } else {
    btn.disabled = false;
    btn.textContent = "🔗 Прив'язати до комплекту";
  }
}

function doAssign() {
  var mainId = document.getElementById('mainId').value;
  var compId = document.getElementById('compId').value;
  if (!mainId) { showMsg('❌ Оберіть головний об\'єкт', 'err'); return; }
  if (!compId) { showMsg('❌ Оберіть компонент', 'err'); return; }
  if (mainId === compId) { showMsg('❌ Не можна прив\'язати об\'єкт до себе', 'err'); return; }
  var comp = items.find(function(i) { return i.id === compId; });
  if (comp && comp.kit === mainId) { showMsg('❌ Вже в цьому комплекті', 'err'); return; }

  var btn = document.getElementById('assignBtn');
  btn.disabled = true; btn.textContent = '⏳...';

  google.script.run
    .withSuccessHandler(function(r) {
      showMsg('✅ ' + r.id + ' прив\'язано до ' + r.kit, 'ok');
      var it = items.find(function(i) { return i.id === compId; });
      if (it) it.kit = mainId;
      renderKits();
      // Очистити поле компонента для наступного
      document.getElementById('searchComp').value = '';
      document.getElementById('compId').value = '';
      document.getElementById('compInfo').style.display = 'none';
      btn.disabled = false; btn.textContent = "🔗 Прив'язати до комплекту";
    })
    .withFailureHandler(function(e) {
      showMsg('❌ ' + e.message, 'err');
      btn.disabled = false; btn.textContent = "🔗 Прив'язати до комплекту";
    })
    .assignToKit(compId, mainId);
}

function doRemove(id) {
  google.script.run
    .withSuccessHandler(function(r) {
      var it = items.find(function(i) { return i.id === r.id; });
      if (it) it.kit = '';
      renderKits();
    })
    .withFailureHandler(function(e) { showMsg('❌ ' + e.message, 'err'); })
    .removeFromKit(id);
}

function resetForm() {
  ['searchMain','searchComp'].forEach(function(id) { document.getElementById(id).value = ''; });
  ['mainId','compId'].forEach(function(id) { document.getElementById(id).value = ''; });
  ['mainInfo','compInfo'].forEach(function(id) { document.getElementById(id).style.display = 'none'; });
  document.getElementById('step2').style.display = 'none';
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  document.querySelector('[onclick="switchTab(\'' + tab + '\')"]').classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function stClass(s) {
  if (s === 'Робочий') return 'st-ok';
  if (s === 'Ремонт' || s === 'На перевірці' || s === 'Резерв') return 'st-fix';
  if (s === 'Втрачений') return 'st-lost';
  return 'st-bad';
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showMsg(txt, cls) {
  var el = document.getElementById('msg');
  el.textContent = txt; el.className = 'msg ' + cls;
  if (cls === 'ok') setTimeout(function(){ el.className='msg'; }, 6000);
}
document.addEventListener('click', function(e) {
  if (!e.target.closest) return;
  if (!e.target.closest('.search-wrap')) {
    ['ddMain','ddComp'].forEach(function(id) {
      var dd = document.getElementById(id); if (dd) dd.style.display = 'none';
    });
  }
});
</script>
</body>
</html>
