<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f8f9fa; padding: 14px; }
  .title { color: #1a3a5c; font-size: 17px; font-weight: bold; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 12px; margin-bottom: 18px; }
  .tile { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 16px; width: 100%; cursor: pointer; text-align: left; margin-bottom: 12px; transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s; }
  .tile:hover { transform: translateX(4px); box-shadow: 0 4px 14px rgba(46,109,164,0.18); border-color: #2e6da4; }
  .tile-icon { font-size: 32px; flex-shrink: 0; }
  .tile-text { flex: 1; }
  .tile-title { font-size: 15px; font-weight: bold; color: #1a3a5c; }
  .tile-desc { font-size: 11px; color: #999; margin-top: 2px; }
  .tile-arrow { color: #2e6da4; font-size: 18px; }
  .hint { color: #aaa; font-size: 11px; margin-top: 14px; text-align: center; line-height: 1.5; }
  .msg { font-size: 11px; color: #c00; margin-top: 8px; min-height: 14px; text-align: center; }
</style>
</head>
<body>
<div class="title">🚀 FPV застосунок</div>
<div class="subtitle">Розділ відкриється на весь екран</div>

<button class="tile" onclick="openSection('flight', this)">
  <div class="tile-icon">✈️</div>
  <div class="tile-text">
    <div class="tile-title">Журнал польоту</div>
    <div class="tile-desc">Екіпажі, вильоти, статуси</div>
  </div>
  <div class="tile-arrow">⛶</div>
</button>

<button class="tile" onclick="openSection('sinotrack', this)">
  <div class="tile-icon">📡</div>
  <div class="tile-text">
    <div class="tile-title">Sinotrack</div>
    <div class="tile-desc">Трекери, SIM-карти</div>
  </div>
  <div class="tile-arrow">⛶</div>
</button>

<button class="tile" onclick="openSection('frequency', this)">
  <div class="tile-icon">📻</div>
  <div class="tile-text">
    <div class="tile-title">Карта частот</div>
    <div class="tile-desc">Конфлікти, VTX, резервні</div>
  </div>
  <div class="tile-arrow">⛶</div>
</button>

<div class="msg" id="msg"></div>
<div class="hint">💡 Кожен розділ відкривається у власному великому вікні поверх таблиці</div>

<script>
function openSection(section, btn) {
  var fn = section==='flight' ? 'openFlightLogModal'
    : section==='sinotrack' ? 'openSinotrackModal'
    : 'openFrequencyModal';
  document.getElementById('msg').textContent = '⏳ Відкриваю...';
  google.script.run
    .withSuccessHandler(function(){ document.getElementById('msg').textContent = ''; })
    .withFailureHandler(function(e){ document.getElementById('msg').textContent = '❌ '+e.message; })
    [fn]();
}
</script>
</body>
</html>
