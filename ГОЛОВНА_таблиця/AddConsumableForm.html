<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 13px; padding: 14px; background: #f8f9fa; }
  h3 { color: #7d4e00; font-size: 15px; border-bottom: 2px solid #c8a97e; padding-bottom: 7px; margin-bottom: 14px; }
  .f { margin-bottom: 11px; }
  label { display: block; font-weight: bold; color: #444; margin-bottom: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .3px; }
  select, input, textarea { width: 100%; padding: 7px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: #fff; font-family: Arial, sans-serif; }
  select:focus, input:focus, textarea:focus { border-color: #7d4e00; outline: none; }
  textarea { height: 46px; resize: vertical; }
  .req { color: #c00; }
  .hint { font-size: 10px; color: #888; margin-top: 3px; font-style: italic; }
  .toggle-wrap { display: flex; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .toggle-btn { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; background: #f0f0f0; color: #666; border: none; }
  .toggle-btn.active { background: #7d4e00; color: #fff; }
  .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .status-btn { padding: 9px; border: 2px solid #ddd; border-radius: 6px; text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; }
  .status-btn:hover { opacity: .8; }
  .status-btn.active { box-shadow: 0 0 0 2px #333; }
  .s-bagato   { background: #d4edda; color: #155724; border-color: #155724; }
  .s-dostatno { background: #d1ecf1; color: #0c5460; border-color: #0c5460; }
  .s-malo     { background: #fff3cd; color: #856404; border-color: #856404; }
  .s-kryt     { background: #f8d7da; color: #721c24; border-color: #721c24; }
  .qty-wrap { display: flex; align-items: center; gap: 8px; }
  .qty-wrap input { width: 80px; text-align: center; font-size: 15px; font-weight: bold; }
  .qty-btn { width: 34px; height: 34px; border: 1px solid #ccc; border-radius: 4px; background: #f0f0f0; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .qty-btn:hover { background: #7d4e00; color: #fff; }
  .compat-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .tag { padding: 3px 8px; border: 1px solid #ccc; border-radius: 12px; font-size: 11px; cursor: pointer; background: #fff; }
  .tag.active { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }
  .btn { width: 100%; padding: 10px; background: #7d4e00; color: #fff; border: none; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #5c3900; }
  .btn:disabled { background: #999; cursor: not-allowed; }
  .btn-sec { background: #6c757d; margin-top: 5px; }
  .msg { padding: 9px; border-radius: 4px; margin-top: 9px; font-size: 12px; display: none; }
  .ok  { background: #d4edda; color: #155724; display: block; }
  .err { background: #f8d7da; color: #721c24; display: block; }
  .loading { text-align: center; color: #888; padding: 30px; }
</style>
</head>
<body>
<h3>➕ Новий витратник</h3>
<div id="body" class="loading">⏳ Завантаження...</div>

<script>
var compatOptions  = [];
var selectedCompat = [];
var selectedStatus = 'Достатньо';
var trackType      = 'Статусний';

google.script.run
  .withSuccessHandler(function(opts) {
    compatOptions = opts;
    renderForm();
  })
  .withFailureHandler(function() { compatOptions = ['FPV','STNG','Універсальне']; renderForm(); })
  .getCompatOptions();

function renderForm() {
  var catOpts = ['Рами','Мотори','ESC','Пропелери','Кабелі','Пайка','Електроніка','Кріплення','Загальне','Інше']
    .map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');

  var tagsHtml = compatOptions.map(function(c) {
    return '<span class="tag" id="tag-' + esc(c) + '" onclick="toggleTag(\'' + esc(c) + '\')">' + esc(c) + '</span>';
  }).join('');

  document.getElementById('body').innerHTML =
    '<div class="f"><label>Назва <span class="req">*</span></label>' +
    '<input type="text" id="name" placeholder="напр. Рама 5\", Мотори 2306..."></div>' +

    '<div class="f"><label>Категорія</label><select id="category">' + catOpts + '</select></div>' +

    '<div class="f"><label>Сумісність</label>' +
    '<div class="compat-tags" id="compatTags">' + tagsHtml + '</div>' +
    '<div class="hint">Обери один або кілька типів. Без вибору = Універсальне</div></div>' +

    '<div class="f"><label>Тип обліку</label>' +
    '<div class="toggle-wrap">' +
      '<button class="toggle-btn" id="btnStat" onclick="setTrack(\'Статусний\')">📊 Статусний</button>' +
      '<button class="toggle-btn" id="btnQty" onclick="setTrack(\'Кількісний\')">🔢 Кількісний</button>' +
    '</div></div>' +

    '<div id="statBlock">' +
      '<div class="f"><label>Початковий статус</label>' +
      '<div class="status-grid">' +
        '<div class="status-btn s-bagato active" onclick="setStatus(\'Багато\')">📦 Багато</div>' +
        '<div class="status-btn s-dostatno" onclick="setStatus(\'Достатньо\')">✅ Достатньо</div>' +
        '<div class="status-btn s-malo" onclick="setStatus(\'Мало\')">⚠️ Мало</div>' +
        '<div class="status-btn s-kryt" onclick="setStatus(\'Критично\')">🚨 Критично</div>' +
      '</div></div>' +
    '</div>' +

    '<div id="qtyBlock" style="display:none">' +
      '<div class="f"><label>Початкова кількість</label>' +
      '<div class="qty-wrap">' +
        '<button class="qty-btn" onclick="changeQty(\'qty\',-1)">−</button>' +
        '<input type="number" id="qty" value="0" min="0">' +
        '<button class="qty-btn" onclick="changeQty(\'qty\',1)">+</button>' +
      '</div></div>' +
      '<div class="f"><label>Мінімум (поріг "Критично")</label>' +
      '<div class="qty-wrap">' +
        '<button class="qty-btn" onclick="changeQty(\'minQty\',-1)">−</button>' +
        '<input type="number" id="minQty" value="0" min="0">' +
        '<button class="qty-btn" onclick="changeQty(\'minQty\',1)">+</button>' +
      '</div>' +
      '<div class="hint">Мало = мін×2, Достатньо = мін×4, Багато = вище</div></div>' +
    '</div>' +

    '<div class="f"><label>Примітка</label>' +
    '<textarea id="note" placeholder="необов\'язково"></textarea></div>' +

    '<button class="btn" id="submitBtn" onclick="submit()">✅ Додати витратник</button>' +
    '<button class="btn btn-sec" onclick="clearForm()">🗑️ Очистити</button>' +
    '<div id="msg" class="msg"></div>';

  // Встановити дефолтний тип
  setTrack('Статусний');
  setStatus('Достатньо');
}

function toggleTag(code) {
  var el = document.getElementById('tag-' + code);
  var idx = selectedCompat.indexOf(code);
  if (idx === -1) { selectedCompat.push(code); el.classList.add('active'); }
  else { selectedCompat.splice(idx, 1); el.classList.remove('active'); }
}

function setTrack(type) {
  trackType = type;
  document.getElementById('btnStat').className = 'toggle-btn' + (type === 'Статусний' ? ' active' : '');
  document.getElementById('btnQty').className  = 'toggle-btn' + (type === 'Кількісний' ? ' active' : '');
  document.getElementById('statBlock').style.display = type === 'Статусний' ? 'block' : 'none';
  document.getElementById('qtyBlock').style.display  = type === 'Кількісний' ? 'block' : 'none';
}

function setStatus(val) {
  selectedStatus = val;
  document.querySelectorAll('.status-btn').forEach(function(b) { b.classList.remove('active'); });
  var map = { 'Багато': 's-bagato', 'Достатньо': 's-dostatno', 'Мало': 's-malo', 'Критично': 's-kryt' };
  document.querySelectorAll('.' + map[val]).forEach(function(b) { b.classList.add('active'); });
}

function changeQty(fieldId, delta) {
  var el = document.getElementById(fieldId);
  if (!el) return;
  el.value = Math.max(0, (parseInt(el.value, 10) || 0) + delta);
}

function submit() {
  var name = document.getElementById('name').value.trim();
  if (!name) { showMsg('❌ Введіть назву', 'err'); return; }

  var compat = selectedCompat.length > 0 ? selectedCompat.join(', ') : 'Універсальне';

  var data = {
    name:      name,
    category:  document.getElementById('category').value,
    compat:    compat,
    trackType: trackType,
    note:      document.getElementById('note').value.trim(),
  };

  if (trackType === 'Кількісний') {
    data.qty    = document.getElementById('qty').value;
    data.minQty = document.getElementById('minQty').value;
  } else {
    data.status = selectedStatus;
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '⏳ Зберігаємо...';

  google.script.run
    .withSuccessHandler(function(id) {
      showMsg('✅ Додано: ' + id + ' — ' + name, 'ok');
      clearForm();
      btn.disabled = false; btn.textContent = '✅ Додати витратник';
    })
    .withFailureHandler(function(e) {
      showMsg('❌ ' + e.message, 'err');
      btn.disabled = false; btn.textContent = '✅ Додати витратник';
    })
    .addConsumableFromForm(data);
}

function clearForm() {
  if (document.getElementById('name')) document.getElementById('name').value = '';
  if (document.getElementById('note')) document.getElementById('note').value = '';
  selectedCompat = [];
  document.querySelectorAll('.tag').forEach(function(t) { t.classList.remove('active'); });
  setTrack('Статусний');
  setStatus('Достатньо');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showMsg(txt, cls) {
  var el = document.getElementById('msg');
  el.textContent = txt; el.className = 'msg ' + cls;
  if (cls === 'ok') setTimeout(function(){ el.className = 'msg'; }, 8000);
}
</script>
</body>
</html>
