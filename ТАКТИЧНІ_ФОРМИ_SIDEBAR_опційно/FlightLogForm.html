<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* ═══════════════════════════════════════════════════════════════
   HORNET TACTICAL OS — темна тактична тема (Wild Hornets)
   Згенеровано за DESIGN.md: Modern-Brutalist / Tactical HUD
   Гострі кути · Hornet Yellow #ffb800 · Archivo Narrow + JetBrains Mono
   ═══════════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #131313;
  --panel: #1c1b1b;
  --panel-2: #201f1f;
  --panel-3: #2a2a2a;
  --line: #353534;
  --line-2: #514532;
  --text: #e5e2e1;
  --muted: #a8a5a2;
  --dim: #7f7c78;
  --accent: #ffb800;
  --accent-hi: #ffca3d;
  --accent-soft: #ffdca1;
  --on-accent: #1a1300;
  --blue: #3498db;
  --blue-deep: #2a486b;
  --blue-soft: #abc9f2;
  --green: #2ecc71;
  --green-bg: #11301d;
  --red: #e74c3c;
  --red-soft: #ff8580;
  --red-bg: #3a1512;
  --orange: #f39c12;
  --orange-bg: #33270e;
  --yellow: #f1c40f;
  --purple: #9b59b6;
  --grey: #7f8c8d;
  --font-ui: 'Archivo Narrow', Arial, sans-serif;
  --font-data: 'JetBrains Mono', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  font-family: var(--font-ui); font-size: 14px; padding: 14px;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    var(--bg);
  color: var(--text);
}
h3 {
  color: var(--accent); font-size: 16px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
  border-bottom: 1px solid var(--line-2); padding-bottom: 7px; margin-bottom: 14px;
}
hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.req { color: var(--red); }
.hint { font-size: 10px; color: var(--dim); margin-top: 3px; font-style: normal; }
.loading { text-align: center; color: var(--dim); padding: 30px; font-family: var(--font-data); font-size: 12px; }
.empty { text-align: center; color: var(--dim); padding: 14px; font-size: 12px; }
.title { color: var(--accent); font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
.subtitle { color: var(--dim); font-size: 12px; margin-bottom: 18px; }

/* ── Поля вводу ── */
label {
  display: block; font-weight: 700; color: var(--dim); margin-bottom: 4px;
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  font-family: var(--font-data);
}
select, input, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 0;
  font-size: 13px; background: #0e0e0e; color: var(--text);
  font-family: var(--font-data);
}
select:focus, input:focus, textarea:focus {
  border-color: var(--accent); outline: none;
  box-shadow: 0 1px 0 0 var(--accent), inset 0 -1px 0 0 var(--accent);
}
input::placeholder, textarea::placeholder { color: #5c5955; }
select option, select optgroup { background: #0e0e0e; color: var(--text); }
textarea { height: 54px; resize: vertical; }
.f { margin-bottom: 11px; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line-2); border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* ── Кнопки ── */
.btn {
  width: 100%; padding: 10px; background: var(--accent); color: var(--on-accent);
  border: none; border-radius: 0; font-size: 13px; font-weight: 700; cursor: pointer;
  margin-top: 8px; font-family: var(--font-data); text-transform: uppercase; letter-spacing: .06em;
}
.btn:hover { background: var(--accent-hi); }
.btn:disabled { background: var(--panel-3); color: var(--dim); cursor: not-allowed; }
.btn-green { background: var(--green-bg); color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.btn-green:hover { background: var(--green); color: #04180c; }
.btn-red { background: var(--red-bg); color: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); margin-top: 4px; }
.btn-red:hover { background: var(--red); color: #1c0503; }
.btn-sec { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); margin-top: 5px; }
.btn-sec:hover { background: var(--panel-3); color: var(--text); }
.btn-sm { width: auto; padding: 4px 10px; font-size: 11px; background: var(--panel-3); color: var(--muted); border: 1px solid var(--line-2); border-radius: 0; cursor: pointer; margin-right: 3px; font-family: var(--font-data); }
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.btn-search { background: var(--blue-deep); color: var(--blue-soft); }
.btn-search:hover { background: var(--blue); color: #06121c; }
.btn-delete { background: var(--red-bg); color: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.btn-delete:hover { background: var(--red); color: #1c0503; }
.btn-delete:disabled { background: var(--panel-3); color: var(--dim); box-shadow: none; cursor: not-allowed; }
.btn-clear { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line-2); margin-top: 4px; }
.btn-clear:hover { background: var(--panel-3); }
.btn-x { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; padding: 2px 5px; }
.btn-x:hover { color: var(--red); }
.btn-x:disabled { color: var(--line); cursor: not-allowed; }
.refresh-btn {
  width: 100%; padding: 8px; background: transparent; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 0; font-weight: 700; cursor: pointer;
  margin-bottom: 10px; font-family: var(--font-data); text-transform: uppercase; letter-spacing: .06em;
}
.refresh-btn:hover { background: var(--accent); color: var(--on-accent); }
.fs-icon-btn { position: absolute; top: 9px; right: 12px; height: 24px; display: flex; align-items: center; background: transparent; color: var(--accent); border: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 0 4px; }
.fs-icon-btn:hover { color: var(--accent-hi); }
.qty-wrap { display: flex; align-items: center; gap: 8px; }
.qty-wrap input { width: 80px; text-align: center; font-size: 15px; font-weight: 700; }
.qty-btn { width: 34px; height: 34px; border: 1px solid var(--line-2); border-radius: 0; background: var(--panel-2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; user-select: none; }
.qty-btn:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.qty-note { font-size: 10px; color: var(--dim); }

/* ── Вкладки ── */
.tabs { display: flex; border-bottom: 1px solid var(--accent); margin-bottom: 14px; gap: 2px; }
.tab {
  padding: 8px 10px; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--muted);
  border-radius: 0; flex: 1; text-align: center; font-family: var(--font-data);
  text-transform: uppercase; letter-spacing: .05em; background: var(--panel);
  border: 1px solid var(--line); border-bottom: none;
}
.tab:hover { color: var(--text); background: var(--panel-3); }
.tab.active {
  background: var(--accent); color: var(--on-accent); border-color: var(--accent);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
}
.tab-content { display: none; }
.tab-content.active { display: block; }
.toggle-wrap { display: flex; border: 1px solid var(--line-2); border-radius: 0; overflow: hidden; margin-bottom: 8px; }
.toggle-btn { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 11px; font-weight: 700; background: var(--panel); color: var(--muted); border: none; font-family: var(--font-data); text-transform: uppercase; }
.toggle-btn.active { background: var(--accent); color: var(--on-accent); }

/* ── Секції ── */
.section, .section-title {
  font-weight: 700; color: var(--accent); font-size: 11px; margin: 14px 0 8px;
  font-family: var(--font-data); text-transform: uppercase; letter-spacing: .1em;
  border-left: 3px solid var(--accent); padding-left: 8px;
}
.section-red { border-left-color: var(--red); color: var(--red-soft); }

/* ── Картки ── */
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 0; padding: 10px; margin-bottom: 8px; }
.card-active { border-left-color: var(--orange); background: #211b10; }
.card-mine   { border-left-color: var(--accent); background: #211d10; }
.card-other  { border-left-color: var(--line-2); background: var(--panel); opacity: 0.65; }
.card-done   { border-left-color: var(--green); }
.card-ok     { border-left-color: var(--green); }
.card-bad    { border-left-color: var(--red); }
.card-lost   { border-left-color: #7a2020; background: #1d0a0a; }
.card-title  { font-weight: 700; font-size: 13px; color: var(--accent-soft); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-meta   { font-size: 12px; color: var(--muted); line-height: 1.7; }
.card-lost .card-meta, .card-lost .card-title { color: var(--red-soft); }
.item-card { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; line-height: 1.6; }
.item-card.ok   { border-left: 3px solid var(--red); }
.item-card.miss { border-left: 3px solid var(--line-2); background: var(--panel-2); color: var(--dim); }
.item-id   { font-weight: 700; color: var(--accent-soft); font-family: var(--font-data); font-size: 12px; }
.item-name { color: var(--text); }
.item-meta { color: var(--dim); font-size: 11px; }
.found-list { margin: 10px 0; }
.kit-card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 0; padding: 10px; margin-bottom: 8px; cursor: pointer; }
.kit-header { display: flex; justify-content: space-between; align-items: center; }
.kit-title { font-weight: 700; color: var(--accent-soft); font-size: 13px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 6px; }
.kit-count { background: var(--blue-deep); color: var(--blue-soft); border-radius: 0; padding: 2px 8px; font-size: 11px; font-weight: 700; flex-shrink: 0; font-family: var(--font-data); }
.kit-members { margin-top: 8px; display: none; }
.kit-members.open { display: block; }
.kit-badge { font-size: 10px; color: var(--blue); margin-left: 4px; }
.member-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); gap: 6px; }
.member-main { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.member-id { font-weight: 700; color: var(--accent-soft); font-size: 11px; white-space: nowrap; font-family: var(--font-data); }
.member-name { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.member-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

/* ── Бейджі та статуси ── */
.badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 0; margin-left: 4px; font-family: var(--font-data); font-weight: 700; }
.badge-mine  { background: var(--accent); color: var(--on-accent); }
.badge-other { background: var(--panel-3); color: var(--muted); }
.badge-act   { background: var(--orange); color: #231604; }
.badge-admin { background: var(--blue-deep); color: var(--blue-soft); }
.badge-main  { background: var(--red-bg); color: var(--red-soft); box-shadow: inset 0 0 0 1px var(--red); }
.badge-user  { background: var(--green-bg); color: var(--green); }
.badge-qty   { background: var(--blue-deep); color: var(--blue-soft); }
.badge-stat  { background: var(--orange-bg); color: var(--orange); }
.st, .st-badge { font-size: 10px; padding: 2px 7px; border-radius: 0; white-space: nowrap; font-family: var(--font-data); font-weight: 700; }
.st-ok   { background: var(--green-bg);  color: var(--green);    border-color: var(--green); }
.st-fix  { background: var(--orange-bg); color: var(--orange);   border-color: var(--orange); }
.st-bad  { background: var(--red-bg);    color: var(--red-soft); border-color: var(--red); }
.st-lost { background: #2a0505;          color: var(--red-soft); border-color: #7a2020; }
.count-badge { display: inline-block; background: var(--red); color: #1c0503; border-radius: 0; padding: 1px 8px; font-size: 11px; font-weight: 700; font-family: var(--font-data); }
.tag { display: inline-block; background: var(--panel-3); color: var(--text); border: 1px solid var(--line-2); border-radius: 0; padding: 3px 8px; font-size: 11px; margin: 2px; cursor: pointer; font-family: var(--font-data); }
.tag:hover { background: var(--red-bg); border-color: var(--red); color: var(--red-soft); }
.tag-busy { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
.tag.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.sheets-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.sheet-tag { background: var(--blue-deep); color: var(--blue-soft); border-radius: 0; padding: 2px 8px; font-size: 11px; font-family: var(--font-data); }
.email-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.email-addr { flex: 1; font-size: 12px; color: var(--text); font-family: var(--font-data); }
.status-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.dot-ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
.dot-err { background: var(--red); box-shadow: 0 0 6px var(--red); }
.dot-off { background: var(--dim); }

/* ── Кнопки статусів ── */
.st-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 5px; }
.st-btn { padding: 8px; border: 1px solid var(--line-2); border-radius: 0; text-align: center; cursor: pointer; font-size: 11px; font-weight: 700; font-family: var(--font-data); }
.st-btn.sel { box-shadow: 0 0 0 2px var(--accent); }
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
.status-btn { padding: 10px; border: 1px solid var(--line-2); border-radius: 0; text-align: center; cursor: pointer; font-size: 12px; font-weight: 700; transition: all .15s; font-family: var(--font-data); }
.status-btn:hover { opacity: .85; }
.status-btn.active { box-shadow: 0 0 0 2px var(--accent); }
.s-bagato   { background: var(--green-bg);  color: var(--green);     border-color: var(--green); }
.s-dostatno { background: #0e2830;          color: #5dade2;          border-color: #5dade2; }
.s-malo     { background: var(--orange-bg); color: var(--orange);    border-color: var(--orange); }
.s-kryt     { background: var(--red-bg);    color: var(--red-soft);  border-color: var(--red); }
.s-bagato.active   { box-shadow: 0 0 0 2px var(--green); }
.s-dostatno.active { box-shadow: 0 0 0 2px #5dade2; }
.s-malo.active     { box-shadow: 0 0 0 2px var(--orange); }
.s-kryt.active     { box-shadow: 0 0 0 2px var(--red); }

/* ── Повідомлення ── */
.msg { padding: 9px; border-radius: 0; margin-top: 9px; font-size: 12px; display: none; }
.ok,  .ok-msg  { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); display: block; }
.err, .err-msg { background: var(--red-bg); color: var(--red-soft); border: 1px solid var(--red); display: block; }
.warn, .warn-box { background: var(--orange-bg); border: 1px solid var(--orange); border-radius: 0; padding: 8px 10px; font-size: 12px; color: var(--orange); margin: 6px 0; }
.danger { background: var(--red-bg); border: 1px solid var(--red); border-radius: 0; padding: 7px; font-size: 11px; color: var(--red-soft); margin: 5px 0; }
.info, .info-box { background: #152535; border: 1px solid var(--blue-deep); border-radius: 0; padding: 8px; font-size: 12px; margin-bottom: 10px; line-height: 1.6; color: var(--blue-soft); }
.info.qty  { background: #152535; border-color: var(--blue-deep); }
.info.stat { background: var(--orange-bg); border-color: var(--orange); color: var(--orange); }
.note { font-size: 10px; color: var(--orange); background: var(--orange-bg); padding: 6px 8px; border-radius: 0; border: 1px solid var(--orange); margin-bottom: 8px; }

/* ── Автодоповнення / випадаючі списки ── */
.ac-wrap, .search-wrap { position: relative; }
.ac-list, .dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--panel-2); border: 1px solid var(--accent); border-top: none; border-radius: 0; max-height: 200px; overflow-y: auto; z-index: 200; display: none; box-shadow: 0 8px 20px rgba(0,0,0,.6); }
.ac-item, .dropdown-item { padding: 8px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--line); }
.ac-item:hover, .ac-item:focus, .dropdown-item:hover { background: var(--panel-3); box-shadow: inset 3px 0 0 var(--accent); }
.ac-item.new { color: var(--accent); font-style: italic; }
.ac-id { font-weight: 700; color: var(--accent-soft); font-size: 11px; font-family: var(--font-data); }
.ac-meta { color: var(--dim); font-size: 11px; }
.ac-busy { color: var(--orange); font-size: 10px; }
.fields { display: none; }
.step { display: none; }
.step.active { display: block; }
.step2 { display: none; }

/* ── ID preview (AddForm) ── */
.id-preview { background: var(--panel-2); color: var(--accent); border: 1px solid var(--accent); border-radius: 0; padding: 6px 10px; text-align: center; margin-bottom: 12px; display: none; font-family: var(--font-data); }
.id-preview .lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .1em; }
.id-preview .short { font-size: 20px; font-weight: 700; letter-spacing: 3px; }
.id-preview .full  { font-size: 10px; color: var(--muted); margin-top: 1px; }
.id-preview .range { font-size: 11px; color: var(--muted); margin-top: 2px; }
.result-list { font-size: 11px; margin-top: 6px; max-height: 120px; overflow-y: auto; }
.result-item { padding: 4px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.result-id { font-weight: 700; color: var(--accent-soft); font-size: 11px; flex: 1; font-family: var(--font-data); }
.result-short { background: var(--accent); color: var(--on-accent); padding: 4px 8px; border-radius: 0; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-align: center; white-space: nowrap; font-family: var(--font-data); }

/* ── Блок «Втрачений» (EditForm) ── */
.lost-block { background: #1d0a0a; border: 1px solid var(--red); border-radius: 0; padding: 10px; margin-bottom: 10px; display: none; }
.lost-block label { color: var(--red-soft); }
.lost-block input, .lost-block textarea { background: #140505; color: #ffcccc; border-color: #7a2020; }
.lost-block input:focus, .lost-block textarea:focus { border-color: var(--red); outline: none; box-shadow: 0 1px 0 0 var(--red); }
.lost-title { color: var(--red); font-weight: 700; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-data); }
.lost-hint { color: var(--red-soft); font-size: 10px; margin-top: 3px; }

/* ── Карта частот ── */
.active-flight { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: 0; padding: 6px 8px; margin-bottom: 5px; font-size: 12px; }
.af-mine { border-left-color: var(--green); background: #10231a; }
.af-unit { border-left-color: var(--blue); background: #10202e; }
.af-ext  { border-left-color: var(--grey); background: var(--panel-3); }
.af-crew { font-weight: 700; color: var(--text); }
.af-sys { display: inline-block; background: var(--blue-deep); color: var(--blue-soft); border-radius: 0; padding: 0 6px; font-size: 10px; margin-left: 3px; font-family: var(--font-data); }
.matrix-wrap { overflow: auto; max-height: 560px; margin-bottom: 10px; border: 1px solid var(--line-2); background: var(--panel-2); }
.matrix { border-collapse: collapse; font-size: 10px; font-family: var(--font-data); }
.matrix th { background: var(--panel-3); color: var(--accent); padding: 5px 3px; text-align: center; position: sticky; top: 0; z-index: 3; font-weight: 700; border: 1px solid var(--line); }
.matrix th.band-label { background: #191919; color: var(--accent); text-align: left; padding: 4px 5px; position: sticky; left: 0; top: 0; z-index: 4; width: 70px; max-width: 70px; font-size: 9px; line-height: 1.2; }
.cell-tag { font-size: 8px; line-height: 1; max-width: 42px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.matrix td { padding: 0; text-align: center; border: 1px solid #262525; }
.cell { width: 50px; height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; line-height: 1.15; position: relative; background: var(--panel-2); color: var(--text); }
.cell:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
.wide-mode .cell { width: 80px; height: 44px; font-size: 12px; }
.wide-mode .matrix-wrap { max-height: 760px; }
.cols { display: flex; gap: 20px; align-items: flex-start; }
.col-matrix { flex: 0 0 auto; }
.col-side { flex: 1; min-width: 280px; max-width: 520px; }
.cols .section:first-child, .col-matrix > .section:first-child, .col-side > .section:first-child { margin-top: 0; }
.wide-mode .matrix th { padding: 8px 4px; font-size: 12px; }
.wide-mode .band-row-label, .wide-mode .matrix th.band-label { width: 100px; max-width: 100px; font-size: 11px; }
.wide-mode body, .wide-mode { font-size: 14px; }
.wide-mode .cell-freq { font-size: 13px; }
.cell-freq { font-weight: 700; font-size: 10px; }
.cell-free     { background: var(--panel-2); }
.cell-moderate { background: var(--yellow); color: #231d04; }
.cell-warning  { background: var(--orange-bg); box-shadow: inset 0 0 0 2px var(--orange); color: var(--orange); }
.cell-reserve  { background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--purple); border-style: dashed; color: #c9a6dd; }
.cell-serious  { background: var(--orange); color: #231604; }
.cell-critical { background: var(--red); color: #fff; }
.cell-mine { background: #10381f !important; box-shadow: inset 0 0 0 3px var(--green); color: var(--green); }
.cell-unit { box-shadow: inset 0 0 0 3px var(--blue); }
.cell-ext  { background: #2f3436 !important; box-shadow: inset 0 0 0 3px var(--grey); color: #b8c2c4; }
.band-row-label { background: #191919 !important; color: var(--accent); padding: 4px 5px; text-align: left; font-weight: 700; position: sticky; left: 0; z-index: 2; font-size: 9px; line-height: 1.2; width: 70px; max-width: 70px; white-space: normal; overflow-wrap: break-word; box-shadow: none !important; }
.legend { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 9px; font-size: 11px; line-height: 1.9; margin-top: 8px; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.lg-box { width: 16px; height: 16px; border-radius: 0; flex-shrink: 0; }
.conflict-detail { background: var(--panel); border: 1px solid var(--line); border-radius: 0; padding: 5px 8px; margin-bottom: 3px; font-size: 11px; }
.cd-freq { font-weight: 700; color: var(--accent-soft); font-family: var(--font-data); }
.cd-crews { color: var(--red-soft); font-size: 10px; }
.ext-item { display: flex; align-items: center; justify-content: space-between; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 0; padding: 5px 8px; margin-bottom: 4px; font-size: 11px; font-family: var(--font-data); }
.ext-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; }
.vtx-box { background: var(--panel); border: 1px solid var(--blue-deep); border-radius: 0; padding: 8px; margin-bottom: 6px; }
.vtx-crew { font-size: 12px; color: var(--blue-soft); margin-bottom: 6px; }
.vtx-btns { display: flex; flex-wrap: wrap; gap: 5px; }
.vtx-btn { background: var(--panel-2); border: 1px solid var(--blue); border-radius: 0; padding: 4px 10px; font-size: 11px; cursor: pointer; color: var(--blue-soft); font-weight: 700; font-family: var(--font-data); }
.vtx-btn:hover { background: var(--blue); color: #06121c; }
.switch-btn { background: var(--blue-deep); color: var(--blue-soft); border: 1px solid var(--blue); border-radius: 0; padding: 3px 10px; font-size: 11px; cursor: pointer; font-weight: 700; font-family: var(--font-data); }
.switch-btn:hover { background: var(--blue); color: #06121c; }
.switch-menu { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

/* ── Модалки ── */
.modal-bg, .modal-overlay { display: none; position: fixed; inset: 0; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; backdrop-filter: blur(2px); }
.modal-bg.open, .modal-overlay.open { display: flex; align-items: center; justify-content: center; }
.modal { background: #1a1a1a; border: 1px solid var(--blue); border-radius: 0; padding: 16px; width: 340px; max-height: 90vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.8); }
.modal input { width: 100%; padding: 8px; border: 1px solid var(--line-2); border-radius: 0; margin: 8px 0; background: #0e0e0e; color: var(--text); }
.modal button { width: 100%; padding: 8px; border: none; border-radius: 0; font-weight: 700; cursor: pointer; font-family: var(--font-data); }
.modal-title { font-weight: 700; color: var(--accent); font-size: 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: .06em; }
.modal-close { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--dim); }
.modal-close:hover { color: var(--red); }

<script>

// Глобальна сітка бендів (порядок як в основній таблиці)
var VIDEO_SYSTEMS = ['Аналог','HDZero','DJI','Walksnail','Hornet Vision'];
var BANDS = {

};
var crewReserves = []; // резервні частоти нового екіпажу
var editReserves = []; // резервні при редагуванні

function tryLoad() { loaded++; if (loaded >= 5) renderAll(); }

// Широкий режим (modal/застосунок) + кнопка fullscreen
function isModalView() { return window.innerWidth > 700; }
function goFullscreen() { google.script.run.openFlightLogModal(); }
(function(){
  var wide = isModalView() || document.body.classList.contains('in-app');
  if (wide) {
    var fs = document.getElementById('fsBtn');
    if (fs) fs.style.display = 'none';
    document.body.classList.add('wide-mode');

})();

// Якщо через 8 секунд не завантажилось — рендеримо що є
setTimeout(function() { if (loaded < 5) { loaded = 5; renderAll(); } }, 8000);

google.script.run.withSuccessHandler(function(v){ currentEmail=v||''; tryLoad(); }).withFailureHandler(function(){ tryLoad(); }).getCurrentUserEmail();
google.script.run.withSuccessHandler(function(v){ adminEmail=v||''; tryLoad(); }).withFailureHandler(function(){ tryLoad(); }).getAdminEmail();
google.script.run.withSuccessHandler(function(v){ allItems=v||[]; tryLoad(); }).withFailureHandler(function(e){ document.getElementById('crewBody').innerHTML='<div class="err" style="display:block">❌ '+(e?e.message:'')+'</div>'; tryLoad(); }).getInventoryList();
google.script.run.withSuccessHandler(function(v){ trackers=v||[]; tryLoad(); }).withFailureHandler(function(){ tryLoad(); }).getSinotrackList();

function isMine(f) {
  if (!f.creatorEmail) return true;
  if (currentEmail && currentEmail===adminEmail && adminEmail!=='YOUR_EMAIL@gmail.com') return true;
  return f.creatorEmail===currentEmail;
}

function getBusyDrones() {
  var busy = {};
  flights.filter(function(f){ return f.status&&f.status.trim()==='Активний'&&!f.id.startsWith('CRW-'); })
    .forEach(function(f){
      var id = f.drones ? f.drones.split('|')[0].trim() : '';
      if (id) busy[id] = (f.crew||'?');
    });
  return busy;
}

function getActiveCrews() {
  return flights.filter(function(f){ return f.id.startsWith('CRW-') && f.status&&f.status.trim()==='Активний'; });
}

function renderAll() {
  try { renderCrew(); } catch(e) { document.getElementById('crewBody').innerHTML='<div class="err" style="display:block">❌ Crew: '+e.message+'</div>'; }
  try { renderFly();  } catch(e) { document.getElementById('flyBody').innerHTML='<div class="err" style="display:block">❌ Fly: '+e.message+'</div>'; }
  try { renderLog();  } catch(e) { document.getElementById('logBody').innerHTML='<div class="err" style="display:block">❌ Log: '+e.message+'</div>'; }
}

// ══ ВКЛАДКА ЕКІПАЖ ══════════════════════════════════════
function renderCrew() {
  var crews = getActiveCrews();
  var gnstItems = allItems.filter(function(it){ return it.type&&it.type.startsWith('GNST'); });

  // Опції відеосистем і частот для екіпажу
  var VS = ['Аналог','HDZero','DJI','Walksnail','Hornet Vision'];
  var crewSystemOpts = VS.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join('');
  var crewFreqOpts = '';
  Object.keys(BANDS).forEach(function(band){
    crewFreqOpts += '<optgroup label="Бенд '+band+'">';
    BANDS[band].forEach(function(f, i){
      crewFreqOpts += '<option value="'+band+(i+1)+' ('+f+')">'+band+(i+1)+' — '+f+' МГц</option>';
    });
    crewFreqOpts += '</optgroup>';
  });
  // Які наземки вже в активних екіпажах
  var busyGnst = {};
  getActiveCrews().forEach(function(c){
    if (c.gnst) busyGnst[c.gnst] = (busyGnst[c.gnst]||[]).concat(c.id);
  });
  var gnstOpts = '<option value="">— без наземки —</option>' +
    gnstItems.map(function(it){
      var busy = busyGnst[it.id];
      var label = it.id + ' — ' + it.name + (busy ? ' 🔒 зайнята: '+busy.join(', ') : '');
      return '<option value="'+esc(it.id)+'"'+(busy?' style="color:#856404"':'')+'>'+esc(label)+'</option>';
    }).join('');
  // Які трекери вже зайняті в активних екіпажах
  var busyTrackers = {};
  getActiveCrews().forEach(function(c){
    if (c.tracker) {
      c.tracker.split('|').forEach(function(tid){
        tid = tid.trim();
        if (tid) busyTrackers[tid] = (busyTrackers[tid]||[]).concat(c.id);
      });
    }
  });

  var crewCards = crews.length
    ? crews.map(function(c){
        var droneList = c.drones ? c.drones.split('|').filter(Boolean) : [];
        var mine = isMine(c);
        return '<div class="card '+(mine?'card-mine':'card-other')+'" style="margin-bottom:8px">'+
          '<div class="card-title">'+esc(c.id)+(mine?'<span class="badge badge-mine">Мій</span>':'')+'</div>'+
          '<div class="card-meta">'+
            (c.gnst?'📡 '+esc(c.gnst)+'<br>':'')+
            (c.bind?'🔗 Bind: <strong>'+esc(c.bind)+'</strong><br>':'')+
            (c.tracker?'📡 '+esc(c.tracker.split('|').join(', '))+'<br>':'')+
            '🛸 '+esc(droneList.join(', '))+
          '</div>'+
          (mine?
            '<div style="display:flex;gap:6px;margin-top:6px">'+
              '<button class="btn btn-green" style="font-size:11px;flex:1" onclick="openEditCrew(\'' + esc(c.id) + '\')">✏️ Редагувати</button>'+
              '<button class="btn btn-red" style="font-size:11px;flex:1" onclick="closeCrew(\'' + esc(c.id) + '\')">🔴 Завершити</button>'+
            '</div>':'')+
        '</div>';
      }).join('')
    : '<div style="text-align:center;color:#aaa;padding:10px;font-size:12px">Активних екіпажів немає</div>';

  document.getElementById('crewBody').innerHTML =
    '<div class="section">Активні екіпажі</div>'+
    crewCards+
    '<hr>'+
    '<div class="section">Створити новий екіпаж</div>'+

    '<div class="f"><label>Наземна станція</label>'+
    '<select id="crewGnst" onchange="onGnstChange()">'+gnstOpts+'</select>'+
    '<div id="gnstWarn"></div></div>'+

    '<div class="f"><label>Bind фраза</label>'+
    '<input type="text" id="crewBind" placeholder="спільна для всіх бортів..."></div>'+

    '<div class="f"><label>Борти (пул)</label>'+
    '<div class="ac-wrap">'+
      '<input type="text" id="droneSearch" placeholder="Пошук борту..." oninput="filterDrones()" autocomplete="off">'+
      '<div class="ac-list" id="ddDrones"></div>'+
    '</div>'+
    '<div id="droneList" style="margin-top:6px"></div></div>'+

    '<div class="f"><label>Sinotrack трекери (можна кілька)</label>'+
    '<div class="ac-wrap">'+
      '<input type="text" id="trkSearch" placeholder="Пошук трекера..." oninput="filterTrackers()" onfocus="filterTrackers()" autocomplete="off">'+
      '<div class="ac-list" id="ddTrk"></div>'+
    '</div>'+
    '<div id="selectedTrkList" style="margin-top:6px"></div>'+
    '<div id="trkConfirmBlock" style="display:none;margin-top:4px">'+
      '<div class="hint">💡 Перевірка: SMS <strong>669000</strong> на номер SIM → отримаєш ID і координати</div>'+
      '<button onclick="confirmTrk()" style="margin-top:4px;padding:4px 10px;background:#14532d;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px">✅ Всі перевірено</button>'+
      '<span id="trkOkStatus" style="font-size:11px;margin-left:6px"></span>'+
    '</div></div>'+

    '<div class="f"><label>Відеосистема</label>'+
    '<select id="crewSystem" onchange="onCrewSystemChange()">'+
      '<option value="">— не вказано —</option>'+
      crewSystemOpts+
    '</select></div>'+

    '<div class="f"><label>Основна частота</label>'+
    '<select id="crewFreq">'+
      '<option value="">— не вказано —</option>'+

    '<div class="f"><label>📻 Резервні VTX Switcher (до 10)</label>'+

    '<button class="btn btn-green" id="crewBtn" onclick="doCreateCrew()">👥 Створити екіпаж</button>'+
    '<div id="msgCrew" class="msg"></div>';

  renderDroneList();
  renderReserveList();
  renderSelectedTrackers();
}

var trkOk = false;
var selectedTrackers = [];

function getBusyTrackers() {
  var busyTrk = {};
  getActiveCrews().forEach(function(c){
    if (c.tracker) {
      c.tracker.split('|').forEach(function(tid){
        tid = tid.trim();
        if (tid) busyTrk[tid] = (busyTrk[tid]||[]).concat(c.id);
      });
    }
  });
  return busyTrk;
}

function filterTrackers() {
  var q  = document.getElementById('trkSearch').value.toLowerCase().trim();
  var dd = document.getElementById('ddTrk');
  var busyTrk = getBusyTrackers();
  var list = trackers.filter(function(t){
    return selectedTrackers.indexOf(t.id) === -1 &&
      (!q || t.id.toLowerCase().includes(q) || t.model.toLowerCase().includes(q) ||
       (t.simContact||'').toLowerCase().includes(q));
  }).slice(0, 10);

  if (!list.length) { dd.style.display='none'; return; }

  dd.innerHTML = list.map(function(t){
    var busy   = busyTrk[t.id];
    var broken = t.status === 'Зламаний';
    var lost   = t.status === 'Втрачений';
    var rowBg  = busy ? '#fffbea' : (broken ? '#fffbea' : (lost ? '#fff0f0' : ''));
    var idColor = busy ? '#856404' : (broken ? '#856404' : (lost ? '#721c24' : '#1a3a5c'));
    var badge  = busy
      ? '<span style="background:#fff3cd;color:#856404;padding:1px 5px;border-radius:8px;font-size:10px;margin-left:4px">🔒 зайнятий</span>'
      : (broken ? '<span style="background:#fff3cd;color:#856404;padding:1px 5px;border-radius:8px;font-size:10px;margin-left:4px">⚠️ Зламаний</span>'
      : (lost   ? '<span style="background:#f8d7da;color:#721c24;padding:1px 5px;border-radius:8px;font-size:10px;margin-left:4px">❌ Втрачений</span>'
      : ''));
    var subInfo = busy
      ? esc(busy.map(function(cid){
          var c2 = flights.find(function(f){ return f.id===cid; });
          return cid+(c2&&c2.gnst?' · '+c2.gnst:'')+(c2&&c2.drones?' · '+c2.drones.split('|')[0]:'');
        }).join(' | '))
      : esc((t.simContact||'')+(t.simNumber?' · '+t.simNumber:''));

    var dispId3 = t.imei || t.id;
    return '<div class="ac-item" style="background:'+rowBg+';cursor:'+(busy?'not-allowed':'pointer')+'"'+
      (!busy?' onmousedown="addTracker(this.dataset.id)" data-id="'+esc(t.id)+'"':'')+'>'+
      '<div class="ac-id" style="color:'+idColor+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(dispId3)+(t.imei?'<span style="font-size:9px;color:#aaa;margin-left:3px">('+esc(t.id)+')</span>':'')+'</div>'+
      '<div class="ac-meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.model)+' · '+subInfo+'</div>'+
    '</div>';
  }).join('');
  dd.style.display = 'block';
}

function addTracker(id) {
  var t = trackers.find(function(x){ return x.id===id; });
  if (!t) return;
  if (t.status !== 'Робочий') {
    if (!confirm('⚠️ Трекер '+id+' — '+t.status+'! Додати все одно?')) return;
  }
  if (selectedTrackers.indexOf(id)===-1) selectedTrackers.push(id);
  document.getElementById('trkSearch').value='';
  document.getElementById('ddTrk').style.display='none';
  renderSelectedTrackers();
  var ce = document.getElementById('trkConfirmBlock');
  if (ce) ce.style.display='block';
}

function removeTracker(id) {
  selectedTrackers = selectedTrackers.filter(function(x){ return x!==id; });
  renderSelectedTrackers();
  var ce = document.getElementById('trkConfirmBlock');
  if (ce) ce.style.display = selectedTrackers.length ? 'block' : 'none';
}

function renderSelectedTrackers() {
  var el = document.getElementById('selectedTrkList');
  if (!el) return;
  if (!selectedTrackers.length) { el.innerHTML=''; return; }
  el.innerHTML = selectedTrackers.map(function(id){
    var t = trackers.find(function(x){ return x.id===id; });
    var broken = t&&t.status==='Зламаний', lost = t&&t.status==='Втрачений';
    var bg  = broken?'#fff3cd':(lost?'#f8d7da':'#e8f4fd');
    var clr = broken?'#856404':(lost?'#721c24':'#1a3a5c');
    var bdr = broken?'#ffc107':(lost?'#f5c6cb':'#b8daff');
    return '<span style="display:inline-block;background:'+bg+';color:'+clr+';border:1px solid '+bdr+';border-radius:10px;padding:2px 8px;font-size:11px;margin:2px;cursor:pointer" onmousedown="removeTracker(this.dataset.id)" data-id="'+esc(id)+'">'+
      esc(t&&t.imei?t.imei:id)+(t?' — '+esc(t.model):'')+(broken?' ⚠️':(lost?' ❌':''))+' ✕</span>';
  }).join('');
}


function confirmTrk() {
  trkOk = true;
  document.getElementById('trkOkStatus').innerHTML = '<span style="color:#155724;font-weight:bold">✅ Підтверджено</span>';
}

function filterDrones() {
  var q = document.getElementById('droneSearch').value.toLowerCase();
  if (!q) { document.getElementById('ddDrones').style.display='none'; return; }
  var busy = getBusyDrones();
  var list = allItems.filter(function(it){
    return (it.type.startsWith('FPV')||it.type.startsWith('STNG')||it.type.startsWith('WING')) &&
      (it.id.toLowerCase().includes(q)||it.name.toLowerCase().includes(q)) &&
      !drones.find(function(d){ return d.id===it.id; });
  }).slice(0,10);
  var dd = document.getElementById('ddDrones');
  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(it){
    var inFlight = busy[it.id];
    return '<div class="ac-item" onmousedown="addDrone(\''+esc(it.id)+'\')" style="'+(inFlight?'background:#fff8f0':'')+'">'+
      '<div class="ac-id" style="'+(inFlight?'color:#e67e22':'')+'">'+esc(it.id)+'</div>'+
      '<div class="ac-meta">'+esc(it.name)+' · '+esc(it.status)+(inFlight?' · ✈️ Екіпаж '+esc(inFlight):'')+'</div>'+
    '</div>';
  }).join('');
  dd.style.display='block';
}

function addDrone(id) {
  if (drones.find(function(d){ return d.id===id; })) return;
  var it = allItems.find(function(i){ return i.id===id; });
  if (!it) return;
  drones.push({ id:id, name:it.name });
  document.getElementById('droneSearch').value='';
  document.getElementById('ddDrones').style.display='none';
  renderDroneList();
  // Авто-визначення системи екіпажу по назві борту
  autoDetectCrewSystem();
}

// Визначити систему екіпажу по бортах у пулі + обмежити частоти
function autoDetectCrewSystem() {
  var sysSel = document.getElementById('crewSystem');
  if (!sysSel) return;
  // Шукаємо першу розпізнану систему серед бортів пулу
  var detected = '';
  for (var i = 0; i < drones.length; i++) {
    var d = detectSystemFromName(drones[i].name);
    if (d) { detected = d; break; }
  }
  if (detected) {
    sysSel.value = detected;
    rebuildCrewFreqOptions(detected);
  }
}

// Перебудувати опції частот екіпажу (основна + резервні) під систему
function rebuildCrewFreqOptions(system) {
  var freqSel = document.getElementById('crewFreq');
  var resSel  = document.getElementById('crewReserveSel');
  var opts = buildFreqOptionsHtml(system);
  if (freqSel) {
    var cur = freqSel.value;
    var html = '<option value="">— не вказано —</option>' + opts;
    // Якщо поточна частота не в новому списку — додати її окремо щоб не загубити
    if (cur && html.indexOf('value="'+cur+'"') === -1) {
      html += '<option value="'+cur+'" selected>'+cur+'</option>';
    }
    freqSel.innerHTML = html;
    if (cur) freqSel.value = cur;
  }
  if (resSel) {
    resSel.innerHTML = '<option value="">+ додати резервну</option>' + opts;
  }
}

// Згенерувати <option> частот для системи (HV → тільки HV, інакше повна)
function buildFreqOptionsHtml(system) {
  var html = '';
  if (system === 'Hornet Vision') {
    html += '<optgroup label="Hornet Vision (HV-L)">';
    [5240,5260,5280,5300,5320].forEach(function(f, i){
      var warn = WARNING_FREQS[f] ? ' ⚠️' : '';
      html += '<option value="HV-L'+(i+1)+' ('+f+')">HV-L'+(i+1)+' — '+f+' МГц'+warn+'</option>';
    });
    html += '</optgroup><optgroup label="Hornet Vision (HV-H)">';
    [5745,5765,5785,5805,5825].forEach(function(f, i){
      html += '<option value="HV-H'+(i+1)+' ('+f+')">HV-H'+(i+1)+' — '+f+' МГц</option>';
    });
    html += '</optgroup>';
  } else {
    Object.keys(BANDS).forEach(function(band){
      if (band.indexOf('HV-') === 0) return;
      html += '<optgroup label="Бенд '+band+'">';
      BANDS[band].forEach(function(f, i){
        html += '<option value="'+band+(i+1)+' ('+f+')">'+band+(i+1)+' — '+f+' МГц</option>';
      });
      html += '</optgroup>';
    });
  }
  return html;
}

function removeDrone(id) {
  drones = drones.filter(function(d){ return d.id!==id; });
  renderDroneList();
  autoDetectCrewSystem();
}

function renderDroneList() {
  var el = document.getElementById('droneList');
  if (!el) return;
  if (!drones.length) { el.innerHTML='<div style="font-size:11px;color:#aaa">Борти не додано</div>'; return; }
  el.innerHTML = drones.map(function(d){
    return '<span class="tag" onclick="removeDrone(\''+esc(d.id)+'\')">'+esc(d.id)+' '+esc(d.name)+' ✕</span>';
  }).join('');
}

function onGnstChange() {
  var id = document.getElementById('crewGnst').value;
  var warn = document.getElementById('gnstWarn');
  if (!id || !warn) return;
  var busyGnst = {};
  getActiveCrews().forEach(function(c){
    if (c.gnst) busyGnst[c.gnst] = (busyGnst[c.gnst]||[]).concat(c.id);
  });
  var busy = busyGnst[id];
  warn.innerHTML = busy
    ? '<div class="warn">⚠️ Наземка вже в екіпажі: <strong>'+esc(busy.join(', '))+'</strong></div>'
    : '';
}

// ── Резервні VTX частоти ──
function addReserve() {
  var sel = document.getElementById('crewReserveSel');
  if (!sel || !sel.value) return;
  if (crewReserves.length >= 10) { alert('Максимум 10 резервних'); sel.value=''; return; }
  if (crewReserves.indexOf(sel.value) === -1) {
    crewReserves.push(sel.value);
    renderReserveList();
  }
  sel.value = '';
}

function removeReserve(code) {
  crewReserves = crewReserves.filter(function(c){ return c !== code; });
  renderReserveList();
}

function renderReserveList() {
  var el = document.getElementById('reserveList');
  if (!el) return;
  if (!crewReserves.length) { el.innerHTML = '<div style="font-size:11px;color:#aaa">Немає резервних</div>'; return; }
  el.innerHTML = crewReserves.map(function(code){
    return '<span style="display:inline-block;background:#e8f4fd;border:1px solid #2e6da4;border-radius:10px;padding:2px 8px;margin:2px;font-size:11px">'+
      '📻 '+esc(code)+' <span style="cursor:pointer;color:#c00;font-weight:bold" onclick="removeReserve(\''+esc(code)+'\')">✕</span></span>';
  }).join('');
}

function onCrewSystemChange() {
  var sys = document.getElementById('crewSystem').value;
  rebuildCrewFreqOptions(sys);
}

function doCreateCrew() {
  var gnst = document.getElementById('crewGnst').value;
  var bind = document.getElementById('crewBind').value.trim();
  var trkStr = selectedTrackers.join('|');
  if (!drones.length) { showMsg('msgCrew','❌ Додайте борти до пулу','err'); return; }
  // Попередження якщо наземка зайнята
  if (gnst) {
    var busyGnst2 = {};
    getActiveCrews().forEach(function(c){ if (c.gnst) busyGnst2[c.gnst]=(busyGnst2[c.gnst]||[]).concat(c.id); });
    if (busyGnst2[gnst]) {
      if (!confirm('⚠️ Наземка вже використовується в екіпажі: '+busyGnst2[gnst].join(', ')+'\nПродовжити?')) return;
    }
  }
  if (!selectedTrackers.length) {
    if (!confirm('⚠️ Без GPS трекера!\nУсвідомлюєте ризик втрати борту?')) return;
  }
  var dronesStr = drones.map(function(d){ return d.id; }).join('|');
  var crewSystem = document.getElementById('crewSystem') ? document.getElementById('crewSystem').value : '';
  var crewFreq   = document.getElementById('crewFreq') ? document.getElementById('crewFreq').value : '';
  var reservesStr = crewReserves.join('|');
  // Діагностика в консоль
  console.log('Створення екіпажу:', { system: crewSystem, freq: crewFreq, reserves: reservesStr });
  var btn = document.getElementById('crewBtn');
  btn.disabled=true; btn.textContent='⏳...';
  google.script.run
    .withSuccessHandler(function(crewId){
      flights.push({ id:crewId, date:new Date().toISOString().slice(0,10),
        crew:crewId, gnst:gnst, drones:dronesStr, bind:bind,
        tracker:trkStr, trackerOk:trkOk?'Перевірено':'Ні',
        start:'', end:'', status:'Активний', note:'', creatorEmail:currentEmail,
        system:crewSystem, freq:crewFreq, reserves:reservesStr });
      showMsg('msgCrew','✅ Екіпаж '+crewId+' створено','ok');
      drones=[]; trkOk=false; selectedTrackers=[]; crewReserves=[];
      renderDroneList(); renderReserveList();
      renderCrew(); renderFly();
      btn.disabled=false; btn.textContent='👥 Створити екіпаж';
    })
    .withFailureHandler(function(e){ showMsg('msgCrew','❌ '+e.message,'err'); btn.disabled=false; btn.textContent='👥 Створити екіпаж'; })
    .createCrew({ gnst:gnst, drones:dronesStr, bind:bind, pilot:'', tracker:trkStr, system:crewSystem, freq:crewFreq, reserves:reservesStr });
}

function closeCrew(crewId) {
  // Перевірити чи є активні вильоти цього екіпажу
  var activeFlights = flights.filter(function(f){
    return !f.id.startsWith('CRW-') && f.crew===crewId && f.status&&f.status.trim()==='Активний';
  });
  if (activeFlights.length) {
    alert('⚠️ Неможливо завершити екіпаж — є активні вильоти:\n'+
      activeFlights.map(function(f){ return '• '+f.id+' ('+f.drones+')'; }).join('\n')+
      '\n\nСпочатку приземли всі борти.');
    return;
  }
  if (!confirm('Завершити екіпаж '+crewId+'?')) return;
  google.script.run
    .withSuccessHandler(function(){
      var c = flights.find(function(f){ return f.id===crewId; });
      if (c) c.status='Завершено';
      renderCrew(); renderFly(); renderLog();
    })
    .withFailureHandler(function(e){ alert('❌ '+e.message); })
    .endFlight(crewId, [], 'Екіпаж завершено');
}

function onCrewChange() {
  var id = document.getElementById('flyCrewSel').value;
  var info = document.getElementById('crewInfo');
  var block = document.getElementById('droneSelBlock');
  var sel = document.getElementById('flyDroneSel');
  if (!id) { info.style.display='none'; block.style.display='none'; return; }

  var c = flights.find(function(f){ return f.id===id; });
  if (!c) return;

  var dl = c.drones ? c.drones.split('|').filter(Boolean) : [];
  var busy = getBusyDrones();

  info.innerHTML = '<div class="info">'+
    (c.gnst?'📡 '+esc(c.gnst)+'<br>':'')+
    (c.bind?'🔗 Bind: <strong>'+esc(c.bind)+'</strong><br>':'')+
    (c.tracker?'📡 '+esc(c.tracker.split('|').join(', '))+(c.trackerOk==='Перевірено'?' ✅':'')+'<br>':'')+
    (c.system?'📹 '+esc(c.system)+'<br>':'')+
    (c.freq?'📻 Основна: <strong>'+esc(c.freq)+'</strong><br>':'')+
    (c.reserves?'🔄 Резервні: '+esc(c.reserves.split('|').join(', '))+'<br>':'')+
    '🛸 Пул: '+esc(dl.join(', '))+
  '</div>';
  info.style.display='block';

  // Підставити систему екіпажу
  var sysSel = document.getElementById('flySystem');
  if (c.system && sysSel) sysSel.value = c.system;

  // Частоти вильоту
  var freqSel = document.getElementById('flyFreq');
  if (freqSel) {
    if (c.freq || c.reserves) {
      // Екіпаж задав частоти → вибір тільки з основної + резервних (VTX switcher pool)
      var opts = '<option value="">— оберіть —</option>';
      if (c.freq) opts += '<option value="'+esc(c.freq)+'">⭐ Основна: '+esc(c.freq)+'</option>';
      if (c.reserves) {
        c.reserves.split('|').filter(Boolean).forEach(function(r){
          opts += '<option value="'+esc(r)+'">🔄 Резерв: '+esc(r)+'</option>';
        });
      }
      freqSel.innerHTML = opts;
      if (c.freq) freqSel.value = c.freq;
    } else {
      // Екіпаж без частот → сітка по системі (або повна), борт перевизначить
      rebuildFreqOptions(c.system || '');
    }
  }

  // Рахуємо скільки бортів цього екіпажу вже в повітрі
  var crewActiveFlights = flights.filter(function(f){
    return !f.id.startsWith('CRW-') && f.crew===id && f.status&&f.status.trim()==='Активний';
  });
  var crewBusyDrones = crewActiveFlights.map(function(f){ return f.drones; });

  sel.innerHTML = '<option value="">— оберіть —</option>' +
    dl.map(function(did){
      var it = allItems.find(function(i){ return i.id===did; });
      var inFlight = busy[did];
      var inCrewFlight = crewBusyDrones.indexOf(did) !== -1;
      var style = inFlight ? 'color:#e67e22' : '';
      return '<option value="'+esc(did)+'"'+(style?' style="'+style+'"':'')+'>'+
        esc(did)+(it?' — '+esc(it.name):'')+
        (inCrewFlight?' ✈️ вже в повітрі':'')+(inFlight&&!inCrewFlight?' ⚠️ інший екіпаж':'')+
      '</option>';
    }).join('');

  if (crewActiveFlights.length) {
    var activeDronesList = crewBusyDrones.join(', ');
    info.innerHTML += '<div class="warn" style="margin-top:4px">✈️ Зараз в повітрі: <strong>'+esc(activeDronesList)+'</strong></div>';
  }
  block.style.display='block';

  // Заповнити список трекерів екіпажу
  var trkBlock = document.getElementById('trkSelBlock');
  var trkSel   = document.getElementById('flyTrkSel');
  if (trkSel && c.tracker) {
    var crewTrks = c.tracker.split('|').filter(Boolean);
    // Які трекери вже зайняті в активних вильотах
    var busyTrkFlights = {};
    flights.filter(function(f){
      return !f.id.startsWith('CRW-') && f.status&&f.status.trim()==='Активний';
    }).forEach(function(f){
      if (f.tracker) busyTrkFlights[f.tracker.trim()] = f.id;
    });

    trkSel.innerHTML = '<option value="">— без трекера —</option>' +
      crewTrks.map(function(tid){
        var t = trackers.find(function(x){ return x.id===tid; });
        var busy2 = busyTrkFlights[tid];
        var dispId = t&&t.imei ? t.imei : tid;
        var lbl = dispId + (t?' — '+t.model:'') + (t&&t.simContact?' ('+t.simContact+')':'') +
          (busy2?' ✈️ вже летить':'');
        return '<option value="'+esc(tid)+'"'+(busy2?' style="color:#e67e22"':'')+'>'+esc(lbl)+'</option>';
      }).join('');
    if (trkBlock) trkBlock.style.display = crewTrks.length ? 'block' : 'none';
  } else if (trkBlock) {
    trkBlock.style.display = 'none';
  }
}

// Суфікси назв → відеосистема
var NAME_SUFFIXES = {
  'AD':'Аналог','AT':'Аналог',
  'HVD':'Hornet Vision','HVT':'Hornet Vision',
  'HDD':'HDZero','HDT':'HDZero',
  'DJD':'DJI','DJT':'DJI',
  'WSD':'Walksnail','WST':'Walksnail',
};

function detectSystemFromName(name) {
  if (!name) return '';
  var upper = String(name).toUpperCase().trim();
  var keys = Object.keys(NAME_SUFFIXES).sort(function(a,b){ return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var suf = keys[i];
    // Суфікс як окреме слово АБО в кінці назви (StingHVD, Sting HVD, Sting-HVD)
    var re = new RegExp('(^|[\\s\\-_])' + suf + '($|[\\s\\-_0-9])');
    if (re.test(upper)) return NAME_SUFFIXES[suf];
    // Або просто закінчується на суфікс
    if (upper.endsWith(suf)) return NAME_SUFFIXES[suf];
  }
  return '';
}

// Авто-визначення системи при виборі борту
function onDroneChange() {
  var droneId = document.getElementById('flyDroneSel').value;
  var sysHint = document.getElementById('sysHint');
  var sysSel  = document.getElementById('flySystem');
  if (!droneId) { if(sysHint) sysHint.textContent=''; return; }

  var it = allItems.find(function(i){ return i.id===droneId; });
  if (!it) return;

  var detected = detectSystemFromName(it.name);
  // Якщо екіпаж вже задав частоти (основна+резервні) — НЕ перебудовуємо список,
  // бо виліт має літати на частотах екіпажу (VTX pool)
  var crewId2 = document.getElementById('flyCrewSel').value;
  var crewObj2 = flights.find(function(f){ return f.id===crewId2; });
  var crewHasFreqs = crewObj2 && (crewObj2.freq || crewObj2.reserves);

  if (detected) {
    if (sysSel) sysSel.value = detected;
    if (sysHint) sysHint.innerHTML = '✅ Авто з назви "'+esc(it.name)+'": <strong>'+esc(detected)+'</strong>';
    if (!crewHasFreqs) rebuildFreqOptions(detected);
  } else {
    if (sysHint) sysHint.innerHTML = '⚠️ "'+esc(it.name)+'" — не розпізнано, обери вручну';
    var curSys = sysSel ? sysSel.value : '';
    if (curSys && !crewHasFreqs) rebuildFreqOptions(curSys);
  }
}


function rebuildFreqOptions(system) {
  var sel = document.getElementById('flyFreq');
  if (!sel) return;
  var cur = sel.value;
  var html = '<option value="">— оберіть —</option>';

  if (system === 'Hornet Vision') {
    // Тільки HV частоти
    html += '<optgroup label="Hornet Vision (HV-L)">';
    [5240,5260,5280,5300,5320].forEach(function(f, i){
      var warn = WARNING_FREQS[f] ? ' ⚠️' : '';
      html += '<option value="HV-L'+(i+1)+' ('+f+')">HV-L'+(i+1)+' — '+f+' МГц'+warn+'</option>';
    });
    html += '</optgroup><optgroup label="Hornet Vision (HV-H)">';
    [5745,5765,5785,5805,5825].forEach(function(f, i){
      html += '<option value="HV-H'+(i+1)+' ('+f+')">HV-H'+(i+1)+' — '+f+' МГц</option>';
    });
    html += '</optgroup>';
  } else {
    // Повна сітка
    Object.keys(BANDS).forEach(function(band){
      if (band.indexOf('HV-') === 0) return; // HV бенди тільки для HV
      html += '<optgroup label="Бенд '+band+'">';
      BANDS[band].forEach(function(f, i){
        html += '<option value="'+band+(i+1)+' ('+f+')">'+band+(i+1)+' — '+f+' МГц</option>';
      });
      html += '</optgroup>';
    });
  }
  sel.innerHTML = html;
  // Спробувати відновити вибір
  if (cur) sel.value = cur;
}

function onSystemChange() {
  var sysHint = document.getElementById('sysHint');
  var sys = document.getElementById('flySystem').value;
  if (sys && sysHint) sysHint.innerHTML = 'Обрано: <strong>'+esc(sys)+'</strong>';
  rebuildFreqOptions(sys);
}

    if (WARNING_FREQS[freq]) {

function doStartFlight() {
  var crewId  = document.getElementById('flyCrewSel').value;
  var pilot   = document.getElementById('pilotInput').value.trim();
  var drone   = document.getElementById('flyDroneSel') ? document.getElementById('flyDroneSel').value : '';
  var fltTrk  = document.getElementById('flyTrkSel') ? document.getElementById('flyTrkSel').value : '';
  var flySystem = document.getElementById('flySystem') ? document.getElementById('flySystem').value : '';
  var flyFreq   = document.getElementById('flyFreq') ? document.getElementById('flyFreq').value : '';
  var crewObj = flights.find(function(f){ return f.id===crewId; });
  // Якщо частоту не вибрано — беремо основну частоту екіпажу
  if (!flyFreq && crewObj && crewObj.freq) flyFreq = crewObj.freq;
  // Якщо систему не вибрано — беремо систему екіпажу
  if (!flySystem && crewObj && crewObj.system) flySystem = crewObj.system;
  if (!crewId) { showMsg('msgFly','❌ Оберіть екіпаж','err'); return; }
  if (!pilot)  { showMsg('msgFly','❌ Вкажіть відповідальну особу','err'); return; }
  if (!drone)  { showMsg('msgFly','❌ Оберіть борт','err'); return; }

  var busy = getBusyDrones();
  // Перевірити чи цей борт вже летить в рамках ЦЬОГО екіпажу
  var crewActiveFlights = flights.filter(function(f){
    return !f.id.startsWith('CRW-') && f.crew===crewId && f.status&&f.status.trim()==='Активний';
  });
  var alreadyInThisCrew = crewActiveFlights.find(function(f){ return f.drones===drone; });
  if (alreadyInThisCrew) {
    showMsg('msgFly','❌ Борт '+drone+' вже в повітрі в цьому екіпажі ('+alreadyInThisCrew.id+')','err');
    return;
  }
  // Попередження якщо борт в іншому екіпажі
  if (busy[drone] && busy[drone]!==crewId) {
    if (!confirm('⚠️ Борт '+drone+' вже в повітрі (Екіпаж '+busy[drone]+')!\nПродовжити?')) return;
  }

  var btn = document.getElementById('flyBtn');
  btn.disabled=true; btn.textContent='⏳...';

  google.script.run
    .withSuccessHandler(function(r){
      flights.push({ id:r.id, date:new Date().toISOString().slice(0,10),
        crew:crewId, gnst:'', drones:drone, bind:'',
        tracker:fltTrk, trackerOk:(crewObj&&crewObj.trackerOk?crewObj.trackerOk:''),
        pilot:pilot, start:r.start, end:'', status:'Активний',
        note:'', creatorEmail:currentEmail, system:flySystem, freq:flyFreq });
      showMsg('msgFly','✅ '+r.id+' — '+drone+' злетів о '+r.start,'ok');
      document.getElementById('pilotInput').value='';
      if (document.getElementById('flyDroneSel')) document.getElementById('flyDroneSel').value='';
      renderFly(); renderLog();
      btn.disabled=false; btn.textContent='🛫 Злетів';
    })
    .withFailureHandler(function(e){ showMsg('msgFly','❌ '+e.message,'err'); btn.disabled=false; btn.textContent='🛫 Злетів'; })
    .startFlight({ crew:crewId, gnst:'', drones:drone, bind:'', pilot:pilot, tracker:fltTrk, trackerOk:(crewObj&&crewObj.trackerOk?crewObj.trackerOk:''), note:'', system:flySystem, freq:flyFreq });
}

  el.classList.add('sel');

}

function doEnd(fId) {
  var noteEl = document.getElementById('endNote-'+fId);
  var note = noteEl ? noteEl.value.trim() : '';
  var lostData = null;
  if (fltStatuses[fId] === 'Втрачений') {
    var coords = document.getElementById('lostCoords-'+fId);
    var link = document.getElementById('lostLink-'+fId);
    var circ = document.getElementById('lostCirc-'+fId);
    lostData = {
      coords:     coords ? coords.value.trim() : '',
      mapsLink:   link ? link.value.trim() : '',
      conditions: circ ? circ.value.trim() : '',
    };
  }
  var st = fltStatuses[fId] ? [{ id: flights.find(function(f){ return f.id===fId; }).drones, status: fltStatuses[fId], lostData: lostData }] : [];
  google.script.run
    .withSuccessHandler(function(r){
      var f = flights.find(function(x){ return x.id===fId; });
      if (f) { f.status='Завершено'; f.end=r.end; }
      delete fltStatuses[fId];
      renderFly(); renderLog();
    })
    .withFailureHandler(function(e){ alert('❌ '+e.message); })
    .endFlight(fId, st, note);
}

var editDrones = [];

function openEditCrew(crewId) {
  var c = flights.find(function(f){ return f.id===crewId; });
  if (!c) return;

  document.getElementById('editCrewId').value = crewId;
  document.getElementById('editBind').value = c.bind || '';

  // Борти
  editDrones = (c.drones ? c.drones.split('|').filter(Boolean) : []).map(function(id){
    var it = allItems.find(function(i){ return i.id===id; });
    return { id:id, name: it?it.name:id };
  });

  // Трекери
  editTrackers = c.tracker ? c.tracker.split('|').filter(Boolean) : [];

  // Наземки - з позначкою зайнятих (крім поточного екіпажу)
  var busyGnst = {};
  getActiveCrews().filter(function(cr){ return cr.id!==crewId; }).forEach(function(cr){
    if (cr.gnst) busyGnst[cr.gnst] = (busyGnst[cr.gnst]||[]).concat(cr.id);
  });
  var gnstItems = allItems.filter(function(it){ return it.type&&it.type.startsWith('GNST'); });
  var gnstSel = document.getElementById('editGnst');
  gnstSel.innerHTML = '<option value="">— без наземки —</option>' +
    gnstItems.map(function(it){
      var busy = busyGnst[it.id];
      return '<option value="'+esc(it.id)+'"'+(busy?' style="color:#856404"':'')+
        (it.id===c.gnst?' selected':'')+'>'+
        esc(it.id+' — '+it.name+(busy?' 🔒 '+busy.join(', '):''))+'</option>';
    }).join('');

  // Відеосистема
  var sysSel = document.getElementById('editSystem');
  sysSel.innerHTML = '<option value="">— не вказано —</option>' +
    VIDEO_SYSTEMS.map(function(s){ return '<option value="'+s+'"'+(s===c.system?' selected':'')+'>'+s+'</option>'; }).join('');

  // Резервні
  editReserves = c.reserves ? c.reserves.split('|').filter(Boolean) : [];

  // Частоти по системі
  rebuildEditFreqOptions(c.system || '', c.freq || '');

  renderEditDroneList();
  renderEditTrkList();
  renderEditReserveList();
  document.getElementById('editModal').classList.add('open');
}

function filterEditDrones() {
  var q = document.getElementById('editDroneSearch').value.toLowerCase();
  if (!q) { document.getElementById('ddEditDrones').style.display='none'; return; }
  var busy = getBusyDrones();
  var list = allItems.filter(function(it){
    return (it.type.startsWith('FPV')||it.type.startsWith('STNG')||it.type.startsWith('WING')) &&
      (it.id.toLowerCase().includes(q)||it.name.toLowerCase().includes(q)) &&
      !editDrones.find(function(d){ return d.id===it.id; });
  }).slice(0,8);
  var dd = document.getElementById('ddEditDrones');
  if (!list.length) { dd.style.display='none'; return; }

    return '<div class="ac-item" onmousedown="addEditDrone(this.dataset.id)" data-id="'+esc(it.id)+'" style="'+(inFlight?'background:#fff8f0':'')+'">'+
      '<div class="ac-id" style="'+(inFlight?'color:#e67e22':'')+'">'+esc(it.id)+'</div>'+
      '<div class="ac-meta">'+esc(it.name)+' · '+esc(it.status)+(inFlight?' ✈️':'')+'</div>'+
    '</div>';
  }).join('');

}

function addEditDrone(id) {
  var it = allItems.find(function(i){ return i.id===id; });
  if (!it || editDrones.find(function(d){ return d.id===id; })) return;
  editDrones.push({ id:id, name:it.name });
  document.getElementById('editDroneSearch').value='';
  document.getElementById('ddEditDrones').style.display='none';
  renderEditDroneList();
  autoDetectEditSystem();
}

// Авто-визначення системи екіпажу при редагуванні
function autoDetectEditSystem() {
  var sysSel = document.getElementById('editSystem');
  var hint = document.getElementById('editSysHint');
  if (!sysSel) return;
  var detected = '';
  for (var i = 0; i < editDrones.length; i++) {
    var d = detectSystemFromName(editDrones[i].name);
    if (d) { detected = d; break; }
  }
  if (detected) {
    sysSel.value = detected;
    if (hint) hint.innerHTML = '✅ Авто з борту: <strong>'+esc(detected)+'</strong>';
    var curFreq = document.getElementById('editFreq').value;
    rebuildEditFreqOptions(detected, curFreq);
  }
}

function renderEditTrkList() {
  var el = document.getElementById('editTrkList');
  if (!el) return;
  if (!editTrackers.length) { el.innerHTML=''; return; }
  el.innerHTML = editTrackers.map(function(id){
    var t = trackers.find(function(x){ return x.id===id; });
    var broken=t&&t.status==='Зламаний', lost=t&&t.status==='Втрачений';
    var bg=broken?'#fff3cd':(lost?'#f8d7da':'#e8f4fd');
    var clr=broken?'#856404':(lost?'#721c24':'#1a3a5c');
    var bdr=broken?'#ffc107':(lost?'#f5c6cb':'#b8daff');
    return '<span style="display:inline-block;background:'+bg+';color:'+clr+';border:1px solid '+bdr+';border-radius:10px;padding:2px 8px;font-size:11px;margin:2px;cursor:pointer" onmousedown="removeEditTrk(this.dataset.id)" data-id="'+esc(id)+'">'+
      esc(t&&t.imei?t.imei:id)+(t?' — '+esc(t.model):'')+(broken?' ⚠️':(lost?' ❌':''))+' ✕</span>';
  }).join('');
}

function removeEditTrk(id) {
  editTrackers = editTrackers.filter(function(x){ return x!==id; });
  renderEditTrkList();
}

function filterEditTrackers() {
  var q = document.getElementById('editTrkSearch').value.toLowerCase().trim();
  var dd = document.getElementById('ddEditTrk');
  var crewId = document.getElementById('editCrewId').value;
  var busyTrk = getBusyTrackers();
  // Не блокуємо трекери поточного екіпажу
  var c = flights.find(function(f){ return f.id===crewId; });
  var currentTrks = c&&c.tracker ? c.tracker.split('|').filter(Boolean) : [];

  var list = trackers.filter(function(t){
    return editTrackers.indexOf(t.id)===-1 &&
      (!q||t.id.toLowerCase().includes(q)||t.model.toLowerCase().includes(q)||(t.simContact||'').toLowerCase().includes(q));
  }).slice(0,10);

  if (!list.length) { dd.style.display='none'; return; }
  dd.innerHTML = list.map(function(t){
    var busyIn = busyTrk[t.id];
    // Не вважати зайнятим якщо це трекер поточного екіпажу
    var busy = busyIn && currentTrks.indexOf(t.id)===-1 ? busyIn : null;
    var broken=t.status==='Зламаний', lost=t.status==='Втрачений';
    var rowBg=busy?'#fffbea':(broken?'#fffbea':(lost?'#fff0f0':''));
    var idColor=busy?'#856404':(broken?'#856404':(lost?'#721c24':'#1a3a5c'));
    var badge=busy?'<span style="background:#fff3cd;color:#856404;padding:1px 5px;border-radius:8px;font-size:10px;margin-left:4px">🔒</span>':
      (broken?'<span style="background:#fff3cd;color:#856404;padding:1px 5px;border-radius:8px;font-size:10px;margin-left:4px">⚠️</span>':
      (lost?'<span style="background:#f8d7da;color:#721c24;padding:1px 5px;border-radius:8px;font-size:10px;margin-left:4px">❌</span>':''));
    var subInfo=busy?esc(busy.join(', ')):esc((t.simContact||'')+(t.simNumber?' · '+t.simNumber:''));
    var subInfo=busy?esc(busy.join(', ')):esc((t.simContact||'')+(t.simNumber?' · '+t.simNumber:''));
    return '<div class="ac-item" style="background:'+rowBg+';cursor:'+(busy?'not-allowed':'pointer')+'"'+
      (!busy?' onclick="addEditTrk(this.dataset.id)" data-id="'+esc(t.id)+'"':'')+'>'+
      '<div class="ac-id" style="color:'+idColor+'">'+(t&&t.imei?esc(t.imei):esc(t.id))+' — '+esc(t.model)+badge+(t&&t.imei?'<span style="font-size:9px;color:#aaa">('+esc(t.id)+')</span>':'')+'</div>'+
      '<div class="ac-meta">'+subInfo+'</div>'+
    '</div>';
  }).join('');
  dd.style.display='block';
}

function addEditTrk(id) {
  var t = trackers.find(function(x){ return x.id===id; });
  if (!t) return;
  if (t.status!=='Робочий') {
    if (!confirm('⚠️ Трекер '+id+' — '+t.status+'! Додати все одно?')) return;
  }
  if (editTrackers.indexOf(id)===-1) editTrackers.push(id);
  document.getElementById('editTrkSearch').value='';
  document.getElementById('ddEditTrk').style.display='none';
  renderEditTrkList();
}

function saveEditCrew() {
  var crewId  = document.getElementById('editCrewId').value;
  var gnst    = document.getElementById('editGnst').value;
  var bind    = document.getElementById('editBind').value.trim();
  var drones  = editDrones.map(function(d){ return d.id; }).join('|');
  var trks    = editTrackers.join('|');
  var system  = document.getElementById('editSystem').value;
  var freq    = document.getElementById('editFreq').value;
  var reserves = editReserves.join('|');

  if (!editDrones.length) { showMsg('msgEdit','❌ Додайте борти','err'); return; }

  google.script.run
    .withSuccessHandler(function(){
      var c = flights.find(function(f){ return f.id===crewId; });
      if (c) { c.gnst=gnst; c.bind=bind; c.drones=drones; c.tracker=trks; c.system=system; c.freq=freq; c.reserves=reserves; }
      closeEditModal();
      renderCrew(); renderFly();
    })
    .withFailureHandler(function(e){ showMsg('msgEdit','❌ '+e.message,'err'); })
    .updateCrew(crewId, { gnst:gnst, bind:bind, drones:drones, tracker:trks, system:system, freq:freq, reserves:reserves });
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('click', function(e){
  if (!e.target.closest||!e.target.closest('.ac-wrap')) {
    ['ddDrones','ddPilot','ddTrk'].forEach(function(id){
      var dd=document.getElementById(id); if(dd) dd.style.display='none';
    });
  }
});
</script>
<!-- Modal редагування екіпажу -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">
      <span>✏️ Редагувати екіпаж</span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <input type="hidden" id="editCrewId">

    <div class="f"><label>Наземна станція</label>
      <select id="editGnst"></select>
      <div id="editGnstWarn"></div>
    </div>

    <div class="f"><label>Bind фраза</label>
      <input type="text" id="editBind" placeholder="спільна для всіх бортів...">
    </div>

    <div class="f"><label>Борти (пул)</label>
      <div class="ac-wrap">
        <input type="text" id="editDroneSearch" placeholder="Пошук борту..." oninput="filterEditDrones()" autocomplete="off">
        <div class="ac-list" id="ddEditDrones"></div>
      </div>
      <div id="editDroneList" style="margin-top:6px"></div>
    </div>

    <div class="f"><label>Sinotrack трекери</label>
      <div class="ac-wrap">
        <input type="text" id="editTrkSearch" placeholder="Пошук трекера..." oninput="filterEditTrackers()" onfocus="filterEditTrackers()" autocomplete="off">
        <div class="ac-list" id="ddEditTrk"></div>
      </div>
      <div id="editTrkList" style="margin-top:6px"></div>
    </div>

    <div class="f"><label>Відеосистема</label>
      <select id="editSystem" onchange="onEditSystemChange()">
        <option value="">— не вказано —</option>
      </select>
      <div id="editSysHint" class="hint"></div>
    </div>

    <div class="f"><label>Основна частота</label>
      <select id="editFreq"><option value="">— не вказано —</option></select>
    </div>

    <div class="f"><label>📻 Резервні VTX Switcher (до 10)</label>
      <select id="editReserveSel" onchange="addEditReserve()">
        <option value="">+ додати резервну</option>
      </select>
      <div id="editReserveList" style="margin-top:6px"></div>
    </div>

    <button class="btn btn-green" onclick="saveEditCrew()" style="margin-top:4px">💾 Зберегти</button>
    <button class="btn btn-sec" onclick="closeEditModal()" style="margin-top:4px">Скасувати</button>
    <div id="msgEdit" class="msg"></div>
  </div>
</div>

</body>
</html>
