name = "wh-media"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Звідки дозволено тягнути файли. Постав адресу свого GitHub Pages —
# тоді сторонній сайт не зможе використати квиток, навіть перехопивши його.
# Порожньо або "*" — дозволено звідусіль (квиток усе одно потрібен).
ALLOWED_ORIGIN = ""

# Секрети сюди НЕ пишуться — вони задаються окремо і не потрапляють у git:
#   wrangler secret put GOOGLE_SA_EMAIL        (client_email із JSON-ключа)
#   wrangler secret put GOOGLE_SA_PRIVATE_KEY  (private_key із JSON-ключа)
#   wrangler secret put TICKET_SECRET          (спільний із INFO_MEDIA_SECRET)
